<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - VXGI</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - voxel GI">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_vxgi.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_vxgi.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>VXGI</span>
			</div>

			<small>Diffuse global illumination using Voxel Cone Tracing.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { pass, mrt, normalView, velocity, vec3, vec4, packNormalToRGB, unpackRGBToNormal, sample, screenUV, builtinGIContext } from 'three/tsl';
			import { vxgi } from 'three/addons/lighting/vxgi/VXGINode.js';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';

			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import WebGPU from 'three/addons/capabilities/WebGPU.js';

			if ( WebGPU.isAvailable() === false ) {

				document.body.appendChild( WebGPU.getErrorMessage() );

				throw new Error( 'No WebGPU support' );

			}

			const models = {
				'Museum': 'museum.glb',
				'Dual Rooms': 'dual-rooms.glb',
				'Cornell Box': 'cornell-box.glb',
				'Cornell Box (Oblique)': 'cornell-box-oblique.glb',
				'Cornell Box (Metallic Sphere)': 'cornell-box-metallic-sphere.glb',
				'Cornell Box (Mirror Wall)': 'cornell-box-mirror-wall.glb'
			};

			let camera, scene, renderer, renderPipeline, controls;
			let model;

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 10, 30 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xaaaaaa );

				renderer = new THREE.WebGPURenderer();
				// renderer.setPixelRatio( window.devicePixelRatio ); // probably too costly for most hardware
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				//

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 7, 0 );
				controls.enablePan = true;
				controls.minDistance = 1;
				controls.maxDistance = 100;
				controls.update();

				//

				renderPipeline = new THREE.RenderPipeline( renderer );

				const prePass = pass( scene, camera );
				prePass.name = 'Pre-Pass';
				prePass.transparent = false;

				prePass.setMRT( mrt( {
					output: packNormalToRGB( normalView ),
					velocity: velocity
				} ) );

				const prePassNormal = sample( ( uv ) => {

					return unpackRGBToNormal( prePass.getTextureNode().sample( uv ) );

				} );

				const prePassDepth = prePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => prePass.getLinearDepthNode() );
				const prePassVelocity = prePass.getTextureNode( 'velocity' ).toInspector( 'Velocity' );

				// pre-pass - bandwidth optimization

				const normalTexture = prePass.getTexture( 'output' );
				normalTexture.type = THREE.UnsignedByteType;

				// gi

				const giPass = vxgi( prePassDepth, prePassNormal, scene, camera, 64 );

				const ao = giPass.getAONode().toInspector( 'VXGI.AO' );
				const gi = giPass.getGINode().toInspector( 'VXGI.GI' );

				// scene pass: AO and indirect irradiance are injected into the materials' lighting

				const scenePass = pass( scene, camera ).toInspector( 'Color' );
				const giContext = builtinGIContext( ao.sample( screenUV ).r, gi.sample( screenUV ).rgb );
				scenePass.contextNode = giContext;

				// traa ( resolves the temporal noise of the cone tracing )

				const traaPass = traa( scenePass, prePassDepth, prePassVelocity, camera );
				renderPipeline.outputNode = traaPass;

				window.addEventListener( 'resize', onWindowResize );

				//

				const params = {
					model: 'Cornell Box',
					output: 0,
					debug: 0
				};

				const types = { Combined: 0, Direct: 3, AO: 1, GI: 2 };
				const debugTypes = { Off: 0, Radiance: 1, Opacity: 2 };

				await renderer.init();

				const loader = new GLTFLoader();
				let loadId = 0;
				let currentModel = params.model;

				async function loadModel() {

					const id = ++ loadId;
					const name = params.model;

					try {

						const gltf = await loader.loadAsync( 'models/gltf/' + models[ name ] );
						if ( id !== loadId ) {

							disposeModel( gltf.scene );
							return;

						}

						if ( model ) {

							scene.remove( model );
							disposeModel( model );

						}

						model = gltf.scene;
						model.traverse( ( object ) => {

							if ( object.isMesh ) {

								object.castShadow = true;
								object.receiveShadow = true;

							}

							if ( object.isLight && object.shadow ) {

								object.castShadow = true;
								object.shadow.mapSize.setScalar( 1024 );
								object.shadow.normalBias = 0.02;

							}

						} );

						scene.add( model );
						model.updateMatrixWorld( true );
						setModelCamera( gltf );
						// Restart temporal accumulation for the new scene.
						traaPass.setSize( 1, 1 );
						giPass.volume.needsUpdate = true;
						currentModel = name;

					} catch ( error ) {

						if ( id !== loadId ) return;
						params.model = currentModel;
						console.error( 'Unable to load model:', error );

					}

				}

				await loadModel();
				renderer.setAnimationLoop( animate );

				const gui = renderer.inspector.createParameters( 'VXGI Settings' );
				gui.add( params, 'model', Object.keys( models ) ).name( 'Model' ).listen().onChange( loadModel );
				gui.add( params, 'output', types ).onChange( updatePostprocessing );
				gui.add( params, 'debug', debugTypes ).name( 'voxel view' ).onChange( updatePostprocessing );
				gui.add( giPass.debugLevel, 'value', 0, 4, 1 ).name( 'voxel view level' );
				gui.add( giPass.coneCount, 'value', 2, 8, 1 ).name( 'cone count' );
				gui.add( giPass.coneAngle, 'value', 10, 90 ).name( 'cone angle' );
				gui.add( giPass.volume.stepScale, 'value', 0.25, 2 ).name( 'step scale' );
				gui.add( giPass.volume.maxDistance, 'value', 0, 50 ).name( 'max distance' );
				gui.add( giPass.normalOffset, 'value', 0, 4 ).name( 'normal offset' );
				gui.add( giPass.giIntensity, 'value', 0, 4 ).name( 'GI intensity' );
				gui.add( giPass, 'bounces', 0, 2, 1 ).name( 'bounces' );
				gui.add( giPass, 'directionalRadiance' ).name( 'directional radiance' );
				gui.add( giPass, 'useTemporalFiltering' ).name( 'temporal filtering' ).onChange( updatePostprocessing );

				function updatePostprocessing() {

					giPass.debug.value = params.debug;

					if ( params.debug !== 0 ) {

						renderPipeline.outputNode = vec4( gi.rgb, 1 );

					} else if ( params.output === 1 ) {

						renderPipeline.outputNode = vec4( vec3( ao ), 1 );

					} else if ( params.output === 2 ) {

						renderPipeline.outputNode = vec4( gi.rgb, 1 );

					} else if ( params.output === 3 ) {

						renderPipeline.outputNode = scenePass;

					} else {

						renderPipeline.outputNode = giPass.useTemporalFiltering ? traaPass : scenePass;

					}

					// direct lighting only: render the scene without the GI context

					scenePass.contextNode = ( params.output === 3 ) ? null : giContext;
					scenePass.needsUpdate = true;

					renderPipeline.needsUpdate = true;

				}

			}

			function disposeModel( model ) {

				const resources = new Set();
				model.traverse( ( object ) => {

					if ( object.geometry ) resources.add( object.geometry );
					if ( object.shadow ) resources.add( object.shadow );
					const materials = Array.isArray( object.material ) ? object.material : [ object.material ];
					for ( const material of materials ) {

						if ( ! material ) continue;
						resources.add( material );
						for ( const value of Object.values( material ) ) {

							if ( value && value.isTexture ) resources.add( value );

						}

					}

				} );
				for ( const resource of resources ) resource.dispose();

			}

			function setModelCamera( gltf ) {

				const source = gltf.cameras[ 0 ];
				const bounds = new THREE.Box3().setFromObject( model );
				const center = bounds.getCenter( new THREE.Vector3() );

				// Clear any orbit damping left over from the previous scene.
				const damping = controls.enableDamping;
				controls.enableDamping = false;
				controls.update();

				if ( source ) {

					source.getWorldPosition( camera.position );
					source.getWorldQuaternion( camera.quaternion );
					camera.fov = source.fov;
					camera.near = source.near;
					camera.far = source.far;
					controls.target.copy( camera.position ).addScaledVector( camera.getWorldDirection( new THREE.Vector3() ), camera.position.distanceTo( center ) );

				} else {

					controls.target.copy( center );
					camera.position.copy( center ).add( new THREE.Vector3( 1, 0.6, 1 ).multiplyScalar( bounds.getSize( new THREE.Vector3() ).length() ) );

				}

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				controls.update();
				controls.saveState();
				controls.enableDamping = damping;

			}

			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );

			}

			function animate() {

				controls.update();

				renderPipeline.render();

			}

		</script>
	</body>
</html>
