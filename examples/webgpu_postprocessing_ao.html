<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - ambient occlusion</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - ambient occlusion">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ao.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ao.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>AO</span>
			</div>

			<small>
				Ambient Occlusion: switchable between GTAO and SSAO.<br />
				Tennyson bust from <a href="https://threedscans.com/lincoln/tennyson/" target="_blank" rel="noopener">Three D Scans</a>.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { sample, pass, mrt, screenUV, normalView, velocity, vec3, vec4, packNormalToRGB, unpackRGBToNormal, colorSpaceToWorking, builtinAOContext } from 'three/tsl';
			import { ao } from 'three/addons/tsl/display/GTAONode.js';
			import { ssao } from 'three/addons/tsl/display/SSAONode.js';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			let camera, scene, renderer, renderPipeline, controls, model;

			let aoPass, traaPass, transparentMesh;

			const models = {
				'Museum': 'museum.glb',
				'Cornell Box': 'cornell-box.glb',
				'Cornell Box (Oblique)': 'cornell-box-oblique.glb',
				'Cornell Box (Metallic Sphere)': 'cornell-box-metallic-sphere.glb',
				'Cornell Box (Mirror Wall)': 'cornell-box-mirror-wall.glb',
				'Dual Rooms': 'dual-rooms.glb'
			};

			const params = {
				model: 'Museum',
				aoType: 'GTAO',
				samples: 16,
				radius: 0.4,
				resolutionScale: 0.5,
				scale: 0.8, // GTAO
				thickness: 1, // GTAO
				temporalFiltering: true, // GTAO
				intensity: 2, // SSAO
				bias: 0.025, // SSAO
				blurEnabled: true, // SSAO
				blurSharpness: 2, // SSAO
				aoOnly: false,
				transparentOpacity: 0.3
			};

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 50 );
				camera.position.set( 1, 3, 7 );

				scene = new THREE.Scene();

				renderer = new THREE.WebGPURenderer();
				renderer.toneMapping = THREE.NeutralToneMapping;
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				// controls

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.minDistance = 0.1;
				controls.maxDistance = 100;
				controls.target.set( 0, 1.2, 0 );

				// environment

				const environment = new RoomEnvironment();
				const pmremGenerator = new THREE.PMREMGenerator( renderer );

				scene.background = new THREE.Color( 0x666666 );
				scene.environment = pmremGenerator.fromScene( environment, 0.04 ).texture;
				scene.environmentIntensity = 0.3;
				environment.dispose();
				pmremGenerator.dispose();

				// post-processing

				renderPipeline = new THREE.RenderPipeline( renderer );

				// pre-pass

				const prePass = pass( scene, camera ).toInspector( 'Normal', ( inspectNode ) => colorSpaceToWorking( inspectNode, THREE.SRGBColorSpace ) );
				prePass.name = 'Pre-Pass';
				prePass.transparent = false;

				prePass.setMRT( mrt( {
					output: packNormalToRGB( normalView ),
					velocity: velocity
				} ) );

				const prePassNormal = sample( ( uv ) => {

					return unpackRGBToNormal( prePass.getTextureNode().sample( uv ) );

				} );

				const prePassDepth = prePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => prePass.getLinearDepthNode() );
				const prePassVelocity = prePass.getTextureNode( 'velocity' ).toInspector( 'Velocity' );

				// pre-pass - bandwidth optimization

				const normalTexture = prePass.getTexture( 'output' );
				normalTexture.type = THREE.UnsignedByteType;

				// scene pass

				const scenePass = pass( scene, camera ).toInspector( 'Color' );

				// traa ( resolves the temporal noise of GTAO )

				traaPass = traa( scenePass, prePassDepth, prePassVelocity, camera );
				traaPass.useSubpixelCorrection = false;

				// ao: the AO node feeds the scene's ambient term via `builtinAOContext`, and
				// can be switched between GTAO ( ground-truth, needs temporal denoise ) and the
				// cheaper SSAO ( self-denoised )

				function updateOutput() {

					// SSAO is self-denoised so it can skip TRAA and use MSAA for edge anti-aliasing instead

					const useTRAA = ( params.aoType === 'GTAO' );

					scenePass.options.samples = useTRAA ? 0 : 4;

					renderPipeline.outputNode = params.aoOnly ? vec4( vec3( aoPass.getTextureNode().sample( screenUV ).r ), 1 ) : ( useTRAA ? traaPass : scenePass );
					renderer.toneMapping = params.aoOnly ? THREE.NoToneMapping : THREE.NeutralToneMapping;
					renderPipeline.needsUpdate = true;

				}

				function createAO() {

					if ( aoPass ) aoPass.dispose();

					aoPass = ( params.aoType === 'SSAO' )
						? ssao( prePassDepth, prePassNormal, camera ).toInspector( 'SSAO', ( inspectNode ) => inspectNode.r )
						: ao( prePassDepth, prePassNormal, camera ).toInspector( 'GTAO', ( inspectNode ) => inspectNode.r );

					updateParameters();

					scenePass.contextNode = builtinAOContext( aoPass.getTextureNode().sample( screenUV ).r );
					scenePass.needsUpdate = true;

					updateOutput();

				}

				createAO();

				// Transparent plane for testing, kept separate from the loaded model.

				transparentMesh = new THREE.Mesh( new THREE.PlaneGeometry( 1.8, 2 ), new THREE.MeshStandardNodeMaterial( { transparent: true, opacity: params.transparentOpacity } ) );
				transparentMesh.visible = false;
				transparentMesh.position.set( 0, 1.2, 1.5 );
				scene.add( transparentMesh );

				const loader = new GLTFLoader();
				let loadId = 0;
				let currentModel = params.model;

				async function loadModel() {

					const id = ++ loadId;
					const name = params.model;

					try {

						const gltf = await loader.loadAsync( 'models/gltf/' + models[ name ] );
						if ( id !== loadId ) {

							disposeModel( gltf.scene );
							return;

						}

						if ( model ) {

							scene.remove( model );
							disposeModel( model );

						}

						model = gltf.scene;
						model.traverse( ( object ) => {

							if ( object.isMesh ) {

								object.castShadow = true;
								object.receiveShadow = true;

							}

							if ( object.isLight && object.shadow ) {

								object.castShadow = true;
								object.shadow.mapSize.setScalar( 1024 );
								object.shadow.normalBias = 0.02;

							}

						} );

						scene.add( model );
						model.updateMatrixWorld( true );
						setModelCamera( gltf );
						// Restart temporal accumulation for the new scene.
						traaPass.setSize( 1, 1 );
						currentModel = name;

					} catch ( error ) {

						if ( id !== loadId ) return;
						params.model = currentModel;
						console.error( 'Unable to load model:', error );

					}

				}

				await loadModel();
				renderer.setAnimationLoop( animate );

				// events

				window.addEventListener( 'resize', onWindowResize );

				// GUI

				const gui = renderer.inspector.createParameters( 'Settings' );
				gui.add( params, 'model', Object.keys( models ) ).name( 'Model' ).listen().onChange( loadModel );
				gui.add( params, 'aoType', [ 'GTAO', 'SSAO' ] ).name( 'AO type' ).onChange( () => {

					// half resolution suffices for GTAO since TRAA smooths it, SSAO looks best at full resolution

					resolutionScaleControl.setValue( params.aoType === 'SSAO' ? 1 : 0.5 );

					createAO();
					updateControls();

				} );
				const resolutionScaleControl = gui.add( params, 'resolutionScale', 0, 1 ).name( 'resolution' ).onChange( updateParameters );
				gui.add( params, 'samples', 4, 32, 1 ).onChange( updateParameters ).debounce( 250 );
				gui.add( params, 'radius', 0.1, 1 ).onChange( updateParameters );

				const gtaoControls = [
					gui.add( params, 'scale', 0.01, 1 ).onChange( updateParameters ),
					gui.add( params, 'thickness', 0.01, 2 ).onChange( updateParameters ),
					gui.add( params, 'temporalFiltering' ).name( 'temporal filtering' ).onChange( updateParameters )
				];

				const ssaoControls = [
					gui.add( params, 'intensity', 0, 4 ).onChange( updateParameters ),
					gui.add( params, 'bias', 0, 0.2 ).onChange( updateParameters ),
					gui.add( params, 'blurEnabled' ).name( 'blur' ).onChange( updateParameters ),
					gui.add( params, 'blurSharpness', 0, 8 ).name( 'blur sharpness' ).onChange( updateParameters )
				];

				gui.add( transparentMesh, 'visible' ).name( 'show transparent mesh' );
				gui.add( params, 'transparentOpacity', 0, 1, 0.01 ).name( 'mesh opacity' ).onChange( ( value ) => {

					transparentMesh.material.opacity = value;

				} );
				gui.add( params, 'aoOnly' ).onChange( updateOutput );

				// show only the controls that apply to the active AO type

				function updateControls() {

					if ( params.aoType === 'GTAO' ) {

						gtaoControls.forEach( ( control ) => control.show() );
						ssaoControls.forEach( ( control ) => control.hide() );

					} else {

						gtaoControls.forEach( ( control ) => control.hide() );
						ssaoControls.forEach( ( control ) => control.show() );

					}

				}

				updateControls();

			}

			function updateParameters() {

				aoPass.samples.value = params.samples;
				aoPass.radius.value = params.radius;
				aoPass.resolutionScale = params.resolutionScale;

				if ( params.aoType === 'SSAO' ) {

					aoPass.intensity.value = params.intensity;
					aoPass.bias.value = params.bias;
					aoPass.blurEnabled = params.blurEnabled;
					aoPass.blurSharpness.value = params.blurSharpness;

				} else {

					aoPass.scale.value = params.scale;
					aoPass.thickness.value = params.thickness;
					aoPass.useTemporalFiltering = params.temporalFiltering;

				}

			}

			function disposeModel( model ) {

				const resources = new Set();
				model.traverse( ( object ) => {

					if ( object.geometry ) resources.add( object.geometry );
					if ( object.shadow ) resources.add( object.shadow );
					const materials = Array.isArray( object.material ) ? object.material : [ object.material ];
					for ( const material of materials ) {

						if ( ! material ) continue;
						resources.add( material );
						for ( const value of Object.values( material ) ) {

							if ( value && value.isTexture ) resources.add( value );

						}

					}

				} );
				for ( const resource of resources ) resource.dispose();

			}

			function setModelCamera( gltf ) {

				const source = gltf.cameras[ 0 ];
				const bounds = new THREE.Box3().setFromObject( model );
				const center = bounds.getCenter( new THREE.Vector3() );

				// Clear any orbit damping left over from the previous scene.
				const damping = controls.enableDamping;
				controls.enableDamping = false;
				controls.update();

				if ( source ) {

					source.getWorldPosition( camera.position );
					source.getWorldQuaternion( camera.quaternion );
					camera.fov = source.fov;
					camera.near = source.near;
					camera.far = source.far;
					controls.target.copy( camera.position ).addScaledVector( camera.getWorldDirection( new THREE.Vector3() ), camera.position.distanceTo( center ) );

				} else {

					controls.target.copy( center );
					camera.position.copy( center ).add( new THREE.Vector3( 1, 0.6, 1 ).multiplyScalar( bounds.getSize( new THREE.Vector3() ).length() ) );

				}

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				controls.update();
				controls.saveState();
				controls.enableDamping = damping;

			}

			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );

			}

			function animate() {

				controls.update();

				renderPipeline.render();

			}

		</script>
	</body>
</html>
