<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js WebGL 2 - buffergeometry - attributes - opacity</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js WebGL 2 - buffergeometry - attributes - opacity">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_buffergeometry_attributes_opacity.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_buffergeometry_attributes_opacity.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info"><a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> WebGL 2 - buffergeometry - attributes - opacity</div>

        <script type="x-shader/x-vertex" id="vertexshader_vertices">

            attribute float opacity;

            varying float vOpacity;

            void main() {

                vOpacity = opacity;

                vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );

                gl_PointSize = 50.0 / -mvPosition.z ;

                gl_Position = projectionMatrix * mvPosition;

            }

        </script>
        <script type="x-shader/x-fragment" id="fragmentshader_vertices">
          
            uniform vec3 color;

            uniform sampler2D pointTexture;

            varying float vOpacity;

            void main() {

                gl_FragColor = texture2D( pointTexture, gl_PointCoord );

                if (gl_FragColor.a < 0.9) discard;

                gl_FragColor = vec4( color, vOpacity ) * gl_FragColor ;

            }

        </script>
        <script type="x-shader/x-vertex" id="vertexshader">

            attribute float opacity;

            varying float vOpacity;

            void main() {

                vOpacity = opacity;

                vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );

                gl_PointSize = 50.0 / -mvPosition.z ;

                gl_Position = projectionMatrix * mvPosition;

            }
        </script>

        <script type="x-shader/x-fragment" id="fragmentshader">

            uniform vec3 color;

            varying float vOpacity;

            void main() {

                gl_FragColor = vec4( color, vOpacity );

            }

        </script>   

        <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three/build/three.module.js",
                    "three/addons/": "https://unpkg.com/three/examples/jsm/"
                }
            }
        </script>

		<script type="module">

            import * as THREE from 'three';

            import { OrbitControls } from 'three/addons/controls/OrbitControls.js'; 

            import Stats from 'three/addons/libs/stats.module.js'; 

            let scene, camera, renderer, controls, stats;

            let obj_group;

            init();

            function init(){

                scene = new THREE.Scene();
                obj_group = new THREE.Group();
                scene.add(obj_group);

                camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.1, 1000 );
                camera.position.set(2,0,2);
                camera.lookAt(0,0,0);

                renderer = new THREE.WebGLRenderer();
                renderer.setSize( window.innerWidth, window.innerHeight );
                renderer.setAnimationLoop( animate );
                document.body.appendChild( renderer.domElement );
                window.addEventListener( 'resize', onWindowResize );

                controls = new OrbitControls( camera, renderer.domElement );
                
                stats = new Stats();
                document.body.appendChild(stats.dom);

                {
                    let vertices = [];
                    let edges = [];
                    let faces = [];
                    let cubes = [];
                    {
                        const depth = 3;
                        const width = 3;
                        const height = 3;

                        let edge_xs = []; 
                        let edge_ys = []; 
                        let edge_zs = []; 

                        let face_zs = [];
                        let face_xs = [];
                        let face_ys = [];

                        const start_depth = Math.floor((depth-1) / 2);
                        const start_height =  Math.floor((height-1) / 2);
                        const start_width =  Math.floor((width-1) / 2);
                        const end_depth = Math.floor((depth+1) / 2);
                        const end_height =  Math.floor((height+1) / 2);
                        const end_width =  Math.floor((width+1) / 2);

                        for (let z = - start_depth; z < end_depth; z++ ) {
                            for (let y = - start_height; y < end_height; y++ ) {
                                for (let x = - start_width; x < end_width; x++ ) {
                                    
                                    const v0 = [ x, y, z ];
                                    const v0x = [ x+1, y, z ];
                                    const v0y = [ x, y+1, z ];
                                    const v0z = [ x, y, z+1 ];  

                                    const v1 = [ x+1, y+1, z+1 ];
                                    const v1_x = [ x, y+1, z+1 ];
                                    const v1_y = [ x+1, y, z+1 ];
                                    const v1_z = [ x+1, y+1, z ];

                                    const edge0x = v0.concat(v0x);
                                    const edge0y = v0.concat(v0y);
                                    const edge0z = v0.concat(v0z);      

                                    const face0z = v0.concat(v0x, v1_z, v1_z, v0y, v0);
                                    const face0x = v0.concat(v0y, v1_x, v1_x, v0z, v0);
                                    const face0y = v0.concat(v0z, v1_y, v1_y, v0x, v0);

                                    const face1z = v1.concat(v1_x, v0z, v0z, v1_y, v1);
                                    const face1x = v1.concat(v1_y, v0x, v0x, v1_z, v1);
                                    const face1y = v1.concat(v1_z, v0y, v0y, v1_x, v1);          

                                    const cube = face0z.concat(face0x, face0y, face1z, face1x, face1y);

                                    vertices.push(...v0);
                                    if(v1[0] < end_width) edge_xs.push(...edge0x);
                                    if(v1[1] < end_height) edge_ys.push(...edge0y);
                                    if(v1[2] < end_depth) edge_zs.push(...edge0z);
                                    if(v1[0] < end_width && v1[1] < end_height) face_zs.push(...face0z);
                                    if(v1[1] < end_height && v1[2] < end_depth) face_xs.push(...face0x);
                                    if(v1[2] < end_depth && v1[0] < end_width) face_ys.push(...face0y);
                                    if(v1[0] < end_width && v1[1] < end_height && v1[2] < end_depth) cubes.push(...cube);

                                }           
                            }    
                        }

                        edges = edge_xs.concat(edge_ys, edge_zs);
                        faces = face_zs.concat(face_xs, face_ys);    

                    }

                    {
                        const geometry = new THREE.BufferGeometry();
                        geometry.setAttribute( 'position', new THREE.Float32BufferAttribute( vertices, 3 ) );
                        const opacities = new Float32Array( geometry.attributes.position.array.length/3 ).fill(0.1);
                        geometry.setAttribute( 'opacity', new THREE.Float32BufferAttribute( opacities, 1 ) );
                        
                        const texture = new THREE.TextureLoader().load( 'textures/sprites/blossom.png' );
                        const material = new THREE.ShaderMaterial( {
                            uniforms: {
                                color: { value: new THREE.Color( 0xffffff ) },
                                pointTexture: { value: texture },
                                alphaTest: {value: 0.5 }
                            },
                            vertexShader: document.getElementById( 'vertexshader_vertices' ).textContent,
                            fragmentShader: document.getElementById( 'fragmentshader_vertices' ).textContent,
                            transparent: true
                        } );

                        const obj_vertices = new THREE.Points( geometry, material );
                        obj_group.add(obj_vertices);
                    }
                    {
                        const geometry = new THREE.BufferGeometry();
                        geometry.setAttribute( 'position', new THREE.Float32BufferAttribute( edges, 3 ) );
                        const opacities = new Float32Array( geometry.attributes.position.array.length/3 ).fill(0.);
                        geometry.setAttribute( 'opacity', new THREE.Float32BufferAttribute( opacities, 1 ) );

                        const material = new THREE.ShaderMaterial( {
                            uniforms: {
                                color: { value: new THREE.Color( 0x509955 ) },
                            },
                            vertexShader: document.getElementById( 'vertexshader' ).textContent,
                            fragmentShader: document.getElementById( 'fragmentshader' ).textContent,
                            transparent: true,
                            side: THREE.DoubleSide
                        } );

                        const obj_edges = new THREE.LineSegments( geometry, material );
                        obj_group.add(obj_edges);

                    }
                    {
                        const geometry = new THREE.BufferGeometry();
                        geometry.setAttribute( 'position', new THREE.Float32BufferAttribute( faces, 3 ) );
                        const opacities = new Float32Array( geometry.attributes.position.array.length/3 ).fill(0.);
                        geometry.setAttribute( 'opacity', new THREE.Float32BufferAttribute( opacities, 1 ) );

                        const material = new THREE.ShaderMaterial( {
                            uniforms: {
                                color: { value: new THREE.Color( 0x228888 ) },
                            },
                            vertexShader: document.getElementById( 'vertexshader' ).textContent,
                            fragmentShader: document.getElementById( 'fragmentshader' ).textContent,
                            transparent: true,
                            side: THREE.DoubleSide
                        } );

                        const obj_faces = new THREE.Mesh( geometry, material );
                        obj_group.add(obj_faces);
                    }
                    {
                        const geometry = new THREE.BufferGeometry();
                        geometry.setAttribute( 'position', new THREE.Float32BufferAttribute( cubes, 3 ) );
                        const opacities = new Float32Array( geometry.attributes.position.array.length/3 ).fill(0.);
                        geometry.setAttribute( 'opacity', new THREE.Float32BufferAttribute( opacities, 1 ) );

                        const material = new THREE.ShaderMaterial( {
                            uniforms: {
                                color: { value: new THREE.Color( 0xffffff ) },
                            },
                            vertexShader: document.getElementById( 'vertexshader' ).textContent,
                            fragmentShader: document.getElementById( 'fragmentshader' ).textContent,
                            transparent: true,
                            side: THREE.DoubleSide
                        } );

                        const obj_cubes = new THREE.Mesh( geometry, material );
                        obj_group.add(obj_cubes);
                    }
                }
            }

            function onWindowResize() {

                camera.aspect = window.innerWidth / window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize( window.innerWidth, window.innerHeight );

            }

            function animate( time ) {

                render(time);

                controls.update();

                stats.update();
            }



            let frame_count = 0, idx = 0;  
            const idx_recur_arr = [1, 2, 6, 36];
            const opacity_on_arr = [1., 1., .6, .3];
            const opacity_off_arr = [.1, 0., 0., 0.];

            function render(time) {
                
                if(frame_count == 30) {

                    frame_count = 0;

                    let idx_offset = idx;

                    for( let i=0; i<obj_group.children.length; i++){
                        
                        const opacity = obj_group.children[i].geometry.attributes.opacity;
                        const l = opacity.array.length;
                        
                        if( idx_offset<l ){

                            const idx_recur = idx_recur_arr[i];
                            const opacity_on = opacity_on_arr[i];

                            for(let j=0; j < idx_recur; j++ ) {
                                opacity.array[idx_offset] = opacity_on;
                                idx_offset++;
                            }

                            idx += idx_recur;
                            opacity.needsUpdate = true;
                            
                            break;

                        } else {
                            idx_offset -= l;
                        }

                    }

                    // reset
                    if(idx_offset == 0){

                        idx = 0;

                        for( let i = 0; i < obj_group.children.length; i++ ) {

                            const opacity = obj_group.children[i].geometry.attributes.opacity;
                            
                            opacity.array.fill(opacity_off_arr[i]);
                            
                            opacity.needsUpdate = true;
                        
                        }
                    }
                            
                }

                frame_count++;

                obj_group.rotation.y = time /2000;  

                renderer.render( scene, camera );

            }
		</script>
	</body>
</html>
