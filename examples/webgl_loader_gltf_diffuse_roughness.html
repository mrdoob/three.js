<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - GLTFloader + Diffuse Roughness</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - GLTFloader + Diffuse Roughness">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_loader_gltf_diffuse_roughness.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_loader_gltf_diffuse_roughness.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			.material-label,
			.row-label {
				color: #fff;
				font: 11px/1.2 Arial, sans-serif;
				letter-spacing: 0;
				padding: 2px 4px;
				background: rgba( 0, 0, 0, 0.7 );
				border-radius: 2px;
				white-space: nowrap;
			}

			.row-label {
				font-size: 12px;
				text-align: right;
			}
		</style>
	</head>

	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - GLTFLoader + <a href="https://github.com/MiiBond/glTF/tree/mbond/EXT_materials_diffuse_roughness/extensions/2.0/Khronos/KHR_materials_diffuse_roughness" target="_blank" rel="noopener">KHR_materials_diffuse_roughness</a><br />
			Diffuse roughness parameter sweep from <a href="https://github.com/KhronosGroup/glTF-Sample-Assets/pull/288" target="_blank" rel="noopener">glTF-Sample-Assets</a>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { CSS2DObject, CSS2DRenderer } from 'three/addons/renderers/CSS2DRenderer.js';

			let camera, scene, renderer, labelRenderer, controls;
			let model, modelCenter, modelSize;

			const rowDescriptions = [
				{ y: 1, desc: 'Control' },
				{ y: 0, desc: 'spec. 0.95' },
				{ y: - 1, desc: 'spec. 0.35' },
				{ y: - 2, desc: 'map R x 1' }
			];
			const labeledObjects = [];
			const rowLabels = [];

			const lightSettings = {
				azimuth: 180,
				elevation: 0,
				intensity: 3
			};

			init().catch( function ( error ) {

				console.error( error );

			} );

			async function init() {

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = THREE.NeutralToneMapping;
				document.body.appendChild( renderer.domElement );

				labelRenderer = new CSS2DRenderer();
				labelRenderer.setSize( window.innerWidth, window.innerHeight );
				labelRenderer.domElement.style.position = 'absolute';
				labelRenderer.domElement.style.top = '0';
				labelRenderer.domElement.style.pointerEvents = 'none';
				document.body.appendChild( labelRenderer.domElement );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x202124 );

				camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 0, - 1 );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;

				const light = new THREE.DirectionalLight( 0xffffff, lightSettings.intensity );
				scene.add( light );
				scene.add( light.target );

				function updateLight() {

					const azimuth = THREE.MathUtils.degToRad( lightSettings.azimuth );
					const elevation = THREE.MathUtils.degToRad( lightSettings.elevation );
					const radius = 10;

					light.position.set(
						radius * Math.sin( azimuth ) * Math.cos( elevation ),
						radius * Math.sin( elevation ),
						radius * Math.cos( azimuth ) * Math.cos( elevation )
					);
					light.intensity = lightSettings.intensity;

				}

				updateLight();

				const gui = new GUI();
				gui.add( lightSettings, 'azimuth', - 180, 180, 1 ).onChange( updateLight );
				gui.add( lightSettings, 'elevation', - 10, 90, 1 ).onChange( updateLight );
				gui.add( lightSettings, 'intensity', 0, 6, 0.1 ).onChange( updateLight );
				if ( camera.aspect < 0.75 ) gui.close();

				const gltf = await new GLTFLoader()
					.setPath( 'models/gltf/' )
					.loadAsync( 'DiffuseRoughnessParameterSweep.glb' );
				model = gltf.scene;

				// The draft sample asset currently uses clockwise triangle winding.
				const geometries = new Set();

				model.traverse( function ( object ) {

					const geometry = object.geometry;

					if ( geometry === undefined ) return;

					addMaterialLabel( object );

					if ( geometries.has( geometry ) ) return;

					const index = geometry.index;

					for ( let i = 0; i < index.count; i += 3 ) {

						const second = index.getX( i + 1 );
						index.setX( i + 1, index.getX( i + 2 ) );
						index.setX( i + 2, second );

					}

					index.needsUpdate = true;
					geometries.add( geometry );

				} );

				addMapTestRow();
				addRowLabels();
				updateModelLayout();
				scene.add( model );

				updateModelBounds();
				light.target.position.copy( modelCenter );

				frameModel();

				window.addEventListener( 'resize', onWindowResize );

			}

			function addMaterialLabel( object, text ) {

				labeledObjects.push( { object, position: object.position.clone() } );

				const element = document.createElement( 'div' );
				element.className = 'material-label';
				element.textContent = text || ( object.material.diffuseRoughness === undefined
					? 'Lambert'
					: object.material.diffuseRoughness.toFixed( 2 ) );

				const label = new CSS2DObject( element );
				label.position.set( 0, 0.48, 0 );
				object.add( label );

			}

			function addMapTestRow() {

				const sources = labeledObjects
					.map( ( { object } ) => object )
					.filter( object => object.name.startsWith( '01_' ) );

				for ( const source of sources ) {

					const mapValue = source.material.diffuseRoughness;
					const map = new THREE.DataTexture( new Uint8Array( [ Math.round( mapValue * 255 ), 0, 0, 255 ] ), 1, 1 );
					map.needsUpdate = true;

					const material = source.material.clone();
					material.diffuseRoughness = 1;
					material.diffuseRoughnessMap = map;

					const object = new THREE.Mesh( source.geometry, material );
					object.position.set( source.position.x, - 2, source.position.z );
					model.add( object );
					addMaterialLabel( object, `R ${ mapValue.toFixed( 2 ) }` );

				}

			}

			function addRowLabels() {

				for ( const { y, desc } of rowDescriptions ) {

					const element = document.createElement( 'div' );
					element.className = 'row-label';
					element.textContent = desc;

					const label = new CSS2DObject( element );
					model.add( label );
					rowLabels.push( { label, y } );

				}

			}

			function updateModelLayout() {

				const portrait = camera.aspect < 0.75;

				for ( const { object, position } of labeledObjects ) {

					if ( portrait ) {

						object.position.set( position.y, - position.x, position.z );

					} else {

						object.position.copy( position );

					}

				}

				for ( const { label, y } of rowLabels ) {

					if ( portrait ) {

						label.position.set( y, 4.15, 0 );
						label.center.set( 0.5, 1 );

					} else {

						label.position.set( 4.05, y, 0 );
						label.center.set( 1, 0.5 );

					}

				}

			}

			function updateModelBounds() {

				const box = new THREE.Box3().setFromObject( model );
				modelCenter = box.getCenter( new THREE.Vector3() );
				modelSize = box.getSize( new THREE.Vector3() );

			}

			function frameModel() {

				const halfFov = THREE.MathUtils.degToRad( camera.fov * 0.5 );
				const framingPadding = camera.aspect < 0.75 ? 1.5 : 1.4;
				const distance = framingPadding * Math.max(
					modelSize.y * 0.5 / Math.tan( halfFov ),
					modelSize.x * 0.5 / ( Math.tan( halfFov ) * camera.aspect )
				);

				const direction = camera.position.clone().sub( controls.target );
				if ( direction.lengthSq() === 0 ) direction.set( 0, 0, 1 );

				controls.target.copy( modelCenter );
				camera.position.copy( modelCenter ).add( direction.normalize().multiplyScalar( distance ) );
				camera.near = distance / 100;
				camera.far = distance * 100;
				camera.updateProjectionMatrix();

				controls.minDistance = distance * 0.35;
				controls.maxDistance = distance * 3;
				controls.update();

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				updateModelLayout();
				updateModelBounds();

				renderer.setSize( window.innerWidth, window.innerHeight );
				labelRenderer.setSize( window.innerWidth, window.innerHeight );

				frameModel();

			}

			function animate() {

				controls.update();
				renderer.render( scene, camera );
				labelRenderer.render( scene, camera );

			}

		</script>

	</body>
</html>
