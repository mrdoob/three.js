<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - light probe volume</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - light probe volume">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_lightprobes.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_lightprobes.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Light Probe Volume</span>
			</div>

			<small>Position-dependent diffuse global illumination via L2 SH probe grid.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';

			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { LightProbeGrid } from 'three/addons/lighting/LightProbeGrid.js';
			import { LightProbeGridHelper } from 'three/addons/helpers/LightProbeGridHelper.js';

			const models = {
				'Museum': 'museum.glb',
				'Dual Rooms': 'dual-rooms.glb',
				'Cornell Box': 'cornell-box.glb',
				'Cornell Box (Oblique)': 'cornell-box-oblique.glb',
				'Cornell Box (Metallic Sphere)': 'cornell-box-metallic-sphere.glb',
				'Cornell Box (Mirror Wall)': 'cornell-box-mirror-wall.glb'
			};

			let camera, scene, renderer, controls;
			let model;
			let probes, probesHelper;

			init();

			async function init() {

				// Camera

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 2.5, 8 );

				// Scene

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x111111 );

				// Renderer

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 1.0;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				// Controls

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 2.5, 0 );
				controls.update();

				// Bake light probe volume

				function bake( resolution ) {

					if ( probes ) {

						scene.remove( probes );
						probes.dispose();

					}

					const bounds = new THREE.Box3().setFromObject( model );
					const size = bounds.getSize( new THREE.Vector3() ).multiplyScalar( 0.95 ).max( new THREE.Vector3( 0.1, 0.1, 0.1 ) );
					probes = new LightProbeGrid( size.x, size.y, size.z, resolution, resolution, resolution );
					probes.position.copy( bounds.getCenter( new THREE.Vector3() ) );
					if ( probesHelper ) probesHelper.visible = false;
					probes.bake( renderer, scene, { cubemapSize: 32, near: 0.05, far: size.length() * 2 } );
					probes.visible = params.enabled;
					scene.add( probes );

					// Update debug visualization

					if ( ! probesHelper ) {

						probesHelper = new LightProbeGridHelper( probes );
						probesHelper.visible = params.showProbes;
						scene.add( probesHelper );

					} else {

						probesHelper.probes = probes;
						probesHelper.update();
						probesHelper.visible = params.showProbes;

					}

				}

				const params = {
					model: 'Cornell Box',
					enabled: true,
					showProbes: false,
					resolution: 6
				};

				// GUI

				const loader = new GLTFLoader();
				let loadId = 0;
				let currentModel = params.model;

				async function loadModel() {

					const id = ++ loadId;
					const name = params.model;

					try {

						const gltf = await loader.loadAsync( 'models/gltf/' + models[ name ] );
						if ( id !== loadId ) {

							disposeModel( gltf.scene );
							return;

						}

						if ( model ) {

							scene.remove( model );
							disposeModel( model );

						}

						model = gltf.scene;
						model.traverse( ( object ) => {

							if ( object.isMesh ) {

								object.castShadow = true;
								object.receiveShadow = true;

							}

							if ( object.isLight && object.shadow ) {

								object.castShadow = true;
								object.shadow.mapSize.setScalar( 1024 );
								object.shadow.normalBias = 0.02;

							}

						} );

						scene.add( model );
						model.updateMatrixWorld( true );
						setModelCamera( gltf );
						bake( params.resolution );
						currentModel = name;

					} catch ( error ) {

						if ( id !== loadId ) return;
						params.model = currentModel;
						console.error( 'Unable to load model:', error );

					}

				}

				await loadModel();
				renderer.setAnimationLoop( animate );

				const gui = renderer.inspector.createParameters( 'Light Probes' );
				gui.add( params, 'model', Object.keys( models ) ).name( 'Model' ).listen().onChange( loadModel );
				gui.add( params, 'enabled' ).name( 'GI' ).onChange( ( value ) => {

					probes.visible = value;

				} );

				gui.add( params, 'resolution', 2, 12, 1 ).name( 'Resolution' ).onChange( ( value ) => {

					bake( value );

				} ).debounce( 250 );
				gui.add( params, 'showProbes' ).name( 'Show Probes' ).onChange( ( value ) => {

					probesHelper.visible = value;

				} );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function disposeModel( model ) {

				const resources = new Set();
				model.traverse( ( object ) => {

					if ( object.geometry ) resources.add( object.geometry );
					if ( object.shadow ) resources.add( object.shadow );
					const materials = Array.isArray( object.material ) ? object.material : [ object.material ];
					for ( const material of materials ) {

						if ( ! material ) continue;
						resources.add( material );
						for ( const value of Object.values( material ) ) {

							if ( value && value.isTexture ) resources.add( value );

						}

					}

				} );
				for ( const resource of resources ) resource.dispose();

			}

			function setModelCamera( gltf ) {

				const source = gltf.cameras[ 0 ];
				const bounds = new THREE.Box3().setFromObject( model );
				const center = bounds.getCenter( new THREE.Vector3() );

				// Clear any orbit damping left over from the previous scene.
				const damping = controls.enableDamping;
				controls.enableDamping = false;
				controls.update();

				if ( source ) {

					source.getWorldPosition( camera.position );
					source.getWorldQuaternion( camera.quaternion );
					camera.fov = source.fov;
					camera.near = source.near;
					camera.far = source.far;
					controls.target.copy( camera.position ).addScaledVector( camera.getWorldDirection( new THREE.Vector3() ), camera.position.distanceTo( center ) );

				} else {

					controls.target.copy( center );
					camera.position.copy( center ).add( new THREE.Vector3( 1, 0.6, 1 ).multiplyScalar( bounds.getSize( new THREE.Vector3() ).length() ) );

				}

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				controls.update();
				controls.saveState();
				controls.enableDamping = damping;

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
