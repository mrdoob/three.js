<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - gpu-driven meshlets</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - gpu-driven meshlets">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_gpudriven_meshlets.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_gpudriven_meshlets.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>GPU-Driven Compute Rasterizer</span>
			</div>

			<small>Rendering <span id="triangleCount"></span> triangles with GPU-driven drawers.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { float, uniform, instanceIndex, positionLocal, positionGeometry, rotate, vec3 } from 'three/tsl';

			import { FirstPersonControls } from 'three/addons/controls/FirstPersonControls.js';
			import { TeapotGeometry } from 'three/addons/geometries/TeapotGeometry.js';
			import { GPUDrivenDrawer } from 'three/addons/drawers/GPUDrivenDrawer.js';
			import { VisibilityBufferDrawer } from 'three/addons/drawers/VisibilityBufferDrawer.js';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			import WebGPU from 'three/addons/capabilities/WebGPU.js';

			if ( WebGPU.isAvailable() === false ) {

				document.body.appendChild( WebGPU.getErrorMessage() );

				throw new Error( 'No WebGPU support' );

			}

			let camera, scene, renderer, controls, timer;
			let drawers, basicDrawer, teapots;

			// the visibility buffer addresses up to 131072 objects per render list

			const rows = 360;
			const cols = 360;
			const instanceCount = rows * cols;

			const options = { Mode: 'Meshlet Debug', Rasterizer: 'Hardware', 'LOD Threshold': 1, 'Occlusion Culling': false, 'Animation Speed': 1 };

			const animationTime = uniform( 0 );

			init();

			async function init() {

				renderer = new THREE.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				// the visibility buffer drawer rasterizes small triangles in a compute shader and large ones in hardware,
				// the GPU-driven drawer rasterizes all triangles in hardware. both cull and select the LOD on the GPU

				// the objects are spread out and hardly occlude each other, so occlusion culling costs more than it saves

				drawers = {
					'Hybrid': new VisibilityBufferDrawer( { maxRasterSize: 16, debug: true, occlusionCulling: false } ),
					'Hardware': new GPUDrivenDrawer( { debug: true, occlusionCulling: false } )
				};

				// the default drawer of the renderer draws all objects with the regular pipeline, for comparison

				basicDrawer = renderer.drawer;

				renderer.drawer = drawers[ options.Rasterizer ];

				await renderer.init();

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, .25, 1000000 );
				camera.position.set( 0, 15, 50 );

				timer = new THREE.Timer();

				controls = new FirstPersonControls( camera, renderer.domElement );
				controls.movementSpeed = 30;
				controls.lookSpeed = 0.2;
				controls.lookAt( 0, - 1.5, 0 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( .1, .1, .1 );

				// the meshlets and levels of detail are generated by the drawer

				const geometry = new TeapotGeometry( 1, 10 );

				const textureMap = new THREE.TextureLoader().load( 'textures/uv_grid_directx.jpg' );
				textureMap.colorSpace = THREE.SRGBColorSpace;
				textureMap.wrapS = THREE.RepeatWrapping;
				textureMap.wrapT = THREE.RepeatWrapping;

				// the instance matrices only translate the teapots, the position node rotates each one around its vertical axis.
				// the drawers evaluate the position node on the GPU for the culling and the software rasterizer

				const material = new THREE.MeshBasicNodeMaterial( { map: textureMap } );
				material.positionNode = positionLocal.add( rotate( positionGeometry, vec3( 0, animationTime.add( float( instanceIndex ) ), 0 ) ).sub( positionGeometry ) );

				teapots = new THREE.InstancedMesh( geometry, material, instanceCount );
				teapots.frustumCulled = false; // culled per instance by the drawer

				const matrix = new THREE.Matrix4();

				for ( let i = 0; i < rows; i ++ ) {

					for ( let j = 0; j < cols; j ++ ) {

						matrix.makeTranslation( ( i - rows / 2 ) * 4.0, - 1, ( j - cols / 2 ) * 4.0 );
						teapots.setMatrixAt( i * cols + j, matrix );

					}

				}

				scene.add( teapots );

				const totalTriangles = instanceCount * geometry.index.count / 3;
				document.getElementById( 'triangleCount' ).innerText = new Intl.NumberFormat().format( totalTriangles );

				const parameterGroup = renderer.inspector.createParameters( 'Parameters' );

				const mode = parameterGroup.add( options, 'Mode', { 'Meshlet Debug': 'Meshlet Debug', 'Texture': 'Texture' } ).onChange( ( value ) => {

					for ( const drawer of Object.values( drawers ) ) drawer.debug = value === 'Meshlet Debug';

				} );

				parameterGroup.add( options, 'Rasterizer', { 'Hybrid': 'Hybrid', 'Hardware': 'Hardware', 'Basic': 'Basic' } ).onChange( updateRasterizer );

				const maxRasterSize = parameterGroup.add( drawers[ 'Hybrid' ], 'maxRasterSize', 1, 64, 1 ).name( 'Max Raster Size' );

				const lodThreshold = parameterGroup.add( options, 'LOD Threshold', 1, 15, 0.1 ).onChange( ( value ) => {

					for ( const drawer of Object.values( drawers ) ) drawer.lodThreshold = value;

				} );

				const occlusionCulling = parameterGroup.add( options, 'Occlusion Culling' ).onChange( ( value ) => {

					for ( const drawer of Object.values( drawers ) ) drawer.occlusionCulling = value;

				} );

				parameterGroup.add( options, 'Animation Speed', 0, 1 );

				// only the parameters of the selected rasterizer are shown

				function updateRasterizer() {

					const rasterizer = options.Rasterizer;
					const gpuDriven = rasterizer !== 'Basic';

					renderer.drawer = gpuDriven ? drawers[ rasterizer ] : basicDrawer;

					gpuDriven ? mode.show() : mode.hide();
					rasterizer === 'Hybrid' ? maxRasterSize.show() : maxRasterSize.hide();
					gpuDriven ? lodThreshold.show() : lodThreshold.hide();
					gpuDriven ? occlusionCulling.show() : occlusionCulling.hide();

				}

				updateRasterizer();

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				timer.update();

				if ( scene === undefined ) return; // still loading

				const delta = timer.getDelta();

				controls.update( delta );

				animationTime.value += delta * options[ 'Animation Speed' ];

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
