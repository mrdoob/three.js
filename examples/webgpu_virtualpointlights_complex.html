<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - virtual point lights (multi-room)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - virtual point lights (multi-room)">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_virtualpointlights_complex.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_virtualpointlights_complex.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Virtual Point Lights (Multi-Room)</span>
			</div>

			<small>Diffuse instant radiosity via Virtual Point Lights by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a></small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/",
					"three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/src/index.js"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { lights } from 'three/tsl';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { VirtualPointLightGenerator } from 'three/addons/lighting/VirtualPointLightGenerator.js';
			import { VirtualPointLightShadowMaps } from 'three/addons/lighting/VirtualPointLightShadowMaps.js';
			import { VirtualPointLightsNode } from 'three/addons/tsl/lighting/VirtualPointLightsNode.js';
			import { VirtualPointLightHelper } from 'three/addons/helpers/VirtualPointLightHelper.js';
			import { acceleratedRaycast, computeBoundsTree } from 'three-mesh-bvh';

			const MAX_VPLS = 1024;
			const params = { mode: 'combined', count: 128, shadows: true, shadowResolution: 64, showVPLs: false, seed: 1, minDistance: 1, progressive: false, bounces: 2 };

			let camera, scene, renderer;
			let generator, shadowMaps, vpl, helper;
			let sourceLights, intensities;
			let mapsDirty = true;
			let previewCount = params.count;
			let nextPreviewTime = Infinity;

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 2.5, 16 );

				// Scene

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x111111 );

				const wallMaterial = new THREE.MeshStandardMaterial( { color: 0xcccccc, side: THREE.BackSide } );
				const whiteMat = new THREE.MeshStandardMaterial( { color: 0xeeeeee } );

				// Room shell: x=-8 to 8, z=-4 to 4, y=0 to 5

				const room = new THREE.Mesh( new THREE.BoxGeometry( 16, 5, 8 ), wallMaterial );
				room.position.set( 0, 2.5, 0 );
				room.receiveShadow = true;
				scene.add( room );

				const redWall = new THREE.Mesh(
					new THREE.PlaneGeometry( 8, 5 ),
					new THREE.MeshStandardMaterial( { color: 0xdd2200 } )
				);
				redWall.rotation.y = Math.PI / 2;
				redWall.position.set( - 7.99, 2.5, 0 );
				scene.add( redWall );

				const blueWall = new THREE.Mesh(
					new THREE.PlaneGeometry( 8, 5 ),
					new THREE.MeshStandardMaterial( { color: 0x0044ff } )
				);
				blueWall.rotation.y = - Math.PI / 2;
				blueWall.position.set( 7.99, 2.5, 0 );
				scene.add( blueWall );

				// Dividing wall at x=0 with doorway

				const dividerMat = new THREE.MeshStandardMaterial( { color: 0xcccccc } );
				const doorwayHalfGap = 1.25;

				// Left section of divider (z = -4 to -1.25)
				const dividerLeft = new THREE.Mesh(
					new THREE.BoxGeometry( 0.3, 5, 4 - doorwayHalfGap ),
					dividerMat
				);
				dividerLeft.position.set( 0, 2.5, - ( doorwayHalfGap + ( 4 - doorwayHalfGap ) / 2 ) );
				dividerLeft.castShadow = true;
				dividerLeft.receiveShadow = true;
				scene.add( dividerLeft );

				// Right section of divider (z = 1.25 to 4)
				const dividerRight = new THREE.Mesh(
					new THREE.BoxGeometry( 0.3, 5, 4 - doorwayHalfGap ),
					dividerMat
				);
				dividerRight.position.set( 0, 2.5, doorwayHalfGap + ( 4 - doorwayHalfGap ) / 2 );
				dividerRight.castShadow = true;
				dividerRight.receiveShadow = true;
				scene.add( dividerRight );

				// Lintel above doorway
				const lintel = new THREE.Mesh(
					new THREE.BoxGeometry( 0.3, 1.2, doorwayHalfGap * 2 ),
					dividerMat
				);
				lintel.position.set( 0, 4.4, 0 );
				lintel.castShadow = true;
				lintel.receiveShadow = true;
				scene.add( lintel );

				// Left room objects

				// Columns
				const columnGeom = new THREE.CylinderGeometry( 0.3, 0.3, 4, 16 );

				for ( const x of [ - 6, - 2 ] ) {

					for ( const z of [ - 2.5, 2.5 ] ) {

						const col = new THREE.Mesh( columnGeom, whiteMat );
						col.position.set( x, 2, z );
						col.castShadow = true;
						col.receiveShadow = true;
						scene.add( col );

					}

				}

				// Table with golden sphere
				const woodTexture = await new THREE.TextureLoader().loadAsync( 'textures/hardwood2_diffuse.jpg' );
				woodTexture.colorSpace = THREE.SRGBColorSpace;
				woodTexture.wrapS = woodTexture.wrapT = THREE.RepeatWrapping;
				woodTexture.repeat.set( 2, 1 );

				const tableTop = new THREE.Mesh(
					new THREE.BoxGeometry( 2.4, 0.12, 1.4 ),
					new THREE.MeshStandardMaterial( { map: woodTexture, roughness: 0.7 } )
				);
				tableTop.position.set( - 4, 1.0, 0 );
				tableTop.castShadow = true;
				tableTop.receiveShadow = true;
				scene.add( tableTop );

				const legGeom = new THREE.BoxGeometry( 0.1, 1, 0.1 );

				for ( const x of [ - 5.05, - 2.95 ] ) {

					for ( const z of [ - 0.55, 0.55 ] ) {

						const leg = new THREE.Mesh( legGeom, tableTop.material );
						leg.position.set( x, 0.5, z );
						leg.castShadow = true;
						scene.add( leg );

					}

				}

				const sphere = new THREE.Mesh(
					new THREE.SphereGeometry( 0.35, 32, 32 ),
					new THREE.MeshStandardMaterial( { color: 0xffd700, metalness: 0.3, roughness: 0.4 } )
				);
				sphere.position.set( - 4, 1.41, 0 );
				sphere.castShadow = true;
				sphere.receiveShadow = true;
				scene.add( sphere );

				// Stepped blocks near red wall
				const step1 = new THREE.Mesh( new THREE.BoxGeometry( 1.5, 0.5, 1 ), whiteMat );
				step1.position.set( - 7, 0.25, 0 );
				step1.castShadow = true;
				step1.receiveShadow = true;
				scene.add( step1 );

				const step2 = new THREE.Mesh( new THREE.BoxGeometry( 1.0, 1.0, 1 ), whiteMat );
				step2.position.set( - 7, 0.5, 0 );
				step2.castShadow = true;
				step2.receiveShadow = true;
				scene.add( step2 );

				const step3 = new THREE.Mesh( new THREE.BoxGeometry( 0.5, 1.5, 1 ), whiteMat );
				step3.position.set( - 7, 0.75, 0 );
				step3.castShadow = true;
				step3.receiveShadow = true;
				scene.add( step3 );

				// Right room objects

				// Columns
				for ( const x of [ 2, 6 ] ) {

					for ( const z of [ - 2.5, 2.5 ] ) {

						const col = new THREE.Mesh( columnGeom, whiteMat );
						col.position.set( x, 2, z );
						col.castShadow = true;
						col.receiveShadow = true;
						scene.add( col );

					}

				}

				// Pedestal with torus knot
				const pedestal = new THREE.Mesh(
					new THREE.BoxGeometry( 0.8, 1.2, 0.8 ),
					whiteMat
				);
				pedestal.position.set( 4, 0.6, 0 );
				pedestal.castShadow = true;
				pedestal.receiveShadow = true;
				scene.add( pedestal );

				const torusKnot = new THREE.Mesh(
					new THREE.TorusKnotGeometry( 0.3, 0.1, 64, 16 ),
					new THREE.MeshStandardMaterial( { color: 0xff44aa, metalness: 0.2, roughness: 0.5 } )
				);
				torusKnot.position.set( 4, 1.65, 0 );
				torusKnot.castShadow = true;
				torusKnot.receiveShadow = true;
				scene.add( torusKnot );

				// Tall cone sculpture
				const sculpture = new THREE.Mesh(
					new THREE.ConeGeometry( 0.4, 2.5, 5 ),
					whiteMat
				);
				sculpture.position.set( 6.5, 1.25, - 1.5 );
				sculpture.castShadow = true;
				sculpture.receiveShadow = true;
				scene.add( sculpture );

				// Lights

				// Warm point light in left room
				const warmLight = new THREE.PointLight( 0xffaa44, 30 );
				warmLight.position.set( - 4, 4.5, 0 );
				warmLight.castShadow = true;
				warmLight.shadow.mapSize.setScalar( 256 );
				warmLight.shadow.radius = 12;
				warmLight.shadow.bias = 0;
				scene.add( warmLight );

				// Cool point light in right room
				const coolLight = new THREE.PointLight( 0x88bbff, 30 );
				coolLight.position.set( 4, 4.5, 0 );
				coolLight.castShadow = true;
				coolLight.shadow.mapSize.setScalar( 256 );
				coolLight.shadow.radius = 12;
				coolLight.shadow.bias = 0;
				scene.add( coolLight );

				// Virtual point lights

				scene.updateMatrixWorld( true );

				const surfaces = [];
				sourceLights = [];

				scene.traverseVisible( object => {

					if ( object.isMesh ) {

						surfaces.push( object );
						object.raycast = acceleratedRaycast;
						if ( ! object.geometry.boundsTree ) computeBoundsTree.call( object.geometry );

					} else if ( object.isPointLight ) {

						sourceLights.push( object );

					}

				} );

				intensities = sourceLights.map( light => light.intensity );

				generator = new VirtualPointLightGenerator( MAX_VPLS );
				shadowMaps = new VirtualPointLightShadowMaps( MAX_VPLS );
				vpl = new VirtualPointLightsNode( generator, ( start, end, index ) => shadowMaps.visibility( start, end, index ) );
				vpl.shadows.value = params.shadows;

				const lighting = lights( [ ...sourceLights, vpl ] );
				const materials = new Map();

				for ( const surface of surfaces ) {

					// node materials are required to add the VPL irradiance via lightsNode

					const original = surface.material;

					if ( ! materials.has( original ) ) {

						const material = new THREE.MeshStandardNodeMaterial();
						material.copy( original );
						material.lightsNode = lighting;
						materials.set( original, material );

					}

					surface.material = materials.get( original );

				}

				helper = new VirtualPointLightHelper( generator );
				helper.visible = params.showVPLs;
				scene.add( helper );

				// Renderer

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );
				await renderer.init();

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 2.5, 0 );
				controls.update();

				// GUI

				const gui = renderer.inspector.createParameters( 'Virtual Point Lights' );
				gui.add( params, 'mode', [ 'direct only', 'indirect only', 'combined' ] ).name( 'Lighting' ).onChange( updateMode );
				gui.add( params, 'count', sourceLights.length, MAX_VPLS, 1 ).name( 'Ray Budget' ).info( 'Total rays shared across source lights and bounce depths. Escaped rays do not become VPLs.' ).onChange( regenerate ).debounce( 250 );
				gui.add( params, 'bounces', 1, 4, 1 ).name( 'Bounces' ).info( 'Maximum diffuse bounces. Ray Budget is shared across depths; more bounces use fewer initial paths.' ).onChange( () => regenerate() );
				gui.add( params, 'seed', 1, 100, 1 ).name( 'Seed' ).onChange( regenerate ).debounce( 250 );
				gui.add( params, 'minDistance', 0.01, 1, 0.01 ).name( 'Distance Clamp' ).info( 'Reduces near-field singularities at the expense of indirect-light energy.' ).onChange( value => vpl.minDistance.value = value );
				gui.add( params, 'showVPLs' ).name( 'Show VPLs' ).onChange( value => helper.visible = value );

				const progressiveParameters = gui.addFolder( 'Progressive' );
				progressiveParameters.add( params, 'progressive' ).name( 'Progressive Preview' ).info( 'Double the ray budget every 0.5 seconds, up to Ray Budget. Each stage regenerates a normalized estimate.' ).onChange( () => regenerate() );
				progressiveParameters.add( { restart: () => regenerate() }, 'restart' ).name( 'Restart Preview' );

				const shadowParameters = gui.addFolder( 'Shadows' );
				shadowParameters.add( params, 'shadows' ).name( 'VPL Shadows' ).onChange( updateVisibility );
				shadowParameters.add( params, 'shadowResolution', [ 32, 64 ] ).name( 'Shadow Resolution' ).info( 'Pixels per cube face. Maps rebuild when the VPL set or resolution changes.' ).onChange( () => {

					mapsDirty = true;
					updateVisibility();

				} );

				regenerate();

				renderer.setAnimationLoop( animate );

				window.addEventListener( 'resize', onWindowResize );

			}

			function generate() {

				const visible = helper.visible;
				helper.visible = false;

				generator.generate( scene, sourceLights, { count: previewCount, seed: params.seed, bounces: params.bounces } );

				helper.visible = visible;

				vpl.update();
				helper.update();
				mapsDirty = true;

			}

			function updateVisibility() {

				vpl.shadows.value = params.shadows;

				if ( params.shadows && mapsDirty ) {

					const visible = helper.visible;
					helper.visible = false;

					shadowMaps.update( renderer, scene, generator, vpl.bias.value, params.shadowResolution );
					mapsDirty = false;

					helper.visible = visible;

				}

			}

			function updateMode() {

				sourceLights.forEach( ( light, i ) => {

					light.intensity = params.mode === 'indirect only' ? 0 : intensities[ i ];

				} );

				vpl.intensity.value = params.mode === 'direct only' ? 0 : 1;

			}

			// sampling always uses the original source power, including in indirect-only mode

			function regenerate( restart = true ) {

				params.count = Math.max( params.count, sourceLights.length * params.bounces );
				if ( restart !== false ) previewCount = params.progressive ? Math.min( 32, params.count ) : params.count;

				sourceLights.forEach( ( light, i ) => {

					light.intensity = intensities[ i ];

				} );

				generate();
				updateMode();
				updateVisibility();

				nextPreviewTime = params.progressive && previewCount < params.count ? performance.now() + 500 : Infinity;

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				if ( performance.now() >= nextPreviewTime ) {

					previewCount = Math.min( params.count, previewCount * 2 );
					regenerate( false );

				}

				renderer.render( scene, camera );

			}


		</script>
	</body>
</html>
