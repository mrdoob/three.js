<html lang="en">
	<head>
		<title>three.js webgpu - 2D FFT</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - 2D FFT">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_fft.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_fft.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a>
				<span>webgpu - 2D FFT</span>
			</div>

			<small>
				GPU 2D complex FFT (<a href="https://github.com/mrdoob/three.js/blob/dev/examples/jsm/gpgpu/FFT.js" target="_blank" rel="noopener">FFT2D</a>) via TSL compute shaders, WebGPU only, by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a>.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import {
				texture, storage, Fn, instanceIndex, uint, int, ivec2, uvec2, vec4, mix,
				storageTexture, textureStore, uniform, NodeAccess
			} from 'three/tsl';

			import WebGPU from 'three/addons/capabilities/WebGPU.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { FFT2D } from 'three/addons/gpgpu/FFT.js';

			// A curated set of power-of-two textures from the shared examples/textures folder --
			// FFT2D only supports power-of-two width/height (see its own comment for why: it's what
			// lets the Stockham FFT skip a separate bit-reversal permutation pass).
			const PRESETS = [
				{ name: 'UV Grid (1024x1024)', url: 'textures/uv_grid_opengl.jpg' },
				{ name: 'Grid (64x64)', url: 'textures/grid.png' },
				{ name: 'Colors (128x128)', url: 'textures/colors.png' },
				{ name: 'Checkerboard (512x512)', url: 'textures/floors/FloorsCheckerboard_S_Diffuse.jpg' },
				{ name: 'Disturb (512x512)', url: 'textures/disturb.jpg' },
				{ name: 'Brick (1024x1024)', url: 'textures/brick_diffuse.jpg' },
				{ name: 'Hardwood (2048x1024)', url: 'textures/hardwood2_diffuse.jpg' },
				{ name: 'Earth (2048x1024)', url: 'textures/land_ocean_ice_cloud_2048.jpg' }
			];

			let camera, scene, renderer, controls;
			let quadOriginal, quadSpectrum, quadReconstructed;

			// Everything GPU-side that only depends on `(width, height)` -- never on which image is
			// loaded -- lives in one size-keyed cache entry: the 3 (one per color channel) `FFT2D`
			// instances, their complex textures, the display targets, and every compute kernel this
			// example builds for itself (`pack`/`combine`/`probe`/`readback` below). Each of those
			// kernels is genuinely shape-only -- which *texture* they read/write and which channel/
			// mode/scale they use are all runtime-adjustable (uniforms, and TSL texture nodes whose
			// `.value` can be repointed at a different texture -- see e.g. `webgpu_compute_rasterizer_
			// ibl.html`'s `depthSourceTexNode.value = ...` for the same pattern elsewhere in the
			// examples), so exactly one of each is ever compiled per size, no matter how many presets
			// of that size get loaded, or how many times forward/inverse runs.
			//
			// Only `loadedTexture` (the actual decoded preset image) is deliberately left out of this
			// cache and freed every `loadPreset` call -- it's the one piece of GPU state that's
			// legitimately different per image, not per size.
			const resourceCache = new Map(); // "WxH" -> see `buildResources`

			function getResources( width, height, sourceTexture ) {

				const key = `${ width }x${ height }`;
				let entry = resourceCache.get( key );

				if ( entry === undefined ) {

					entry = buildResources( width, height, sourceTexture );
					resourceCache.set( key, entry );

				}

				return entry;

			}

			// A float `StorageTexture` with (at least) 2 channels -- `FFT2D`'s complex-number
			// currency, `(real, imag)` in `.rg`. Used for the per-channel packed source, the
			// spectrum, and the reconstruction; `.b`/`.a` are unused (written as `0`/`1` by
			// `FFT2D#computeForward`/`computeInverse`, per its own contract).
			function createComplexTexture( width, height ) {

				const tex = new THREE.StorageTexture( width, height );
				tex.type = THREE.FloatType;
				tex.magFilter = THREE.NearestFilter;
				tex.minFilter = THREE.NearestFilter;
				tex.generateMipmaps = false;

				return tex;

			}

			// Builds everything one `(width, height)` needs: the 3 `FFT2D` instances, their complex
			// textures, the 2 color display targets, and the 4 example-only compute kernels
			// (`pack`/`combine`/`probe`/`readback`) -- see `resourceCache`'s comment for why each
			// kernel is built exactly once here rather than per call. `sourceTexture` only seeds the
			// pack kernel's initial texture-node value (immediately overwritten by the real one on
			// every actual `packChannel` call) -- any correctly-shaped texture would do.
			function buildResources( width, height, sourceTexture ) {

				const ffts = { r: new FFT2D( width, height ), g: new FFT2D( width, height ), b: new FFT2D( width, height ) };

				const complexSource = { r: createComplexTexture( width, height ), g: createComplexTexture( width, height ), b: createComplexTexture( width, height ) };
				const complexSpectrum = { r: createComplexTexture( width, height ), g: createComplexTexture( width, height ), b: createComplexTexture( width, height ) };
				const complexReconstructed = { r: createComplexTexture( width, height ), g: createComplexTexture( width, height ), b: createComplexTexture( width, height ) };

				const spectrumTexture = new THREE.StorageTexture( width, height );
				const reconstructedTexture = new THREE.StorageTexture( width, height );

				// Match the source image's exact, unfiltered point-sampling so the 3 quads are
				// visually comparable pixel-for-pixel (no mipmap/linear-filtering discrepancy when a
				// texture ends up displayed smaller than its native size on screen).
				for ( const tex of [ spectrumTexture, reconstructedTexture ] ) {

					tex.magFilter = THREE.NearestFilter;
					tex.minFilter = THREE.NearestFilter;
					tex.generateMipmaps = false;

				}

				return {
					width, height, ffts, complexSource, complexSpectrum, complexReconstructed, spectrumTexture, reconstructedTexture,
					pack: buildPackKernel( width, height, sourceTexture, complexSource.r ),
					combine: buildCombineKernel( width, height, complexSpectrum, spectrumTexture ),
					probe: buildProbeKernel( width, complexSpectrum.r ),
					readback: buildReadbackKernel( width, height, complexReconstructed.r )
				};

			}

			let loadedTexture = null;
			let originalChannels = null; // CPU copy ({r, g, b} Float32Arrays), for the round-trip-error console log only.

			// Bumped on every `loadPreset` call and captured by each in-flight one -- lets a call
			// that's superseded by a newer image selection (e.g. rapid dropdown changes) recognize
			// it's stale after an `await` and bail out instead of clobbering the newer preset's
			// state or GUI/label text.
			let generation = 0;

			let labelOriginal, labelSpectrum, labelReconstructed;

			const textureLoader = new THREE.TextureLoader();

			const params = { image: PRESETS[ 0 ].name };

			init();

			async function init() {

				if ( WebGPU.isAvailable() === false ) {

					document.body.appendChild( WebGPU.getErrorMessage() );

					throw new Error( 'No WebGPU support' );

				}

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x111111 );

				camera = new THREE.OrthographicCamera( - 1, 1, 1, - 1, 0, 10 );
				camera.position.z = 5;

				// Materials are (re)created per preset with their `map` set at construction time, via
				// `setQuadMaterial` below, rather than assigned post-hoc -- reassigning `.map` on an
				// already-built material doesn't reliably trigger WebGPURenderer's node-graph
				// rebuild (confirmed: it's flaky, not just cosmetic -- the mesh can keep showing
				// stale/blank content), and per-preset a fresh material is cheap regardless of
				// whether its texture is a fresh one or (see `resourceCache`) a reused one.
				quadOriginal = new THREE.Mesh( new THREE.PlaneGeometry( 1, 1 ), new THREE.MeshBasicMaterial() );
				quadSpectrum = new THREE.Mesh( new THREE.PlaneGeometry( 1, 1 ), new THREE.MeshBasicMaterial() );
				quadReconstructed = new THREE.Mesh( new THREE.PlaneGeometry( 1, 1 ), new THREE.MeshBasicMaterial() );

				// Real 3D objects (a canvas-texture quad each), not an HTML/CSS overlay -- they live
				// in the same scene as the image quads, so panning/zooming the camera moves and
				// scales them exactly like the images, with no per-frame screen-space projection
				// bookkeeping needed. Built once here (their text never changes); only their
				// position/scale is updated per preset, in `layoutQuads`.
				labelOriginal = createLabelMesh( 'Original Image' );
				labelSpectrum = createLabelMesh( 'Frequency Space' );
				labelReconstructed = createLabelMesh( 'Reconstructed Image' );

				scene.add( quadOriginal, quadSpectrum, quadReconstructed, labelOriginal, labelSpectrum, labelReconstructed );

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				// Pan (right-drag / two-finger drag) and zoom (scroll / pinch) so people can look at
				// the 3 textures up close; rotate is disabled since it doesn't make sense for a flat,
				// front-on 2D view. There's no continuous animation loop here (rendering is
				// on-demand, triggered after each pipeline step), so `render` is wired to the
				// controls' own "change" event to keep the view responsive while dragging/zooming.
				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableRotate = false;
				controls.screenSpacePanning = true;
				controls.addEventListener( 'change', render );

				// GUI, via the inspector's built-in parameter panel (see webgpu_ocean.html for the
				// same `renderer.inspector.createParameters(...)` convention).

				const gui = renderer.inspector.createParameters( 'FFT' );

				gui.add( params, 'image', PRESETS.map( ( p ) => p.name ) ).name( 'image' ).onChange( ( name ) => {

					const preset = PRESETS.find( ( p ) => p.name === name );

					loadPreset( preset ); // fire-and-forget; see `generation` for why that's safe.

				} );

				window.addEventListener( 'resize', onWindowResize );

				await loadPreset( PRESETS[ 0 ] );

			}

			async function loadPreset( preset ) {

				const myGeneration = ++ generation;

				const newTexture = await textureLoader.loadAsync( preset.url );

				// `loadAsync` resolves on the underlying <img>'s `load` event, which fires once
				// bytes have arrived but doesn't guarantee decoding (including any embedded ICC
				// color profile) has finished -- confirmed source of a real, intermittent bug: the
				// very first time a given image loads, the GPU texture upload can grab it mid-decode
				// and show up wrong (e.g. an ICC-profiled image briefly rendering desaturated),
				// while a later load of the same URL hits the browser's already-fully-decoded image
				// cache and looks correct. `decode()` is the standard way to await full decode
				// before the image is used for anything (GPU upload here, and the canvas draw in
				// `computeChannelsCPU` below).
				await newTexture.image.decode();

				if ( myGeneration !== generation ) { newTexture.dispose(); return; } // superseded

				newTexture.colorSpace = THREE.NoColorSpace;
				newTexture.flipY = true;
				newTexture.magFilter = THREE.NearestFilter;
				newTexture.minFilter = THREE.NearestFilter;
				newTexture.generateMipmaps = false;
				newTexture.wrapS = THREE.ClampToEdgeWrapping;
				newTexture.wrapT = THREE.ClampToEdgeWrapping;

				const width = newTexture.image.width;
				const height = newTexture.image.height;

				if ( isPowerOfTwo( width ) === false || isPowerOfTwo( height ) === false ) {

					console.warn( `webgpu_fft: "${ preset.name }" is ${ width }x${ height }, which is not power-of-two -- skipped.` );
					newTexture.dispose();
					return;

				}

				// Only the previous preset's *decoded image* is torn down here -- every other GPU
				// resource (the FFT instances, complex textures, display targets, and this example's
				// own compute kernels) comes from `getResources`'s size-keyed cache and deliberately
				// stays alive across presets, so revisiting a size (including the one just left)
				// reuses everything already built for it instead of paying to rebuild any of it.

				loadedTexture?.dispose();
				loadedTexture = newTexture;

				const resources = getResources( width, height, loadedTexture );
				const { ffts, complexSource, complexSpectrum, complexReconstructed, spectrumTexture, reconstructedTexture } = resources;

				// A brand-new material per quad, with `map` set at construction time, replacing the
				// old one outright (rather than mutating `.map` on the existing material) -- see the
				// comment at `quadOriginal`'s construction in `init()` for why.
				setQuadMaterial( quadOriginal, loadedTexture );
				setQuadMaterial( quadSpectrum, spectrumTexture );
				setQuadMaterial( quadReconstructed, reconstructedTexture );

				layoutQuads( width, height );

				// Pack each color channel of the loaded image into its own complex source texture
				// (real = channel value, imag = 0) -- this example's own helper, not part of
				// `FFT2D`'s core contract (see FFT.js's class comment).
				packChannel( renderer, resources, loadedTexture, complexSource.r, 0 );
				packChannel( renderer, resources, loadedTexture, complexSource.g, 1 );
				packChannel( renderer, resources, loadedTexture, complexSource.b, 2 );

				// CPU-side per-channel copy of the source image, used only to compute the
				// round-trip-error console log after an inverse FFT -- not part of the GPU pipeline.
				originalChannels = computeChannelsCPU( newTexture.image, width, height );

				render();

				// The rest of the pipeline (forward FFT -> spectrum, inverse FFT -> reconstruction)
				// runs automatically -- there's no user-facing step between loading an image and
				// seeing all 3 quads, so it's just a straight-line continuation of this function
				// rather than separate button-triggered handlers.

				ffts.r.computeForward( renderer, complexSource.r, complexSpectrum.r );
				ffts.g.computeForward( renderer, complexSource.g, complexSpectrum.g );
				ffts.b.computeForward( renderer, complexSource.b, complexSpectrum.b );

				// Auto-normalize the spectrum's log scale to use the full [0, 1] range with no
				// manual tuning: for a non-negative-real input (a raw color channel, always >= 0),
				// the DC bin (read back here) is *guaranteed* -- by the triangle inequality applied
				// to the DFT sum -- to have the largest magnitude of any bin in that channel. The
				// same scale is then shared across R/G/B (the single largest of the 3 channels'
				// DC magnitudes) rather than normalizing each channel independently -- an
				// independent per-channel normalization would rescale each channel's brightness
				// relative to the others and wash the color balance out toward white; a shared
				// scale preserves each texel's actual R:G:B ratio. Read sequentially (not
				// `Promise.all`): all 3 channels share one cached probe kernel/buffer (see
				// `buildProbeKernel`), so concurrent dispatches would race on it.
				const dcR = await readBin( renderer, resources, complexSpectrum.r, 0 );
				const dcG = await readBin( renderer, resources, complexSpectrum.g, 0 );
				const dcB = await readBin( renderer, resources, complexSpectrum.b, 0 );

				if ( myGeneration !== generation ) return; // superseded mid-readback

				const maxMagnitude = Math.max(
					Math.hypot( dcR.real, dcR.imag ),
					Math.hypot( dcG.real, dcG.imag ),
					Math.hypot( dcB.real, dcB.imag )
				);

				combineChannels( renderer, resources, complexSpectrum, spectrumTexture, { mode: 'log', scale: 1 / Math.log( 1 + maxMagnitude ), shift: true } );

				render();

				ffts.r.computeInverse( renderer, complexSpectrum.r, complexReconstructed.r );
				ffts.g.computeInverse( renderer, complexSpectrum.g, complexReconstructed.g );
				ffts.b.computeInverse( renderer, complexSpectrum.b, complexReconstructed.b );

				combineChannels( renderer, resources, complexReconstructed, reconstructedTexture, { mode: 'linear', scale: 1 } );

				// Sequential for the same reason as the `readBin` calls above: one cached
				// readback kernel/buffer per size, shared across all 3 channels.
				const dataR = await readComplexTexture( renderer, resources, complexReconstructed.r );
				const dataG = await readComplexTexture( renderer, resources, complexReconstructed.g );
				const dataB = await readComplexTexture( renderer, resources, complexReconstructed.b );

				if ( myGeneration !== generation ) return; // superseded mid-readback

				let maxDiff = 0;
				let sumSq = 0;
				let n = 0;

				for ( const [ data, original ] of [ [ dataR, originalChannels.r ], [ dataG, originalChannels.g ], [ dataB, originalChannels.b ] ] ) {

					for ( let i = 0; i < width * height; i ++ ) {

						const diff = data[ i * 2 ] - original[ i ];
						maxDiff = Math.max( maxDiff, Math.abs( diff ) );
						sumSq += diff * diff;
						n ++;

					}

				}

				const rms = Math.sqrt( sumSq / n );

				console.log( `webgpu_fft: "${ preset.name }" round-trip error vs. original color -- max |diff|: ${ maxDiff.toExponential( 3 ) }, RMS: ${ rms.toExponential( 3 ) }.` );

				render();

			}

			// --- Example-only helpers -----------------------------------------------------------
			//
			// Everything below reads/writes plain textures and has no shared state of its own beyond
			// what `buildResources` builds once per size -- unlike `FFT2D`, which only ever
			// transforms complex numbers between two textures it's handed (see FFT.js's class
			// comment for why packing/display/probing live here instead of on the class). Each
			// `build*Kernel` function is called exactly once per size (from `buildResources`); the
			// matching `pack`/`combine`/`readBin`/`readComplexTexture` call just re-points that
			// kernel's uniforms/texture-node values and dispatches it again.

			// Builds the pack kernel for one size: a single compiled shader shared by all 3 color
			// channels, which color channel to extract (`'r'`=0/`'g'`=1/`'b'`=2) selected at runtime
			// by `channelUniform` via `select()` rather than baked in at compile time -- see
			// `resourceCache`'s comment. `sourceNode.value`/`writeTex.value` are repointed at the
			// real source/destination textures on every actual `packChannel` call.
			function buildPackKernel( width, height, initialSourceTexture, initialDestinationTexture ) {

				const sourceNode = texture( initialSourceTexture );
				const writeTex = storageTexture( initialDestinationTexture ).setAccess( NodeAccess.WRITE_ONLY );
				const channelUniform = uniform( 0, 'uint' );

				const kernel = Fn( () => {

					const x = instanceIndex.mod( uint( width ) );
					const y = instanceIndex.div( uint( width ) );

					const texel = sourceNode.load( ivec2( int( x ), int( y ) ) );
					const value = channelUniform.equal( uint( 0 ) ).select( texel.r, channelUniform.equal( uint( 1 ) ).select( texel.g, texel.b ) );

					textureStore( writeTex, uvec2( x, y ), vec4( value, 0, 0, 1 ) );

				} )().compute( width * height );

				return { kernel, sourceNode, writeTex, channelUniform };

			}

			// Packs one color channel (`channelIndex`: 0/1/2 for r/g/b) of `sourceTexture` into
			// `destinationTexture`'s `.rg` channels as a complex number (real = channel value,
			// imag = 0) -- `FFT2D`'s input format. `sourceTexture` is sampled with an exact
			// (unfiltered) texel fetch, so it must be exactly as large as `destinationTexture`.
			function packChannel( renderer, resources, sourceTexture, destinationTexture, channelIndex ) {

				const { kernel, sourceNode, writeTex, channelUniform } = resources.pack;

				sourceNode.value = sourceTexture;
				writeTex.value = destinationTexture;
				channelUniform.value = channelIndex;

				renderer.compute( kernel );

			}

			// Builds the combine kernel for one size: a single compiled shader shared by both the
			// spectrum and reconstruction views (see `combineChannels`'s comment for what those
			// views mean) -- every way they differ is a uniform here rather than a separate kernel:
			// `modeUniform` (0 = linear/real-part, 1 = log-magnitude, blended via `mix()`),
			// `shiftUniform` (0/1, added into the sample coordinate so it's a no-op when off, instead
			// of a compile-time branch), and `scaleUniform`. `rNode`/`gNode`/`bNode`/`writeTex` start
			// out pointed at the spectrum textures/target simply because those exist at this point;
			// every actual `combineChannels` call repoints all 4 anyway.
			function buildCombineKernel( width, height, initialChannels, initialTarget ) {

				const halfW = width >> 1;
				const halfH = height >> 1;

				const rNode = texture( initialChannels.r );
				const gNode = texture( initialChannels.g );
				const bNode = texture( initialChannels.b );
				const writeTex = storageTexture( initialTarget ).setAccess( NodeAccess.WRITE_ONLY );

				const modeUniform = uniform( 0 );
				const shiftUniform = uniform( 0, 'uint' );
				const scaleUniform = uniform( 1 );

				const extract = ( channelNode, coord ) => {

					const texel = channelNode.load( coord );
					const linearValue = texel.r;
					const logValue = texel.rg.length().add( 1 ).log();

					return mix( linearValue, logValue, modeUniform ).mul( scaleUniform ).clamp( 0, 1 );

				};

				const kernel = Fn( () => {

					const x = instanceIndex.mod( uint( width ) );
					const y = instanceIndex.div( uint( width ) );

					// Quadrant shift (spectrum view only): read from the bin that, after
					// wrap-around, is `width/2, height/2` away -- this moves the DC bin (index 0,0)
					// to the texture center. Adding `halfW/halfH * shiftUniform` is a no-op when
					// `shiftUniform` is 0, so this is one expression covering both views rather than
					// a runtime or compile-time branch.
					const sx = x.add( uint( halfW ).mul( shiftUniform ) ).mod( uint( width ) );
					const sy = y.add( uint( halfH ).mul( shiftUniform ) ).mod( uint( height ) );
					const coord = ivec2( int( sx ), int( sy ) );

					const value = vec4(
						extract( rNode, coord ),
						extract( gNode, coord ),
						extract( bNode, coord ),
						1
					);

					textureStore( writeTex, uvec2( x, y ), value );

				} )().compute( width * height );

				return { kernel, rNode, gNode, bNode, writeTex, modeUniform, shiftUniform, scaleUniform };

			}

			// `ffts.r/g/b`'s 3 complex textures combined into one RGBA display texture -- shared by
			// the spectrum and reconstruction views, which differ only in what scalar they extract
			// per texel and how it's scaled:
			//
			//  - `mode: 'log'` reads each channel's *magnitude* (`length(real, imag)`) and displays
			//    `log(1 + magnitude) * scale`, quadrant-shifted so the DC (zero-frequency) bin lands
			//    at the texture's center -- the conventional way to display a 2D spectrum. Meant to
			//    be called right after `computeForward`.
			//  - `mode: 'linear'` reads each channel's *real part* directly and displays
			//    `real * scale`, unshifted. Meant to be called right after `computeInverse`.
			//
			// `scale` is a single number shared by all 3 channels -- e.g. the spectrum view passes
			// `1 / log(1 + maxDCMagnitude)`, the single largest DC magnitude across R/G/B (see
			// `readBin`), so its log scale saturates to exactly 1 at the strongest channel's DC
			// peak without rescaling the other two channels independently, which would distort
			// each texel's R:G:B ratio (push everything toward white) instead of just brightening
			// it. The reconstruction view just passes `scale: 1` (already `[0, 1]`-ranged).
			function combineChannels( renderer, resources, channels, target, { mode = 'linear', scale = 1, shift = false } = {} ) {

				const { kernel, rNode, gNode, bNode, writeTex, modeUniform, shiftUniform, scaleUniform } = resources.combine;

				rNode.value = channels.r;
				gNode.value = channels.g;
				bNode.value = channels.b;
				writeTex.value = target;
				modeUniform.value = mode === 'log' ? 1 : 0;
				shiftUniform.value = shift ? 1 : 0;
				scaleUniform.value = scale;

				renderer.compute( kernel );

			}

			// Builds the single-bin probe kernel for one size, shared across every `readBin` call
			// for that size (all 3 color channels, every preset) -- `sourceNode.value` and
			// `indexUniform` are re-pointed/re-set on each actual call instead of rebuilding.
			function buildProbeKernel( width, initialSourceTexture ) {

				const sourceNode = texture( initialSourceTexture );
				const indexUniform = uniform( 0, 'uint' );

				const probeAttribute = new THREE.StorageBufferAttribute( 1, 2 );
				const probeWrite = storage( probeAttribute, 'vec2', 1 );

				const kernel = Fn( () => {

					const x = indexUniform.mod( uint( width ) );
					const y = indexUniform.div( uint( width ) );

					probeWrite.element( 0 ).assign( sourceNode.load( ivec2( int( x ), int( y ) ) ).rg );

				} )().compute( 1 );

				return { kernel, sourceNode, indexUniform, probeWrite };

			}

			// Reads back a single complex bin (real, imag) from `sourceTexture` at `index` (a
			// linear `y * width + x` index), without transferring the whole texture -- used above
			// to read just the DC bin (`index = 0`) for `combineChannels`'s log-scale normalization.
			async function readBin( renderer, resources, sourceTexture, index = 0 ) {

				const { kernel, sourceNode, indexUniform, probeWrite } = resources.probe;

				sourceNode.value = sourceTexture;
				indexUniform.value = index;

				renderer.compute( kernel );

				const data = new Float32Array( await renderer.getArrayBufferAsync( probeWrite.value ) );

				return { real: data[ 0 ], imag: data[ 1 ] };

			}

			// Builds the whole-texture readback kernel for one size, shared across every
			// `readComplexTexture` call for that size -- `sourceNode.value` is re-pointed on each
			// actual call instead of rebuilding.
			function buildReadbackKernel( width, height, initialSourceTexture ) {

				const count = width * height;

				const sourceNode = texture( initialSourceTexture );
				const readAttribute = new THREE.StorageBufferAttribute( count, 2 );
				const readWrite = storage( readAttribute, 'vec2', count );

				const kernel = Fn( () => {

					const x = instanceIndex.mod( uint( width ) );
					const y = instanceIndex.div( uint( width ) );

					readWrite.element( instanceIndex ).assign( sourceNode.load( ivec2( int( x ), int( y ) ) ).rg );

				} )().compute( count );

				return { kernel, sourceNode, readWrite };

			}

			// Reads back a whole complex texture as interleaved `(real, imag)` pairs -- used only
			// for the round-trip-error console log above, not part of the render pipeline.
			async function readComplexTexture( renderer, resources, sourceTexture ) {

				const { kernel, sourceNode, readWrite } = resources.readback;

				sourceNode.value = sourceTexture;

				renderer.compute( kernel );

				return new Float32Array( await renderer.getArrayBufferAsync( readWrite.value ) );

			}

			// -------------------------------------------------------------------------------------

			function setQuadMaterial( quad, map ) {

				quad.material.dispose();
				quad.material = new THREE.MeshBasicMaterial( { map } );

			}

			function computeChannelsCPU( image, width, height ) {

				const canvas = document.createElement( 'canvas' );
				canvas.width = width;
				canvas.height = height;

				const ctx = canvas.getContext( '2d' );
				ctx.drawImage( image, 0, 0, width, height );

				const { data } = ctx.getImageData( 0, 0, width, height );
				const count = width * height;
				const r = new Float32Array( count );
				const g = new Float32Array( count );
				const b = new Float32Array( count );

				for ( let i = 0; i < count; i ++ ) {

					r[ i ] = data[ i * 4 ] / 255;
					g[ i ] = data[ i * 4 + 1 ] / 255;
					b[ i ] = data[ i * 4 + 2 ] / 255;

				}

				return { r, g, b };

			}

			// Content size (world units) of the 3-quad layout, with margin -- kept at module scope
			// so `fitCamera` can refit on window resize without needing the image dimensions again.
			let contentWidth = 3;
			let contentHeight = 1;

			function layoutQuads( width, height ) {

				const aspect = width / height;
				const quadHeight = 2;
				const quadWidth = quadHeight * aspect;
				const gap = quadWidth * 0.15;
				const spacing = quadWidth + gap;

				for ( const [ quad, x ] of [ [ quadOriginal, - spacing ], [ quadSpectrum, 0 ], [ quadReconstructed, spacing ] ] ) {

					quad.scale.set( quadWidth, quadHeight, 1 );
					quad.position.set( x, 0, 0 );

				}

				// Labels scale with the quads (a "real" part of the 3D layout, per-preset aspect
				// ratio included) and sit just under each one; being ordinary scene objects, panning
				// and zooming the camera moves/scales them along with everything else, with no
				// separate screen-space bookkeeping needed (contrast the HTML-overlay approach this
				// replaced, which needed a manual world-to-screen projection kept in sync by hand).
				const labelHeight = quadHeight * 0.09;
				const labelGap = quadHeight * 0.04;

				for ( const [ label, x ] of [ [ labelOriginal, - spacing ], [ labelSpectrum, 0 ], [ labelReconstructed, spacing ] ] ) {

					const labelWidth = labelHeight * label.userData.aspect;
					label.scale.set( labelWidth, labelHeight, 1 );
					label.position.set( x, - quadHeight / 2 - labelGap - labelHeight / 2, 0 );

				}

				const margin = 1.2;
				contentWidth = ( spacing * 2 + quadWidth ) * margin;
				contentHeight = ( quadHeight + labelGap * 2 + labelHeight * 2 ) * margin;

				controls.target.set( 0, 0, 0 );
				fitCamera();

			}

			// A canvas-texture quad with the given text -- a "real" 3D label (a scene object, not an
			// HTML/CSS overlay) so it participates in the same camera transform as everything else.
			// `userData.aspect` (canvas width / height) is used by `layoutQuads` to size it without
			// distortion; the mesh's own geometry is a unit (1x1) quad, scaled per-preset instead of
			// rebuilt, since the text itself never changes.
			function createLabelMesh( text ) {

				const scale = 4; // supersampled for crisp text at any zoom level
				const canvas = document.createElement( 'canvas' );
				canvas.width = 512 * scale;
				canvas.height = 96 * scale;

				const ctx = canvas.getContext( '2d' );
				ctx.font = `${ 32 * scale }px monospace`;
				ctx.fillStyle = '#cccccc';
				ctx.textAlign = 'center';
				ctx.textBaseline = 'middle';
				ctx.fillText( text, canvas.width / 2, canvas.height / 2 );

				const map = new THREE.CanvasTexture( canvas );
				map.colorSpace = THREE.SRGBColorSpace;

				const material = new THREE.MeshBasicMaterial( { map, transparent: true, depthWrite: false } );
				const mesh = new THREE.Mesh( new THREE.PlaneGeometry( 1, 1 ), material );
				mesh.userData.aspect = canvas.width / canvas.height;

				return mesh;

			}

			// Fits an orthographic frustum of `contentWidth` x `contentHeight` world units into the
			// current window aspect ratio, letterboxing whichever dimension has room to spare.
			function fitCamera() {

				const windowAspect = window.innerWidth / window.innerHeight;
				const contentAspect = contentWidth / contentHeight;

				let viewWidth, viewHeight;

				if ( windowAspect > contentAspect ) {

					viewHeight = contentHeight;
					viewWidth = viewHeight * windowAspect;

				} else {

					viewWidth = contentWidth;
					viewHeight = viewWidth / windowAspect;

				}

				camera.left = - viewWidth / 2;
				camera.right = viewWidth / 2;
				camera.top = viewHeight / 2;
				camera.bottom = - viewHeight / 2;
				camera.updateProjectionMatrix();

			}

			function isPowerOfTwo( value ) {

				return value > 0 && ( value & ( value - 1 ) ) === 0;

			}

			function onWindowResize() {

				renderer.setSize( window.innerWidth, window.innerHeight );

				fitCamera();

				render();

			}

			function render() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
