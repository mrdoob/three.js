<html lang="en">
	<head>
		<title>three.js webgpu - 2D FFT</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - 2D FFT">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_fft.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_fft.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a>
				<span>webgpu - 2D FFT</span>
			</div>

			<small>
				GPU 2D complex FFT (<a href="https://github.com/mrdoob/three.js/blob/dev/examples/jsm/gpgpu/FFT.js" target="_blank" rel="noopener">FFT2D</a>) via TSL compute shaders, WebGPU only, by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a>.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { texture, Fn, instanceIndex, uint, uvec2, vec4, storageTexture, textureStore, NodeAccess } from 'three/tsl';

			import WebGPU from 'three/addons/capabilities/WebGPU.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { FFT2D } from 'three/addons/gpgpu/FFT.js';

			// A curated set of power-of-two textures from the shared examples/textures folder --
			// FFT2D only supports power-of-two width/height (see its own comment for why: it's what
			// lets the Stockham FFT skip a separate bit-reversal permutation pass).
			const PRESETS = [
				{ name: 'UV Grid (1024x1024)', url: 'textures/uv_grid_opengl.jpg' },
				{ name: 'Grid (64x64)', url: 'textures/grid.png' },
				{ name: 'Colors (128x128)', url: 'textures/colors.png' },
				{ name: 'Checkerboard (512x512)', url: 'textures/floors/FloorsCheckerboard_S_Diffuse.jpg' },
				{ name: 'Disturb (512x512)', url: 'textures/disturb.jpg' },
				{ name: 'Brick (1024x1024)', url: 'textures/brick_diffuse.jpg' },
				{ name: 'Hardwood (2048x1024)', url: 'textures/hardwood2_diffuse.jpg' },
				{ name: 'Earth (2048x1024)', url: 'textures/land_ocean_ice_cloud_2048.jpg' }
			];

			let camera, scene, renderer, controls;
			let quadOriginal, quadSpectrum, quadReconstructed;

			// One FFT2D instance per color channel -- see FFT2D's own class-level comment on why
			// full-color support is 3 single-channel instances run in lockstep plus a small custom
			// combine kernel, rather than a dedicated multi-channel API.
			//
			// Cached per image size (`"WxH"`) rather than rebuilt per preset: constructing an
			// `FFT2D` is cheap, but its *first* `computeForward`/`computeInverse` call lazily
			// builds and compiles its row/column/transpose kernels (`FFT2D#_ensureButterfliesBuilt`),
			// which depend only on `(width, height, the device's compute limits)` -- never on which
			// image is loaded. Presets that repeat a size (or any app cycling through many
			// same-size images) reuse that size's 3 instances instead of paying to rebuild them.
			const fftCache = new Map(); // "WxH" -> { r: FFT2D, g: FFT2D, b: FFT2D }

			function getFFTs( width, height ) {

				const key = `${ width }x${ height }`;
				let entry = fftCache.get( key );

				if ( entry === undefined ) {

					entry = { r: new FFT2D( width, height ), g: new FFT2D( width, height ), b: new FFT2D( width, height ) };
					fftCache.set( key, entry );

				}

				return entry;

			}

			let ffts = null;
			let loadedTexture = null;
			let textureNode = null;
			let spectrumTexture = null;
			let reconstructedTexture = null;
			let originalChannels = null; // CPU copy ({r, g, b} Float32Arrays), for the round-trip-error console log only.

			// Bumped on every `loadPreset` call and captured by each in-flight one -- lets a call
			// that's superseded by a newer image selection (e.g. rapid dropdown changes) recognize
			// it's stale after an `await` and bail out instead of clobbering the newer preset's
			// state or GUI/label text.
			let generation = 0;

			let labelOriginal, labelSpectrum, labelReconstructed;

			const textureLoader = new THREE.TextureLoader();

			const params = { image: PRESETS[ 0 ].name };

			init();

			async function init() {

				if ( WebGPU.isAvailable() === false ) {

					document.body.appendChild( WebGPU.getErrorMessage() );

					throw new Error( 'No WebGPU support' );

				}

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x111111 );

				camera = new THREE.OrthographicCamera( - 1, 1, 1, - 1, 0, 10 );
				camera.position.z = 5;

				// Materials are (re)created per preset with their `map` set at construction time, via
				// `setQuadMaterial` below, rather than assigned post-hoc -- reassigning `.map` on an
				// already-built material doesn't reliably trigger WebGPURenderer's node-graph
				// rebuild (confirmed: it's flaky, not just cosmetic -- the mesh can keep showing
				// stale/blank content), and per-preset a fresh texture/material pair is needed anyway.
				quadOriginal = new THREE.Mesh( new THREE.PlaneGeometry( 1, 1 ), new THREE.MeshBasicMaterial() );
				quadSpectrum = new THREE.Mesh( new THREE.PlaneGeometry( 1, 1 ), new THREE.MeshBasicMaterial() );
				quadReconstructed = new THREE.Mesh( new THREE.PlaneGeometry( 1, 1 ), new THREE.MeshBasicMaterial() );

				// Real 3D objects (a canvas-texture quad each), not an HTML/CSS overlay -- they live
				// in the same scene as the image quads, so panning/zooming the camera moves and
				// scales them exactly like the images, with no per-frame screen-space projection
				// bookkeeping needed. Built once here (their text never changes); only their
				// position/scale is updated per preset, in `layoutQuads`.
				labelOriginal = createLabelMesh( 'Original Image' );
				labelSpectrum = createLabelMesh( 'Frequency Space' );
				labelReconstructed = createLabelMesh( 'Reconstructed Image' );

				scene.add( quadOriginal, quadSpectrum, quadReconstructed, labelOriginal, labelSpectrum, labelReconstructed );

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				// Pan (right-drag / two-finger drag) and zoom (scroll / pinch) so people can look at
				// the 3 textures up close; rotate is disabled since it doesn't make sense for a flat,
				// front-on 2D view. There's no continuous animation loop here (rendering is
				// on-demand, triggered after each pipeline step), so `render` is wired to the
				// controls' own "change" event to keep the view responsive while dragging/zooming.
				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableRotate = false;
				controls.screenSpacePanning = true;
				controls.addEventListener( 'change', render );

				// GUI, via the inspector's built-in parameter panel (see webgpu_ocean.html for the
				// same `renderer.inspector.createParameters(...)` convention).

				const gui = renderer.inspector.createParameters( 'FFT' );

				gui.add( params, 'image', PRESETS.map( ( p ) => p.name ) ).name( 'image' ).onChange( ( name ) => {

					const preset = PRESETS.find( ( p ) => p.name === name );

					loadPreset( preset ); // fire-and-forget; see `generation` for why that's safe.

				} );

				window.addEventListener( 'resize', onWindowResize );

				await loadPreset( PRESETS[ 0 ] );

			}

			async function loadPreset( preset ) {

				const myGeneration = ++ generation;

				const newTexture = await textureLoader.loadAsync( preset.url );

				// `loadAsync` resolves on the underlying <img>'s `load` event, which fires once
				// bytes have arrived but doesn't guarantee decoding (including any embedded ICC
				// color profile) has finished -- confirmed source of a real, intermittent bug: the
				// very first time a given image loads, the GPU texture upload can grab it mid-decode
				// and show up wrong (e.g. an ICC-profiled image briefly rendering desaturated),
				// while a later load of the same URL hits the browser's already-fully-decoded image
				// cache and looks correct. `decode()` is the standard way to await full decode
				// before the image is used for anything (GPU upload here, and the canvas draw in
				// `computeChannelsCPU` below).
				await newTexture.image.decode();

				if ( myGeneration !== generation ) { newTexture.dispose(); return; } // superseded

				newTexture.colorSpace = THREE.NoColorSpace;
				newTexture.flipY = true;
				newTexture.magFilter = THREE.NearestFilter;
				newTexture.minFilter = THREE.NearestFilter;
				newTexture.generateMipmaps = false;
				newTexture.wrapS = THREE.ClampToEdgeWrapping;
				newTexture.wrapT = THREE.ClampToEdgeWrapping;

				const width = newTexture.image.width;
				const height = newTexture.image.height;

				if ( isPowerOfTwo( width ) === false || isPowerOfTwo( height ) === false ) {

					console.warn( `webgpu_fft: "${ preset.name }" is ${ width }x${ height }, which is not power-of-two -- skipped.` );
					newTexture.dispose();
					return;

				}

				// Tear down the previous preset's texture/target resources -- but *not* `ffts`: those
				// come from `getFFTs`'s size-keyed cache, which deliberately keeps every size's
				// instances alive across presets so that revisiting a size (including the one just
				// left) reuses its already-built kernels instead of paying to rebuild them.

				loadedTexture?.dispose();
				spectrumTexture?.dispose();
				reconstructedTexture?.dispose();

				loadedTexture = newTexture;
				textureNode = texture( loadedTexture );

				ffts = getFFTs( width, height );

				spectrumTexture = new THREE.StorageTexture( width, height );
				reconstructedTexture = new THREE.StorageTexture( width, height );

				// Match `loadedTexture`'s exact, unfiltered point-sampling so the 3 quads are
				// visually comparable pixel-for-pixel (no mipmap/linear-filtering discrepancy when a
				// texture ends up displayed smaller than its native size on screen).
				for ( const tex of [ spectrumTexture, reconstructedTexture ] ) {

					tex.magFilter = THREE.NearestFilter;
					tex.minFilter = THREE.NearestFilter;
					tex.generateMipmaps = false;

				}

				// A brand-new material per quad, with `map` set at construction time, replacing the
				// old one outright (rather than mutating `.map` on the existing material) -- see the
				// comment at `quadOriginal`'s construction in `init()` for why.
				setQuadMaterial( quadOriginal, loadedTexture );
				setQuadMaterial( quadSpectrum, spectrumTexture );
				setQuadMaterial( quadReconstructed, reconstructedTexture );

				layoutQuads( width, height );

				ffts.r.packTexture( renderer, textureNode, 'r' );
				ffts.g.packTexture( renderer, textureNode, 'g' );
				ffts.b.packTexture( renderer, textureNode, 'b' );

				// CPU-side per-channel copy of the source image, used only to compute the
				// round-trip-error console log after an inverse FFT -- not part of the GPU pipeline.
				originalChannels = computeChannelsCPU( newTexture.image, width, height );

				render();

				// The rest of the pipeline (forward FFT -> spectrum, inverse FFT -> reconstruction)
				// runs automatically -- there's no user-facing step between loading an image and
				// seeing all 3 quads, so it's just a straight-line continuation of this function
				// rather than separate button-triggered handlers. `ffts.r/g/b` are always run in
				// lockstep (same calls, same order) so they stay on the same ping-pong buffer at
				// every point -- `combineSpectrum`/`combineReconstructed` below rely on that to only
				// need 2 kernel variants (all-A / all-B) instead of 8.

				ffts.r.computeForward( renderer );
				ffts.g.computeForward( renderer );
				ffts.b.computeForward( renderer );

				// Auto-normalize each channel's spectrum log scale to use the full [0, 1] range with
				// no manual tuning: for a non-negative-real input (a raw color channel, always >= 0),
				// the DC bin (read back here) is *guaranteed* -- by the triangle inequality applied
				// to the DFT sum -- to have the largest magnitude of any bin in that channel. See
				// `FFT2D#unpackSpectrum`'s own comment for the full argument.
				const [ dcR, dcG, dcB ] = await Promise.all( [ ffts.r.readBin( renderer, 0 ), ffts.g.readBin( renderer, 0 ), ffts.b.readBin( renderer, 0 ) ] );

				if ( myGeneration !== generation ) return; // superseded mid-readback

				const maxMagnitude = {
					r: Math.hypot( dcR.real, dcR.imag ),
					g: Math.hypot( dcG.real, dcG.imag ),
					b: Math.hypot( dcB.real, dcB.imag )
				};

				combineSpectrum( ffts, spectrumTexture, maxMagnitude );

				render();

				ffts.r.computeInverse( renderer );
				ffts.g.computeInverse( renderer );
				ffts.b.computeInverse( renderer );

				combineReconstructed( ffts, reconstructedTexture );

				const [ dataR, dataG, dataB ] = await Promise.all( [ ffts.r.readData( renderer ), ffts.g.readData( renderer ), ffts.b.readData( renderer ) ] );

				if ( myGeneration !== generation ) return; // superseded mid-readback

				let maxDiff = 0;
				let sumSq = 0;
				let n = 0;

				for ( const [ data, original ] of [ [ dataR, originalChannels.r ], [ dataG, originalChannels.g ], [ dataB, originalChannels.b ] ] ) {

					for ( let i = 0; i < ffts.r.count; i ++ ) {

						const diff = data[ i * 2 ] - original[ i ];
						maxDiff = Math.max( maxDiff, Math.abs( diff ) );
						sumSq += diff * diff;
						n ++;

					}

				}

				const rms = Math.sqrt( sumSq / n );

				console.log( `webgpu_fft: "${ preset.name }" round-trip error vs. original color -- max |diff|: ${ maxDiff.toExponential( 3 ) }, RMS: ${ rms.toExponential( 3 ) }.` );

				render();

			}

			// `ffts.r/g/b` always share the same `current` buffer (see the lockstep comment above),
			// so each combine kernel only needs 2 variants -- reading all 3 channels' A buffers, or
			// all 3 B buffers -- selected once per call via `ffts.r.current`.
			function runCombine( kernels, ffts, renderer ) {

				renderer.compute( ffts.r.current === 'A' ? kernels.allA : kernels.allB );

			}

			// Combines the 3 channels' current (spatial-domain) buffers into one RGBA texture, no
			// shift or scaling needed -- this is meant to be called right after `computeInverse`.
			function combineReconstructed( ffts, target ) {

				const { width, count } = ffts.r;

				const writeTex = storageTexture( target ).setAccess( NodeAccess.WRITE_ONLY );

				const build = ( r, g, b ) => Fn( () => {

					const x = instanceIndex.mod( uint( width ) );
					const y = instanceIndex.div( uint( width ) );

					const value = vec4(
						r.element( instanceIndex ).x.clamp( 0, 1 ),
						g.element( instanceIndex ).x.clamp( 0, 1 ),
						b.element( instanceIndex ).x.clamp( 0, 1 ),
						1
					);

					textureStore( writeTex, uvec2( x, y ), value );

				} )().compute( count );

				runCombine( { allA: build( ffts.r.readA, ffts.g.readA, ffts.b.readA ), allB: build( ffts.r.readB, ffts.g.readB, ffts.b.readB ) }, ffts, renderer );

			}

			// Combines the 3 channels' current (frequency-domain) buffers into one color-coded
			// log-magnitude spectrum -- each channel shows its own quadrant-shifted, independently
			// auto-normalized log-magnitude in its own color channel. This is meant to be called
			// right after `computeForward`; see `FFT2D#unpackSpectrum` for the single-channel
			// equivalent this mirrors (shift math included).
			function combineSpectrum( ffts, target, maxMagnitude ) {

				const { width, height, count } = ffts.r;
				const halfW = width >> 1;
				const halfH = height >> 1;

				const normR = Math.log( 1 + maxMagnitude.r );
				const normG = Math.log( 1 + maxMagnitude.g );
				const normB = Math.log( 1 + maxMagnitude.b );

				const writeTex = storageTexture( target ).setAccess( NodeAccess.WRITE_ONLY );

				const build = ( r, g, b ) => Fn( () => {

					const x = instanceIndex.mod( uint( width ) );
					const y = instanceIndex.div( uint( width ) );

					const sx = x.add( uint( halfW ) ).mod( uint( width ) );
					const sy = y.add( uint( halfH ) ).mod( uint( height ) );
					const srcIndex = sy.mul( uint( width ) ).add( sx );

					const value = vec4(
						r.element( srcIndex ).toVar().length().add( 1 ).log().div( normR ).clamp( 0, 1 ),
						g.element( srcIndex ).toVar().length().add( 1 ).log().div( normG ).clamp( 0, 1 ),
						b.element( srcIndex ).toVar().length().add( 1 ).log().div( normB ).clamp( 0, 1 ),
						1
					);

					textureStore( writeTex, uvec2( x, y ), value );

				} )().compute( count );

				runCombine( { allA: build( ffts.r.readA, ffts.g.readA, ffts.b.readA ), allB: build( ffts.r.readB, ffts.g.readB, ffts.b.readB ) }, ffts, renderer );

			}

			function setQuadMaterial( quad, map ) {

				quad.material.dispose();
				quad.material = new THREE.MeshBasicMaterial( { map } );

			}

			function computeChannelsCPU( image, width, height ) {

				const canvas = document.createElement( 'canvas' );
				canvas.width = width;
				canvas.height = height;

				const ctx = canvas.getContext( '2d' );
				ctx.drawImage( image, 0, 0, width, height );

				const { data } = ctx.getImageData( 0, 0, width, height );
				const count = width * height;
				const r = new Float32Array( count );
				const g = new Float32Array( count );
				const b = new Float32Array( count );

				for ( let i = 0; i < count; i ++ ) {

					r[ i ] = data[ i * 4 ] / 255;
					g[ i ] = data[ i * 4 + 1 ] / 255;
					b[ i ] = data[ i * 4 + 2 ] / 255;

				}

				return { r, g, b };

			}

			// Content size (world units) of the 3-quad layout, with margin -- kept at module scope
			// so `fitCamera` can refit on window resize without needing the image dimensions again.
			let contentWidth = 3;
			let contentHeight = 1;

			function layoutQuads( width, height ) {

				const aspect = width / height;
				const quadHeight = 2;
				const quadWidth = quadHeight * aspect;
				const gap = quadWidth * 0.15;
				const spacing = quadWidth + gap;

				for ( const [ quad, x ] of [ [ quadOriginal, - spacing ], [ quadSpectrum, 0 ], [ quadReconstructed, spacing ] ] ) {

					quad.scale.set( quadWidth, quadHeight, 1 );
					quad.position.set( x, 0, 0 );

				}

				// Labels scale with the quads (a "real" part of the 3D layout, per-preset aspect
				// ratio included) and sit just under each one; being ordinary scene objects, panning
				// and zooming the camera moves/scales them along with everything else, with no
				// separate screen-space bookkeeping needed (contrast the HTML-overlay approach this
				// replaced, which needed a manual world-to-screen projection kept in sync by hand).
				const labelHeight = quadHeight * 0.09;
				const labelGap = quadHeight * 0.04;

				for ( const [ label, x ] of [ [ labelOriginal, - spacing ], [ labelSpectrum, 0 ], [ labelReconstructed, spacing ] ] ) {

					const labelWidth = labelHeight * label.userData.aspect;
					label.scale.set( labelWidth, labelHeight, 1 );
					label.position.set( x, - quadHeight / 2 - labelGap - labelHeight / 2, 0 );

				}

				const margin = 1.2;
				contentWidth = ( spacing * 2 + quadWidth ) * margin;
				contentHeight = ( quadHeight + labelGap * 2 + labelHeight * 2 ) * margin;

				controls.target.set( 0, 0, 0 );
				fitCamera();

			}

			// A canvas-texture quad with the given text -- a "real" 3D label (a scene object, not an
			// HTML/CSS overlay) so it participates in the same camera transform as everything else.
			// `userData.aspect` (canvas width / height) is used by `layoutQuads` to size it without
			// distortion; the mesh's own geometry is a unit (1x1) quad, scaled per-preset instead of
			// rebuilt, since the text itself never changes.
			function createLabelMesh( text ) {

				const scale = 4; // supersampled for crisp text at any zoom level
				const canvas = document.createElement( 'canvas' );
				canvas.width = 512 * scale;
				canvas.height = 96 * scale;

				const ctx = canvas.getContext( '2d' );
				ctx.font = `${ 32 * scale }px monospace`;
				ctx.fillStyle = '#cccccc';
				ctx.textAlign = 'center';
				ctx.textBaseline = 'middle';
				ctx.fillText( text, canvas.width / 2, canvas.height / 2 );

				const map = new THREE.CanvasTexture( canvas );
				map.colorSpace = THREE.SRGBColorSpace;

				const material = new THREE.MeshBasicMaterial( { map, transparent: true, depthWrite: false } );
				const mesh = new THREE.Mesh( new THREE.PlaneGeometry( 1, 1 ), material );
				mesh.userData.aspect = canvas.width / canvas.height;

				return mesh;

			}

			// Fits an orthographic frustum of `contentWidth` x `contentHeight` world units into the
			// current window aspect ratio, letterboxing whichever dimension has room to spare.
			function fitCamera() {

				const windowAspect = window.innerWidth / window.innerHeight;
				const contentAspect = contentWidth / contentHeight;

				let viewWidth, viewHeight;

				if ( windowAspect > contentAspect ) {

					viewHeight = contentHeight;
					viewWidth = viewHeight * windowAspect;

				} else {

					viewWidth = contentWidth;
					viewHeight = viewWidth / windowAspect;

				}

				camera.left = - viewWidth / 2;
				camera.right = viewWidth / 2;
				camera.top = viewHeight / 2;
				camera.bottom = - viewHeight / 2;
				camera.updateProjectionMatrix();

			}

			function isPowerOfTwo( value ) {

				return value > 0 && ( value & ( value - 1 ) ) === 0;

			}

			function onWindowResize() {

				renderer.setSize( window.innerWidth, window.innerHeight );

				fitCamera();

				render();

			}

			function render() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
