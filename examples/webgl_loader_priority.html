<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - loader priority</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - loader priority<br>
			Click to reload all assets with main asset at the chosen priority:<br>
			Main asset priority: <a href="?priority=high">High</a> | <a href="?priority=low">Low</a><br>
			<span id="status"></span>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

			let camera, scene, renderer;
			let start, heroTime = 'loading', backgroundCount = 0;

			const priority = new URLSearchParams( location.search ).get( 'priority' ) === 'low' ? 'low' : 'high';

			const models = [
				'BoomBox.glb', 'coffeeMug.glb', 'Stork.glb', 'Flamingo.glb',
				'Parrot.glb', 'RobotExpressive/RobotExpressive.glb',
				'DiffuseRoughnessParameterSweep.glb', 'godrays_demo.glb', 'collision-world.glb',
				'ShadowmappableMesh.glb', 'ShaderBall.glb', 'DispersionTest.glb'
			];

			init();

			function init() {

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 3, 2, 3 );
				camera.zoom = 3.4;
				camera.updateProjectionMatrix();

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x333333 );

				scene.add( new THREE.HemisphereLight( 0xffffff, 0x444444, 3 ) );

				const light = new THREE.DirectionalLight( 0xffffff, 3 );
				light.position.set( 2, 4, 3 );
				scene.add( light );

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.body.appendChild( renderer.domElement );

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.addEventListener( 'change', render );

				window.addEventListener( 'resize', onWindowResize );

				start = performance.now();

				const background = new GLTFLoader().setPriority( 'auto' ).setCache( 'reload' );

				for ( const model of models ) {

					background.load( 'models/gltf/' + model, onBackgroundLoad, undefined, onError );

				}

				const hero = new GLTFLoader().setPriority( priority ).setCache( 'reload' );
				hero.load( 'models/gltf/Horse.glb', onHeroLoad, undefined, onError );

				updateStatus();
				render();

			}

			function onBackgroundLoad( gltf ) {

				// Background models are downloaded and parsed, but only the critical model is displayed.

				const textures = new Set();

				gltf.scene.traverse( object => {

					if ( ! object.isMesh ) return;

					object.geometry.dispose();

					const materials = Array.isArray( object.material ) ? object.material : [ object.material ];

					for ( const material of materials ) {

						for ( const value of Object.values( material ) ) {

							if ( value && value.isTexture ) textures.add( value );

						}

						material.dispose();

					}

				} );

				for ( const texture of textures ) texture.dispose();

				backgroundCount ++;
				updateStatus();

			}

			function onHeroLoad( gltf ) {

				heroTime = ( performance.now() - start ).toFixed( 0 ) + ' ms';

				const model = gltf.scene;

				const box = new THREE.Box3().setFromObject( model );
				const size = box.getSize( new THREE.Vector3() );
				model.scale.setScalar( 2 / Math.max( size.x, size.y, size.z ) );

				box.setFromObject( model );
				model.position.sub( box.getCenter( new THREE.Vector3() ) );

				scene.add( model );

				updateStatus();
				render();

			}

			function updateStatus() {

				document.getElementById( 'status' ).textContent = `Main asset (${ priority }): ${ heroTime }; background assets: ${ backgroundCount } / ${ models.length }`;

			}

			function onError( error ) {

				console.error( error );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

				render();

			}

			function render() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
