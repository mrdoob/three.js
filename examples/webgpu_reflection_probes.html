<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - reflection probes</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			#status { position: absolute; bottom: 20px; left: 20px; padding: 10px; background: #000a; color: #fff; font: 13px monospace; pointer-events: none; }
		</style>
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>
			<div class="title-wrapper"><a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Reflection Probes</span></div>
			<small>Box-projected reflection probes blended per pixel by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a></small>
		</div>
		<div id="status" class="lbl">Preparing reflection probes...</div>
		<script type="importmap">
			{
				"imports": {
					"three": "../src/Three.WebGPU.js",
					"three/webgpu": "../src/Three.WebGPU.js",
					"three/tsl": "../src/Three.TSL.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>
		<script type="module">

			import * as THREE from 'three/webgpu';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { ReflectionProbe, ReflectionProbes } from 'three/addons/lighting/ReflectionProbes.js';
			import { reflectionProbes } from 'three/addons/tsl/lighting/ReflectionProbesNode.js';
			import { ReflectionProbesHelper } from 'three/addons/helpers/ReflectionProbesHelper.js';

			const status = document.getElementById( 'status' );
			const params = { showProbes: false, dynamicObject: 'Bunny', pause: false, showGrid: false, gridResolution: 6, gridSize: 0.12, resolution: 128, boxProjection: true, capture: capture };
			const grid = new THREE.Group();
			let camera, scene, renderer, controls, probes, probesHelper, gridMaterial, dynamicObject;
			let capturing = false;

			init().catch( ( error ) => {

				status.textContent = `Unable to initialize: ${ error.message }`;
				console.error( error );

			} );

			async function init() {

				// Camera

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 2.5, 16 );

				// Scene

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x111111 );

				// Materials

				const wallMaterial = new THREE.MeshStandardMaterial( { color: 0xcccccc, side: THREE.BackSide } );
				const whiteMat = new THREE.MeshStandardMaterial( { color: 0xeeeeee } );

				// Room shell: x=-8 to 8, z=-4 to 4, y=0 to 5

				const room = new THREE.Mesh( new THREE.BoxGeometry( 16, 5, 8 ), wallMaterial );
				room.position.set( 0, 2.5, 0 );
				room.receiveShadow = true;
				scene.add( room );

				const redWall = new THREE.Mesh(
					new THREE.PlaneGeometry( 8, 5 ),
					new THREE.MeshStandardMaterial( { color: 0xdd2200 } )
				);
				redWall.rotation.y = Math.PI / 2;
				redWall.position.set( - 7.99, 2.5, 0 );
				scene.add( redWall );

				const blueWall = new THREE.Mesh(
					new THREE.PlaneGeometry( 8, 5 ),
					new THREE.MeshStandardMaterial( { color: 0x0044ff } )
				);
				blueWall.rotation.y = - Math.PI / 2;
				blueWall.position.set( 7.99, 2.5, 0 );
				scene.add( blueWall );

				// Dividing wall at x=0 with doorway

				const dividerMat = new THREE.MeshStandardMaterial( { color: 0xcccccc } );
				const doorwayHalfGap = 1.25;

				// Left section of divider (z = -4 to -1.25)
				const dividerLeft = new THREE.Mesh(
					new THREE.BoxGeometry( 0.3, 5, 4 - doorwayHalfGap ),
					dividerMat
				);
				dividerLeft.position.set( 0, 2.5, - ( doorwayHalfGap + ( 4 - doorwayHalfGap ) / 2 ) );
				dividerLeft.castShadow = true;
				dividerLeft.receiveShadow = true;
				scene.add( dividerLeft );

				// Right section of divider (z = 1.25 to 4)
				const dividerRight = new THREE.Mesh(
					new THREE.BoxGeometry( 0.3, 5, 4 - doorwayHalfGap ),
					dividerMat
				);
				dividerRight.position.set( 0, 2.5, doorwayHalfGap + ( 4 - doorwayHalfGap ) / 2 );
				dividerRight.castShadow = true;
				dividerRight.receiveShadow = true;
				scene.add( dividerRight );

				// Lintel above doorway
				const lintel = new THREE.Mesh(
					new THREE.BoxGeometry( 0.3, 1.2, doorwayHalfGap * 2 ),
					dividerMat
				);
				lintel.position.set( 0, 4.4, 0 );
				lintel.castShadow = true;
				lintel.receiveShadow = true;
				scene.add( lintel );

				// Left room objects

				// Columns
				const columnGeom = new THREE.CylinderGeometry( 0.3, 0.3, 4, 16 );

				for ( const x of [ - 6, - 2 ] ) {

					for ( const z of [ - 2.5, 2.5 ] ) {

						const col = new THREE.Mesh( columnGeom, whiteMat );
						col.position.set( x, 2, z );
						col.castShadow = true;
						col.receiveShadow = true;
						scene.add( col );

					}

				}

				// Table with golden sphere
				const tableTop = new THREE.Mesh(
					new THREE.BoxGeometry( 2.4, 0.12, 1.4 ),
					new THREE.MeshStandardMaterial( { color: 0x886644 } )
				);
				tableTop.position.set( - 4, 1.0, 0 );
				tableTop.castShadow = true;
				tableTop.receiveShadow = true;
				scene.add( tableTop );

				const legGeom = new THREE.BoxGeometry( 0.1, 1, 0.1 );

				for ( const x of [ - 5.05, - 2.95 ] ) {

					for ( const z of [ - 0.55, 0.55 ] ) {

						const leg = new THREE.Mesh( legGeom, tableTop.material );
						leg.position.set( x, 0.5, z );
						leg.castShadow = true;
						scene.add( leg );

					}

				}

				const sphere = new THREE.Mesh(
					new THREE.SphereGeometry( 0.35, 32, 32 ),
					new THREE.MeshStandardMaterial( { color: 0xffd700, metalness: 0.3, roughness: 0.4 } )
				);
				sphere.position.set( - 4, 1.41, 0 );
				sphere.castShadow = true;
				sphere.receiveShadow = true;
				scene.add( sphere );

				// Stepped blocks near red wall
				const step1 = new THREE.Mesh( new THREE.BoxGeometry( 1.5, 0.5, 1 ), whiteMat );
				step1.position.set( - 7, 0.25, 0 );
				step1.castShadow = true;
				step1.receiveShadow = true;
				scene.add( step1 );

				const step2 = new THREE.Mesh( new THREE.BoxGeometry( 1.0, 1.0, 1 ), whiteMat );
				step2.position.set( - 7, 0.5, 0 );
				step2.castShadow = true;
				step2.receiveShadow = true;
				scene.add( step2 );

				const step3 = new THREE.Mesh( new THREE.BoxGeometry( 0.5, 1.5, 1 ), whiteMat );
				step3.position.set( - 7, 0.75, 0 );
				step3.castShadow = true;
				step3.receiveShadow = true;
				scene.add( step3 );

				// Right room objects

				// Columns
				for ( const x of [ 2, 6 ] ) {

					for ( const z of [ - 2.5, 2.5 ] ) {

						const col = new THREE.Mesh( columnGeom, whiteMat );
						col.position.set( x, 2, z );
						col.castShadow = true;
						col.receiveShadow = true;
						scene.add( col );

					}

				}

				// Pedestal with torus knot
				const pedestal = new THREE.Mesh(
					new THREE.BoxGeometry( 0.8, 1.2, 0.8 ),
					whiteMat
				);
				pedestal.position.set( 4, 0.6, 0 );
				pedestal.castShadow = true;
				pedestal.receiveShadow = true;
				scene.add( pedestal );

				const torusKnot = new THREE.Mesh(
					new THREE.TorusKnotGeometry( 0.3, 0.1, 64, 16 ),
					new THREE.MeshStandardMaterial( { color: 0xff44aa, metalness: 0.2, roughness: 0.5 } )
				);
				torusKnot.position.set( 4, 1.65, 0 );
				torusKnot.castShadow = true;
				torusKnot.receiveShadow = true;
				scene.add( torusKnot );

				// Tall cone sculpture
				const sculpture = new THREE.Mesh(
					new THREE.ConeGeometry( 0.4, 2.5, 5 ),
					whiteMat
				);
				sculpture.position.set( 6.5, 1.25, - 1.5 );
				sculpture.castShadow = true;
				sculpture.receiveShadow = true;
				scene.add( sculpture );

				// Lights

				// Warm point light in left room
				const warmLight = new THREE.PointLight( 0xffaa44, 30 );
				warmLight.position.set( - 4, 4.5, 0 );
				warmLight.castShadow = true;
				warmLight.shadow.mapSize.setScalar( 256 );
				warmLight.shadow.radius = 12;
				warmLight.shadow.bias = - 0.002;
				scene.add( warmLight );

				// Cool point light in right room
				const coolLight = new THREE.PointLight( 0x88bbff, 30 );
				coolLight.position.set( 4, 4.5, 0 );
				coolLight.castShadow = true;
				coolLight.shadow.mapSize.setScalar( 256 );
				coolLight.shadow.radius = 12;
				coolLight.shadow.bias = - 0.002;
				scene.add( coolLight );

				// Renderer and controls match webgpu_lightprobes_complex.

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 1.0;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );
				await renderer.init();

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 2.5, 0 );
				controls.update();

				// One probe per room plus a smaller doorway probe, which takes priority where they overlap.

				probes = new ReflectionProbes();

				const probeSetup = [
					{ position: [ - 4, 2.5, 0 ], size: [ 8.4, 5.4, 8.4 ], projectionSize: [ 8, 5, 8 ] },
					{ position: [ 4, 2.5, 0 ], size: [ 8.4, 5.4, 8.4 ], projectionSize: [ 8, 5, 8 ] },
					{ position: [ 0, 2.5, 0 ], size: [ 2.4, 5.4, 3 ], projectionSize: [ 16, 5, 8 ] }
				];

				for ( const setup of probeSetup ) {

					const probe = new ReflectionProbe( ...setup.size );
					probe.position.set( ...setup.position );
					probe.projectionSize = new THREE.Vector3( ...setup.projectionSize );
					probes.add( probe );

				}

				scene.add( probes );
				await capture();
				scene.environmentNode = reflectionProbes( probes );

				// Each test surface evaluates the probe blend at its own world position.

				gridMaterial = new THREE.MeshStandardMaterial( { metalness: 1, roughness: 0.08 } );
				const dynamicMaterial = new THREE.MeshStandardMaterial( { metalness: 1, roughness: 0 } );

				const loader = new DRACOLoader();
				let bunnyGeometry;
				try {

					bunnyGeometry = await loader.loadAsync( 'models/draco/bunny.drc' );

				} finally {

					loader.dispose();

				}

				bunnyGeometry.computeVertexNormals();
				bunnyGeometry.center();
				bunnyGeometry.computeBoundingBox();
				const bunnySize = bunnyGeometry.boundingBox.getSize( new THREE.Vector3() );
				// The bunny's longest dimension is 4.5 times the original grid sphere diameter.
				const bunnyScale = 4.5 * 2 * params.gridSize / Math.max( bunnySize.x, bunnySize.y, bunnySize.z );
				bunnyGeometry.scale( bunnyScale, bunnyScale, bunnyScale );
				const dynamicGeometries = {
					Bunny: bunnyGeometry,
					Sphere: new THREE.SphereGeometry( 4.5 * params.gridSize, 32, 24 )
				};
				dynamicObject = new THREE.Mesh( dynamicGeometries[ params.dynamicObject ], dynamicMaterial );
				dynamicObject.castShadow = true;
				dynamicObject.receiveShadow = true;
				dynamicObject.visible = params.dynamicObject !== 'None';
				updateDynamicObject( 0 );

				probesHelper = new ReflectionProbesHelper( probes );
				probesHelper.material.roughness = 0.08;
				probesHelper.visible = params.showProbes;
				scene.add( probesHelper, grid, dynamicObject );
				updateGrid();

				const gui = renderer.inspector.createParameters( 'Reflection Probes' );
				gui.add( params, 'resolution', [ 64, 128, 256, 512, 1024 ] ).name( 'Capture Resolution' );
				gui.add( params, 'capture' ).name( 'Capture' );
				gui.add( params, 'boxProjection' ).name( 'Box Projection' ).onChange( ( value ) => probes.boxProjection = value );

				const dynamicTest = gui.addFolder( 'Dynamic Test' );
				dynamicTest.add( params, 'dynamicObject', [ 'None', 'Bunny', 'Sphere' ] ).name( 'Object' ).onChange( ( value ) => {

					if ( value !== 'None' ) dynamicObject.geometry = dynamicGeometries[ value ];
					dynamicObject.visible = value !== 'None' && ! capturing;

				} );
				dynamicTest.add( params, 'pause' ).name( 'Pause' );
				dynamicTest.add( dynamicMaterial, 'roughness', 0, 1, 0.01 ).name( 'Roughness' );

				const staticTest = gui.addFolder( 'Static Test' );
				staticTest.add( params, 'showGrid' ).name( 'Grid' ).onChange( ( value ) => grid.visible = value && ! capturing );
				staticTest.add( params, 'gridResolution', 2, 12, 1 ).name( 'Grid resolution' ).onChange( updateGrid );
				staticTest.add( gridMaterial, 'roughness', 0, 1, 0.01 ).name( 'Grid roughness' );

				const internalStructure = gui.addFolder( 'Internal Structure' );
				internalStructure.add( params, 'showProbes' ).name( 'Influence boxes and probes' ).onChange( ( value ) => probesHelper.visible = value && ! capturing );
				internalStructure.add( probesHelper.material, 'roughness', 0, 1, 0.01 ).name( 'Probe roughness' );

				window.addEventListener( 'resize', () => {

					camera.aspect = window.innerWidth / window.innerHeight;
					camera.updateProjectionMatrix();
					renderer.setSize( window.innerWidth, window.innerHeight );

				} );
				let animationTime = 0;
				let previousTime = null;

				renderer.setAnimationLoop( ( time ) => {

					const delta = previousTime === null ? 0 : ( time - previousTime ) / 1000;
					previousTime = time;

					if ( ! capturing ) {

						if ( ! params.pause && params.dynamicObject !== 'None' ) {

							animationTime += delta;
							updateDynamicObject( animationTime );

						}

						renderer.render( scene, camera );

					}

				} );

			}

			function updateDynamicObject( time ) {

				// A figure eight around both room centers, crossing x=0 at the doorway.
				// Stay above the table objects and inside the rows of columns at z=+/-2.5.
				const phase = time * 0.35;
				dynamicObject.position.set( 5.6 * Math.sin( phase ), 2.5, 1.4 * Math.sin( 2 * phase ) );
				dynamicObject.rotation.y = Math.atan2( 5.6 * Math.cos( phase ), 2.8 * Math.cos( 2 * phase ) );

			}

			function updateGrid() {

				for ( const mesh of [ ...grid.children ] ) {

					grid.remove( mesh );
					mesh.geometry.dispose();
					mesh.dispose();

				}

				const resolution = params.gridResolution;
				const matrix = new THREE.Matrix4();
				for ( const centerX of [ - 3.9, 3.9 ] ) {

					const mesh = new THREE.InstancedMesh( new THREE.SphereGeometry( params.gridSize, 16, 12 ), gridMaterial, resolution ** 3 );
					let index = 0;
					for ( let z = 0; z < resolution; z ++ ) {

						for ( let y = 0; y < resolution; y ++ ) {

							for ( let x = 0; x < resolution; x ++ ) {

								matrix.makeTranslation( centerX - 3.9 + x * 7.8 / ( resolution - 1 ), 0.1 + y * 4.7 / ( resolution - 1 ), - 3.8 + z * 7.6 / ( resolution - 1 ) );
								mesh.setMatrixAt( index ++, matrix );

							}

						}

					}

					mesh.instanceMatrix.needsUpdate = true;
					grid.add( mesh );

				}

				grid.visible = params.showGrid && ! capturing;

			}

			async function capture() {

				if ( capturing || ! probes ) return;
				capturing = true;
				document.body.dataset.capturing = 'true';
				status.textContent = 'Capturing and filtering three probes...';
				grid.visible = false;
				if ( probesHelper ) probesHelper.visible = false;
				if ( dynamicObject ) dynamicObject.visible = false;
				try {

					// Time GPU completion, not just submission.
					const queue = renderer.backend.device.queue;
					await queue.onSubmittedWorkDone();
					const start = performance.now();
					probes.bake( renderer, scene, { resolution: Number( params.resolution ), near: 0.05, far: 30 } );
					await queue.onSubmittedWorkDone();
					status.textContent = `Last capture: ${ ( performance.now() - start ).toFixed( 1 ) } ms`;
					document.body.dataset.ready = 'true';

				} catch ( error ) {

					status.textContent = `Capture failed: ${ error.message }`;
					console.error( error );

				} finally {

					if ( probesHelper ) probesHelper.visible = params.showProbes;
					if ( dynamicObject ) dynamicObject.visible = params.dynamicObject !== 'None';
					grid.visible = params.showGrid;
					capturing = false;
					document.body.dataset.capturing = 'false';

				}

			}

		</script>
	</body>
</html>
