<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - virtual point lights</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - virtual point lights">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_vpl.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_vpl.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Virtual Point Lights</span>
			</div>

			<small>
				Instant radiosity: one bounce of light from the point light is ray cast on the CPU and every hit becomes a virtual point light. Same scene as webgpu_lightprobes.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { Fn, Loop, If, uniform, uniformArray, vec3, vec4, float, max, min, dot, normalize, sqrt, select, positionWorld, normalWorld } from 'three/tsl';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			const MAX_VPLS = 1024;
			const LIGHT_INTENSITY = 40; // candela, same as webgpu_lightprobes
			const LIGHT_POSITION = new THREE.Vector3( 0, 4.5, 0 );

			const params = { mode: 'combined', count: 256, shadows: true, showVPLs: false, seed: 1 };

			let renderer, scene, camera;
			const surfaces = []; // everything a CPU ray can hit
			const boxes = []; // oriented boxes: shadow casters
			const spheres = []; // spheres: shadow casters

			const vplPosition = uniformArray( Array.from( { length: MAX_VPLS }, () => new THREE.Vector3() ), 'vec3' );
			const vplNormal = uniformArray( Array.from( { length: MAX_VPLS }, () => new THREE.Vector3( 0, 1, 0 ) ), 'vec3' );
			const vplFlux = uniformArray( Array.from( { length: MAX_VPLS }, () => new THREE.Vector3() ), 'vec3' );
			const vplCount = uniform( 0, 'int' );
			const directWeight = uniform( 1 );
			const indirectWeight = uniform( 1 );
			const useShadows = uniform( 1 );

			let vplPoints;

			// Is the segment a -> b blocked by a box or a sphere? (t in [0,1])

			function occluded( a, b ) {

				const d = b.sub( a ).toVar();
				const hit = float( 0 ).toVar();

				for ( const box of boxes ) {

					// slab test in the box's local space, the segment parameter t is unchanged by the transform

					const la = box.inverse.mul( vec4( a, 1 ) ).xyz;
					const ld = box.inverse.mul( vec4( d, 0 ) ).xyz.add( 1e-6 );
					const inv = float( 1 ).div( ld );
					const t1 = box.half.negate().sub( la ).mul( inv );
					const t2 = box.half.sub( la ).mul( inv );
					const tNear = max( max( min( t1.x, t2.x ), min( t1.y, t2.y ) ), min( t1.z, t2.z ) );
					const tFar = min( min( max( t1.x, t2.x ), max( t1.y, t2.y ) ), max( t1.z, t2.z ) );

					If( tNear.lessThan( tFar ).and( tFar.greaterThan( 0 ) ).and( tNear.lessThan( 1 ) ), () => {

						hit.assign( 1 );

					} );

				}

				for ( const sphere of spheres ) {

					const oc = a.sub( sphere.center );
					const A = dot( d, d );
					const B = dot( oc, d );
					const disc = B.mul( B ).sub( A.mul( dot( oc, oc ).sub( sphere.radius * sphere.radius ) ) );
					const root = sqrt( max( disc, 0 ) );
					const t1 = B.negate().sub( root ).div( A );
					const t2 = B.negate().add( root ).div( A );

					If( disc.greaterThan( 0 ).and( t1.lessThan( 1 ) ).and( t2.greaterThan( 0 ) ), () => {

						hit.assign( 1 );

					} );

				}

				return hit;

			}

			function visibility( x, nx, y, ny ) {

				return select( useShadows.greaterThan( 0.5 ), float( 1 ).sub( occluded( x.add( nx.mul( 0.01 ) ), y.add( ny.mul( 0.01 ) ) ) ), float( 1 ) );

			}

			const lighting = Fn( () => {

				const x = positionWorld;
				const n = normalize( normalWorld );
				const sum = vec3( 0 ).toVar();

				// direct: irradiance from the point light, I * cos / d^2

				const toLight = vec3( LIGHT_POSITION ).sub( x );
				const d2 = max( dot( toLight, toLight ), 1e-4 );
				const cosine = max( dot( n, normalize( toLight ) ), 0 );
				sum.addAssign( vec3( LIGHT_INTENSITY ).mul( cosine ).div( d2 ).mul( visibility( x, n, vec3( LIGHT_POSITION ), n ) ).mul( directWeight ) );

				// indirect: every VPL is a Lambertian emitter with flux phi, irradiance = phi / PI * cos(x) * cos(y) / d^2

				Loop( vplCount, ( { i } ) => {

					const y = vplPosition.element( i );
					const ny = vplNormal.element( i );
					const v = y.sub( x );
					const vd2 = max( dot( v, v ), 0.2 ); // clamped: hides the 1/d^2 singularity (energy loss, see limitations)
					const w = normalize( v );
					const g = max( dot( n, w ), 0 ).mul( max( dot( ny, w.negate() ), 0 ) ).div( vd2 );

					sum.addAssign( vplFlux.element( i ).mul( g.mul( visibility( x, n, y, ny ) ).div( Math.PI ) ).mul( indirectWeight ) );

				} );

				return sum;

			} );

			function makeMaterial( color ) {

				const albedo = new THREE.Color( color );
				const material = new THREE.MeshBasicNodeMaterial();
				material.colorNode = lighting().mul( vec3( albedo.r, albedo.g, albedo.b ) ).div( Math.PI );
				material.userData.albedo = albedo;
				return material;

			}

			function addWall( width, height, position, rotation, material ) {

				const wall = new THREE.Mesh( new THREE.PlaneGeometry( width, height ), material );
				wall.position.copy( position );
				wall.rotation.set( ...rotation );
				scene.add( wall );
				surfaces.push( wall );

			}

			function addBox( size, position, rotationY, material ) {

				const mesh = new THREE.Mesh( new THREE.BoxGeometry( size.x, size.y, size.z ), material );
				mesh.position.copy( position );
				mesh.rotation.y = rotationY;
				mesh.updateMatrixWorld();
				scene.add( mesh );
				surfaces.push( mesh );
				boxes.push( { inverse: uniform( mesh.matrixWorld.clone().invert() ), half: vec3( size.x / 2, size.y / 2, size.z / 2 ) } );

			}

			function addSphere( radius, position, material ) {

				const mesh = new THREE.Mesh( new THREE.SphereGeometry( radius, 32, 32 ), material );
				mesh.position.copy( position );
				scene.add( mesh );
				surfaces.push( mesh );
				spheres.push( { center: vec3( position.x, position.y, position.z ), radius } );

			}

			// Cast rays uniformly over the sphere from the point light and turn every first hit into a VPL.

			function generateVPLs() {

				const raycaster = new THREE.Raycaster();
				const normal = new THREE.Vector3();
				const direction = new THREE.Vector3();
				let seed = params.seed * 2654435761 >>> 0;
				const random = () => { // mulberry32

					seed = seed + 0x6D2B79F5 >>> 0;
					let t = Math.imul( seed ^ seed >>> 15, 1 | seed );
					t = t + Math.imul( t ^ t >>> 7, 61 | t ) ^ t;
					return ( ( t ^ t >>> 14 ) >>> 0 ) / 4294967296;

				};

				const power = 4 * Math.PI * LIGHT_INTENSITY / params.count; // total flux of an isotropic point light, split evenly

				vplCount.value = 0;

				for ( let n = 0; n < params.count; n ++ ) {

					const z = random() * 2 - 1, phi = random() * Math.PI * 2, r = Math.sqrt( 1 - z * z );
					raycaster.set( LIGHT_POSITION, direction.set( r * Math.cos( phi ), z, r * Math.sin( phi ) ) );

					const hit = raycaster.intersectObjects( surfaces )[ 0 ];
					if ( hit === undefined ) continue;

					normal.copy( hit.face.normal ).transformDirection( hit.object.matrixWorld );
					const albedo = hit.object.material.userData.albedo;

					const i = vplCount.value ++;
					vplPosition.array[ i ].copy( hit.point );
					vplNormal.array[ i ].copy( normal );
					vplFlux.array[ i ].set( albedo.r, albedo.g, albedo.b ).multiplyScalar( power ); // tinted by the surface it hit

				}

				vplPoints.geometry.setFromPoints( vplPosition.array.slice( 0, vplCount.value ) );

			}

			function updateMode() {

				directWeight.value = params.mode === 'indirect only' ? 0 : 1;
				indirectWeight.value = params.mode === 'direct only' ? 0 : 1;

			}

			function init() {

				// Camera

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 2.5, 8 );

				// Scene

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x111111 );

				// Cornell box, same as webgpu_lightprobes

				const wallMaterial = makeMaterial( 0xcccccc );
				const redMaterial = makeMaterial( 0xff0000 );
				const greenMaterial = makeMaterial( 0x00ff00 );
				const objectMaterial = makeMaterial( 0xeeeeee );

				addWall( 6, 6, new THREE.Vector3( 0, 0, 0 ), [ - Math.PI / 2, 0, 0 ], wallMaterial ); // floor
				addWall( 6, 6, new THREE.Vector3( 0, 5, 0 ), [ Math.PI / 2, 0, 0 ], wallMaterial ); // ceiling
				addWall( 6, 5, new THREE.Vector3( 0, 2.5, - 3 ), [ 0, 0, 0 ], wallMaterial ); // back
				addWall( 6, 5, new THREE.Vector3( 0, 2.5, 3 ), [ 0, Math.PI, 0 ], wallMaterial ); // front
				addWall( 6, 5, new THREE.Vector3( - 3, 2.5, 0 ), [ 0, Math.PI / 2, 0 ], redMaterial ); // left
				addWall( 6, 5, new THREE.Vector3( 3, 2.5, 0 ), [ 0, - Math.PI / 2, 0 ], greenMaterial ); // right

				addBox( new THREE.Vector3( 1.2, 2.5, 1.2 ), new THREE.Vector3( - 0.8, 1.25, - 0.8 ), Math.PI / 8, objectMaterial ); // tall box
				addBox( new THREE.Vector3( 1.2, 1.2, 1.2 ), new THREE.Vector3( 1, 0.6, 0.5 ), - Math.PI / 6, objectMaterial ); // short box
				addSphere( 0.5, new THREE.Vector3( 1, 1.9, 0.5 ), objectMaterial );

				vplPoints = new THREE.Points( new THREE.BufferGeometry(), new THREE.PointsMaterial( { size: 0.06, color: 0xffff00, toneMapped: false } ) );
				vplPoints.visible = false;
				scene.add( vplPoints );

				// Renderer

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( () => renderer.render( scene, camera ) );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 1.0;
				document.body.appendChild( renderer.domElement );

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 2.5, 0 );
				controls.update();

				const gui = new GUI();
				gui.add( params, 'mode', [ 'direct only', 'indirect only', 'combined' ] ).onChange( updateMode );
				gui.add( params, 'count', 1, MAX_VPLS, 1 ).name( 'VPL count' ).onChange( generateVPLs );
				gui.add( params, 'seed', 1, 100, 1 ).name( 'VPL seed' ).onChange( generateVPLs );
				gui.add( params, 'shadows' ).name( 'VPL / light visibility' ).onChange( ( v ) => ( useShadows.value = v ? 1 : 0 ) );
				gui.add( params, 'showVPLs' ).name( 'show VPLs' ).onChange( ( v ) => ( vplPoints.visible = v ) );

				updateMode();
				scene.updateMatrixWorld( true );
				generateVPLs();

				window.addEventListener( 'resize', () => {

					renderer.setSize( window.innerWidth, window.innerHeight );
					camera.aspect = window.innerWidth / window.innerHeight;
					camera.updateProjectionMatrix();

				} );

			}

			init();

		</script>
	</body>
</html>
