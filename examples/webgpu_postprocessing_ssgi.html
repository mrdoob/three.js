<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - SSGI</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - SSGI">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssgi.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssgi.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>SSGI</span>
			</div>

			<small>Real-time indirect illumination and ambient occlusion using screen-space information.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { pass, mrt, output, normalView, diffuseColor, velocity, add, vec3, vec4, packNormalToRGB, unpackRGBToNormal, sample } from 'three/tsl';
			import { ssgi } from 'three/addons/tsl/display/SSGINode.js';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';

			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			const models = {
				'Cornell Box': 'cornell-box.glb',
				'Cornell Box (Oblique)': 'cornell-box-oblique.glb',
				'Cornell Box (Metallic Sphere)': 'cornell-box-metallic-sphere.glb',
				'Cornell Box (Mirror Wall)': 'cornell-box-mirror-wall.glb',
				'Stripped Emissive Mirror Floor': 'stripped-emissive-mirror-floor.glb'
			};

			let camera, scene, renderer, renderPipeline, controls;
			let model;

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 10, 30 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xaaaaaa );

				renderer = new THREE.WebGPURenderer();
				//renderer.setPixelRatio( window.devicePixelRatio ); // probably too costly for most hardware
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				//

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 7, 0 );
				controls.enablePan = true;
				controls.minDistance = 1;
				controls.maxDistance = 100;
				controls.update();

				//

				renderPipeline = new THREE.RenderPipeline( renderer );

				const scenePass = pass( scene, camera );
				scenePass.setMRT( mrt( {
					output: output,
					diffuseColor: diffuseColor,
					normal: packNormalToRGB( normalView ),
					velocity: velocity
				} ) );

				const scenePassColor = scenePass.getTextureNode( 'output' );
				const scenePassDiffuse = scenePass.getTextureNode( 'diffuseColor' ).toInspector( 'Diffuse Color' );
				const scenePassDepth = scenePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => {

					return scenePass.getLinearDepthNode();

				} );

				const scenePassNormal = scenePass.getTextureNode( 'normal' ).toInspector( 'Normal' );
				const scenePassVelocity = scenePass.getTextureNode( 'velocity' ).toInspector( 'Velocity' );

				// bandwidth optimization

				const diffuseTexture = scenePass.getTexture( 'diffuseColor' );
				diffuseTexture.type = THREE.UnsignedByteType;

				const normalTexture = scenePass.getTexture( 'normal' );
				normalTexture.type = THREE.UnsignedByteType;

				const sceneNormal = sample( ( uv ) => {

					return unpackRGBToNormal( scenePassNormal.sample( uv ) );

				} );

				// gi

				const giPass = ssgi( scenePassColor, scenePassDepth, sceneNormal, camera );
				giPass.sliceCount.value = 2;
				giPass.stepCount.value = 8;

				// composite

				const ao = giPass.getAONode().toInspector( 'SSGI.AO' );
				const gi = giPass.getGINode().toInspector( 'SSGI.GI' );

				const compositePass = vec4( add( scenePassColor.rgb.mul( ao ), ( scenePassDiffuse.rgb.mul( gi.rgb ) ) ), scenePassColor.a );
				compositePass.name = 'Composite';

				// traa

				const traaPass = traa( compositePass, scenePassDepth, scenePassVelocity, camera );
				renderPipeline.outputNode = traaPass;

				window.addEventListener( 'resize', onWindowResize );

				//

				const params = {
					model: 'Cornell Box',
					output: 0
				};

				const types = { Combined: 0, Direct: 3, AO: 1, GI: 2 };

				await renderer.init();

				const loader = new GLTFLoader();
				let loadId = 0;
				let currentModel = params.model;

				async function loadModel() {

					const id = ++ loadId;
					const name = params.model;

					try {

						const gltf = await loader.loadAsync( 'models/gltf/' + models[ name ] );
						if ( id !== loadId ) {

							disposeModel( gltf.scene );
							return;

						}

						if ( model ) {

							scene.remove( model );
							disposeModel( model );

						}

						model = gltf.scene;
						model.traverse( ( object ) => {

							if ( object.isMesh ) {

								object.castShadow = true;
								object.receiveShadow = true;

							}

							if ( object.isLight && object.shadow ) {

								object.castShadow = true;
								object.shadow.mapSize.setScalar( 1024 );
								object.shadow.normalBias = 0.02;

							}

						} );

						scene.add( model );
						model.updateMatrixWorld( true );
						setModelCamera( gltf );
						// Restart temporal accumulation for the new scene.
						traaPass.setSize( 1, 1 );
						currentModel = name;

					} catch ( error ) {

						if ( id !== loadId ) return;
						params.model = currentModel;
						console.error( 'Unable to load model:', error );

					}

				}

				await loadModel();
				renderer.setAnimationLoop( animate );

				const gui = renderer.inspector.createParameters( 'SSGI settings' );
				gui.add( params, 'model', Object.keys( models ) ).name( 'Model' ).listen().onChange( loadModel );
				gui.add( params, 'output', types ).onChange( updatePostprocessing );
				gui.add( giPass.sliceCount, 'value', 1, 4, 1 ).name( 'slice count' );
				gui.add( giPass.stepCount, 'value', 1, 32, 1 ).name( 'step count' );
				gui.add( giPass.radius, 'value', 1, 25 ).name( 'radius' );
				gui.add( giPass.expFactor, 'value', 1, 3 ).name( 'exp factor' );
				gui.add( giPass.thickness, 'value', 0.01, 10 ).name( 'thickness' );
				gui.add( giPass.backfaceLighting, 'value', 0, 1 ).name( 'backface lighting' );
				gui.add( giPass.aoIntensity, 'value', 0, 4 ).name( 'AO intensity' );
				gui.add( giPass.giIntensity, 'value', 0, 100 ).name( 'GI intensity' );
				gui.add( giPass.useLinearThickness, 'value' ).name( 'use linear thickness' );
				gui.add( giPass.useScreenSpaceSampling, 'value' ).name( 'screen-space sampling' );
				gui.add( giPass, 'useTemporalFiltering' ).name( 'temporal filtering' ).onChange( updatePostprocessing );

				function updatePostprocessing( value ) {

					if ( value === 1 ) {

						renderPipeline.outputNode = vec4( vec3( ao ), 1 );

					} else if ( value === 2 ) {

						renderPipeline.outputNode = vec4( gi, 1 );

					} else if ( value === 3 ) {

						renderPipeline.outputNode = scenePassColor;

					} else {

						renderPipeline.outputNode = giPass.useTemporalFiltering ? traaPass : compositePass;

					}

					renderPipeline.needsUpdate = true;


				}


			}

			function disposeModel( model ) {

				const resources = new Set();
				model.traverse( ( object ) => {

					if ( object.geometry ) resources.add( object.geometry );
					if ( object.shadow ) resources.add( object.shadow );
					const materials = Array.isArray( object.material ) ? object.material : [ object.material ];
					for ( const material of materials ) {

						if ( ! material ) continue;
						resources.add( material );
						for ( const value of Object.values( material ) ) {

							if ( value && value.isTexture ) resources.add( value );

						}

					}

				} );
				for ( const resource of resources ) resource.dispose();

			}

			function setModelCamera( gltf ) {

				const source = gltf.cameras[ 0 ];
				const bounds = new THREE.Box3().setFromObject( model );
				const center = bounds.getCenter( new THREE.Vector3() );

				// Clear any orbit damping left over from the previous scene.
				const damping = controls.enableDamping;
				controls.enableDamping = false;
				controls.update();

				if ( source ) {

					source.getWorldPosition( camera.position );
					source.getWorldQuaternion( camera.quaternion );
					camera.fov = source.fov;
					camera.near = source.near;
					camera.far = source.far;
					controls.target.copy( camera.position ).addScaledVector( camera.getWorldDirection( new THREE.Vector3() ), camera.position.distanceTo( center ) );

				} else {

					controls.target.copy( center );
					camera.position.copy( center ).add( new THREE.Vector3( 1, 0.6, 1 ).multiplyScalar( bounds.getSize( new THREE.Vector3() ).length() ) );

				}

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				controls.update();
				controls.saveState();
				controls.enableDamping = damping;

			}

			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );

			}

			function animate() {

				controls.update();

				renderPipeline.render();

			}

		</script>
	</body>
</html>
