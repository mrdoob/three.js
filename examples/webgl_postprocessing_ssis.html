<!DOCTYPE html>
<html lang="en">

<head>

	<title>three.js webgl - postprocessing - Screen Space Indirect Specular</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<meta property="og:title" content="three.js webgl - postprocessing - Screen Space Indirect Specular">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://threejs.org/examples/webgl_postprocessing_ssis.html">
	<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_postprocessing_ssis.jpg">
	<link type="text/css" rel="stylesheet" href="main.css">
	<style>
		#info { color: #38434b; }
		#info a { color: #456d6b; }
	</style>

</head>

<body>
	<div id="info">
		<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - screen space indirect specular<br />
		SSISPass fills <code>scene.ssisMap</code>; materials apply their own BRDF to it.
	</div>

	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.module.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">
		import * as THREE from 'three';

		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import Stats from 'three/addons/libs/stats.module.js';
		import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
		import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
		import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
		import { GBufferPass } from 'three/addons/postprocessing/GBufferPass.js';
		import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
		import { SSISPass } from 'three/addons/postprocessing/SSISPass.js';
		import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
		import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

		const params = {
			ssis: true,
			autoRotate: true,
			floorRoughness: 0.1,
			floorMetalness: 0.15,
			view: 'Beauty'
		};

		const renderer = new THREE.WebGLRenderer();
		renderer.toneMapping = THREE.ACESFilmicToneMapping;
		renderer.toneMappingExposure = 1.3;
		// like the WebGPU SSR examples, render at CSS pixels; raise for sharper output at a high cost
		const pixelRatio = 1;
		renderer.setPixelRatio( pixelRatio );
		renderer.setSize( window.innerWidth, window.innerHeight );
		renderer.setAnimationLoop( animate );
		document.body.appendChild( renderer.domElement );

		const camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 100 );
		camera.position.set( 2.8, 2.4, 5.6 );

		const scene = new THREE.Scene();
		scene.background = new THREE.Color( 0xe9edf2 );
		scene.fog = new THREE.Fog( 0xe9edf2, 10, 35 );
		scene.environmentIntensity = 2;

		const pmrem = new THREE.PMREMGenerator( renderer );
		pmrem.compileEquirectangularShader();
		new HDRLoader().load( 'textures/equirectangular/monochrome_studio_02_1k.hdr', texture => {

			scene.environment = pmrem.fromEquirectangular( texture ).texture;
			texture.dispose();
			pmrem.dispose();

		} );

		const floor = new THREE.Mesh(
			new THREE.PlaneGeometry( 200, 200 ),
			new THREE.MeshStandardMaterial( { color: 0xffffff, roughness: params.floorRoughness, metalness: params.floorMetalness } )
		);
		floor.rotation.x = - Math.PI / 2;
		scene.add( floor );

		// A restrained palette complements the helmet and gives the floor distinct reflections.
		const add = ( geometry, color, roughness, metalness, x, y, z ) => {

			const mesh = new THREE.Mesh( geometry, new THREE.MeshStandardMaterial( { color, roughness, metalness } ) );
			mesh.position.set( x, y, z );
			scene.add( mesh );
			return mesh;

		};

		const box = add( new RoundedBoxGeometry( 0.7, 0.7, 0.7, 4, 0.08 ), 0xe8dfce, 0.25, 0.15, - 1.65, 0.35, 0.65 );
		box.rotation.y = Math.PI / 6;
		add( new THREE.SphereGeometry( 0.45, 64, 32 ), 0xbba477, 0.22, 0.8, 1.65, 0.45, 0.25 );
		add( new THREE.ConeGeometry( 0.38, 1.1, 64 ), 0x365a59, 0.3, 0.45, - 2, 0.55, - 0.4 );

		new GLTFLoader().load( 'models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf', gltf => {

			const helmet = gltf.scene;
			const bounds = new THREE.Box3().setFromObject( helmet );
			const size = bounds.getSize( new THREE.Vector3() );
			const center = bounds.getCenter( new THREE.Vector3() );
			const scale = 2 / size.y;
			helmet.scale.multiplyScalar( scale );
			helmet.position.set( - center.x * scale, - bounds.min.y * scale, - center.z * scale );
			scene.add( helmet );

		} );

		const stats = new Stats();
		document.body.appendChild( stats.dom );

		const controls = new OrbitControls( camera, renderer.domElement );
		controls.target.set( 0, 0.85, 0 );
		controls.enableDamping = true;
		controls.autoRotate = params.autoRotate;
		controls.autoRotateSpeed = 0.6;
		controls.minDistance = 3;
		controls.maxDistance = 10;
		controls.maxPolarAngle = Math.PI / 2 - 0.05;
		controls.update();

		const width = window.innerWidth * pixelRatio;
		const height = window.innerHeight * pixelRatio;

		const composer = new EffectComposer( renderer );
		const gBufferPass = new GBufferPass( scene, camera, width, height, { material: true } );
		const ssisPass = new SSISPass( scene, camera, width, height, gBufferPass );
		ssisPass.maxDistance = 6;
		ssisPass.thickness = 0.1;

		composer.addPass( gBufferPass );
		composer.addPass( new RenderPass( scene, camera ) );
		composer.addPass( ssisPass );

		// debug view: replaces the beauty with one of the buffers
		const viewPass = new ShaderPass( {
			uniforms: { tView: { value: null }, mode: { value: 0 } },
			vertexShader: /* glsl */`
				varying vec2 vUv;
				void main() {
					vUv = uv;
					gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
				}`,
			fragmentShader: /* glsl */`
				uniform sampler2D tView;
				uniform int mode;
				varying vec2 vUv;
				void main() {
					vec4 c = texture2D( tView, vUv );
					if ( mode == 1 ) c = vec4( vec3( c.r ), 1.0 ); // roughness
					gl_FragColor = vec4( c.rgb, 1.0 );
				}`
		}, 'unused' );
		viewPass.enabled = false;
		composer.addPass( viewPass );
		composer.addPass( new OutputPass() );

		scene.ssisMap = ssisPass.texture;

		const views = {
			'Beauty': null,
			'SSIS radiance': [ ssisPass.texture, 0 ],
			'Roughness': [ gBufferPass.materialTexture, 1 ],
			'Normals': [ gBufferPass.normalTexture, 0 ]
		};

		const gui = new GUI( { width: 260 } );
		gui.add( params, 'view', Object.keys( views ) ).onChange( v => {

			viewPass.enabled = views[ v ] !== null;
			if ( viewPass.enabled ) {

				viewPass.uniforms.tView.value = views[ v ][ 0 ];
				viewPass.uniforms.mode.value = views[ v ][ 1 ];

			}

		} );
		gui.add( params, 'ssis' ).name( 'SSIS as lighting input' ).onChange( v => {

			scene.ssisMap = v ? ssisPass.texture : null;

		} );
		gui.add( params, 'autoRotate' ).onChange( v => controls.autoRotate = v );
		gui.add( params, 'floorRoughness', 0, 1 ).onChange( v => floor.material.roughness = v );
		gui.add( params, 'floorMetalness', 0, 1 ).onChange( v => floor.material.metalness = v );
		const ssisFolder = gui.addFolder( 'SSIS settings' );
		ssisFolder.close();
		ssisFolder.add( ssisPass, 'stochastic' );
		ssisFolder.add( ssisPass, 'quality', 0.1, 1 );
		ssisFolder.add( ssisPass, 'resolutionScale', 0.25, 1 );
		ssisFolder.add( ssisPass, 'rayCount', 1, 16, 1 );
		ssisFolder.add( ssisPass, 'maxFrames', 1, 64, 1 );
		ssisFolder.add( ssisPass, 'temporalClip', 0.5, 4 );
		ssisFolder.add( ssisPass, 'maxDistance', 0, 10 );
		ssisFolder.add( ssisPass, 'thickness', 0, 0.5 );
		ssisFolder.add( ssisPass, 'maxRoughness', 0, 1 );
		ssisFolder.add( ssisPass, 'screenEdgeFade', 0, 0.5 );
		gui.add( scene, 'environmentIntensity', 0, 3 );

		window.addEventListener( 'resize', () => {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize( window.innerWidth, window.innerHeight );
			composer.setSize( window.innerWidth, window.innerHeight );

		} );

		function animate() {

			stats.begin();

			controls.update();

			composer.render();

			stats.end();

		}

	</script>
</body>

</html>
