<!DOCTYPE html>
<html lang="en">

<head>

	<title>three.js webgl - postprocessing - Screen Space Indirect Specular</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<meta property="og:title" content="three.js webgl - postprocessing - Screen Space Indirect Specular">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://threejs.org/examples/webgl_postprocessing_ssis.html">
	<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_postprocessing_ssis.jpg">
	<link type="text/css" rel="stylesheet" href="main.css">
	<style>
		#info { color: #ffffff; text-shadow: 0 1px 4px #000000; }
		#info a { color: #abe7e2; }
	</style>

</head>

<body>
	<div id="info">
		screen space indirect specular by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a><br />
		Reflections pre-calcuated in screen space and passed into material BRDFs
	</div>

	<script type="importmap">
		{
			"imports": {
				"three": "../src/Three.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">
		import * as THREE from 'three';

		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import Stats from 'three/addons/libs/stats.module.js';
		import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
		import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
		import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
		import { GBufferPass } from 'three/addons/postprocessing/GBufferPass.js';
		import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
		import { SSISPass } from 'three/addons/postprocessing/SSISPass.js';
		import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
		import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

		const params = {
			ssis: true,
			rotateHelmet: true,
			view: 'Beauty'
		};

		const renderer = new THREE.WebGLRenderer();
		renderer.toneMapping = THREE.ACESFilmicToneMapping;
		renderer.toneMappingExposure = 1.3;
		// like the WebGPU SSR examples, render at CSS pixels; raise for sharper output at a high cost
		const pixelRatio = 1;
		renderer.setPixelRatio( pixelRatio );
		renderer.setSize( window.innerWidth, window.innerHeight );
		renderer.setAnimationLoop( animate );
		document.body.appendChild( renderer.domElement );

		const camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 100 );
		camera.position.set( 3, 1.8, 8.5 ).multiplyScalar( 0.75 );

		const scene = new THREE.Scene();
		scene.environmentIntensity = 1;

		const pmrem = new THREE.PMREMGenerator( renderer );
		pmrem.compileEquirectangularShader();
		new HDRLoader().load( 'textures/equirectangular/san_giuseppe_bridge_2k.hdr', texture => {

			texture.mapping = THREE.EquirectangularReflectionMapping;
			scene.background = texture;
			scene.environment = pmrem.fromEquirectangular( texture ).texture;
			pmrem.dispose();

		} );

		const geometries = [
			new RoundedBoxGeometry( 0.6, 0.6, 0.6, 4, 0.08 ),
			new THREE.SphereGeometry( 0.35, 64, 32 ),
			new THREE.ConeGeometry( 0.3, 0.75, 64 ),
			new THREE.TorusGeometry( 0.32, 0.1, 24, 64 )
		];
		const colors = [
			0xe8dfce, 0xbba477, 0x365a59, 0xb8cad5,
			0xc5816b, 0x708b85, 0xd8b47b, 0x8299b0,
			0xc2b4cc, 0x404b55, 0xd4c6b3, 0x83b5b0
		];
		const goldenAngle = Math.PI * ( 3 - Math.sqrt( 5 ) );
		const random = THREE.MathUtils.seededRandom;
		random( 42 );

		// Keep the original ring and scatter another twelve objects within its outer radius.
		for ( let i = 0; i < 24; i ++ ) {

			const shape = i % geometries.length;
			const finish = Math.floor( i / geometries.length );
			const material = new THREE.MeshStandardMaterial( {
				color: colors[ i % colors.length ],
				roughness: finish / 5,
				metalness: ( ( finish + shape ) % 6 ) / 5
			} );
			const mesh = new THREE.Mesh( geometries[ shape ], material );
			if ( i < 12 ) {

				mesh.position.setFromSphericalCoords( 2.1 + 0.15 * ( i % 3 ), Math.acos( 1 - 2 * ( i + 0.5 ) / 12 ), i * goldenAngle );
				mesh.rotation.set( i * 0.73, i * 0.49, i * 0.31 );

			} else {

				do {

					const radius = 1.55 + 0.85 * random();
					mesh.position.setFromSphericalCoords( radius, Math.acos( 2 * random() - 1 ), 2 * Math.PI * random() );

				} while ( scene.children.some( object => object.position.distanceToSquared( mesh.position ) < 0.9 * 0.9 ) );

				mesh.rotation.set( 2 * Math.PI * random(), 2 * Math.PI * random(), 2 * Math.PI * random() );

			}

			mesh.scale.setScalar( 0.85 + 0.1 * ( i % 4 ) );
			scene.add( mesh );

		}

		const helmet = new THREE.Group();
		new GLTFLoader().load( 'models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf', gltf => {

			const model = gltf.scene;
			const bounds = new THREE.Box3().setFromObject( model );
			const size = bounds.getSize( new THREE.Vector3() );
			const center = bounds.getCenter( new THREE.Vector3() );
			const scale = 2 / size.y;
			model.scale.multiplyScalar( scale );
			model.position.set( - center.x * scale, - center.y * scale, - center.z * scale );
			helmet.add( model );
			scene.add( helmet );

		} );

		const stats = new Stats();
		document.body.appendChild( stats.dom );
		const timer = new THREE.Timer();
		timer.connect( document );

		const controls = new OrbitControls( camera, renderer.domElement );
		controls.target.set( 0, 0, 0 );
		controls.enableDamping = true;
		controls.minDistance = 4;
		controls.maxDistance = 14;
		controls.update();

		const width = window.innerWidth * pixelRatio;
		const height = window.innerHeight * pixelRatio;

		const composer = new EffectComposer( renderer );
		const gBufferPass = new GBufferPass( scene, camera, width, height, { material: true } );
		const ssisPass = new SSISPass( scene, camera, width, height, gBufferPass );

		composer.addPass( gBufferPass );
		composer.addPass( new RenderPass( scene, camera ) );
		composer.addPass( ssisPass );

		// debug view: replaces the beauty with one of the buffers
		const viewPass = new ShaderPass( {
			uniforms: { tView: { value: null }, mode: { value: 0 } },
			vertexShader: /* glsl */`
				varying vec2 vUv;
				void main() {
					vUv = uv;
					gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
				}`,
			fragmentShader: /* glsl */`
				uniform sampler2D tView;
				uniform int mode;
				varying vec2 vUv;
				void main() {
					vec4 c = texture2D( tView, vUv );
					if ( mode == 1 ) c = vec4( vec3( c.r ), 1.0 ); // roughness
					gl_FragColor = vec4( c.rgb, 1.0 );
				}`
		}, 'unused' );
		viewPass.enabled = false;
		composer.addPass( viewPass );
		composer.addPass( new OutputPass() );

		scene.ssisMap = ssisPass.texture;

		const views = {
			'Beauty': null,
			'SSIS radiance': [ ssisPass.texture, 0 ],
			'Roughness': [ gBufferPass.materialTexture, 1 ],
			'Normals': [ gBufferPass.normalTexture, 0 ]
		};

		const gui = new GUI( { width: 260 } );
		gui.add( params, 'view', Object.keys( views ) ).onChange( v => {

			viewPass.enabled = views[ v ] !== null;
			if ( viewPass.enabled ) {

				viewPass.uniforms.tView.value = views[ v ][ 0 ];
				viewPass.uniforms.mode.value = views[ v ][ 1 ];

			}

		} );
		gui.add( params, 'ssis' ).name( 'SSIS as lighting input' ).onChange( v => {

			scene.ssisMap = v ? ssisPass.texture : null;

		} );
		gui.add( params, 'rotateHelmet' );
		const ssisFolder = gui.addFolder( 'SSIS settings' );
		ssisFolder.close();
		ssisFolder.add( ssisPass, 'stochastic' );
		ssisFolder.add( ssisPass, 'quality', 0.1, 1 );
		ssisFolder.add( ssisPass, 'resolutionScale', 0.25, 1 );
		ssisFolder.add( ssisPass, 'rayCount', 1, 64, 1 );
		ssisFolder.add( ssisPass, 'maxDistance', 0, 30 );
		ssisFolder.add( ssisPass, 'thickness', 0, 0.5 );
		ssisFolder.add( ssisPass, 'screenEdgeFade', 0, 0.5 );

		window.addEventListener( 'resize', () => {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize( window.innerWidth, window.innerHeight );
			composer.setSize( window.innerWidth, window.innerHeight );

		} );

		function animate() {

			stats.begin();

			timer.update();
			if ( params.rotateHelmet ) helmet.rotation.y += timer.getDelta() * 0.3;

			controls.update();

			composer.render();

			stats.end();

		}

	</script>
</body>

</html>
