<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - virtual point lights</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - virtual point lights">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_virtualpointlights.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_virtualpointlights.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Virtual Point Lights</span>
			</div>

			<small>Diffuse instant radiosity via Virtual Point Lights by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a></small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/",
					"three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/src/index.js"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { lights } from 'three/tsl';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { VirtualPointLightGenerator } from 'three/addons/lighting/VirtualPointLightGenerator.js';
			import { VirtualPointLightShadowMaps } from 'three/addons/lighting/VirtualPointLightShadowMaps.js';
			import { VirtualPointLightsNode } from 'three/addons/tsl/lighting/VirtualPointLightsNode.js';
			import { VirtualPointLightHelper } from 'three/addons/helpers/VirtualPointLightHelper.js';
			import { acceleratedRaycast, computeBoundsTree } from 'three-mesh-bvh';

			const MAX_VPLS = 1024;
			const params = { mode: 'combined', count: 128, shadows: true, shadowResolution: 64, showVPLs: false, seed: 1, minDistance: 1, progressive: false, bounces: 2, candidateMultiplier: 4, importanceSampling: true, emissive: true };

			let camera, scene, renderer;
			let generator, shadowMaps, vpl, helper;
			let sourceLights, intensities;
			let mapsDirty = true;
			let previewCount = params.count;
			let nextPreviewTime = Infinity;

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 2.5, 8 );

				// Scene

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x111111 );

				const wallMaterial = new THREE.MeshStandardMaterial( { color: 0xcccccc } );
				const redMaterial = new THREE.MeshStandardMaterial( { color: 0xff0000 } );
				const greenMaterial = new THREE.MeshStandardMaterial( { color: 0x00ff00 } );

				// Floor
				const floor = new THREE.Mesh( new THREE.PlaneGeometry( 6, 6 ), wallMaterial );
				floor.rotation.x = - Math.PI / 2;
				floor.receiveShadow = true;
				scene.add( floor );

				// Ceiling
				const ceiling = new THREE.Mesh( new THREE.PlaneGeometry( 6, 6 ), wallMaterial );
				ceiling.rotation.x = Math.PI / 2;
				ceiling.position.y = 5;
				ceiling.receiveShadow = true;
				scene.add( ceiling );

				// Back wall
				const backWall = new THREE.Mesh( new THREE.PlaneGeometry( 6, 5 ), wallMaterial );
				backWall.position.set( 0, 2.5, - 3 );
				backWall.receiveShadow = true;
				scene.add( backWall );

				// Front wall
				const frontWall = new THREE.Mesh( new THREE.PlaneGeometry( 6, 5 ), wallMaterial );
				frontWall.rotation.y = Math.PI;
				frontWall.position.set( 0, 2.5, 3 );
				frontWall.receiveShadow = true;
				scene.add( frontWall );

				// Left wall (red)
				const leftWall = new THREE.Mesh( new THREE.PlaneGeometry( 6, 5 ), redMaterial );
				leftWall.rotation.y = Math.PI / 2;
				leftWall.position.set( - 3, 2.5, 0 );
				leftWall.receiveShadow = true;
				scene.add( leftWall );

				// Right wall (green)
				const rightWall = new THREE.Mesh( new THREE.PlaneGeometry( 6, 5 ), greenMaterial );
				rightWall.rotation.y = - Math.PI / 2;
				rightWall.position.set( 3, 2.5, 0 );
				rightWall.receiveShadow = true;
				scene.add( rightWall );

				// Objects inside the box

				const objectMaterial = new THREE.MeshStandardMaterial( { color: 0xeeeeee } );

				// Tall box
				const tallBox = new THREE.Mesh( new THREE.BoxGeometry( 1.2, 2.5, 1.2 ), objectMaterial );
				tallBox.position.set( - 0.8, 1.25, - 0.8 );
				tallBox.rotation.y = Math.PI / 8;
				tallBox.castShadow = true;
				tallBox.receiveShadow = true;
				scene.add( tallBox );

				// Short box
				const shortBox = new THREE.Mesh( new THREE.BoxGeometry( 1.2, 1.2, 1.2 ), objectMaterial );
				shortBox.position.set( 1, 0.6, 0.5 );
				shortBox.rotation.y = - Math.PI / 6;
				shortBox.castShadow = true;
				shortBox.receiveShadow = true;
				scene.add( shortBox );

				// Sphere (to show smooth GI variation)
				const sphere = new THREE.Mesh( new THREE.SphereGeometry( 0.5, 32, 32 ), objectMaterial.clone() );
				sphere.position.set( 1, 1.9, 0.5 );
				sphere.castShadow = true;
				sphere.receiveShadow = true;
				scene.add( sphere );

				// Light
				const light = new THREE.PointLight( 0xffffff, 40 );
				light.position.set( 0, 4.5, 0 );
				light.castShadow = true;
				light.shadow.mapSize.setScalar( 256 );
				light.shadow.radius = 10;
				light.shadow.normalBias = - 0.02;
				scene.add( light );

				// Virtual point lights

				scene.updateMatrixWorld( true );

				const surfaces = [];
				sourceLights = [];

				scene.traverseVisible( object => {

					if ( object.isMesh ) {

						surfaces.push( object );
						object.raycast = acceleratedRaycast;
						if ( ! object.geometry.boundsTree ) computeBoundsTree.call( object.geometry );

					} else if ( object.isPointLight ) {

						sourceLights.push( object );

					}

				} );

				intensities = sourceLights.map( light => light.intensity );

				generator = new VirtualPointLightGenerator( MAX_VPLS );
				shadowMaps = new VirtualPointLightShadowMaps( MAX_VPLS );
				vpl = new VirtualPointLightsNode( generator, ( start, end, index ) => shadowMaps.visibility( start, end, index ) );
				vpl.shadows.value = params.shadows;

				const lighting = lights( [ ...sourceLights, vpl ] );
				const materials = new Map();

				for ( const surface of surfaces ) {

					// node materials are required to add the VPL irradiance via lightsNode

					const original = surface.material;

					if ( ! materials.has( original ) ) {

						const material = new THREE.MeshStandardNodeMaterial();
						material.copy( original );
						material.lightsNode = lighting;
						materials.set( original, material );

					}

					surface.material = materials.get( original );

				}

				helper = new VirtualPointLightHelper( generator );
				helper.visible = params.showVPLs;
				scene.add( helper );

				// Renderer

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );
				await renderer.init();

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 2.5, 0 );
				controls.update();

				// GUI

				const gui = renderer.inspector.createParameters( 'Virtual Point Lights' );
				gui.add( params, 'mode', [ 'direct only', 'indirect only', 'combined' ] ).name( 'Lighting' ).onChange( updateMode );
				gui.add( params, 'count', sourceLights.length, MAX_VPLS, 1 ).name( 'VPL Budget' ).info( 'Maximum emitters used by the renderer. Escaped paths do not become VPLs.' ).onChange( regenerate ).debounce( 250 );
				gui.add( params, 'bounces', 1, 16, 1 ).name( 'Bounces' ).info( 'Maximum diffuse reflections. More depths share the initial-path budget.' ).onChange( () => regenerate() );
				gui.add( params, 'candidateMultiplier', [ 1, 2, 4, 8, 16 ] ).name( 'CPU Candidates' ).info( 'Trace more paths during generation while keeping the VPL and shadow-map budgets fixed.' ).onChange( regenerate );
				gui.add( params, 'importanceSampling' ).name( 'Source Importance' ).onChange( regenerate );
				gui.add( params, 'emissive' ).name( 'Emissive Surfaces' ).onChange( regenerate );
				gui.add( params, 'seed', 1, 100, 1 ).name( 'Seed' ).onChange( regenerate ).debounce( 250 );
				gui.add( params, 'minDistance', 0.01, 1, 0.01 ).name( 'Distance Clamp' ).info( 'Reduces near-field singularities at the expense of indirect-light energy.' ).onChange( value => vpl.minDistance.value = value );
				gui.add( params, 'showVPLs' ).name( 'Show VPLs' ).onChange( value => helper.visible = value );

				const progressiveParameters = gui.addFolder( 'Progressive' );
				progressiveParameters.add( params, 'progressive' ).name( 'Progressive Preview' ).info( 'Double the ray budget every 0.5 seconds, up to VPL Budget. Each stage regenerates a normalized estimate.' ).onChange( () => regenerate() );
				progressiveParameters.add( { restart: () => regenerate() }, 'restart' ).name( 'Restart Preview' );

				const shadowParameters = gui.addFolder( 'Shadows' );
				shadowParameters.add( params, 'shadows' ).name( 'VPL Shadows' ).onChange( updateVisibility );
				shadowParameters.add( params, 'shadowResolution', [ 32, 64 ] ).name( 'Shadow Resolution' ).info( 'Pixels per cube face. Maps rebuild when the VPL set or resolution changes.' ).onChange( () => {

					mapsDirty = true;
					updateVisibility();

				} );

				regenerate();

				renderer.setAnimationLoop( animate );

				window.addEventListener( 'resize', onWindowResize );

			}

			function generate() {

				const visible = helper.visible;
				helper.visible = false;

				generator.generate( scene, sourceLights, { count: previewCount, seed: params.seed, bounces: params.bounces, candidateMultiplier: params.candidateMultiplier, importanceSampling: params.importanceSampling, emissive: params.emissive } );

				helper.visible = visible;

				vpl.update();
				helper.update();
				mapsDirty = true;

			}

			function updateVisibility() {

				vpl.shadows.value = params.shadows;

				if ( params.shadows && mapsDirty ) {

					const visible = helper.visible;
					helper.visible = false;

					shadowMaps.update( renderer, scene, generator, vpl.bias.value, params.shadowResolution );
					mapsDirty = false;

					helper.visible = visible;

				}

			}

			function updateMode() {

				sourceLights.forEach( ( light, i ) => {

					light.intensity = params.mode === 'indirect only' ? 0 : intensities[ i ];

				} );

				vpl.intensity.value = params.mode === 'direct only' ? 0 : 1;

			}

			// sampling always uses the original source power, including in indirect-only mode

			function regenerate( restart = true ) {

				params.count = Math.max( params.count, sourceLights.length * params.bounces );
				if ( restart !== false ) previewCount = params.progressive ? Math.min( 32, params.count ) : params.count;

				sourceLights.forEach( ( light, i ) => {

					light.intensity = intensities[ i ];

				} );

				generate();
				updateMode();
				updateVisibility();

				nextPreviewTime = params.progressive && previewCount < params.count ? performance.now() + 500 : Infinity;

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				if ( performance.now() >= nextPreviewTime ) {

					previewCount = Math.min( params.count, previewCount * 2 );
					regenerate( false );

				}

				renderer.render( scene, camera );

			}


		</script>
	</body>
</html>
