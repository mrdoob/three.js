<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - meshlets materials</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - meshlets materials">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_meshlets_materials.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_meshlets_materials.jpg">
		<link rel="icon" href="data:,">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>
			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Meshlets Materials</span>
			</div>
			<small>
				Built-in and custom TSL materials drawn by the GPU-driven pipeline, one sector of statues per material.<br />
				<span id="status" role="status">Loading...</span><br />
				<span id="stats"></span>
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { color, float, vec3, sin, fract, smoothstep, mix, step, time, hash, instanceIndex, positionLocal, positionWorld, normalView, mx_fractal_noise_float, mx_noise_vec3, mx_hsvtorgb } from 'three/tsl';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
			import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { MeshletDrawingPipeline } from 'three/addons/pipelines/MeshletDrawingPipeline.js';
			import WebGPU from 'three/addons/capabilities/WebGPU.js';

			if ( WebGPU.isAvailable() === false ) {

				document.body.appendChild( WebGPU.getErrorMessage() );
				throw new Error( 'No WebGPU support' );

			}

			const SPACING = 3;
			const INNER_RADIUS = 10;
			const ROWS = 8;

			const parameters = {
				pipeline: 'Meshlet',
				meshlets: false,
				lod: 3,
				rotate: true
			};

			const status = document.getElementById( 'status' );
			const stats = document.getElementById( 'stats' );
			const timer = new THREE.Timer();

			let renderer, scene, camera, controls, pipelines;
			let geometry, statueCount = 0;

			init().catch( error => {

				status.textContent = error.message;
				console.error( error );

			} );

			async function init() {

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.shadowMap.enabled = true;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );
				await renderer.init();

				pipelines = {
					'Meshlet': new MeshletDrawingPipeline( { lodThreshold: parameters.lod, shadowLodThreshold: parameters.lod } ),
					'Default (slow)': renderer.drawingPipeline
				};
				renderer.drawingPipeline = pipelines[ parameters.pipeline ];

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x1d1b24 );
				scene.fog = new THREE.FogExp2( 0x1d1b24, 0.012 );
				scene.environment = new THREE.PMREMGenerator( renderer ).fromScene( new RoomEnvironment(), 0.04 ).texture;
				scene.environmentIntensity = 0.5;

				scene.add( new THREE.HemisphereLight( 0x9fb4d9, 0x4a3b30, 0.6 ) );

				const sunLight = new THREE.DirectionalLight( 0xffd2a8, 2.5 );
				sunLight.position.set( - 50, 60, 30 );
				sunLight.castShadow = true;
				sunLight.shadow.mapSize.setScalar( 4096 );
				sunLight.shadow.normalBias = 0.05;
				sunLight.shadow.camera.left = sunLight.shadow.camera.bottom = - 50;
				sunLight.shadow.camera.right = sunLight.shadow.camera.top = 50;
				sunLight.shadow.camera.far = 150;
				scene.add( sunLight );

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 300 );
				camera.position.set( 0, 14, 48 );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 2, 0 );
				controls.enableDamping = true;
				controls.autoRotate = parameters.rotate;
				controls.autoRotateSpeed = 0.6;
				controls.minDistance = 5;
				controls.maxDistance = 120;
				controls.maxPolarAngle = Math.PI * 0.49;
				controls.update();

				const ground = new THREE.Mesh( new THREE.CircleGeometry( 300, 64 ), new THREE.MeshStandardNodeMaterial( { color: 0x4f463f, roughness: 0.9 } ) );
				ground.rotation.x = - Math.PI / 2;
				ground.receiveShadow = true;
				scene.add( ground );

				geometry = await new PLYLoader().loadAsync( 'models/ply/binary/Lucy100k.ply' );
				geometry.computeVertexNormals();

				// stand the statue on the ground with a height of 4 units

				geometry.computeBoundingBox();
				const box = geometry.boundingBox;
				const size = box.getSize( new THREE.Vector3() );
				geometry.translate( - ( box.min.x + box.max.x ) / 2, - box.min.y, - ( box.min.z + box.max.z ) / 2 );
				geometry.scale( 4 / size.y, 4 / size.y, 4 / size.y );

				createStatues( createMaterials() );
				createGUI();
				window.addEventListener( 'resize', onWindowResize );
				await prepare();

			}

			function createMaterials() {

				const materials = [];

				// built-in materials

				materials.push( new THREE.MeshStandardNodeMaterial( { color: 0xd8d0c4, roughness: 0.5 } ) );
				materials.push( new THREE.MeshStandardNodeMaterial( { color: 0xffc35a, metalness: 1, roughness: 0.25 } ) );
				materials.push( new THREE.MeshPhongNodeMaterial( { color: 0x3d9c6f, shininess: 80, specular: 0x666666 } ) );
				materials.push( new THREE.MeshToonNodeMaterial( { color: 0x6f8fd8 } ) );

				// procedural marble veins

				const marble = new THREE.MeshStandardNodeMaterial( { roughness: 0.3 } );
				const veins = sin( positionLocal.y.mul( 6 ).add( mx_fractal_noise_float( positionLocal.mul( 1.5 ), 4 ).mul( 4 ) ) ).abs();
				marble.colorNode = mix( color( 0x2b2622 ), color( 0xf2ece4 ), smoothstep( 0.05, 0.35, veins ) );
				materials.push( marble );

				// glowing scan lines moving up the statues

				const scan = new THREE.MeshStandardNodeMaterial( { color: 0x1c2733, roughness: 0.4, metalness: 0.6 } );
				const line = smoothstep( 0.9, 1, fract( positionWorld.y.mul( 0.75 ).sub( time.mul( 0.5 ) ) ) );
				scan.emissiveNode = color( 0x29d4ff ).mul( line ).mul( 4 );
				materials.push( scan );

				// hammered metal: the normal is perturbed by noise

				const hammered = new THREE.MeshStandardNodeMaterial( { color: 0xb87333, metalness: 1, roughness: 0.35 } );
				hammered.normalNode = normalView.add( mx_noise_vec3( positionLocal.mul( 18 ) ).mul( 0.35 ) ).normalize();
				materials.push( hammered );

				// a color per instance from the instance index

				const rainbow = new THREE.MeshStandardNodeMaterial( { roughness: 0.4 } );
				rainbow.colorNode = mx_hsvtorgb( vec3( hash( instanceIndex ), 0.65, 0.9 ) );
				materials.push( rainbow );

				// statues swaying in the wind: the culling bounds follow the deformed positions. the position of instanced
				// meshes includes the instance matrix, the phase of each statue comes from its position

				const sway = new THREE.MeshStandardNodeMaterial( { color: 0xc77dff, roughness: 0.5 } );
				const bend = positionLocal.y.div( 4 ).pow( 2 ).mul( sin( time.mul( 2 ).add( positionLocal.x.mul( 0.4 ) ) ) ).mul( 0.6 );
				sway.positionNode = positionLocal.add( vec3( bend, 0, bend.mul( 0.5 ) ) );
				materials.push( sway );

				// alpha tested slits

				const slits = new THREE.MeshStandardNodeMaterial( { color: 0xe8e2d6, roughness: 0.6, alphaTest: 0.5 } );
				slits.opacityNode = step( float( 0.35 ), fract( positionLocal.y.mul( 4 ) ) );
				materials.push( slits );

				return materials;

			}

			function createStatues( materials ) {

				// a ring of sectors around the center, the statues of a sector are instances of one instanced mesh

				const sector = Math.PI * 2 / materials.length;
				const matrix = new THREE.Matrix4();
				const position = new THREE.Vector3();
				const quaternion = new THREE.Quaternion();
				const scale = new THREE.Vector3();
				const up = new THREE.Vector3( 0, 1, 0 );

				for ( let m = 0; m < materials.length; m ++ ) {

					const placements = [];

					for ( let row = 0; row < ROWS; row ++ ) {

						const radius = INNER_RADIUS + row * SPACING;
						const columns = Math.floor( radius * sector / SPACING );

						for ( let column = 0; column < columns; column ++ ) {

							const angle = sector * ( m + ( column + 0.5 ) / columns );
							placements.push( [ Math.cos( angle ) * radius, Math.sin( angle ) * radius ] );

						}

					}

					const statues = new THREE.InstancedMesh( geometry, materials[ m ], placements.length );
					statues.castShadow = true;
					statues.receiveShadow = true;

					placements.forEach( ( [ x, z ], i ) => {

						position.set( x, 0, z );
						quaternion.setFromAxisAngle( up, Math.random() * Math.PI * 2 );
						scale.setScalar( 0.85 + Math.random() * 0.3 );
						statues.setMatrixAt( i, matrix.compose( position, quaternion, scale ) );

					} );

					statues.computeBoundingSphere();
					scene.add( statues );

					statueCount += placements.length;

				}

			}

			async function prepare() {

				renderer.setAnimationLoop( null );
				status.textContent = 'Preparing materials...';

				try {

					renderer.drawingPipeline = pipelines[ parameters.pipeline ];
					await renderer.compileAsync( scene, camera );
					status.textContent = '';

				} catch ( error ) {

					status.textContent = error.message;
					console.error( error );

				} finally {

					renderer.setAnimationLoop( animate );

				}

			}

			function createGUI() {

				const gui = renderer.inspector.createParameters( 'Settings' );
				gui.add( parameters, 'pipeline', Object.keys( pipelines ) ).name( 'Pipeline' ).onChange( prepare );
				gui.add( parameters, 'meshlets' ).name( 'Show meshlets' ).onChange( value => {

					pipelines[ 'Meshlet' ].debug = value;
					renderer.toneMapping = value ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;
					prepare();

				} );
				gui.add( parameters, 'lod', 1, 8, 0.5 ).name( 'LOD error (px)' ).onChange( value => {

					pipelines[ 'Meshlet' ].lodThreshold = value;
					pipelines[ 'Meshlet' ].shadowLodThreshold = value;

				} );
				gui.add( parameters, 'rotate' ).name( 'Auto rotate' ).onChange( value => controls.autoRotate = value );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function formatCount( value ) {

				if ( value >= 1e9 ) return ( value / 1e9 ).toFixed( 1 ) + 'B';
				if ( value >= 1e6 ) return ( value / 1e6 ).toFixed( 1 ) + 'M';
				if ( value >= 1e3 ) return ( value / 1e3 ).toFixed( 0 ) + 'k';
				return value.toString();

			}

			function animate( time ) {

				timer.update( time );
				controls.update( timer.getDelta() );
				renderer.render( scene, camera );

				let text = `${ statueCount } statues | ${ formatCount( statueCount * geometry.index.count / 3 ) } triangles in the scene`;

				if ( renderer.drawingPipeline === pipelines[ 'Meshlet' ] ) {

					const info = pipelines[ 'Meshlet' ].info;
					text += ` | ${ formatCount( info.triangles ) } drawn in ${ formatCount( info.clusters ) } clusters`;

				}

				stats.textContent = text;

			}

		</script>
	</body>
</html>
