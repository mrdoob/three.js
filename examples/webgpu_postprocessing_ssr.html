<!DOCTYPE html>
<html lang="en">

<head>

	<head>
		<title>three.js webgpu - postprocessing - Screen Space Reflections (SSR)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - postprocessing - Screen Space Reflections (SSR)">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssr.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssr.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>

<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>SSR</span>
			</div>

			<small>
				Screen Space Reflections.<br />
				<a href="https://skfb.ly/6tqYD" target="_blank" rel="noopener">Steampunk Camera</a> by
				<a href="https://sketchfab.com/lumoize" target="_blank" rel="noopener">dylanheyes</a> is licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">Creative Commons Attribution</a>.
			</small>
		</div>

	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.webgpu.js",
				"three/webgpu": "../build/three.webgpu.js",
				"three/tsl": "../build/three.tsl.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">

		import * as THREE from 'three/webgpu';
		import { pass, mrt, output, normalView, materialMetalness, materialRoughness, diffuseColor, screenUV, color, sample, packNormalToRGB, unpackRGBToNormal, vec4, uniform, mix, velocity } from 'three/tsl';
		import { ssr } from 'three/addons/tsl/display/SSRNode.js';
		import { temporalDenoise } from 'three/addons/tsl/display/DenoiseNode.js';
		import { traa } from 'three/addons/tsl/display/TRAANode.js';
		import { smaa } from 'three/addons/tsl/display/SMAANode.js';

		import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
		import { Inspector } from 'three/addons/inspector/Inspector.js';

		const params = {
			output: 'Beauty', traa: true, traaFrames: 20, steps: 32,
			maxDistance: 1, thickness: 0.03, binaryRefine: true,
			roughness: 1, denoise: true, luminancePhi: 3
		};

		let camera, scene, model, renderer, pipeline;
		let controls;

		init();

		async function init() {

			camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 50 );
			camera.position.set( 3, 2, 3 );

			scene = new THREE.Scene();
			scene.backgroundNode = screenUV.distance( .5 ).remap( 0, 0.5 ).mix( color( 0x888877 ), color( 0x776666 ) );

			const dracoLoader = new DRACOLoader();

			const loader = new GLTFLoader();
			loader.setDRACOLoader( dracoLoader );
			loader.load( 'models/gltf/steampunk_camera.glb', function ( gltf ) {

				model = gltf.scene;

				model.traverse( function ( object ) {

					if ( object.material ) {

						if ( object.material.name === 'Lense_Casing' ) {

							object.material.transparent = true;

						}

						// Avoid overdrawing
						object.material.side = THREE.FrontSide;

					}

				} );

				model.position.y = 0.1;
				scene.add( model );

			} );

			// Add a reflective plane under the camera

			const floorGeometry = new THREE.CircleGeometry( 2, 64 );
			const floorMaterial = new THREE.MeshStandardMaterial( {
				color: 0xffffff,
				metalness: 1,
				roughness: 0.5
			} );
			const floor = new THREE.Mesh( floorGeometry, floorMaterial );
			floor.rotation.x = - Math.PI / 2;
			floor.position.y = - 0.8;
			scene.add( floor );

			//

			renderer = new THREE.WebGPURenderer();
			// renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( animate );
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.inspector = new Inspector();
			document.body.appendChild( renderer.domElement );

			await renderer.init();

			const environment = new RoomEnvironment();
			const pmremGenerator = new THREE.PMREMGenerator( renderer );

			scene.environment = pmremGenerator.fromScene( environment, 0.04 ).texture;
			scene.environmentIntensity = 1.25;
			pmremGenerator.dispose();

			//

			pipeline = new THREE.RenderPipeline( renderer );

			const scenePass = pass( scene, camera );
			scenePass.setMRT( mrt( {
				output,
				diffuseColor: vec4( diffuseColor.rgb, materialMetalness ),
				normal: vec4( packNormalToRGB( normalView ), materialRoughness ),
				velocity
			} ) );
			scenePass.getTexture( 'normal' ).type = THREE.UnsignedByteType;
			scenePass.getTexture( 'diffuseColor' ).type = THREE.UnsignedByteType;
			const beauty = scenePass.getTextureNode();
			const depth = scenePass.getTextureNode( 'depth' );
			const packedNormal = scenePass.getTextureNode( 'normal' );
			const motion = scenePass.getTextureNode( 'velocity' );
			const albedo = scenePass.getTextureNode( 'diffuseColor' );
			const normal = sample( uv => unpackRGBToNormal( packedNormal.sample( uv ).rgb ) );
			const surfaceRoughness = sample( uv => packedNormal.sample( uv ).a );
			const reflection = ssr( beauty, depth, normal, {
				stochastic: true, outputCoverage: true, binaryRefine: params.binaryRefine,
				diffuseNode: albedo, metalnessNode: albedo.a, roughnessNode: surfaceRoughness
			} ).toInspector( 'SSR' );
			const raw = reflection.getTextureNode();
			const coverage = reflection.getCoverageNode();
			// Filter coverage alongside the existing BRDF-weighted reflection color.
			// Hit distance remains a separate guide, rather than doubling as coverage.
			const denoiser = temporalDenoise( vec4( raw.rgb, coverage.r ), {
				camera, depth, normal, velocity: motion, roughness: surfaceRoughness,
				alpha: true, hitDistance: sample( uv => raw.sample( uv ).a )
			} );
			const filtered = denoiser.getTextureNode();
			const denoiseEnabled = uniform( 1 );
			const combined = beauty.rgb.add( mix( raw.rgb, filtered.rgb, denoiseEnabled ) );
			const temporalAA = traa( vec4( combined, 1 ), depth, motion, camera );
			const spatialAA = smaa( vec4( combined, 1 ) );

			function updateOutput() {

				let view;
				switch ( params.output ) {

					case 'Beauty': view = params.traa ? temporalAA : spatialAA; break;
					case 'SSR': view = vec4( raw.rgb, 1 ); break;
					case 'SSR DR': view = vec4( filtered.rgb, 1 ); break;
					case 'SSR coverage': view = vec4( coverage.rrr, 1 ); break;
					case 'SSR coverage DR': view = vec4( filtered.aaa, 1 ); break;

				}

				pipeline.outputNode = view;
				pipeline.outputColorTransform = ! params.output.includes( 'coverage' );
				pipeline.needsUpdate = true;

			}

			controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;
			controls.update();

			window.addEventListener( 'resize', onWindowResize );

			// GUI

			const displayGui = renderer.inspector.createParameters( 'Display' );
			displayGui.add( params, 'output', [ 'Beauty', 'SSR', 'SSR DR', 'SSR coverage', 'SSR coverage DR' ] ).name( 'Output' ).onChange( updateOutput );
			displayGui.add( params, 'traa' ).name( 'TRAA' ).onChange( updateOutput );
			displayGui.add( params, 'traaFrames', 1, 64, 1 ).name( 'TRAA history frames' ).onChange( value => temporalAA.maxFrames.value = value );

			const ssrGui = renderer.inspector.createParameters( 'SSR' );
			ssrGui.add( params, 'steps', 1, 64, 1 ).name( 'Steps' ).info( 'Maximum ray-march steps for one GGX ray per pixel per frame. Binary refinement adds up to 8 steps.' ).onChange( updateParameters );
			ssrGui.add( params, 'binaryRefine' ).name( 'Binary refine' ).onChange( updateParameters );
			ssrGui.add( params, 'maxDistance', 0.01, 50, 0.01 ).name( 'Max distance' ).onChange( updateParameters );
			ssrGui.add( params, 'thickness', 0, 0.5, 0.001 ).name( 'Thickness' ).onChange( updateParameters );

			const denoiseGui = renderer.inspector.createParameters( 'Denoising' );
			denoiseGui.add( params, 'denoise' ).name( 'Enabled' ).onChange( value => denoiseEnabled.value = Number( value ) );
			denoiseGui.add( params, 'luminancePhi', 0, 10 ).name( 'Luminance phi' ).onChange( updateParameters );

			const sceneGui = renderer.inspector.createParameters( 'Scene' );
			sceneGui.add( params, 'roughness', 0, 1 ).name( 'Roughness' ).onChange( value => {

				model?.traverse( object => {

					if ( object.material ) object.material.roughness = value;

				} );

			} );

			updateParameters();
			updateOutput();

			function updateParameters() {

				reflection.quality.value = params.steps / 64;
				reflection.binaryRefine = params.binaryRefine;
				reflection.maxDistance.value = params.maxDistance;
				reflection.thickness.value = params.thickness;
				denoiser.luminancePhi.value = params.luminancePhi;

			}

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );

		}

		function animate() {

			controls.update();

			pipeline.render();

		}

	</script>
</body>

</html>
