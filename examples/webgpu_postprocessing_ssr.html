<!DOCTYPE html>
<html lang="en">

<head>

	<head>
		<title>three.js webgpu - postprocessing - Screen Space Reflections (SSR)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - postprocessing - Screen Space Reflections (SSR)">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssr.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssr.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>

<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>SSR</span>
			</div>

			<small>
				Screen Space Reflections.<br />
				<a href="https://skfb.ly/6tqYD" target="_blank" rel="noopener">Steampunk Camera</a> by
				<a href="https://sketchfab.com/lumoize" target="_blank" rel="noopener">dylanheyes</a> is licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">Creative Commons Attribution</a>.
			</small>
		</div>

	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.webgpu.js",
				"three/webgpu": "../build/three.webgpu.js",
				"three/tsl": "../build/three.tsl.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">

		import * as THREE from 'three/webgpu';
		import { pass, mrt, output, normalView, metalness, roughness, screenUV, color, sample, packNormalToRGB, unpackRGBToNormal, vec2, vec3, vec4, Fn, If, uniform, context, cameraWorldMatrix, getViewPosition, diffuseColor, specularColorBlended, specularF90, EnvironmentBRDF, indirectSpecular, environmentSpecular, pmremTexture, colorSpaceToWorking } from 'three/tsl';
		import { ssr } from 'three/addons/tsl/display/SSRNode.js';
		import { fastNoise } from 'three/addons/tsl/utils/FASTNoise.js';
		import { smaa } from 'three/addons/tsl/display/SMAANode.js';

		import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
		import { Inspector } from 'three/addons/inspector/Inspector.js';

		const params = {
			quality: 0.5,
			view: 'Beauty',
			sampling: 'FAST Separate',
			environment: true,
			maxDistance: 5,
			intensity: 1,
			thickness: 0.03,
			binaryRefine: false,
			roughness: 1,
			enabled: true
		};

		let camera, scene, model, renderer, renderPipeline, ssrPass;
		let controls;
		const samplingModes = [ 'Original', 'FAST Product', 'FAST Separate' ];
		const samplingMode = uniform( 2, 'uint' );
		const ssrEnabled = uniform( 1 );
		const environmentEnabled = uniform( 1 );

		init();

		async function init() {

			camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 50 );
			camera.position.set( 3, 2, 3 );

			scene = new THREE.Scene();
			scene.backgroundNode = screenUV.distance( .5 ).remap( 0, 0.5 ).mix( color( 0x888877 ), color( 0x776666 ) );

			const dracoLoader = new DRACOLoader().setDecoderPath( 'jsm/libs/draco/gltf/' );

			const loader = new GLTFLoader();
			loader.setDRACOLoader( dracoLoader );
			loader.load( 'models/gltf/steampunk_camera.glb', function ( gltf ) {

				model = gltf.scene;

				model.traverse( function ( object ) {

					if ( object.material ) {

						if ( object.material.name === 'Lense_Casing' ) {

							object.material.transparent = true;

						}

						// Avoid overdrawing
						object.material.side = THREE.FrontSide;

					}

				} );

				model.position.y = 0.1;
				scene.add( model );

			} );

			// Add a reflective plane under the camera

			const floorGeometry = new THREE.CircleGeometry( 2, 64 );
			const floorMaterial = new THREE.MeshStandardMaterial( {
				color: 0xffffff,
				metalness: 1,
				roughness: 0.2
			} );
			const floor = new THREE.Mesh( floorGeometry, floorMaterial );
			floor.rotation.x = - Math.PI / 2;
			floor.position.y = - 0.8;
			scene.add( floor );

			//

			renderer = new THREE.WebGPURenderer();
			// renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.inspector = new Inspector();
			document.body.appendChild( renderer.domElement );

			await renderer.init();

			const noiseAtlases = await Promise.all( [ 'product', 'separate05' ].map( async variant => {

				const atlas = await new THREE.TextureLoader().loadAsync( `textures/noises/fast/gauss1-ema01-${ variant }.png` );
				atlas.flipY = false;
				atlas.colorSpace = THREE.NoColorSpace;
				atlas.generateMipmaps = false;
				atlas.minFilter = atlas.magFilter = THREE.NearestFilter;
				return atlas;

			} ) );
			const productNoise = fastNoise( noiseAtlases[ 0 ], new THREE.Vector2() );
			const separateNoise = fastNoise( noiseAtlases[ 1 ], new THREE.Vector2() );
			const samplingNoise = Fn( () => {

				const value = vec4().toVar();
				If( samplingMode.equal( 2 ), () => value.assign( separateNoise ) ).Else( () => value.assign( productNoise ) );
				return value;

			} )();

			const environment = new RoomEnvironment();
			const pmremGenerator = new THREE.PMREMGenerator( renderer );

			scene.environment = pmremGenerator.fromScene( environment, 0.04 ).texture;
			scene.environmentIntensity = 1.25;
			pmremGenerator.dispose();

			// One fixed probe, captured at the initial viewer position. The room omits
			// the Steampunk Camera model and cannot sample the reflection being written.
			const cubeTarget = new THREE.CubeRenderTarget( 256, { type: THREE.HalfFloatType } );
			const cubeCamera = new THREE.CubeCamera( 0.1, 100, cubeTarget );
			cubeCamera.position.copy( camera.position );
			cubeCamera.update( renderer, environment );
			const capture = environmentSpecular( pmremTexture( cubeTarget.texture ), 1.25 );
			const fallback = query => {

				const value = capture( query );
				return vec4( value.rgb, environmentEnabled );

			};

			//

			renderPipeline = new THREE.RenderPipeline( renderer );

			// SSR reads a fallback-only source; only the final pass consumes SSR.
			const scenePass = pass( scene, camera );
			scenePass.contextNode = context( { indirectSpecularNode: indirectSpecular( [ fallback ] ) } );
			scenePass.setMRT( mrt( {
				output: vec4( output.rgb, 1 ),
				normal: vec4( packNormalToRGB( normalView ), roughness ),
				albedo: vec4( diffuseColor.rgb, metalness ),
				reflectance: vec4( specularColorBlended, specularF90 )
			} ) );

			const scenePassColor = scenePass.getTextureNode( 'output' ).toInspector( 'Color' );
			const scenePassNormal = scenePass.getTextureNode( 'normal' ).toInspector( 'Normal', ( node ) => {

				return colorSpaceToWorking( node, THREE.SRGBColorSpace );

			} );
			const scenePassDepth = scenePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => {

				return scenePass.getLinearDepthNode();

			} );
			const scenePassMetalRough = sample( uv => vec2( scenePass.getTextureNode( 'albedo' ).sample( uv ).a, scenePassNormal.sample( uv ).a ) );

			// optional: optimize bandwidth by reducing the texture precision for normals and metal/roughness

			scenePass.getTexture( 'albedo' ).type = THREE.UnsignedByteType;
			scenePass.getTexture( 'reflectance' ).type = THREE.UnsignedByteType;

			const normalTexture = scenePass.getTexture( 'normal' );
			normalTexture.type = THREE.UnsignedByteType;

			const sceneNormal = sample( ( uv ) => {

				return unpackRGBToNormal( scenePassNormal.sample( uv ).rgb ).normalize();

			} );

			//

			ssrPass = ssr( scenePassColor, scenePassDepth, sceneNormal, {
				stochastic: true,
				outputCoverage: true,
				noiseNode: samplingNoise,
				diffuseNode: scenePass.getTextureNode( 'albedo' ),
				metalnessNode: scenePassMetalRough.r,
				roughnessNode: scenePassMetalRough.g
			} ).toInspector( 'SSR (BRDF weighted)' );

			const coverage = sample( uv => ssrPass.getCoverageNode().sample( uv ).r ).toInspector( 'SSR Coverage' );
			const incoming = sample( uv => {

				const raw = ssrPass.getTextureNode().sample( uv );
				const c = ssrPass.getCoverageNode().sample( uv ).r;
				const n = sceneNormal.sample( uv );
				const v = getViewPosition( uv, scenePassDepth.sample( uv ).r, uniform( camera.projectionMatrixInverse ) ).negate().normalize();
				const f = scenePass.getTextureNode( 'reflectance' ).sample( uv );
				const modulation = EnvironmentBRDF( {
					dotNV: n.dot( v ).clamp(),
					specularColor: f.rgb,
					specularF90: f.a,
					roughness: scenePassMetalRough.sample( uv ).g
				} );
				// Undo coverage and the receiver BRDF before applying material lighting once.
				return raw.rgb.div( c.max( 1e-4 ) ).div( modulation.max( vec3( 1e-4 ) ) );

			} ).toInspector( 'SSR Incoming Radiance' );

			const screenReflection = ( { normal, viewDirection, direction, roughness: level } ) => Fn( () => {

				const baseNormal = sceneNormal.sample( screenUV ).transformDirection( cameraWorldMatrix );
				const baseRoughness = scenePassMetalRough.sample( screenUV ).g;
				const baseDirection = baseRoughness.pow4().mix( viewDirection.negate().reflect( baseNormal ), baseNormal ).normalize();
				// Other lobes (clearcoat, anisotropy, broad scattering) retain fallback.
				const matches = level.sub( baseRoughness ).abs().lessThan( 0.01 )
					.and( normal.dot( baseNormal ).greaterThan( 0.999 ) )
					.and( direction.dot( baseDirection ).greaterThan( 0.999 ) );
				return vec4( incoming.sample( screenUV ), coverage.sample( screenUV ).mul( matches ).mul( ssrEnabled ) );

			} )();

			const beautyPass = pass( scene, camera );
			beautyPass.contextNode = context( { indirectSpecularNode: indirectSpecular( [ screenReflection, fallback ] ) } );
			const views = {
				Beauty: smaa( beautyPass ),
				'Environment only': smaa( scenePassColor ),
				'SSR incoming radiance': vec4( incoming.sample( screenUV ), 1 ),
				'SSR coverage': vec4( vec3( coverage ), 1 )
			};
			renderPipeline.outputNode = views.Beauty;

			//

			controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;
			controls.update();

			window.addEventListener( 'resize', onWindowResize );

			// GUI

			const gui = renderer.inspector.createParameters( 'Settings' );
			const ssrFolder = gui.addFolder( 'SSR' );
			ssrFolder.add( params, 'sampling', samplingModes ).onChange( updateParameters );
			ssrFolder.add( params, 'quality', 0, 1 ).onChange( updateParameters );
			gui.add( params, 'view', Object.keys( views ) ).onChange( value => {

				renderPipeline.outputNode = views[ value ];
				renderPipeline.needsUpdate = true;

			} );
			gui.add( params, 'environment' ).onChange( value => environmentEnabled.value = Number( value ) );
			ssrFolder.add( params, 'maxDistance', 0, 10 ).onChange( updateParameters );
			ssrFolder.add( params, 'intensity', 0, 1 ).onChange( updateParameters );
			ssrFolder.add( params, 'thickness', 0, 0.05 ).onChange( updateParameters );
			ssrFolder.add( params, 'binaryRefine' ).name( 'binary refine' ).onChange( updateParameters );
			ssrFolder.add( params, 'enabled' ).onChange( value => ssrEnabled.value = Number( value ) );

			const modelFolder = gui.addFolder( 'Model' );
			modelFolder.add( params, 'roughness', 0, 1 ).onChange( ( value ) => {

				model?.traverse( function ( object ) {

					if ( object.material ) {

						object.material.roughness = value;

					}

				} );

			} );

			updateParameters();
			renderer.setAnimationLoop( animate );

		}

		function updateParameters() {

			samplingMode.value = samplingModes.indexOf( params.sampling );
			ssrPass.useNoiseNode.value = samplingMode.value !== 0;
			ssrPass.quality.value = params.quality;
			ssrPass.maxDistance.value = params.maxDistance;
			ssrPass.intensity.value = params.intensity;
			ssrPass.thickness.value = params.thickness;
			// build-time constant: assigning it recompiles the SSR material (setter no-ops if unchanged)
			ssrPass.binaryRefine = params.binaryRefine;

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );

		}

		function animate() {

			controls.update();

			renderPipeline.render();

		}

	</script>
</body>

</html>
