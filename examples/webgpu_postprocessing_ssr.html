		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - postprocessing - Screen Space Reflections (SSR)">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssr.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssr.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">

<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>SSR</span>
			</div>

			<small>
				Screen Space Reflections.<br />
				<a href="https://skfb.ly/6tqYD" target="_blank" rel="noopener">Steampunk Camera</a> by
				<a href="https://sketchfab.com/lumoize" target="_blank" rel="noopener">dylanheyes</a> is licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">Creative Commons Attribution</a>.
			</small>

	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.webgpu.js",
				"three/webgpu": "../build/three.webgpu.js",
				"three/tsl": "../build/three.tsl.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">

		import * as THREE from 'three/webgpu';
		import { pass, mrt, output, normalView, float, textureSize, velocity, metalness, roughness, screenUV, color, sample, packNormalToRGB, unpackRGBToNormal, vec2, vec3, vec4, Fn, If, uv, convertToTexture, uniform, context, cameraWorldMatrix, getViewPosition, diffuseColor, specularColorBlended, specularF90, EnvironmentBRDF, indirectSpecular, environmentSpecular, pmremTexture, texture, reference, } from 'three/tsl';
		import { ssr } from 'three/addons/tsl/display/SSRNode.js';
		import { screenSpaceGBuffer } from 'three/addons/tsl/display/ScreenSpaceGBufferNode.js';
		import { reprojectedRadiance } from 'three/addons/tsl/display/ReprojectedRadianceNode.js';
		import { coverageDenoise } from 'three/addons/tsl/display/CoverageDenoiseNode.js';
		import { resolveSSRHitDistance } from 'three/addons/tsl/utils/SpecularHelpers.js';
		import { fastNoise } from 'three/addons/tsl/utils/FASTNoise.js';
		import { traa } from 'three/addons/tsl/display/TRAANode.js';
		import { smaa } from 'three/addons/tsl/display/SMAANode.js';

		import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
		import { Inspector } from 'three/addons/inspector/Inspector.js';

		const params = {
			quality: 1,
			raysPerPixel: 1,
			traceSteps: 64,
			classify: true,
			output: 'Beauty',
			reflectionSource: 'Previous frame',
			antialiasing: 'TRAA',
			renderScale: 1,
			effectScale: 0.5,
			denoise: true,
			maxFrames: 16,
			radius: 3,
			historyRadius: 0,
			maxRoughness: 0.8,
			mirrorBias: 0,
			stepExponent: 2,
			maxLuminance: 35,
			screenEdgeFade: 0.1,
			sampling: 'FAST Separate',
			environment: true,
			maxDistance: 5,
			intensity: 1,
			thickness: 0.03,
			binaryRefine: true,
			roughness: 1,
			floorRoughness: 0.2,
			enabled: true
		};

		let camera, scene, model, renderer, renderPipeline, ssrPass, ssrDenoise;
		let controls, geometryPass, beautyPass, lightingHistory, traaPass, effectGuides;
		const historyValid = uniform( false );
		const useHistorySource = uniform( params.reflectionSource === 'Previous frame' );
		const previousView = uniform( new THREE.Matrix4() );
		const previousProjection = uniform( new THREE.Matrix4() );
		const previousProjectionInverse = uniform( new THREE.Matrix4() );
		const surfaceStates = new WeakMap();
		let nextSurfaceId = 1;
		const lastCameraPosition = new THREE.Vector3();
		const lastCameraQuaternion = new THREE.Quaternion();
		const lastProjection = new THREE.Matrix4();
		let cameraHistoryValid = false;
		const currentView = new THREE.Matrix4();
		const currentProjection = new THREE.Matrix4();
		const currentProjectionInverse = new THREE.Matrix4();
		const samplingModes = [ 'Original', 'FAST Product', 'FAST Separate' ];
		const samplingMode = uniform( 2, 'uint' );
		const denoiseEnabled = uniform( 1 );
		const maxRoughness = uniform( params.maxRoughness );
		const ssrStrength = uniform( params.intensity );
		const ssrEnabled = uniform( 1 );
		const environmentEnabled = uniform( 1 );

		init();

		async function init() {

			camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 50 );
			camera.position.set( 3, 2, 3 );

			scene = new THREE.Scene();
			scene.backgroundNode = screenUV.distance( .5 ).remap( 0, 0.5 ).mix( color( 0x888877 ), color( 0x776666 ) ).mul( environmentEnabled );

			const dracoLoader = new DRACOLoader().setDecoderPath( 'jsm/libs/draco/gltf/' );

			const loader = new GLTFLoader();
			loader.setDRACOLoader( dracoLoader );
			loader.load( 'models/gltf/steampunk_camera.glb', function ( gltf ) {

				model = gltf.scene;

				model.traverse( function ( object ) {

					if ( object.material ) {

						// Avoid overdrawing
						object.material.side = THREE.FrontSide;

					}

				} );

				model.position.y = 0.1;
				scene.add( model );
				resetHistory();

			} );

			// Add a reflective plane under the camera

			const floorGeometry = new THREE.CircleGeometry( 2, 64 );
			const floorMaterial = new THREE.MeshStandardMaterial( {
				color: 0xffffff,
				metalness: 1,
				roughness: params.floorRoughness
			} );
			const floor = new THREE.Mesh( floorGeometry, floorMaterial );
			floor.rotation.x = - Math.PI / 2;
			floor.position.y = - 0.8;
			scene.add( floor );

			//

			renderer = new THREE.WebGPURenderer();
			renderer.setPixelRatio( params.renderScale );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.inspector = new Inspector();
			document.body.appendChild( renderer.domElement );

			await renderer.init();

			const noiseAtlases = await Promise.all( [ 'product', 'separate05' ].map( async variant => {

				const atlas = await new THREE.TextureLoader().loadAsync( `textures/noises/fast/gauss1-ema01-${ variant }.png` );
				atlas.flipY = false;
				atlas.colorSpace = THREE.NoColorSpace;
				atlas.generateMipmaps = false;
				atlas.minFilter = atlas.magFilter = THREE.NearestFilter;
				return atlas;

			} ) );
			const productNoise = fastNoise( noiseAtlases[ 0 ], new THREE.Vector2() );
			const separateNoise = fastNoise( noiseAtlases[ 1 ], new THREE.Vector2() );
			const samplingNoise = Fn( () => {

				const value = vec4().toVar();
				If( samplingMode.equal( 2 ), () => {

					value.assign( separateNoise );

				} ).Else( () => {

					value.assign( productNoise );

				} );
				return value;

			} )();

			const environment = new RoomEnvironment();
			const pmremGenerator = new THREE.PMREMGenerator( renderer );

			scene.environment = pmremGenerator.fromScene( environment, 0.04 ).texture;
			scene.environmentIntensity = 1.25;
			pmremGenerator.dispose();

			// Capture the room and display floor from a fixed position, omitting the camera model.
			// The floor uses the original room lighting, avoiding probe feedback.
			const captureFloor = floor.clone();
			captureFloor.material = floorMaterial.clone();
			captureFloor.material.envMap = scene.environment;
			captureFloor.material.envMapIntensity = scene.environmentIntensity;
			captureFloor.position.sub( environment.position );
			environment.add( captureFloor );

			const cubeTarget = new THREE.CubeRenderTarget( 256, { type: THREE.HalfFloatType } );
			const cubeCamera = new THREE.CubeCamera( 0.1, 100, cubeTarget );
			cubeCamera.position.copy( camera.position );
			cubeCamera.update( renderer, environment );
			scene.environment = cubeTarget.texture;
			const capture = environmentSpecular( pmremTexture( cubeTarget.texture ), 1.25 );
			const fallback = query => {

				const value = capture( query );
				return vec4( value.rgb, environmentEnabled );

			};

			//

			renderPipeline = new THREE.RenderPipeline( renderer );

			// Geometry guides have their own pass so motion and HDR lighting fit
			// within the standard WebGPU color attachment limit.
			geometryPass = pass( scene, camera );
			geometryPass.contextNode = context( { indirectSpecularNode: indirectSpecular( [] ) } );
			geometryPass.setMRT( mrt( {
				output: vec4( packNormalToRGB( normalView ), roughness ),
				albedo: vec4( diffuseColor.rgb, metalness ),
				reflectance: vec4( specularColorBlended, specularF90 ),
				velocity: vec4( velocity, reference( 'userData.ssrSurfaceId', 'float' ), reference( 'userData.ssrReactive', 'float' ) )
			} ) );
			const scenePassNormal = geometryPass.getTextureNode().toInspector( 'Normal-Roughness' );
			const albedoMetalness = geometryPass.getTextureNode( 'albedo' );
			const reflectance = geometryPass.getTextureNode( 'reflectance' );
			const motion = geometryPass.getTextureNode( 'velocity' );
			geometryPass.getTexture( 'albedo' ).type = THREE.UnsignedByteType;
			geometryPass.getTexture( 'reflectance' ).type = THREE.HalfFloatType;
			const scenePassDepth = geometryPass.getTextureNode( 'depth' ).toInspector( 'Depth', () => geometryPass.getLinearDepthNode() );
			const scenePassMetalRough = sample( uv => vec2( albedoMetalness.sample( uv ).a, scenePassNormal.sample( uv ).a ) );

			// SSR reads a fallback-only source; only the final pass consumes SSR.
			const scenePass = pass( scene, camera );
			scenePass.contextNode = context( { indirectSpecularNode: indirectSpecular( [ fallback ] ) } );
			scenePass.setMRT( mrt( { output: vec4( output.rgb, 1 ) } ) );
			const scenePassColor = scenePass.getTextureNode().toInspector( 'Source Color' );

			const sceneNormal = sample( ( uv ) => {

				return unpackRGBToNormal( scenePassNormal.sample( uv ).rgb ).normalize();

			} );

			//

			effectGuides = screenSpaceGBuffer( scenePassDepth, scenePassNormal, albedoMetalness );
			effectGuides.resolutionScale = params.effectScale;
			const effectDepth = effectGuides.getTextureNode();
			const effectNormalRoughness = effectGuides.getTextureNode( 'normal' );
			const effectMaterial = effectGuides.getTextureNode( 'material' );
			const effectReflectance = sample( coordinate => reflectance.sample( effectDepth.sample( coordinate ).gb ) );
			const effectNormal = sample( coordinate => unpackRGBToNormal( effectNormalRoughness.sample( coordinate ).rgb ).normalize() );

			lightingHistory = new THREE.RenderTarget( 1, 1, { type: THREE.HalfFloatType, depthTexture: new THREE.DepthTexture() } );
			lightingHistory.depthTexture.format = scenePassDepth.value.format;
			lightingHistory.depthTexture.type = scenePassDepth.value.type;
			lightingHistory.depthTexture.minFilter = THREE.NearestFilter;
			lightingHistory.depthTexture.magFilter = THREE.NearestFilter;
			const historySource = reprojectedRadiance( texture( lightingHistory.texture ), texture( lightingHistory.depthTexture ), scenePassDepth, sceneNormal, camera, {
				previousView, previousProjection, previousProjectionInverse, valid: historyValid
			} );
			const currentTraceSource = sample( coordinate => scenePassColor.sample( effectDepth.sample( coordinate ).gb ) );
			const previousTraceSource = sample( coordinate => {

				const sourceUV = effectDepth.sample( coordinate ).gb;
				const value = historySource.sample( sourceUV );
				// This source validates static geometry; moving objects use fallback.
				return vec4( value.rgb, value.a.mul( motion.sample( sourceUV ).w.oneMinus() ) );

			} );

			ssrPass = ssr( useHistorySource.value ? previousTraceSource : currentTraceSource, effectDepth, effectNormal, {
				camera,
				stochastic: true,
				outputCoverage: true,
				traceMaskNode: effectNormalRoughness.a.lessThan( maxRoughness ),
				noiseNode: samplingNoise,
				diffuseNode: effectMaterial,
				metalnessNode: effectMaterial.a,
				specularNode: effectReflectance.rgb,
				specularF90Node: effectReflectance.a,
				hitReactiveNode: sample( coordinate => motion.sample( effectDepth.sample( coordinate ).gb ).w ),
				roughnessNode: effectNormalRoughness.a
			} ).toInspector( 'SSR (BRDF weighted)' );

			const coverage = sample( uv => {

				const level = effectNormalRoughness.sample( uv ).a;
				const roughnessFade = level.smoothstep( maxRoughness.sub( 0.1 ), maxRoughness ).oneMinus();
				return ssrPass.getCoverageNode().sample( uv ).r.mul( roughnessFade );

			} ).toInspector( 'SSR Coverage' );
			const incoming = sample( uv => {

				const raw = ssrPass.getTextureNode().sample( uv );
				const c = ssrPass.getCoverageNode().sample( uv ).r;
				const sourceUV = effectDepth.sample( uv ).gb;
				const n = effectNormal.sample( uv );
				const v = getViewPosition( sourceUV, effectDepth.sample( uv ).r, uniform( camera.projectionMatrixInverse ) ).negate().normalize();
				const f = effectReflectance.sample( uv );
				const modulation = EnvironmentBRDF( {
					dotNV: n.dot( v ).clamp(),
					specularColor: f.rgb,
					specularF90: f.a,
					roughness: effectNormalRoughness.sample( uv ).a
				} );
				// Undo coverage and the receiver BRDF before applying material lighting once.
				return raw.rgb.div( c.max( 1e-4 ) ).div( modulation.max( vec3( 1e-4 ) ) );

			} ).toInspector( 'SSR Incoming Radiance' );

			// Reconstruct conditional radiance and coverage before filling any holes.
			const sparseSSR = convertToTexture( vec4( incoming.sample( uv() ), coverage.sample( uv() ) ) );
			// Reconstruct on the SSR grid, guided by the surfaces the rays were traced from.
			const effectMotion = sample( coordinate => motion.sample( effectDepth.sample( coordinate ).gb ) );
			ssrDenoise = coverageDenoise( sparseSSR, camera, {
				depth: effectDepth,
				normal: effectNormalRoughness,
				velocity: effectMotion,
				surfaceId: sample( coordinate => effectMotion.sample( coordinate ).z ),
				// Moving receivers keep velocity-reprojected history; only moving hits reject it.
				reactive: sample( coordinate => ssrPass.getCoverageNode().sample( coordinate ).g ),
				hitDistance: sample( uv => resolveSSRHitDistance( ssrPass.getTextureNode().sample( uv ).a, coverage.sample( uv ) ) )
			} );
			const denoised = ssrDenoise.getTextureNode();
			const projectionInverse = uniform( camera.projectionMatrixInverse );

			// Joint bilateral upsampling: weight the four nearest SSR texels by
			// depth and normal similarity so reflections do not bleed across edges.
			const filtered = sample( coordinate => Fn( () => {

				const size = vec2( textureSize( effectDepth ) );
				const pixel = coordinate.mul( size ).sub( 0.5 );
				const base = pixel.floor();
				const fraction = pixel.fract();
				const viewZ = depth => getViewPosition( coordinate, depth, projectionInverse ).z;
				const z = viewZ( scenePassDepth.sample( coordinate ).r ).toConst();
				const n = sceneNormal.sample( coordinate ).toConst();
				const tolerance = z.abs().mul( 0.02 ).max( 0.001 );
				const sum = vec4( 0 ).toVar();
				const total = float( 0 ).toVar();

				for ( let y = 0; y <= 1; y ++ ) {

					for ( let x = 0; x <= 1; x ++ ) {

						const tapUV = base.add( vec2( x, y ) ).add( 0.5 ).div( size ).toConst();
						const depthWeight = viewZ( effectDepth.sample( tapUV ).r ).sub( z ).div( tolerance ).pow2().negate().exp();
						const normalWeight = effectNormal.sample( tapUV ).dot( n ).max( 0 ).pow( 8 );
						const wx = x === 0 ? fraction.x.oneMinus() : fraction.x;
						const wy = y === 0 ? fraction.y.oneMinus() : fraction.y;
						const weight = wx.mul( wy ).mul( depthWeight ).mul( normalWeight ).toConst();
						const value = denoised.sample( tapUV );
						sum.addAssign( vec4( value.rgb.mul( value.a ), value.a ).mul( weight ) );
						total.addAssign( weight );

					}

				}

				// No matching texel (thin features): fall back to plain interpolation.
				const result = denoised.sample( coordinate ).toVar();
				If( total.greaterThan( 1e-4 ), () => {

					result.assign( vec4( sum.rgb.div( sum.a.max( 1e-6 ) ), sum.a.div( total ) ) );

				} );
				return result;

			} )() );

			const screenReflection = ( { normal, viewDirection, direction, roughness: level } ) => Fn( () => {

				const baseNormal = sceneNormal.sample( screenUV ).transformDirection( cameraWorldMatrix );
				const baseRoughness = scenePassMetalRough.sample( screenUV ).g;
				const baseDirection = baseRoughness.pow4().mix( viewDirection.negate().reflect( baseNormal ), baseNormal ).normalize();
				// Other lobes (clearcoat, anisotropy, broad scattering) retain fallback.
				const matches = level.sub( baseRoughness ).abs().lessThan( 0.01 )
					.and( normal.dot( baseNormal ).greaterThan( 0.999 ) )
					.and( direction.dot( baseDirection ).greaterThan( 0.999 ) );
				const raw = vec4( incoming.sample( screenUV ), coverage.sample( screenUV ) );
				const value = denoiseEnabled.mix( raw, filtered.sample( screenUV ) );
				return vec4( value.rgb, value.a.mul( matches ).mul( ssrEnabled ).mul( ssrStrength ) );

			} )();

			beautyPass = pass( scene, camera );
			const onAfterRender = scene.onAfterRender;
			scene.onAfterRender = function ( renderer, sourceScene, sourceCamera, ...args ) {

				onAfterRender.call( this, renderer, sourceScene, sourceCamera, ...args );
				if ( sourceCamera === camera ) {

					currentView.copy( camera.matrixWorldInverse );
					currentProjection.copy( camera.projectionMatrix );
					currentProjectionInverse.copy( camera.projectionMatrixInverse );

				}

			};

			beautyPass.contextNode = context( { indirectSpecularNode: indirectSpecular( [ screenReflection, fallback ] ) } );
			const resolvedSpecular = Fn( () => {

				const normal = sceneNormal.sample( screenUV ).transformDirection( uniform( camera.matrixWorld ) );
				const level = scenePassNormal.sample( screenUV ).a;
				const view = getViewPosition( screenUV, scenePassDepth.sample( screenUV ).r, uniform( camera.projectionMatrixInverse ) ).negate().normalize().transformDirection( uniform( camera.matrixWorld ) );
				const direction = level.pow4().mix( view.negate().reflect( normal ), normal ).normalize();
				const environment = fallback( { direction, roughness: level } );
				const value = filtered.sample( screenUV );
				const weight = value.a.mul( ssrStrength ).mul( ssrEnabled );
				return vec4( value.rgb.mul( weight ).add( environment.rgb.mul( environment.a ).mul( weight.oneMinus() ) ), 1 );

			} )();
			traaPass = traa( beautyPass, scenePassDepth, motion, camera );
			traaPass.useSubpixelCorrection = false;
			const smaaPass = smaa( beautyPass );
			const views = {
				Beauty: traaPass,
				'PMREM only': smaa( scenePassColor ),
				SSR: vec4( incoming.sample( screenUV ).mul( coverage.sample( screenUV ) ).mul( ssrStrength ), 1 ),
				'SSR Filtered': vec4( filtered.sample( screenUV ).rgb.mul( filtered.sample( screenUV ).a ).mul( ssrStrength ), 1 ),
				'SSR Coverage': vec4( vec3( coverage.sample( screenUV ).mul( ssrStrength ) ), 1 ),
				'SSR Coverage Filtered': vec4( vec3( filtered.sample( screenUV ).a.mul( ssrStrength ) ), 1 ),
				'History age': vec4( vec3( ssrDenoise.getTextureNode( 'metadata' ).sample( screenUV ).r.div( ssrDenoise.maxFrames ) ), 1 ),
				'Virtual history': vec4( vec3( ssrDenoise.getTextureNode( 'metadata' ).sample( screenUV ).b ), 1 ),
				'Indirect Specular': resolvedSpecular
			};
			const updateOutput = () => {

				// Debug views must still produce the beauty lighting used next frame,
				// and run TRAA so jitter and histories match the Beauty pipeline.
				const selected = views[ params.output ];
				const traa = params.antialiasing === 'TRAA';
				renderPipeline.outputNode = ( useHistorySource.value || traa ) && params.output !== 'Beauty' ? Fn( builder => {

					( traa ? traaPass : beautyPass ).build( builder );
					return selected;

				} )() : selected;
				renderPipeline.needsUpdate = true;

			};

			updateOutput();

			//

			controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;
			controls.update();

			window.addEventListener( 'resize', onWindowResize );

			// GUI

			const gui = renderer.inspector.createParameters( 'Settings' );
			gui.add( params, 'renderScale', { '50%': 0.5, '75%': 0.75, '100%': 1 } ).name( 'Render scale' ).onChange( () => {

				renderer.setPixelRatio( params.renderScale );
				onWindowResize();
				resetHistory();

			} );
			gui.add( params, 'effectScale', { Full: 1, Half: 0.5, Quarter: 0.25 } ).name( 'SSR scale' ).onChange( updateParameters );
			gui.add( params, 'antialiasing', [ 'SMAA', 'TRAA' ] ).onChange( value => {

				views.Beauty = value === 'TRAA' ? traaPass : smaaPass;
				updateOutput();
				resetHistory();

			} );
			const ssrFolder = gui.addFolder( 'SSR' );
			ssrFolder.add( params, 'reflectionSource', [ 'Current frame', 'Previous frame' ] ).name( 'Reflection source' ).onChange( value => {

				useHistorySource.value = value === 'Previous frame';
				ssrPass.setColorNode( useHistorySource.value ? previousTraceSource : currentTraceSource );
				updateOutput();
				resetHistory();

			} );
			ssrFolder.add( params, 'denoise' ).onChange( value => {

				denoiseEnabled.value = Number( value );
				resetHistory();

			} );
			ssrFolder.add( params, 'maxFrames', 1, 32, 1 ).onChange( updateParameters );
			ssrFolder.add( params, 'radius', 0, 3 ).onChange( updateParameters );
			ssrFolder.add( params, 'historyRadius', 0, 16 ).name( 'History blur' ).onChange( updateParameters );
			ssrFolder.add( params, 'maxRoughness', 0.1, 1 ).onChange( updateParameters );
			ssrFolder.add( params, 'mirrorBias', 0, 1 ).onChange( updateParameters );
			ssrFolder.add( params, 'stepExponent', 1, 4, 1 ).onChange( updateParameters );
			ssrFolder.add( params, 'screenEdgeFade', 0, 0.5 ).onChange( updateParameters );
			ssrFolder.add( params, 'sampling', samplingModes ).onChange( updateParameters );
			ssrFolder.add( params, 'classify' ).name( 'Skip unused rays' ).onChange( updateParameters );
			ssrFolder.add( params, 'raysPerPixel', [ 1, 2, 4, 8, 16 ] ).name( 'Rays per pixel' ).onChange( updateParameters );
			ssrFolder.add( params, 'traceSteps', [ 32, 64, 128, 256, 512 ] ).name( 'Steps per ray' ).onChange( updateParameters );
			ssrFolder.add( params, 'quality', 0, 1 ).onChange( updateParameters );
			gui.add( params, 'output', Object.keys( views ) ).onChange( () => {

				updateOutput();

				resetHistory();

			} );
			gui.add( params, 'environment' ).onChange( value => {

				environmentEnabled.value = Number( value );
				scene.environmentIntensity = value ? 1.25 : 0;
				resetHistory();

			} );
			ssrFolder.add( params, 'maxDistance', 0, 10 ).onChange( updateParameters );
			ssrFolder.add( params, 'intensity', 0, 1 ).name( 'SSR strength' ).onChange( value => {

				ssrStrength.value = value;
				resetHistory();

			} );
			ssrFolder.add( params, 'thickness', 0, 0.05 ).onChange( updateParameters );
			ssrFolder.add( params, 'binaryRefine' ).name( 'binary refine' ).onChange( updateParameters );
			ssrFolder.add( params, 'enabled' ).onChange( value => {

				ssrEnabled.value = Number( value );
				resetHistory();

			} );

			gui.add( params, 'floorRoughness', 0, 1 ).name( 'Floor roughness' ).onChange( value => {

				floorMaterial.roughness = value;
				captureFloor.material.roughness = value;
				cubeCamera.update( renderer, environment );
				resetHistory();

			} );

			const modelFolder = gui.addFolder( 'Model' );
			modelFolder.add( params, 'roughness', 0, 1 ).onChange( ( value ) => {

				model?.traverse( function ( object ) {

					if ( object.material ) {

						object.material.roughness = value;

					}

				} );

			} );

			updateParameters();
			renderer.setAnimationLoop( animate );

		}

		function updateParameters() {

			samplingMode.value = samplingModes.indexOf( params.sampling );
			ssrPass.useNoiseNode.value = samplingMode.value !== 0;
			ssrPass.quality.value = params.quality;
			ssrPass.raysPerPixel.value = params.raysPerPixel;
			ssrPass.maxSteps.value = params.traceSteps;
			ssrPass.useTraceMask.value = params.classify && params.effectScale === 1;
			effectGuides.resolutionScale = params.effectScale;
			ssrPass.resolutionScale = params.effectScale;
			// Preserve the sparse ray grid until edge-aware reconstruction.
			ssrDenoise.inputNode.setResolutionScale( params.effectScale );
			ssrPass.mirrorBias.value = params.mirrorBias;
			ssrPass.stepExponent = params.stepExponent;
			ssrPass.maxLuminance.value = params.maxLuminance;
			ssrPass.screenEdgeFade.value = params.screenEdgeFade;
			maxRoughness.value = params.maxRoughness;
			ssrDenoise.maxFrames.value = params.maxFrames;
			ssrDenoise.radius.value = params.radius;
			ssrDenoise.historyRadius.value = params.historyRadius;
			resetHistory();
			ssrPass.maxDistance.value = params.maxDistance;
			// The tracer keeps physical radiance. Strength scales resolved coverage.
			ssrStrength.value = params.intensity;
			ssrPass.thickness.value = params.thickness;
			// build-time constant: assigning it recompiles the SSR material (setter no-ops if unchanged)
			ssrPass.binaryRefine = params.binaryRefine;

		}

		function resetHistory() {

			historyValid.value = false;
			ssrDenoise?.reset();
			traaPass?.setSize( 1, 1 );

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );

		}

		function updateSceneHistory() {

			scene.updateMatrixWorld();
			scene.traverse( object => {

				if ( ! object.isMesh ) return;
				const materials = Array.isArray( object.material ) ? object.material : [ object.material ];
				const materialState = materials.map( material => [ material.uuid, material.version, material.roughness, material.metalness, material.ior, material.specularIntensity, material.opacity, material.color?.getHex(), material.specularColor?.getHex() ].join( ':' ) ).join( ',' );
				const previous = surfaceStates.get( object );
				object.userData.ssrReactive = previous && previous.matrix.equals( object.matrixWorld ) ? 0 : 1;
				if ( ! previous ) {

					object.userData.ssrSurfaceId = nextSurfaceId ++;
					surfaceStates.set( object, { matrix: object.matrixWorld.clone(), materialState } );

				} else {

					if ( previous.materialState !== materialState ) resetHistory();
					previous.matrix.copy( object.matrixWorld );
					previous.materialState = materialState;

				}

			} );
			if ( cameraHistoryValid && ( camera.position.distanceTo( lastCameraPosition ) > 0.5 || camera.quaternion.angleTo( lastCameraQuaternion ) > Math.PI / 6 || ! lastProjection.equals( camera.projectionMatrix ) ) ) resetHistory();
			lastCameraPosition.copy( camera.position );
			lastCameraQuaternion.copy( camera.quaternion );
			lastProjection.copy( camera.projectionMatrix );
			cameraHistoryValid = true;

		}

		function animate() {

			controls.update();
			updateSceneHistory();

			const size = renderer.getDrawingBufferSize( new THREE.Vector2() );
			if ( lightingHistory.width !== size.x || lightingHistory.height !== size.y ) {

				lightingHistory.setSize( size.x, size.y );
				resetHistory();

			}

			renderer.initRenderTarget( lightingHistory );
			renderPipeline.render();
			// The source is previous beauty lighting, never a same-frame feedback loop.
			if ( useHistorySource.value ) {

				renderer.copyTextureToTexture( beautyPass.getTexture( 'output' ), lightingHistory.texture );
				renderer.copyTextureToTexture( geometryPass.getTexture( 'depth' ), lightingHistory.depthTexture );
				previousView.value.copy( currentView );
				previousProjection.value.copy( currentProjection );
				previousProjectionInverse.value.copy( currentProjectionInverse );
				historyValid.value = true;

			} else {

				historyValid.value = false;

			}

		}

	</script>
</body>
