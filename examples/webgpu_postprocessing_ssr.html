<!DOCTYPE html>
<html lang="en">

<head>

	<head>
		<title>three.js webgpu - postprocessing - Screen Space Reflections (SSR)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - postprocessing - Screen Space Reflections (SSR)">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssr.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssr.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>

<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>SSR</span>
			</div>

			<small>
				Screen Space Reflections.<br />
				<a href="https://skfb.ly/6tqYD" target="_blank" rel="noopener">Steampunk Camera</a> by
				<a href="https://sketchfab.com/lumoize" target="_blank" rel="noopener">dylanheyes</a> is licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">Creative Commons Attribution</a>.
			</small>
		</div>

	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.webgpu.js",
				"three/webgpu": "../build/three.webgpu.js",
				"three/tsl": "../build/three.tsl.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">

		import * as THREE from 'three/webgpu';
		import { pass, mrt, output, normalView, metalness, roughness, specularColorBlended, screenUV, color, sample, packNormalToRGB, unpackRGBToNormal, vec2, colorSpaceToWorking } from 'three/tsl';
		import { ssr } from 'three/addons/tsl/display/SSRNode.js';
		import { smaa } from 'three/addons/tsl/display/SMAANode.js';

		import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
		import { Inspector } from 'three/addons/inspector/Inspector.js';

		const models = {
			'Steampunk Camera': 'steampunk_camera.glb',
			'Primitives Floor (Color Dielectric)': 'primitives-floor-color-dielectric.glb',
			'Primitives Floor (Color Rough)': 'primitives-floor-color-rough.glb',
			'Primitives Floor (Metallic Mirror)': 'primitives-floor-metallic-mirror.glb',
			'Stripped Emissive Mirror Floor': 'stripped-emissive-mirror-floor.glb'
		};

		const params = {
			model: 'Steampunk Camera',
			quality: 0.5,
			blurQuality: 1,
			maxDistance: 0.5,
			intensity: 1,
			thickness: 0.0035,
			binaryRefine: false,
			override: false,
			roughness: 1,
			enabled: true
		};

		let camera, scene, model, renderer, renderPipeline, ssrPass;
		let controls, floor;
		let sceneScale = 1;
		const originalRoughness = new WeakMap();

		init();

		async function init() {

			camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 50 );
			camera.position.set( 3, 2, 3 );

			scene = new THREE.Scene();
			scene.backgroundNode = screenUV.distance( .5 ).remap( 0, 0.5 ).mix( color( 0x888877 ), color( 0x776666 ) );

			const dracoLoader = new DRACOLoader().setDecoderPath( 'jsm/libs/draco/gltf/' );

			const loader = new GLTFLoader();
			loader.setDRACOLoader( dracoLoader );
			// Add a reflective plane under the camera

			const floorGeometry = new THREE.CircleGeometry( 2, 64 );
			const floorMaterial = new THREE.MeshStandardMaterial( {
				color: 0xffffff,
				metalness: 1,
				roughness: 0.5
			} );
			floor = new THREE.Mesh( floorGeometry, floorMaterial );
			floor.rotation.x = - Math.PI / 2;
			floor.position.y = - 0.8;
			scene.add( floor );

			//

			renderer = new THREE.WebGPURenderer();
			// renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.inspector = new Inspector();
			document.body.appendChild( renderer.domElement );

			await renderer.init();

			const environment = new RoomEnvironment();
			const pmremGenerator = new THREE.PMREMGenerator( renderer );

			scene.environment = pmremGenerator.fromScene( environment, 0.04 ).texture;
			scene.environmentIntensity = 1.25;
			pmremGenerator.dispose();

			//

			renderPipeline = new THREE.RenderPipeline( renderer );

			const scenePass = pass( scene, camera );
			scenePass.setMRT( mrt( {
				output: output,
				normal: packNormalToRGB( normalView ),
				metalrough: vec2( metalness, roughness ), // pack metalness and roughness into a single attachment
				specular: specularColorBlended
			} ) );

			const scenePassColor = scenePass.getTextureNode( 'output' ).toInspector( 'Color' );
			const scenePassNormal = scenePass.getTextureNode( 'normal' ).toInspector( 'Normal', ( node ) => {

				return colorSpaceToWorking( node, THREE.SRGBColorSpace );

			} );
			const scenePassDepth = scenePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => {

				return scenePass.getLinearDepthNode();

			} );
			const scenePassMetalRough = scenePass.getTextureNode( 'metalrough' ).toInspector( 'Metalness-Roughness' );
			const scenePassSpecular = scenePass.getTextureNode( 'specular' ).toInspector( 'Specular Reflectance' );

			// optional: optimize bandwidth by reducing the texture precision for normals and metal/roughness

			const normalTexture = scenePass.getTexture( 'normal' );
			normalTexture.type = THREE.UnsignedByteType;

			const metalRoughTexture = scenePass.getTexture( 'metalrough' );
			metalRoughTexture.type = THREE.UnsignedByteType;

			const sceneNormal = sample( ( uv ) => {

				return unpackRGBToNormal( scenePassNormal.sample( uv ) );

			} );

			//

			ssrPass = ssr( scenePassColor, scenePassDepth, sceneNormal, {
				metalnessNode: scenePassMetalRough.r,
				specularNode: scenePassSpecular.rgb,
				reflectNonMetals: true,
				roughnessNode: scenePassMetalRough.g
			} ).toInspector( 'SSR' );

			// blend SSR over beauty (SSR outputs premultiplied color, so use additive blending)

			const outputNode = smaa( scenePassColor.add( ssrPass.rgb ) );

			renderPipeline.outputNode = outputNode;

			//

			controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;
			controls.update();

			window.addEventListener( 'resize', onWindowResize );

			// GUI

			let loadId = 0;
			let currentModel = params.model;

			async function loadModel() {

				const id = ++ loadId;
				const name = params.model;

				try {

					const gltf = await loader.loadAsync( 'models/gltf/' + models[ name ] );
					if ( id !== loadId ) {

						disposeModel( gltf.scene );
						return;

					}

					if ( model ) {

						scene.remove( model );
						disposeModel( model );

					}

					model = gltf.scene;
					updateMaterialOverrides();
					model.traverse( ( object ) => {

						if ( object.isMesh ) {

							object.castShadow = true;
							object.receiveShadow = true;

						}

						if ( object.isLight && object.shadow ) {

							object.castShadow = true;
							object.shadow.mapSize.setScalar( 1024 );
							object.shadow.normalBias = 0.02;

						}

					} );
					const isCamera = name === 'Steampunk Camera';
					floor.visible = isCamera;
					if ( isCamera ) {

						model.position.y = 0.1;
						model.traverse( ( object ) => {

							if ( object.material ) {

								if ( object.material.name === 'Lense_Casing' ) object.material.transparent = true;
								object.material.side = THREE.FrontSide;

							}

						} );

					}

					scene.add( model );
					model.updateMatrixWorld( true );
					setModelCamera( gltf );
					if ( isCamera && gltf.cameras.length === 0 ) {

						camera.fov = 35;
						camera.near = 0.1;
						camera.far = 50;
						camera.position.set( 3, 2, 3 );
						controls.target.set( 0, 0, 0 );
						camera.updateProjectionMatrix();
						controls.update();
						controls.saveState();

					}

					// Convert the scale-relative SSR controls to world units for the loaded scene.
					const bounds = new THREE.Box3().setFromObject( model );
					if ( floor.visible ) bounds.expandByObject( floor );
					sceneScale = Math.max( bounds.getSize( new THREE.Vector3() ).length(), 0.001 );
					updateParameters();
					currentModel = name;

				} catch ( error ) {

					if ( id !== loadId ) return;
					params.model = currentModel;
					console.error( 'Unable to load model:', error );

				}

			}

			await loadModel();
			renderer.setAnimationLoop( animate );

			const gui = renderer.inspector.createParameters( 'Settings' );
			gui.add( params, 'model', Object.keys( models ) ).name( 'Model' ).listen().onChange( loadModel );
			const ssrFolder = gui.addFolder( 'SSR' );
			ssrFolder.add( params, 'quality', 0, 1 ).onChange( updateParameters );
			ssrFolder.add( params, 'blurQuality', 1, 3, 1 ).onChange( updateParameters );
			ssrFolder.add( params, 'maxDistance', 0, 2 ).name( 'relative max distance' ).info( 'Fraction of the loaded scene bounding-box diagonal.' ).onChange( updateParameters );
			ssrFolder.add( params, 'intensity', 0, 1 ).onChange( updateParameters );
			ssrFolder.add( params, 'thickness', 0, 0.02 ).name( 'relative thickness' ).info( 'Hit tolerance as a fraction of the loaded scene bounding-box diagonal.' ).onChange( updateParameters );
			ssrFolder.add( params, 'binaryRefine' ).name( 'binary refine' ).onChange( updateParameters );
			ssrFolder.add( params, 'enabled' ).onChange( () => {

				if ( params.enabled === true ) {

					renderPipeline.outputNode = outputNode;

				} else {

					renderPipeline.outputNode = scenePass;

				}

				renderPipeline.needsUpdate = true;

			} );
			const overridesFolder = gui.addFolder( 'Overrides' );
			overridesFolder.add( params, 'override' ).onChange( updateMaterialOverrides );
			overridesFolder.add( params, 'roughness', 0, 1 ).name( 'floor roughness' ).onChange( updateMaterialOverrides );

			updateParameters();

		}

		function updateMaterialOverrides() {

			if ( ! model ) return;

			const target = model.getObjectByName( 'receiver-floor' ) || floor;
			target.traverse( ( object ) => {

				const materials = Array.isArray( object.material ) ? object.material : [ object.material ];
				for ( const material of materials ) {

					if ( ! material || material.roughness === undefined ) continue;
					if ( ! originalRoughness.has( material ) ) originalRoughness.set( material, material.roughness );
					material.roughness = params.override ? params.roughness : originalRoughness.get( material );

				}

			} );

		}

		function updateParameters() {

			ssrPass.quality.value = params.quality;
			// blurQuality is a build-time constant: assigning it recompiles the blur material
			// (the setter no-ops when the value is unchanged).
			ssrPass.blurQuality = params.blurQuality;
			ssrPass.maxDistance.value = params.maxDistance * sceneScale;
			ssrPass.intensity.value = params.intensity;
			ssrPass.thickness.value = params.thickness * sceneScale;
			// build-time constant: assigning it recompiles the SSR material (setter no-ops if unchanged)
			ssrPass.binaryRefine = params.binaryRefine;

		}

		function disposeModel( model ) {

			const resources = new Set();
			model.traverse( ( object ) => {

				if ( object.geometry ) resources.add( object.geometry );
				if ( object.shadow ) resources.add( object.shadow );
				const materials = Array.isArray( object.material ) ? object.material : [ object.material ];
				for ( const material of materials ) {

					if ( ! material ) continue;
					resources.add( material );
					for ( const value of Object.values( material ) ) {

						if ( value && value.isTexture ) resources.add( value );

					}

				}

			} );
			for ( const resource of resources ) resource.dispose();

		}

		function setModelCamera( gltf ) {

			const source = gltf.cameras[ 0 ];
			const bounds = new THREE.Box3().setFromObject( model );
			const center = bounds.getCenter( new THREE.Vector3() );

			// Clear any orbit damping left over from the previous scene.
			const damping = controls.enableDamping;
			controls.enableDamping = false;
			controls.update();

			if ( source ) {

				source.getWorldPosition( camera.position );
				source.getWorldQuaternion( camera.quaternion );
				camera.fov = source.fov;
				camera.near = source.near;
				camera.far = source.far;
				controls.target.copy( camera.position ).addScaledVector( camera.getWorldDirection( new THREE.Vector3() ), camera.position.distanceTo( center ) );

			} else {

				controls.target.copy( center );
				camera.position.copy( center ).add( new THREE.Vector3( 1, 0.6, 1 ).multiplyScalar( bounds.getSize( new THREE.Vector3() ).length() ) );

			}

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			controls.update();
			controls.saveState();
			controls.enableDamping = damping;

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );

		}

		function animate() {

			controls.update();

			renderPipeline.render();

		}

	</script>
</body>

</html>
