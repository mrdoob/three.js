<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - gaussian splatting</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - gaussian splatting">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_gaussian_splatting.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_gaussian_splatting.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			#info > small#license {
				top: 45px;
			}
		</style>
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Gaussian Splatting</span>
			</div>

			<small id="status">WebGPU TSL Gaussian splat renderer by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a>.</small>
			<small id="license"></small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { SPLATLoader } from 'three/addons/loaders/SPLATLoader.js';
			import { SPZLoader } from 'three/addons/loaders/SPZLoader.js';
			import { GaussianSplatMesh } from 'three/addons/objects/GaussianSplatMesh.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';

			let camera, scene, renderer, controls, splats, splatRoot;
			THREE.ColorManagement.workingColorSpace = THREE.SRGBColorSpace;

			const zeroVector = new THREE.Vector3();

			const sources = {
				millipede: {
					name: 'Millipede (SPLAT)',
					url: './models/splat/millipede.splat',
					loader: SPLATLoader,
					rotation: new THREE.Euler( - Math.PI * - 1.10, Math.PI * - 0.10, Math.PI * 0.15 ),
					cameraPosition: new THREE.Vector3( 0, 0.4, 1 ),
					credit: {
						author: 'Fabian Plum',
						authorUrl: 'https://superspl.at/user?id=scant3d',
						source: 'https://superspl.at/scene/3d5482d4',
						license: 'CC Attribution',
						licenseUrl: 'http://creativecommons.org/licenses/by/4.0/'
					}
				},
				lion: {
					name: 'Lion (SPZ)',
					url: './models/spz/lion.v3.spz',
					loader: SPZLoader,
					rotation: new THREE.Euler( Math.PI, 0, 0 ),
					cameraPosition: new THREE.Vector3( 0, 0.2, 1 ),
					credit: {
						author: 'Renaud',
						authorUrl: 'https://superspl.at/user?id=rohls',
						source: 'https://superspl.at/scene/56155c3f',
						license: 'CC Attribution',
						licenseUrl: 'http://creativecommons.org/licenses/by/4.0/'
					}
				},
				tomatoes: {
					name: 'Tomatoes (SPZ v4)',
					url: './models/spz/tomatoes.v4.spz',
					loader: SPZLoader,
					cameraPosition: new THREE.Vector3( 0, 0.35, 1 ),
					credit: {
						author: 'Grail',
						authorUrl: 'https://superspl.at/user/grail',
						source: 'https://superspl.at/scene/2826d2c0',
						license: 'CC Attribution',
						licenseUrl: 'http://creativecommons.org/licenses/by/4.0/'
					}
				}
			};
			const sourceNames = Object.values( sources ).map( ( source ) => source.name );
			const params = {
				source: sources.lion.name
			};

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.01, 100 );
				camera.position.set( 0, 0.35, 3.2 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x07080f );

				renderer = new THREE.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.minDistance = 1.2;
				controls.maxDistance = 8;
				controls.target.set( 0, 0, 0 );
				controls.update();

				const gui = renderer.inspector.createParameters( 'Building' );
				gui.add( params, 'source', sourceNames ).name( 'Splat' ).onChange( async ( value ) => {

					await loadSplatSource( getSourceKeyByName( value ) );

				} );

				await loadSplatSource( getSourceKeyByName( params.source ) );

				window.addEventListener( 'resize', onWindowResize );

			}

			async function loadSplatSource( sourceKey ) {

				const source = sources[ sourceKey ];
				const splatData = await new source.loader().loadAsync( source.url );

				disposeCurrentSplats();

				splats = new GaussianSplatMesh( splatData, { autoSort: false } );
				splatRoot = splats;

				if ( source.rotation !== undefined ) splatRoot.rotation.copy( source.rotation );

				scene.add( splatRoot );

				fitCameraToSplats( splats, source );

				updateLicenseInfo( source );

			}

			function updateLicenseInfo( source ) {

				const license = document.getElementById( 'license' );
				const credit = source.credit;

				if ( credit === undefined ) {

					license.innerHTML = '';
					return;

				}

				license.innerHTML = 'Model by <a href="' + credit.authorUrl + '" target="_blank" rel="noopener">' + credit.author + '</a>, ' +
					'via <a href="' + credit.source + '" target="_blank" rel="noopener">superspl.at</a>. ' +
					'Licensed under <a href="' + credit.licenseUrl + '" target="_blank" rel="noopener">' + credit.license + '</a>.';

			}

			function getSourceKeyByName( sourceName ) {

				return Object.keys( sources ).find( ( key ) => sources[ key ].name === sourceName );

			}

			function disposeCurrentSplats() {

				if ( splatRoot === undefined ) return;

				scene.remove( splatRoot );
				splats.geometry.dispose();
				splats.material.dispose();
				splats = undefined;
				splatRoot = undefined;

			}

			function fitCameraToSplats( mesh, source ) {

				mesh.updateWorldMatrix( true, false );

				const sphere = mesh.splatGeometry.boundingSphere.clone().applyMatrix4( mesh.matrixWorld );
				const radius = Math.max( sphere.radius, 0.01 );
				const distance = radius / Math.sin( THREE.MathUtils.degToRad( camera.fov ) * 0.5 );

				controls.minDistance = source.minDistance || radius * 1.1;
				controls.maxDistance = source.maxDistance || radius * 8;
				controls.target.copy( sphere.center ).add( source.cameraTarget || zeroVector );
				camera.position.copy( source.cameraPosition ).normalize().multiplyScalar( distance * 1.15 ).add( sphere.center );
				camera.near = Math.max( distance / 1000, 0.001 );
				camera.far = Math.max( distance * 10, 10 );

				camera.updateProjectionMatrix();
				controls.update();

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				controls.update();

				if ( splats !== undefined ) {

					splats.updateSort( renderer, camera );

				}

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
