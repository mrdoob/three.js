<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - adaptive subdivision</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - adaptive subdivision">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_tsl_adaptive_subdivision.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_tsl_adaptive_subdivision.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Adaptive Subdivision</span>
			</div>

			<small>
				Crack-free adaptive subdivision on the GPU with triplanar displacement maps, using<br/>
				longest edge bisection on <a href="https://onrendering.com/data/papers/cbt/ConcurrentBinaryTrees.pdf" target="_blank" rel="noopener">Concurrent Binary Trees</a>.<br/>
				Textures from <a href="https://polyhaven.com" target="_blank" rel="noopener">Poly Haven</a>.<br/>
				<span id="stats"></span><br/>
				<span id="telemetry"></span>
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { Fn, abs, color, dFdx, dFdy, float, fwidth, hue, ivec2, log2, luminance, max, min, mix, normalLocal, positionLocal, pow, screenCoordinate, select, smoothstep, texture, textureLoad, transformNormalToView, uniform, vec2, vec3, vec4 } from 'three/tsl';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { CSMShadowNode } from 'three/addons/csm/CSMShadowNode.js';
			import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';
			import { SkyMesh } from 'three/addons/objects/SkyMesh.js';
			import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
			import { AdaptiveSubdivisionMesh } from 'three/addons/objects/AdaptiveSubdivisionMesh.js';

			import WebGPU from 'three/addons/capabilities/WebGPU.js';

			if ( WebGPU.isAvailable() === false ) {

				document.body.appendChild( WebGPU.getErrorMessage() );

				throw new Error( 'No WebGPU support' );

			}

			let camera, scene, renderer, controls;
			let meshes, normalMappedMeshes, light, statsElement, telemetryElement;

			const params = {
				adaptive: true,
				displacement: 1.5,
				targetEdgePixels: 8,
				maxErrorPixels: 0.5,
				shadowDetail: 0,
				morphing: true,
				morphTime: 0,
				wireframe: false,
				debugColors: 'none',
				frustumCulling: true,
				backfaceCulling: true,
				freeze: false,
				shadows: true,
				pixelRatio: window.devicePixelRatio
			};

			// where the time of a frame goes: the CPU time of the updates and the render, averaged over frames, and the GPU
			// time of the subdivision updates, the shadow maps and the scene from the inspector, where the browser supports
			// GPU timestamps

			const telemetry = { cpu: { total: 0, subdivision: 0, render: 0 }, gpu: null };

			class TelemetryInspector extends Inspector {

				resolveFrame( frame ) {

					super.resolveFrame( frame );

					const gpu = { subdivision: 0, shadows: 0, scene: 0 };

					for ( const stats of frame.children ) {

						const time = this.getStatsData( stats.cid ).gpu;

						if ( stats.isComputeStats ) {

							gpu.subdivision += time;

						} else {

							// the shadow maps are rendered within the scene

							const shadowMaps = stats.children.filter( ( child ) => child.name.startsWith( 'Shadow Map' ) );
							const shadows = shadowMaps.reduce( ( sum, child ) => sum + this.getStatsData( child.cid ).gpu, 0 );

							gpu.shadows += shadows;
							gpu.scene += time - shadows;

						}

					}

					telemetry.gpu = gpu;

				}

			}

			const wireframe = uniform( 0 );
			const debugColors = uniform( 0 ); // 0: none, 1: subdivision depth, 2: triangle size
			const targetEdgePixels = uniform( params.targetEdgePixels );
			const displacementScale = uniform( params.displacement );

			// the world: ruins on a plateau, a path winding up to them from a valley and a ridge with cliffs behind. the
			// shapes are generated on the CPU from noise and kept coarse, the detail comes from the displacement maps

			const random = mulberry32( 5 );
			const noise = new SimplexNoise( { random } );

			const PLATEAU_HEIGHT = 3;
			const PATH_WIDTH = 2.2;
			const TERRAIN_SIZE = 180;
			const BLEND_SHARPNESS = 0.08; // the height range over which texture layers blend, see createSubdivisionMesh()
			const WIREFRAME_COLOR = color( 0x40d0ff );
			const WIREFRAME_OPACITY = 0.7; // the triangles are only a few pixels large, so opaque lines would hide the surface

			// the path, with its height following the ground smoothly up to the plateau

			const path = new THREE.CatmullRomCurve3( [
				[ - 24, 40 ], [ - 18, 27 ], [ - 6, 19 ], [ 7, 15 ], [ 9, 9 ], [ 3, 6 ], [ 0, 3.5 ], [ 0, 1 ]
			].map( ( [ x, z ] ) => new THREE.Vector3( x, 0, z ) ) ).getSpacedPoints( 100 );

			const pathBounds = new THREE.Box3().setFromPoints( path ).expandByScalar( PATH_WIDTH * 2 );

			for ( const point of path ) point.y = plateauHeight( point.x, point.z );

			for ( let pass = 0; pass < 4; pass ++ ) {

				const heights = path.map( ( point ) => point.y );

				path.forEach( ( point, i ) => {

					let sum = 0;

					for ( let k = - 6; k <= 6; k ++ ) sum += heights[ THREE.MathUtils.clamp( i + k, 0, path.length - 1 ) ];

					point.y = sum / 13;

				} );

			}

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.05, 400 );
				camera.position.set( - 7, 6.5, 20 );

				scene = new THREE.Scene();
				scene.fog = new THREE.FogExp2( 0xc4d2de, 0.006 );

				// a low sun from the left of the view, raking across the displaced relief

				const sun = new THREE.Vector3().setFromSphericalCoords( 1, THREE.MathUtils.degToRad( 90 - 28 ), THREE.MathUtils.degToRad( - 70 ) );

				const sky = new SkyMesh();
				sky.scale.setScalar( 1000 );
				sky.turbidity.value = 4;
				sky.rayleigh.value = 1.5;
				sky.mieDirectionalG.value = 0.85;
				sky.sunPosition.value.copy( sun );
				scene.add( sky );

				scene.add( new THREE.HemisphereLight( 0xc6dcf2, 0x6b5a45, 1.5 ) );

				// cascaded shadow maps cover the whole view

				light = new THREE.DirectionalLight( 0xffe2c4, 3.5 );
				light.position.copy( sun ).multiplyScalar( 100 );
				light.castShadow = true;
				light.shadow.mapSize.set( 2048, 2048 );
				light.shadow.camera.near = 1;
				light.shadow.camera.far = 400;
				light.shadow.shadowNode = new CSMShadowNode( light, { cascades: 3, maxFar: 120, lightMargin: 80 } );
				scene.add( light );

				// renderer

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 0.8;
				renderer.shadowMap.enabled = true;
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				// CC0 texture sets from Poly Haven. size: the physical size of a texture tile, depth: the range of the
				// displacement, in meters, patch size: that of the meshes using the set, see bakeErrorPyramid().
				// the rock scan is a reddish sandstone: its luminance is tinted with the mean color of the wall (in linear
				// space, the wall's mean color divided by the rock's mean luminance), so the rocks match the grey stone

				const textureSets = await Promise.all( [
					loadTextureSet( 'coast_sand_rocks_02', 4, 0.08, 4 ),
					loadTextureSet( 'cobblestone_floor_08', 2, 0.08, 4 ),
					loadTextureSet( 'japanese_stone_wall', 1.9, 0.14, 4 ),
					loadTextureSet( 'rock_face_03', 2, 0.21, 4, new THREE.Color( 1.32, 1.22, 1.05 ) )
				] );

				const [ grass, cobblestone, stoneWall, rock ] = textureSets;

				// the terrain blends three layers: grass, rock on steep slopes and cobblestones along the path and in the
				// ruins, painted into a mask texture. grass and cobblestones are projected from the top, rock with triplanar
				// mapping

				const terrainMaskTexture = createTerrainMask();

				const terrainMask = ( position ) => {

					const { x: cobble, y: rock } = texture( terrainMaskTexture, position.xz.div( TERRAIN_SIZE ).add( 0.5 ) ).level( 0 );

					return vec3( float( 1 ).sub( cobble ).sub( rock ), rock, cobble );

				};

				const boulders = [
					[ 6.5, 5, 0.6 ], [ - 7, 4.5, 0.9 ], [ - 9.5, - 3, 0.5 ], [ 12, 13, 1.1 ], [ - 2.5, 13, 0.7 ], [ - 12.5, 22, 1.2 ],
					[ 3.5, 19.5, 0.5 ], [ - 19.5, 31, 0.9 ], [ 11, - 7, 0.8 ], [ - 6, - 9.5, 1 ], [ 2, - 8.5, 0.45 ], [ 15, 3, 0.7 ],
					[ - 15, 9, 1.3 ], [ 9, 23, 0.9 ], [ - 26, 36, 1.4 ], [ 0.5, 27, 0.6 ]
				];

				const outcrops = [
					[ - 12, - 18, 3.5 ], [ 4, - 21, 4 ], [ 17, - 15, 3 ], [ - 27, - 11, 4.5 ], [ 25, 9, 3 ], [ - 29, 17, 3.5 ]
				];

				// one mesh per material, as each leaf draws its own patch size, so near and far objects can share a mesh

				const rockGeometry = mergeGeometries( [ createRockGeometry( boulders, 3 ), createRockGeometry( outcrops, 5 ) ] );

				const parts = [
					[ createTerrainGeometry(), createSurface( [ { set: grass }, { set: rock, triplanar: true, scale: 1 / 3, depth: 0.35 }, { set: cobblestone } ], terrainMask ) ],
					[ createRuinsGeometry(), createSurface( [ { set: stoneWall, triplanar: true } ], null ) ],
					[ rockGeometry, createSurface( [ { set: rock, triplanar: true } ], null ) ]
				];

				// the subdivision meshes, and the same meshes normal mapped without subdivision to compare

				meshes = parts.map( ( [ geometry, surface ] ) => createSubdivisionMesh( geometry, surface ) );

				[ 'Terrain', 'Ruins', 'Rocks' ].forEach( ( name, i ) => meshes[ i ].name = name );

				normalMappedMeshes = parts.map( ( [ geometry, surface ] ) => createNormalMappedMesh( geometry, surface ) );

				scene.add( ...meshes, ...normalMappedMeshes );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0.5, 3.4, 0 );
				controls.minDistance = 0.3;
				controls.maxDistance = 80;
				controls.maxPolarAngle = Math.PI * 0.6;
				controls.screenSpacePanning = false;
				controls.enableDamping = true;
				controls.update();

				statsElement = document.getElementById( 'stats' );
				telemetryElement = document.getElementById( 'telemetry' );

				// the shaders are compiled in parallel before the first frame, instead of one after the other when first used.
				// the rocks have the same shaders as the ruins, so they compile after them and find them compiled

				const [ terrain, ruins, rocks ] = meshes;

				await Promise.all( [
					renderer.compileAsync( scene, camera ),
					terrain.compileAsync( renderer ),
					ruins.compileAsync( renderer ).then( () => rocks.compileAsync( renderer ) )
				] );

				// the inspector is attached after compiling, which would report the shadow nodes to it outside of a frame

				renderer.inspector = new TelemetryInspector();

				// gui

				const gui = renderer.inspector.createParameters( 'Adaptive Subdivision' );
				gui.add( params, 'adaptive' ).name( 'Adaptive Displacement' ).onChange( v => {

					for ( const mesh of meshes ) mesh.visible = v;
					for ( const mesh of normalMappedMeshes ) mesh.visible = ! v;

				} );
				gui.add( params, 'displacement', 0, 3 ).name( 'Displacement' ).onChange( v => displacementScale.value = v );
				gui.add( params, 'targetEdgePixels', 2, 32, 1 ).name( 'Target Edge (px)' ).onChange( v => targetEdgePixels.value = v );
				gui.add( params, 'maxErrorPixels', 0, 4 ).name( 'Max Error (px)' );
				gui.add( params, 'morphTime', 0, 0.5, 0.01 ).name( 'Transition Time (s)' );
				gui.add( params, 'shadowDetail', 0, 1 ).name( 'Shadowmap Detail' );
				gui.add( params, 'morphing' ).name( 'Smooth Transitions' );
				gui.add( params, 'frustumCulling' ).name( 'Frustum Culling' );
				gui.add( params, 'backfaceCulling' ).name( 'Backface Culling' );
				gui.add( params, 'freeze' ).name( 'Freeze Subdivision' );
				gui.add( params, 'wireframe' ).name( 'Wireframe' ).onChange( v => wireframe.value = v ? 1 : 0 );
				gui.add( params, 'debugColors', { 'None': 'none', 'Subdivision Depth': 'depth', 'Triangle Size': 'size' } ).name( 'Debug Colors' ).onChange( v => debugColors.value = [ 'none', 'depth', 'size' ].indexOf( v ) );

				// switching off the shadows and lowering the resolution shows what they cost, also without GPU timestamps

				const ratio = window.devicePixelRatio;

				gui.add( params, 'shadows' ).name( 'Shadows' ).onChange( v => light.castShadow = v );
				gui.add( params, 'pixelRatio', { [ `Device (${ ratio }x)` ]: ratio, 'Half': ratio / 2, 'Quarter': ratio / 4 } ).name( 'Resolution' ).onChange( v => renderer.setPixelRatio( v ) );


				updateStats();

				// the window may have been resized while loading

				onWindowResize();

				// the relief maps are baked by the first frame, as rendering starts the animation loop of the renderer

				renderer.setAnimationLoop( () => {

					for ( const set of textureSets ) set.bake();

					renderer.setAnimationLoop( animate );

					animate();

				} );

				window.addEventListener( 'resize', onWindowResize );

			}

			async function loadTextureSet( name, size, depth, patchSize, tint = null ) {

				const loader = new THREE.TextureLoader();

				const load = async ( type, colorSpace ) => {

					const map = await loader.loadAsync( `textures/polyhaven/${ name }_${ type }_1k.jpg` );
					map.wrapS = map.wrapT = THREE.RepeatWrapping;
					map.colorSpace = colorSpace;
					map.anisotropy = 8;

					return map;

				};

				const [ colorMap, heightMap ] = await Promise.all( [
					load( 'diff', THREE.SRGBColorSpace ),
					load( 'disp', THREE.NoColorSpace )
				] );

				const { reliefMap, bake } = createReliefMap( heightMap, patchSize );

				return { colorMap, reliefMap, bake, patchSize, size: heightMap.image.width, scale: 1 / size, depth, tint };

			}

			// a one time preprocess of a height map into a relief map: the height in r and its gradient in g and b, in height
			// units per texture repeat. the gradient is smoothed over 3x3 texels (Sobel), so the 8-bit heights do not show up
			// as noise, and its mipmaps are exact as the mean of gradients is the gradient of the mean height. a holds how
			// far the triangles of a leaf deviate from the heights, see bakeErrorPyramid(). the relief map can be used right
			// away, and is baked later

			function createReliefMap( heightMap, patchSize ) {

				const { width, height } = heightMap.image;

				const renderTarget = new THREE.RenderTarget( width, height, {
					type: THREE.HalfFloatType,
					generateMipmaps: true,
					minFilter: THREE.LinearMipmapLinearFilter,
					wrapS: THREE.RepeatWrapping,
					wrapT: THREE.RepeatWrapping,
					depthBuffer: false
				} );

				const material = new THREE.NodeMaterial();

				material.fragmentNode = Fn( () => {

					const size = ivec2( width, height );
					const texel = ivec2( screenCoordinate.xy );
					const h = ( x, y ) => textureLoad( heightMap, texel.add( ivec2( x, y ) ).add( size ).mod( size ) ).x;

					const gradientX = h( 1, - 1 ).add( h( 1, 0 ).mul( 2 ) ).add( h( 1, 1 ) ).sub( h( - 1, - 1 ) ).sub( h( - 1, 0 ).mul( 2 ) ).sub( h( - 1, 1 ) );
					const gradientY = h( - 1, 1 ).add( h( 0, 1 ).mul( 2 ) ).add( h( 1, 1 ) ).sub( h( - 1, - 1 ) ).sub( h( 0, - 1 ).mul( 2 ) ).sub( h( 1, - 1 ) );

					// the Sobel response to a slope of one per texel is eight

					return vec4( h( 0, 0 ), gradientX.mul( width / 8 ), gradientY.mul( height / 8 ), 0 );

				} )();

				const bake = () => {

					renderer.setRenderTarget( renderTarget );
					new THREE.QuadMesh( material ).render( renderer );
					renderer.setRenderTarget( null );

					material.dispose();
					heightMap.dispose();

					bakeErrorPyramid( renderTarget.texture, patchSize );

				};

				return { reliefMap: renderTarget.texture, bake };

			}

			// the error pyramid in a: mip level m holds the mean squared difference between the heights and their linear
			// interpolation between texels 2^( m - k ) apart, over blocks of 2^m texels, which are the leaves of patches with
			// 2^k segments per edge. so a single lookup tells how far the triangles of a leaf deviate from the heights. the
			// interpolation is approximated by the bilinearly filtered mip level of the spacing

			function bakeErrorPyramid( reliefMap, patchSize ) {

				const { width, height } = reliefMap.image;
				const levelCount = Math.log2( Math.max( width, height ) ) + 1;
				const k = Math.log2( patchSize );

				// the squared differences at full resolution, averaged by the mipmaps

				const differenceTarget = new THREE.RenderTarget( width, height, {
					type: THREE.HalfFloatType,
					generateMipmaps: true,
					minFilter: THREE.LinearMipmapLinearFilter,
					depthBuffer: false
				} );

				const spacing = uniform( 0 );
				const differenceMaterial = new THREE.NodeMaterial();

				differenceMaterial.fragmentNode = Fn( () => {

					const uv = screenCoordinate.xy.div( vec2( width, height ) );
					const difference = textureLoad( reliefMap, ivec2( screenCoordinate.xy ) ).x.sub( texture( reliefMap, uv ).level( spacing ).x );

					return vec4( difference.mul( difference ), 0, 0, 1 );

				} )();

				// a level of the relief map with the mean squared differences in a, copied into the relief map

				const level = uniform( 0, 'int' );
				const levelMaterial = new THREE.NodeMaterial();

				levelMaterial.fragmentNode = Fn( () => {

					const texel = ivec2( screenCoordinate.xy );

					return vec4( textureLoad( reliefMap, texel, level ).xyz, textureLoad( differenceTarget.texture, texel, level ).x );

				} )();

				const differenceQuad = new THREE.QuadMesh( differenceMaterial );
				const levelQuad = new THREE.QuadMesh( levelMaterial );

				for ( let m = k; m < levelCount; m ++ ) {

					spacing.value = m - k;

					renderer.setRenderTarget( differenceTarget );
					differenceQuad.render( renderer );

					const levelTarget = new THREE.RenderTarget( Math.max( width >> m, 1 ), Math.max( height >> m, 1 ), { type: THREE.HalfFloatType, depthBuffer: false } );

					level.value = m;

					renderer.setRenderTarget( levelTarget );
					levelQuad.render( renderer );

					renderer.copyTextureToTexture( levelTarget.texture, reliefMap, null, null, 0, m );

					levelTarget.dispose();

				}

				renderer.setRenderTarget( null );

				differenceTarget.dispose();
				differenceMaterial.dispose();
				levelMaterial.dispose();

			}

			// a surface displaced by one or more texture layers, which can override the scale and depth of their texture set.
			// with several layers, mask( position ) returns their weights, which are sharpened by the heights so the stones of
			// the higher layer poke through where they blend. all inputs of the displacement are the same for vertices shared
			// by neighboring triangles, so the blended surface is crack-free too

			function createSurface( layerSets, mask ) {

				// the relief maps of all layers are baked for the patch size of the meshes, see bakeErrorPyramid()

				const patchSize = layerSets[ 0 ].set.patchSize;

				// the scale, depth and tint of a layer are uniforms, so surfaces with the same kinds of layers have the same
				// shaders, which compile once, see AdaptiveSubdivisionMesh.compileAsync(). untinted layers keep their saturation

				const layers = layerSets.map( ( { set, triplanar = false, ...overrides } ) => {

					const layer = { ...set, ...overrides, triplanar };

					layer.scaleNode = uniform( layer.scale );
					layer.texelScaleNode = uniform( layer.scale * layer.size ); // texels per meter
					layer.depthNode = uniform( layer.depth );
					layer.saturationNode = uniform( layer.tint === null ? 1 : 0 );
					layer.tintNode = uniform( layer.tint === null ? new THREE.Color( 1, 1, 1 ) : layer.tint );

					return layer;

				} );

				const sum = ( values ) => values.reduce( ( a, b ) => a.add( b ) );

				// samples a layer from the top or with triplanar mapping

				const project = ( layer, sample, position, normal ) => {

					const p = position.mul( layer.scaleNode );

					return layer.triplanar ? triplanar( sample, p, normal ) : sample( p.xz );

				};

				// the relief of a layer: the height in [ 0, 1 ] and its gradient in local space, at the given mip level or
				// with automatic mip levels in fragment shaders. the gradients of the projections are mapped back to the
				// axes they project, the change of the blend weights along the surface is ignored

				const relief = ( layer, position, normal, level = null ) => {

					const sample = ( uv ) => level === null ? texture( layer.reliefMap, uv ) : texture( layer.reliefMap, uv ).level( level );
					const p = position.mul( layer.scaleNode );

					if ( layer.triplanar === false ) {

						const y = sample( p.xz );

						return { height: y.x, gradient: vec3( y.y, 0, y.z ).mul( layer.scaleNode ) };

					}

					const weights = triplanarWeights( normal );
					const x = sample( p.zy ), y = sample( p.xz ), z = sample( p.xy );

					return {
						height: x.x.mul( weights.x ).add( y.x.mul( weights.y ) ).add( z.x.mul( weights.z ) ),
						gradient: vec3( 0, x.z, x.y ).mul( weights.x ).add( vec3( y.y, 0, y.z ).mul( weights.y ) ).add( vec3( z.y, z.z, 0 ).mul( weights.z ) ).mul( layer.scaleNode )
					};

				};

				// the mip level is picked from the footprint, the size of the rendered triangles or of the pixels for the normals

				const mipLevel = ( layer, footprint ) => max( log2( footprint.mul( layer.texelScaleNode ) ), 0 );

				const reliefs = ( position, normal, footprint ) => layers.map( ( layer ) => relief( layer, position, normal, footprint !== null ? mipLevel( layer, footprint ) : null ) );

				// the weights of the layers: a layer wins where its height plus its mask weight is the highest

				const blend = ( position, normal, heights ) => {

					if ( layers.length === 1 ) return [ float( 1 ) ];

					const s = vec3( ...heights ).add( mask( position ).mul( 1 + BLEND_SHARPNESS ) );
					const b = s.sub( max( s.x, s.y, s.z ).sub( BLEND_SHARPNESS ) ).max( 0 );
					const weights = b.div( b.x.add( b.y ).add( b.z ) );

					return [ weights.x, weights.y, weights.z ];

				};

				// the height around the mean, times the depth

				const displacement = ( { position, normal, footprint } ) => {

					const r = reliefs( position, normal, footprint );
					const weights = blend( position, normal, r.map( ( { height } ) => height ) );

					return sum( layers.map( ( layer, i ) => r[ i ].height.sub( 0.5 ).mul( weights[ i ] ).mul( layer.depthNode ) ) ).mul( displacementScale );

				};

				// its gradient, much cheaper than finite differences

				const displacementGradient = ( { position, normal, footprint } ) => {

					const r = reliefs( position, normal, footprint );
					const weights = blend( position, normal, r.map( ( { height } ) => height ) );

					return sum( layers.map( ( layer, i ) => r[ i ].gradient.mul( weights[ i ] ).mul( layer.depthNode ) ) ).mul( displacementScale );

				};

				// how far the triangles of a leaf deviate from the heights sampled with the footprint: the error at their size
				// minus the error at the footprint, below which the triangles do not need to follow the heights. weighted by
