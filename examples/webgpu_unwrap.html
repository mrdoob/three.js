<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - UV unwrap</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			#status { position: absolute; bottom: 20px; left: 20px; color: white; white-space: pre-wrap; pointer-events: none; }
			#atlas { position: absolute; bottom: 150px; left: 20px; width: 240px; height: 240px; background: #080c12; pointer-events: none; }
		</style>
	</head>
	<body>
		<div id="info"><a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a> / native UV unwrap<br>
			Density: green = target, yellow = 1.414x deviation, red = 2x or greater (either direction).
		</div>
		<p id="status">Loading renderer...</p>
		<canvas id="atlas" width="512" height="512"></canvas>
		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>
		<script type="module">
			import * as THREE from 'three/webgpu';
			import { Fn, color, mix, positionWorld, uniform, uv } from 'three/tsl';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
			import { UVUnwrapper } from 'three/addons/utils/UVUnwrapper.js';

			const status = document.getElementById( 'status' );
			const scene = new THREE.Scene();
			scene.background = new THREE.Color( 0x303b4b );
			const camera = new THREE.PerspectiveCamera( 45, innerWidth / innerHeight, 0.01, 10000 );
			const renderer = new THREE.WebGPURenderer( { antialias: true } );
			renderer.inspector = new Inspector();
			renderer.setPixelRatio( devicePixelRatio );
			renderer.setSize( innerWidth, innerHeight );
			document.body.appendChild( renderer.domElement );
			const controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;
			scene.add( new THREE.HemisphereLight( 0xffffff, 0x667788, 3 ) );
			const light = new THREE.DirectionalLight( 0xffffff, 3 );
			light.position.set( 3, 5, 4 );
			scene.add( light );

			const checkerCanvas = document.createElement( 'canvas' );
			checkerCanvas.width = checkerCanvas.height = 1024;
			const ctx = checkerCanvas.getContext( '2d' );
			for ( let y = 0; y < 32; y ++ ) {

				for ( let x = 0; x < 32; x ++ ) {

					ctx.fillStyle = ( x + y ) % 2 ? '#e8edf7' : '#2559a0';
					ctx.fillRect( x * 32, y * 32, 32, 32 );
					ctx.fillStyle = '#e09028';
					ctx.fillRect( x * 32, y * 32, 2, 32 );
					ctx.fillRect( x * 32, y * 32, 32, 2 );

				}

			}

			const checkerTexture = new THREE.CanvasTexture( checkerCanvas );
			checkerTexture.channel = 1;
			checkerTexture.colorSpace = THREE.SRGBColorSpace;
			const previewMaterial = new THREE.MeshStandardMaterial( { map: checkerTexture, roughness: 0.8, side: THREE.DoubleSide } );
			const atlasSize = uniform( 2048 );
			const densityTarget = uniform( 1 );
			const densityMaterial = new THREE.MeshBasicNodeMaterial( { side: THREE.DoubleSide, toneMapped: false } );
			densityMaterial.colorNode = Fn( () => {

				const dx = positionWorld.dFdx(), dy = positionWorld.dFdy();
				const texel = uv( 1 ).mul( atlasSize );
				const tx = texel.dFdx(), ty = texel.dFdy();
				const normal = dx.cross( dy );
				const areaSquared = normal.dot( normal ).max( 1e-30 );
				const a = dy.cross( normal ).div( areaSquared );
				const b = normal.cross( dx ).div( areaSquared );
				const gradientU = a.mul( tx.x ).add( b.mul( ty.x ) );
				const gradientV = a.mul( tx.y ).add( b.mul( ty.y ) );
				// Singular values measure density along both principal surface directions.
				const trace = gradientU.dot( gradientU ).add( gradientV.dot( gradientV ) );
				const cross = gradientU.cross( gradientV );
				const determinant = cross.dot( cross );
				const largest = trace.add( trace.mul( trace ).sub( determinant.mul( 4 ) ).max( 0 ).sqrt() ).mul( 0.5 );
				const smallest = determinant.div( largest.max( 1e-30 ) );
				const ratio = largest.sqrt().div( densityTarget ).max( densityTarget.div( smallest.max( 1e-30 ).sqrt() ) ).max( 1 );
				const deviation = ratio.log2().clamp( 0, 1 );
				const green = color( '#28d45c' ), yellow = color( '#ffe030' ), red = color( '#ef3028' );
				return mix( mix( green, yellow, deviation.mul( 2 ).clamp( 0, 1 ) ), red, deviation.mul( 2 ).sub( 1 ).clamp( 0, 1 ) );

			} )();
			const params = {
				model: 'boxes', mode: 'lightmap', resolution: 2048, useInputUVs: false,
				view: 'checker', referenceDensity: 0, showAtlas: true,
				unwrap: unwrapAndReport
			};
			const gui = renderer.inspector.createParameters( 'UV unwrap' );
			gui.add( params, 'model', {
				'Scaled boxes': 'boxes', 'Damaged Helmet': 'DamagedHelmet/glTF/DamagedHelmet.gltf',
				'Soldier': 'Soldier.glb', 'Xbot': 'Xbot.glb', 'Lee Perry Smith': 'LeePerrySmith/LeePerrySmith.glb',
				'Space ship hallway': 'space_ship_hallway.glb'
			} ).name( 'Model' ).listen().onChange( value => loadModel( value ).catch( reportError ) );
			gui.add( params, 'mode', { 'Lightmap': 'lightmap', 'Normal bake': 'normal' } ).name( 'Method' ).listen().onChange( params.unwrap );
			gui.add( params, 'resolution', [ 1024, 2048, 4096 ] ).name( 'Atlas size' ).listen().onChange( params.unwrap );
			gui.add( params, 'useInputUVs' ).name( 'Preserve authored islands' ).listen().onChange( params.unwrap );
			gui.add( params, 'unwrap' ).name( 'Unwrap again' );
			gui.add( params, 'view', { 'UV checker': 'checker', 'Texel density': 'density', 'Original materials': 'original' } ).name( 'View' ).onChange( updateMaterials );
			gui.add( params, 'referenceDensity' ).name( 'Target texels / unit' ).info( '0 uses the fitted atlas density. Both principal directions are compared with this target.' ).onChange( updateMaterials );
			gui.add( params, 'showAtlas' ).name( 'Show atlas' ).onChange( updateAtlasVisibility );
			const draco = new DRACOLoader().setDecoderPath( 'jsm/libs/draco/gltf/' );
			const loader = new GLTFLoader().setDRACOLoader( draco );
			const unwrapper = new UVUnwrapper();
			let root, originals = [], result, loadId = 0;

			function updateAtlasVisibility() {

				document.getElementById( 'atlas' ).hidden = ! params.showAtlas;

			}

			function updateMaterials() {

				if ( result ) densityTarget.value = params.referenceDensity > 0 ? params.referenceDensity : result.texelsPerUnit;
				for ( const item of originals ) item.mesh.material = params.view === 'checker' ? previewMaterial : params.view === 'density' ? densityMaterial : item.material;

			}

			function unwrap() {

				if ( ! root ) return;
				status.textContent = 'Unwrapping…';
				for ( const item of originals ) {

					if ( item.mesh.geometry !== item.geometry ) item.mesh.geometry.dispose();
					item.mesh.geometry = item.geometry;

				}

				try {

					result = unwrapper.unwrap( root, {
						mode: params.mode,
						useInputUVs: params.useInputUVs,
						resolution: Number( params.resolution ), diagnostics: true
					} );
					atlasSize.value = result.width;
					const s = result.diagnostics.statistics;
					status.textContent = `${ s.triangles.toLocaleString() } triangles / ${ s.charts } charts\n${ s.totalMilliseconds.toFixed( 1 ) } ms / ${ ( s.utilization * 100 ).toFixed( 1 ) }% triangle coverage\n${ result.texelsPerUnit.toFixed( 2 ) } texels/world unit\nLocal density ${ s.minTexelsPerUnit.toFixed( 2 ) }–${ s.maxTexelsPerUnit.toFixed( 2 ) }\nWorst stretch ${ s.maxStretch.toFixed( 3 ) }\n${ s.degenerateTriangles } degenerate triangles`;
					drawAtlas();
					updateMaterials();

				} catch ( error ) {

					result = null;
					const canvas = document.getElementById( 'atlas' );
					canvas.getContext( '2d' ).clearRect( 0, 0, canvas.width, canvas.height );
					for ( const item of originals ) item.mesh.material = item.material;
					status.textContent = error.message;
					throw error;

				}

			}

			function drawAtlas() {

				const canvas = document.getElementById( 'atlas' ), context = canvas.getContext( '2d' );
				context.clearRect( 0, 0, canvas.width, canvas.height );
				for ( const record of result.meshes ) {

					const geometry = record.geometry, uv = geometry.attributes.uv1, index = geometry.index;
					for ( let face = 0; face < record.faceCharts.length; face ++ ) {

						const chart = record.faceCharts[ face ];
						if ( chart < 0 ) continue;
						context.fillStyle = `hsl(${ chart * 137.508 % 360 },65%,60%)`;
						context.beginPath();
						for ( let j = 0; j < 3; j ++ ) {

							const v = index.getX( face * 3 + j ), x = uv.getX( v ) * canvas.width, y = ( 1 - uv.getY( v ) ) * canvas.height;
							if ( j === 0 ) context.moveTo( x, y ); else context.lineTo( x, y );

						}

						context.closePath();
						context.fill();

					}

				}

			}

			async function loadModel( name ) {

				params.model = name;
				const id = ++ loadId;
				status.textContent = 'Loading model…';
				let loaded;
				if ( name === 'boxes' ) {

					loaded = new THREE.Group();
					const geometry = new THREE.BoxGeometry();
					for ( let i = 0; i < 8; i ++ ) {

						const mesh = new THREE.Mesh( geometry, new THREE.MeshStandardMaterial() );
						mesh.position.set( ( i % 4 ) * 1.8, 0, Math.floor( i / 4 ) * 2 );
						mesh.scale.set( 0.5 + i * 0.1, 0.7 + i * 0.2, 1 );
						mesh.rotation.y = i * 0.3;
						loaded.add( mesh );

					}

				} else {

					loaded = ( await loader.loadAsync( `models/gltf/${ name }` ) ).scene;

				}

				if ( id !== loadId ) {

					disposeModel( loaded );
					return;

				}

				if ( root ) {

					scene.remove( root );
					for ( const item of originals ) {

						item.mesh.material = item.material;
						item.geometry.dispose();

					}

					disposeModel( root );

				}

				root = loaded;
				originals = [];
				root.traverse( mesh => {

					if ( mesh.isMesh ) originals.push( { mesh, geometry: mesh.geometry, material: mesh.material } );

				} );
				scene.add( root );
				const box = new THREE.Box3().setFromObject( root ), center = box.getCenter( new THREE.Vector3() );
				const size = box.getSize( new THREE.Vector3() ).length();
				controls.target.copy( center );
				camera.position.copy( center ).add( new THREE.Vector3( size * 0.65, size * 0.35, size * 0.9 ) );
				camera.near = Math.max( size / 10000, 0.001 );
				camera.far = Math.max( size * 100, 10 );
				camera.updateProjectionMatrix();
				controls.update();
				unwrap();
				return result;

			}

			function disposeModel( object ) {

				object.traverse( mesh => {

					if ( ! mesh.isMesh ) return;
					mesh.geometry.dispose();
					for ( const material of [].concat( mesh.material ) ) {

						for ( const value of Object.values( material ) ) if ( value && value.isTexture ) value.dispose();
						material.dispose();

					}

				} );

			}

			function unwrapAndReport() {

				try {

					unwrap();

				} catch ( error ) {

					reportError( error );

				}

			}

			function reportError( error ) {

				status.textContent = error.message;
				console.error( error );

			}

			window.addEventListener( 'resize', () => {

				camera.aspect = innerWidth / innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( innerWidth, innerHeight );

			} );
			renderer.init().then( () => {

				renderer.setAnimationLoop( animate );
				return loadModel( 'boxes' );

			} ).catch( reportError );
			function animate() {

				controls.update();
				renderer.render( scene, camera );

			}
		</script>
	</body>
</html>
