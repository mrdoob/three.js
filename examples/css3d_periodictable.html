<!DOCTYPE html>
<html>
<head>
	<title>Interactive Periodic Table</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<style>
		html, body {
			margin: 0;
			height: 100%;
			background: #000;
			overflow: hidden;
			font-family: Helvetica, sans-serif;
		}
		a { color: #8ff; }

		#info {
			position: absolute;
			top: 10px;
			width: 100%;
			text-align: center;
			color: #8ff;
			font-size: 13px;
			z-index: 5;
		}

		#menu {
			position: absolute;
			bottom: 20px;
			width: 100%;
			text-align: center;
			z-index: 5;
		}

		#loading {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			color: #8ff;
			font-size: 18px;
			z-index: 10;
		}

		#legend {
			position: absolute;
			top: 10px;
			right: 20px;
			color: #ccc;
			font-size: 12px;
			text-align: right;
			z-index: 5;
		}
		#legend span { display: inline-block; width: 12px; height: 12px; margin-left: 6px; vertical-align: middle; }

		.element {
			width: 120px;
			height: 160px;
			box-shadow: 0px 0px 12px rgba(0,255,255,0.5);
			border: 1px solid rgba(127,255,255,0.25);
			font-family: Helvetica, sans-serif;
			text-align: center;
			line-height: normal;
			cursor: pointer;
		}
		.element:hover {
			box-shadow: 0px 0px 12px rgba(0,255,255,0.9);
			border: 1px solid rgba(255,255,255,0.9);
		}
		.element .number {
			position: absolute;
			top: 8px;
			right: 10px;
			font-size: 11px;
			color: rgba(255,255,255,0.6);
		}
		.element .symbol {
			position: absolute;
			top: 34px;
			left: 0px;
			right: 0px;
			font-size: 44px;
			font-weight: bold;
			color: rgba(255,255,255,0.9);
			text-shadow: 0 0 10px rgba(0,0,0,0.6);
		}
		.element .details {
			position: absolute;
			bottom: 10px;
			left: 6px;
			right: 6px;
			font-size: 11px;
			color: rgba(255,255,255,0.85);
			line-height: 1.3;
		}

		button {
			color: rgba(127,255,255,0.75);
			background: transparent;
			outline: 1px solid rgba(127,255,255,0.75);
			border: 0px;
			padding: 6px 14px;
			margin: 0 3px;
			cursor: pointer;
			font-size: 13px;
		}
		button:hover { background-color: rgba(0,255,255,0.3); }
		button:active { color: #000; background-color: rgba(0,255,255,0.75); }

		#detailPanel {
			position: absolute;
			left: 20px;
			top: 60px;
			width: 220px;
			background: rgba(0,10,15,0.85);
			border: 1px solid rgba(127,255,255,0.4);
			border-radius: 6px;
			padding: 14px;
			color: #cff;
			font-size: 13px;
			display: none;
			z-index: 6;
		}
		#detailPanel img {
			width: 100%;
			border-radius: 4px;
			margin-bottom: 8px;
			border: 3px solid #888;
		}
		#detailPanel h3 { margin: 0 0 4px 0; font-size: 16px; color: #fff; }
		#detailPanel .role { color: #9ee; margin-bottom: 6px; }
		#detailPanel .worth { font-weight: bold; }
	</style>
</head>
<body>

	<div id="info">Interactive Periodic Table &mdash; click a tile for details</div>
	<div id="loading">Loading data from Google Sheet…</div>
	<div id="legend">
		Net worth &nbsp;
		<span style="background:#e74c3c"></span> &lt;$100K &nbsp;
		<span style="background:#e67e22"></span> $100K&ndash;$200K &nbsp;
		<span style="background:#2ecc71"></span> &gt;$200K
	</div>

	<div id="container"></div>

	<div id="detailPanel">
		<img id="dpImg" src="" alt="">
		<h3 id="dpName"></h3>
		<div class="role" id="dpRole"></div>
		<div class="worth" id="dpWorth"></div>
	</div>

	<div id="menu">
		<button id="table">TABLE</button>
		<button id="sphere">SPHERE</button>
		<button id="helix">HELIX</button>
		<button id="grid">GRID</button>
		<button id="logout" style="margin-left:20px;">SIGN OUT</button>
	</div>

	<script type="importmap">
	{
		"imports": {
			"three": "https://unpkg.com/three@0.170.0/build/three.module.js",
			"three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
		}
	}
	</script>

	<!-- Edit these values for your own Google Cloud project / Sheet -->
	<script>
		window.APP_CONFIG = {
			// Same OAuth client ID used on login.html
			GOOGLE_CLIENT_ID: 'YOUR_CLIENT_ID.apps.googleusercontent.com',

			// The ID from your Google Sheet's URL:
			// https://docs.google.com/spreadsheets/d/SPREADSHEET_ID/edit
			SPREADSHEET_ID: 'YOUR_SPREADSHEET_ID',

			// Range: adjust sheet name / row range to match your data.
			// Expected columns, left to right: Symbol, Name, Role, NetWorth, PhotoURL
			SHEET_RANGE: 'Sheet1!A2:E119',

			// A Google Sheets API key (enable "Google Sheets API" in Cloud Console,
			// then Credentials -> Create Credentials -> API key).
			// Only works if the sheet is shared as "Anyone with the link – Viewer".
			API_KEY: 'YOUR_SHEETS_API_KEY'
		};
	</script>

	<script type="module">
		import * as THREE from 'three';
		import TWEEN from 'three/addons/libs/tween.module.js';
		import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
		import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

		const CONFIG = window.APP_CONFIG;

		// ---------- 0. Auth guard ----------
		// Require a Google sign-in (from login.html) before showing the table.
		const idToken = sessionStorage.getItem('googleIdToken');
		if (!idToken) {
			window.location.href = 'login.html';
		}

		document.getElementById('logout').addEventListener('click', () => {
			sessionStorage.removeItem('googleIdToken');
			sessionStorage.removeItem('googleUser');
			window.location.href = 'login.html';
		});

		// ---------- 1. Element grid positions ----------
		// These (group, period) coordinates reproduce the classic periodic-table
		// shape (20 columns x 10 rows including the lanthanide/actinide rows),
		// same layout as the three.js demo. Row order below must match the
		// row order of your Google Sheet data (one sheet row per tile).
		const positions = [
			[1,1],[18,1],
			[1,2],[2,2],[13,2],[14,2],[15,2],[16,2],[17,2],[18,2],
			[1,3],[2,3],[13,3],[14,3],[15,3],[16,3],[17,3],[18,3],
			[1,4],[2,4],[3,4],[4,4],[5,4],[6,4],[7,4],[8,4],[9,4],[10,4],[11,4],[12,4],[13,4],[14,4],[15,4],[16,4],[17,4],[18,4],
			[1,5],[2,5],[3,5],[4,5],[5,5],[6,5],[7,5],[8,5],[9,5],[10,5],[11,5],[12,5],[13,5],[14,5],[15,5],[16,5],[17,5],[18,5],
			[1,6],[2,6],
			[4,9],[5,9],[6,9],[7,9],[8,9],[9,9],[10,9],[11,9],[12,9],[13,9],[14,9],[15,9],[16,9],[17,9],[18,9],
			[4,6],[5,6],[6,6],[7,6],[8,6],[9,6],[10,6],[11,6],[12,6],[13,6],[14,6],[15,6],[16,6],[17,6],[18,6],
			[1,7],[2,7],
			[4,10],[5,10],[6,10],[7,10],[8,10],[9,10],[10,10],[11,10],[12,10],[13,10],[14,10],[15,10],[16,10],[17,10],[18,10],
			[4,7],[5,7],[6,7],[7,7],[8,7],[9,7],[10,7],[11,7],[12,7],[13,7],[14,7],[15,7],[16,7],[17,7],[18,7]
		];

		// Fallback sample data so the page still renders if the Sheets fetch
		// fails (e.g. credentials not filled in yet) — replace with your own
		// data or just wire up the Sheet and delete this.
		const sampleRow = () => ({
			symbol: '??', name: 'Sample Person', role: 'Role', netWorth: 50000, photo: ''
		});

		// ---------- 2. Fetch data from Google Sheets ----------
		async function fetchSheetData() {
			const { SPREADSHEET_ID, SHEET_RANGE, API_KEY } = CONFIG;
			const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(SHEET_RANGE)}?key=${API_KEY}`;

			try {
				const res = await fetch(url);
				if (!res.ok) throw new Error(`Sheets API error: ${res.status}`);
				const data = await res.json();
				const rows = data.values || [];

				return rows.map(r => ({
					symbol: r[0] || '',
					name: r[1] || '',
					role: r[2] || '',
					netWorth: parseFloat(String(r[3]).replace(/[^0-9.-]/g, '')) || 0,
					photo: r[4] || ''
				}));
			} catch (err) {
				console.error('Could not load Google Sheet data, using sample data instead.', err);
				return positions.map(() => sampleRow());
			}
		}

		// ---------- 3. Color by net worth ----------
		function colorForNetWorth(nw) {
			if (nw > 200000) return '#2ecc71';   // green
			if (nw > 100000) return '#e67e22';   // orange
			return '#e74c3c';                    // red (<100K)
		}

		// ---------- 4. Build the scene once data is loaded ----------
		let camera, scene, renderer, controls;
		const objects = [];
		const targets = { table: [], sphere: [], helix: [], grid: [] };

		fetchSheetData().then(people => {
			document.getElementById('loading').style.display = 'none';
			init(people);
			animate();
		});

		function init(people) {
			camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
			camera.position.z = 3000;

			scene = new THREE.Scene();

			const count = Math.min(people.length, positions.length);

			// --- TABLE layout (20 x 10) ---
			for (let i = 0; i < count; i++) {
				const person = people[i];
				const [group, period] = positions[i];

				const element = document.createElement('div');
				element.className = 'element';
				element.style.backgroundColor = hexToRgba(colorForNetWorth(person.netWorth), 0.55);

				const number = document.createElement('div');
				number.className = 'number';
				number.textContent = i + 1;
				element.appendChild(number);

				const symbol = document.createElement('div');
				symbol.className = 'symbol';
				symbol.textContent = person.symbol;
				element.appendChild(symbol);

				const details = document.createElement('div');
				details.className = 'details';
				details.innerHTML = person.name + '<br>' + person.role;
				element.appendChild(details);

				element.addEventListener('click', () => showDetail(person));

				const objectCSS = new CSS3DObject(element);
				objectCSS.position.x = Math.random() * 4000 - 2000;
				objectCSS.position.y = Math.random() * 4000 - 2000;
				objectCSS.position.z = Math.random() * 4000 - 2000;
				scene.add(objectCSS);
				objects.push(objectCSS);

				const tableTarget = new THREE.Object3D();
				tableTarget.position.x = (group * 140) - 1330;
				tableTarget.position.y = -(period * 180) + 990;
				targets.table.push(tableTarget);
			}

			// --- SPHERE layout ---
			const vector = new THREE.Vector3();
			for (let i = 0, l = objects.length; i < l; i++) {
				const phi = Math.acos(-1 + (2 * i) / l);
				const theta = Math.sqrt(l * Math.PI) * phi;
				const object = new THREE.Object3D();
				object.position.setFromSphericalCoords(800, phi, theta);
				vector.copy(object.position).multiplyScalar(2);
				object.lookAt(vector);
				targets.sphere.push(object);
			}

			// --- DOUBLE HELIX layout ---
			// Pairs of tiles share the same height (rung) but sit on opposite
			// sides of the cylinder (theta offset by PI), like DNA base pairs.
			for (let i = 0, l = objects.length; i < l; i++) {
				const rung = Math.floor(i / 2);
				const strandOffset = (i % 2) * Math.PI;
				const theta = rung * 0.35 + Math.PI + strandOffset;
				const y = -(rung * 16) + 450;

				const object = new THREE.Object3D();
				object.position.setFromCylindricalCoords(900, theta, y);
				vector.x = object.position.x * 2;
				vector.y = object.position.y;
				vector.z = object.position.z * 2;
				object.lookAt(vector);
				targets.helix.push(object);
			}

			// --- GRID layout (5 x 4 x 10) ---
			for (let i = 0; i < objects.length; i++) {
				const object = new THREE.Object3D();
				object.position.x = ((i % 5) * 400) - 800;              // 5 columns
				object.position.y = -((Math.floor(i / 5) % 4) * 400) + 600; // 4 rows
				object.position.z = (Math.floor(i / 20) * 1000) - 4500; // up to 10 layers deep
				targets.grid.push(object);
			}

			// --- Renderer / controls ---
			renderer = new CSS3DRenderer();
			renderer.setSize(window.innerWidth, window.innerHeight);
			document.getElementById('container').appendChild(renderer.domElement);

			controls = new TrackballControls(camera, renderer.domElement);
			controls.minDistance = 500;
			controls.maxDistance = 6000;
			controls.addEventListener('change', render);

			document.getElementById('table').addEventListener('click', () => transform(targets.table, 2000));
			document.getElementById('sphere').addEventListener('click', () => transform(targets.sphere, 2000));
			document.getElementById('helix').addEventListener('click', () => transform(targets.helix, 2000));
			document.getElementById('grid').addEventListener('click', () => transform(targets.grid, 2000));

			transform(targets.table, 2000);

			window.addEventListener('resize', onWindowResize);
		}

		function showDetail(person) {
			const panel = document.getElementById('detailPanel');
			document.getElementById('dpImg').src = person.photo || 'https://placehold.co/200x200?text=No+Photo';
			document.getElementById('dpImg').style.borderColor = colorForNetWorth(person.netWorth);
			document.getElementById('dpName').textContent = person.name;
			document.getElementById('dpRole').textContent = person.role;
			document.getElementById('dpWorth').textContent = 'Net worth: $' + person.netWorth.toLocaleString();
			document.getElementById('dpWorth').style.color = colorForNetWorth(person.netWorth);
			panel.style.display = 'block';
		}

		function hexToRgba(hex, alpha) {
			const r = parseInt(hex.slice(1, 3), 16);
			const g = parseInt(hex.slice(3, 5), 16);
			const b = parseInt(hex.slice(5, 7), 16);
			return `rgba(${r},${g},${b},${alpha})`;
		}

		function transform(targetList, duration) {
			TWEEN.removeAll();
			for (let i = 0; i < objects.length; i++) {
				const object = objects[i];
				const target = targetList[i];

				new TWEEN.Tween(object.position)
					.to({ x: target.position.x, y: target.position.y, z: target.position.z }, Math.random() * duration + duration)
					.easing(TWEEN.Easing.Exponential.InOut)
					.start();

				new TWEEN.Tween(object.rotation)
					.to({ x: target.rotation.x, y: target.rotation.y, z: target.rotation.z }, Math.random() * duration + duration)
					.easing(TWEEN.Easing.Exponential.InOut)
					.start();
			}

			new TWEEN.Tween({})
				.to({}, duration * 2)
				.onUpdate(render)
				.start();
		}

		function onWindowResize() {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
			render();
		}

		function animate() {
			requestAnimationFrame(animate);
			TWEEN.update();
			controls.update();
		}

		function render() {
			renderer.render(scene, camera);
		}
	</script>
</body>
</html>
