<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - light baking</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - light baking">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_lightmap_baking.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_lightmap_baking.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Light Baking</span>
			</div>

			<small>Bake Stochastic Radiosity, Ray Radiosity (<a href="https://github.com/gkjohnson/three-mesh-bvh" target="_blank" rel="noopener">three-mesh-bvh</a>), Light Probe or VXGI into denoised directional light maps of these scenes or your own glTF, and export KHR_lightmap, unlit or vertex color glTF.<br/><span id="status"></span><span id="warning" style="display: block; color: #ffc040;"></span><span id="credit"></span></small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/",
					"three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/src/index.js",
					"three-mesh-bvh/webgpu": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/src/webgpu/index.js"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { attribute, builtinGIContext, cameraProjectionMatrix, color, float, ivec2, mix, modelViewMatrix, normalWorld, pass, passTexture, positionGeometry, positionWorld, screenCoordinate, texture, toneMappingExposure, uniform, varying, vec4 } from 'three/tsl';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { LightBaker } from 'three/addons/lighting/LightBaker.js';
			import { LightProbeGrid } from 'three/addons/lighting/LightProbeGrid.js';
			import { VertexLightBaker, vertexIrradiance } from 'three/addons/lighting/VertexLightBaker.js';
			import { lightProbeGridIrradiance } from 'three/addons/tsl/lighting/LightProbeGridNode.js';
			import { instancedLightMap } from 'three/addons/tsl/lighting/DirectionalLightMapNode.js';
			import { ReflectionProbes } from 'three/addons/lighting/ReflectionProbes.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { DRACOLoader, DRACO_GLTF_CONFIG } from 'three/addons/loaders/DRACOLoader.js';
			import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
			import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
			import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';

			let camera, scene, renderer, controls, renderPipeline;
			let world, meshes, materials, status, warning, credit;
			let lightBaker, bakedPass, livePass, liveOutput;
			let busy = false, bakePending = false, bakeController = null, bakeId = 0;
			let dynamicObjects, dynamicTime = 0, dynamicMaterialKey = '', frameTime = 0;
			let capture = null, captureBakeId = - 1, previewBakeId = - 1, captureStatus = '';
			let vertexPass, vertexGI = null, vertexControls = [], wireframe = null;
			let gltfLoader = null, sceneControl, gltfFolder, uv1Control;

			const worlds = {};

			// the scenes and their loaders

			const scenes = { 'Cornell Box': createCornellBox, 'Ball Pool': createBallPool, 'Courtyard': loadCourtyard, 'Sponza': loadSponza, 'Littlest Tokyo': loadLittlestTokyo };

			// stochastic radiosity converges in fewer samples with more directions per sample, desktop GPUs
			// render them at almost no extra cost, but they take memory and more time per sample on phones

			const params = {
				scene: 'Cornell Box',
				output: 'Baked GI',
				algorithm: 'Stochastic Radiosity',
				resolution: 1024,
				pageSize: 2048,
				directions: window.matchMedia( '(pointer: coarse)' ).matches ? 16 : 64,
				dynamicObject: true,
				reflections: true,
				vertexBudget: 500000,
				wireframe: false,
				vertexStep: 0,
				directLight: 'Live',
				directionalLightMap: true,
				lightMapSpecular: true,
				exportFormat: 'KHR_lightmap 16-bit',
				bakeToneMapping: true,
				denoise: true,
				stitchSeams: true,
				keepUV1: false,
				sky: 'venice_sunset_1k.hdr',
				sun: true,
				sunElevation: 50,
				sunAzimuth: 30,
				sunIntensity: 3,
				exposure: 1
			};

			// the algorithms of LightBaker. It stops the bake once the estimated noise of the light map drops
			// below a tolerance, or after a maximum of samples per algorithm, and bakes several cheap samples
			// of the stochastic radiosity per frame

			const algorithms = { 'Stochastic Radiosity': 'stochastic', 'Ray Radiosity': 'ray', 'Light Probe': 'probes', 'VXGI': 'vxgi' };

			// KHR_lightmap needs a loader that supports it, the unlit and emissive formats show the baked
			// light in any glTF viewer

			const exportFormats = {
				'KHR_lightmap 16-bit': { format: 'KHR_lightmap', bitDepth: 16 },
				'KHR_lightmap 8-bit': { format: 'KHR_lightmap', bitDepth: 8 },
				'Unlit (atlas)': { format: 'unlit' },
				'Unlit (vertex colors)': { format: 'unlit-vertex' },
				'Emissive (atlas)': { format: 'emissive' }
			};

			// skies for your own glTF files without lights of their own. Small bright suns in a sky converge slowly
			// with the stochastic radiosity, the sun light of these skies is soft

			const skies = [ 'venice_sunset_1k.hdr', 'blouberg_sunrise_2_1k.hdr', 'None' ];

			// Live GI evaluates the irradiance per pixel and frame, this averages the frames while the view
			// is still, so the noisy irradiance of the stochastic algorithms converges like the bake

			class FrameAccumulationNode extends THREE.Node {

				constructor( textureNode, maxFrames = 1024 ) {

					super( 'vec4' );

					this.textureNode = textureNode;
					this.maxFrames = maxFrames;
					this.frames = 0;

					this._target = new THREE.RenderTarget( 1, 1, { type: THREE.HalfFloatType, depthBuffer: false } );
					this._history = new THREE.RenderTarget( 1, 1, { type: THREE.HalfFloatType, depthBuffer: false } );
					this._historyNode = texture( this._history.texture );
					this._outputNode = passTexture( this, this._target.texture );
					this._weight = uniform( 1 );
					this._quad = new THREE.QuadMesh( new THREE.NodeMaterial() );

					this.updateBeforeType = THREE.NodeUpdateType.FRAME;

				}

				reset() {

					this.frames = 0;

				}

				updateBefore( { renderer } ) {

					const size = renderer.getDrawingBufferSize( new THREE.Vector2() );

					if ( size.x !== this._target.width || size.y !== this._target.height ) {

						this._target.setSize( size.x, size.y );
						this._history.setSize( size.x, size.y );
						this.frames = 0;

					}

					// running mean, an exponential average after the last frame

					this._weight.value = 1 / Math.min( this.frames + 1, this.maxFrames );
					this._historyNode.value = this._history.texture;
					this._outputNode.value = this._target.texture;

					const renderTarget = renderer.getRenderTarget();
					renderer.setRenderTarget( this._target );
					this._quad.render( renderer );
					renderer.setRenderTarget( renderTarget );

					[ this._target, this._history ] = [ this._history, this._target ];
					this.frames ++;

				}

				setup() {

					const coord = ivec2( screenCoordinate );

					this._quad.material.fragmentNode = mix( this._historyNode.load( coord ), this.textureNode.load( coord ), this._weight );

					return this._outputNode;

				}

				dispose() {

					this._target.dispose();
					this._history.dispose();
					this._quad.material.dispose();

				}

			}

			init();

			async function init() {

				// Camera

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );

				// Scene

				scene = new THREE.Scene();

				// Renderer. The ray traced radiosity can need more storage buffers per shader stage than the default
				// eight, e.g. for a sky, lights and emissive meshes together

				const adapter = await navigator.gpu?.requestAdapter();
				const requiredLimits = adapter ? { maxStorageBuffersPerShaderStage: adapter.limits.maxStorageBuffersPerShaderStage } : {};

				renderer = new THREE.WebGPURenderer( { antialias: true, requiredLimits } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();
				if ( renderer.backend.isWebGPUBackend !== true ) throw new Error( 'This example requires WebGPU.' );

				// Controls

				controls = new OrbitControls( camera, renderer.domElement );
				controls.addEventListener( 'change', () => liveOutput?.reset() );

				// "Baked GI" shows the light map while it accumulates,
				// "Live GI" evaluates the raw irradiance per pixel every frame

				renderPipeline = new THREE.RenderPipeline( renderer );
				bakedPass = pass( scene, camera );

				// "Vertex GI" shows the irradiance fitted to the vertices instead of the light map

				vertexPass = pass( scene, camera );
				vertexPass.contextNode = builtinGIContext( float( 1 ), vertexIrradiance() );

				status = document.getElementById( 'status' );
				warning = document.getElementById( 'warning' );
				credit = document.getElementById( 'credit' );

				// the light baker unwraps the light map UVs, sets up the GI source, bakes, denoises and stitches
				// the light maps, assigns them to the materials and exports them

				lightBaker = new LightBaker( renderer );

				dynamicObjects = createDynamicObjects();
				scene.add( ...dynamicObjects );

				await setScene();

				// GUI

				// the scene, the output and the algorithm, the other settings in folders

				const gui = renderer.inspector.createParameters( 'Light Baking' );
				sceneControl = gui.add( params, 'scene', Object.keys( scenes ) ).name( 'Scene' ).onChange( setScene );
				gui.add( { openGLTF }, 'openGLTF' ).name( 'Open glTF…' ).info( 'or drop a .glb, or a .gltf with its files, onto the page' );
				gui.add( params, 'output', [ 'Baked GI', 'Live GI', 'Vertex GI' ] ).name( 'Output' ).onChange( setOutput );
				gui.add( params, 'algorithm', Object.keys( algorithms ) ).name( 'GI Algorithm' ).onChange( bake );
				gui.add( { bake }, 'bake' ).name( 'Re-Bake GI' );

				const lightMapFolder = gui.addFolder( 'Light Map' ).close();
				lightMapFolder.add( params, 'resolution', [ 256, 1024, 2048, 4096 ] ).name( 'Resolution' ).listen().onChange( bake );
				lightMapFolder.add( params, 'pageSize', [ 1024, 2048, 4096 ] ).name( 'Max Page Size' ).listen().onChange( bake );
				lightMapFolder.add( params, 'directLight', [ 'Live', 'Baked' ] ).name( 'Direct Light' ).onChange( bake );
				lightMapFolder.add( params, 'directions', [ 16, 64, 144 ] ).name( 'Stochastic Directions' ).onChange( () => params.algorithm === 'Stochastic Radiosity' && bake() );
				lightMapFolder.add( params, 'denoise' ).name( 'Denoise' ).onChange( setDenoise );
				lightMapFolder.add( params, 'stitchSeams' ).name( 'Stitch Seams' ).onChange( () => {

					lightBaker.stitchSeams = params.stitchSeams;
					lightBaker.process();

				} );
				lightMapFolder.add( params, 'directionalLightMap' ).name( 'Directional' ).onChange( () => params.directionalLightMap && lightBaker.lightMapper.directionTexture === null ? bake() : applyLightMaps() );
				lightMapFolder.add( params, 'lightMapSpecular' ).name( 'Specular' ).onChange( applyLightMaps );

				const probesFolder = gui.addFolder( 'Probes' ).close();
				probesFolder.add( params, 'dynamicObject' ).name( 'Dynamic Objects' ).info( 'a sphere and a knot that light probes light' ).onChange( () => liveOutput.reset() );
				probesFolder.add( params, 'reflections' ).name( 'Reflections' ).onChange( () => liveOutput.reset() );

				// Vertex GI can show the edges, colored by the refinement step that created them, and every step of
				// the refinement with its fit

				const vertexFolder = gui.addFolder( 'Vertex GI' ).close();
				vertexFolder.add( params, 'vertexBudget', [ 100000, 500000, 2000000 ] ).name( 'Vertex Budget' ).onChange( () => {

					resetVertexGI();
					showOutput();

				} );
				vertexControls = [
					vertexFolder.add( params, 'wireframe' ).name( 'Wireframe' ).info( 'gray: original edges, blue to orange: later refinement steps' ).listen().onChange( showOutput ),
					vertexFolder.add( params, 'vertexStep', 0, 1, 1 ).name( 'Refinement Step' ).listen().onChange( showOutput )
				];

				const exportFolder = gui.addFolder( 'Export' ).close();
				exportFolder.add( params, 'exportFormat', Object.keys( exportFormats ) ).name( 'Format' );
				exportFolder.add( params, 'bakeToneMapping' ).name( 'Bake Tone Mapping' ).info( 'unlit formats: viewers without tone mapping match this page, three.js viewers tone map twice' );
				exportFolder.add( { exportGLTF }, 'exportGLTF' ).name( 'Export glTF' );

				// the lighting of glTF files: their lights, or a sky and a sun

				gltfFolder = gui.addFolder( 'glTF Lighting' ).close();
				uv1Control = gltfFolder.add( params, 'keepUV1' ).name( 'Keep uv1' ).info( 'bake into the light map UVs of the file instead of unwrapping new ones' ).listen().onChange( reloadGLTF );
				gltfFolder.add( params, 'sky', skies ).name( 'Sky' ).listen().onChange( setGLTFLighting );
				gltfFolder.add( params, 'sun' ).name( 'Sun' ).listen().onChange( setGLTFLighting );
				gltfFolder.add( params, 'sunElevation', 0, 90, 1 ).name( 'Sun Elevation' ).listen().onChange( setGLTFLighting );
				gltfFolder.add( params, 'sunAzimuth', 0, 360, 1 ).name( 'Sun Azimuth' ).listen().onChange( setGLTFLighting );
				gltfFolder.add( params, 'sunIntensity', 0, 10, 0.1 ).name( 'Sun Intensity' ).listen().onChange( setGLTFLighting );
				gltfFolder.add( params, 'exposure', 0.1, 16, 0.1 ).name( 'Exposure' ).listen().onChange( () => world.exposure = renderer.toneMappingExposure = params.exposure );

				showWorldControls();
				showOutput();

				window.addEventListener( 'resize', onWindowResize );

				// drop a .glb, or a .gltf with its buffers and textures, onto the page

				window.addEventListener( 'dragover', ( event ) => event.preventDefault() );
				window.addEventListener( 'drop', ( event ) => {

					event.preventDefault();

					if ( event.dataTransfer.files.length > 0 ) loadGLTFFiles( event.dataTransfer.files );

				} );

				renderer.setAnimationLoop( animate );

			}

			async function setScene() {

				if ( busy ) return;

				busy = true;

				try {

					if ( worlds[ params.scene ] === undefined ) {

						status.textContent = `Loading ${ params.scene }…`;
						worlds[ params.scene ] = await scenes[ params.scene ]();

					}

				} finally {

					busy = false;

				}

				showWorld( worlds[ params.scene ] );

				await bake();

			}

			function showWorld( next ) {

				if ( world !== undefined ) scene.remove( world.root );

				world = next;
				scene.add( world.root );
				scene.background = world.background;
				renderer.toneMappingExposure = world.exposure ?? 1;

				params.resolution = world.atlasResolution ?? world.resolution;
				params.pageSize = world.pageSize ?? params.pageSize;

				camera.near = world.near ?? 0.1;
				camera.far = world.far ?? 100;
				camera.updateProjectionMatrix();
				camera.position.copy( world.camera );
				controls.target.copy( world.target );
				controls.update();

				meshes = [];
				world.root.traverse( ( object ) => object.isMesh && meshes.push( object ) );
				world.sourceMaterials ??= new Set( meshes.flatMap( ( mesh ) => [ mesh.material ].flat() ) );

				warning.textContent = world.warnings ?? '';
				credit.innerHTML = world.credit ?? '';

				if ( world.gltf !== undefined ) Object.assign( params, world.gltf.lighting, { keepUV1: world.gltf.keepUV1, exposure: world.exposure ?? 1 } );

				showWorldControls();

			}

			function showWorldControls() {

				// the lighting controls of your own glTF files

				if ( gltfFolder === undefined ) return;

				if ( world.gltf !== undefined ) gltfFolder.show();
				else gltfFolder.hide();

				if ( world.hasUV1 ) uv1Control.show();
				else uv1Control.hide();

			}

			function createCornellBox() {

				const root = new THREE.Group();

				const wallMaterial = new THREE.MeshStandardMaterial( { color: 0xcccccc } );
				const redMaterial = new THREE.MeshStandardMaterial( { color: 0xff0000 } );
				const greenMaterial = new THREE.MeshStandardMaterial( { color: 0x00ff00 } );

				// Floor
				const floor = new THREE.Mesh( new THREE.PlaneGeometry( 6, 6 ), wallMaterial );
				floor.rotation.x = - Math.PI / 2;
				floor.receiveShadow = true;
				root.add( floor );

				// Ceiling
				const ceiling = new THREE.Mesh( new THREE.PlaneGeometry( 6, 6 ), wallMaterial );
				ceiling.rotation.x = Math.PI / 2;
				ceiling.position.y = 5;
				ceiling.receiveShadow = true;
				root.add( ceiling );

				// Back wall
				const backWall = new THREE.Mesh( new THREE.PlaneGeometry( 6, 5 ), wallMaterial );
				backWall.position.set( 0, 2.5, - 3 );
				backWall.receiveShadow = true;
				root.add( backWall );

				// Front wall
				const frontWall = new THREE.Mesh( new THREE.PlaneGeometry( 6, 5 ), wallMaterial );
				frontWall.rotation.y = Math.PI;
				frontWall.position.set( 0, 2.5, 3 );
				frontWall.receiveShadow = true;
				root.add( frontWall );

				// Left wall (red)
				const leftWall = new THREE.Mesh( new THREE.PlaneGeometry( 6, 5 ), redMaterial );
				leftWall.rotation.y = Math.PI / 2;
				leftWall.position.set( - 3, 2.5, 0 );
				leftWall.receiveShadow = true;
				root.add( leftWall );

				// Right wall (green)
				const rightWall = new THREE.Mesh( new THREE.PlaneGeometry( 6, 5 ), greenMaterial );
				rightWall.rotation.y = - Math.PI / 2;
				rightWall.position.set( 3, 2.5, 0 );
				rightWall.receiveShadow = true;
				root.add( rightWall );

				// Objects inside the box

				const objectMaterial = new THREE.MeshStandardMaterial( { color: 0xeeeeee } );

				// Tall box
				const tallBox = new THREE.Mesh( new THREE.BoxGeometry( 1.2, 2.5, 1.2 ), objectMaterial );
				tallBox.position.set( - 0.8, 1.25, - 0.8 );
				tallBox.rotation.y = Math.PI / 8;
				tallBox.castShadow = true;
				tallBox.receiveShadow = true;
				root.add( tallBox );

				// Glossy sphere, to show direct specular lighting (Light Probe and VXGI)
				const glossyMaterial = new THREE.MeshStandardMaterial( { color: 0x0044ff, roughness: 0.15 } );
				const glossySphere = new THREE.Mesh( new THREE.SphereGeometry( 0.65, 32, 32 ), glossyMaterial );
				glossySphere.position.set( 1, 0.65, 0.5 );
				glossySphere.castShadow = true;
				glossySphere.receiveShadow = true;
				root.add( glossySphere );

				// Lights: both radiosity solvers bake the direct light of an emissive area light panel with
				// soft shadows, light probes and VXGI bake the indirect light of a live point light
				const lightPanel = new THREE.Mesh( new THREE.PlaneGeometry( 2, 2 ), new THREE.MeshStandardMaterial( { color: 0x000000, emissive: 0xffffff, emissiveIntensity: 20 } ) );
				lightPanel.rotation.x = Math.PI / 2;
				lightPanel.position.y = 4.99;
				root.add( lightPanel );

				const light = new THREE.PointLight( 0xffffff, 40 );
				light.position.set( 0, 4.5, 0 );
				light.castShadow = true;
				light.shadow.mapSize.setScalar( 256 );
				light.shadow.radius = 10;
				light.shadow.normalBias = - 0.02;
				root.add( light );

				return {
					root, light, lightPanel, background: new THREE.Color( 0x111111 ), resolution: 1024, cacheSize: 256,
					camera: new THREE.Vector3( 0, 2.5, 8 ), target: new THREE.Vector3( 0, 2.5, 0 ),
					path: [[ - 2.2, 0.55, - 2.2 ], [ - 2.3, 1.3, 0.3 ], [ - 1.1, 2.4, 1.8 ], [ 1, 1.9, 1.9 ], [ 2.3, 1.1, 0.1 ], [ 2, 0.55, - 2.1 ], [ 0.5, 1, - 2.3 ], [ - 0.9, 0.6, - 2.4 ]], objectSize: 0.3,
					reflections: [ { position: [ 0.4, 1.6, 1.3 ], box: [ - 3, 0, - 3, 3, 5, 3 ] }, { position: [ 0.6, 1.6, - 1.9 ], box: [ - 3, 0, - 3, 3, 5, 3 ] } ],
					probes: { size: new THREE.Vector3( 5.6, 4.7, 5.6 ), position: new THREE.Vector3( 0, 2.45, 0 ), counts: [ 6, 6, 6 ], far: 20 }
				};

			}

			function createBallPool() {

				// colorful balls piled in an open box, after webgpu_postprocessing_ssgi_ballpool

				const root = new THREE.Group();

				const white = new THREE.MeshStandardMaterial( { color: 0xeeeeee } );
				const walls = [
					[ new THREE.PlaneGeometry( 8, 8 ), white, [ 0, 0, 0 ], [ - Math.PI / 2, 0 ]],
					[ new THREE.PlaneGeometry( 8, 8 ), white, [ 0, 6, 0 ], [ Math.PI / 2, 0 ]],
					[ new THREE.PlaneGeometry( 8, 6 ), white, [ 0, 3, - 4 ], [ 0, 0 ]],
					[ new THREE.PlaneGeometry( 8, 6 ), new THREE.MeshStandardMaterial( { color: 0xff2222 } ), [ - 4, 3, 0 ], [ 0, Math.PI / 2 ]],
					[ new THREE.PlaneGeometry( 8, 6 ), new THREE.MeshStandardMaterial( { color: 0x22ff22 } ), [ 4, 3, 0 ], [ 0, - Math.PI / 2 ]]
				];

				for ( const [ geometry, material, position, [ x, y ]] of walls ) {

					const wall = new THREE.Mesh( geometry, material );
					wall.position.fromArray( position );
					wall.rotation.set( x, y, 0 );
					wall.receiveShadow = true;
					root.add( wall );

				}

				// the balls settle one by one, each at the lowest of a few random spots on the floor or the balls below.
				// They are the instances of one mesh, with their colors. Each one has its own region of the light
				// map, the light map UVs of the instances are scaled and offset into them

				const radius = 0.4;
				const colors = [ 0xff4444, 0x44ff44, 0x4488ff, 0xffaa00, 0xff44ff, 0x44ffff, 0xffff44, 0xff8844, 0x8844ff, 0x44ff88 ].map( ( color ) => new THREE.Color( color ) );
				const material = instancedLightMap( new THREE.MeshStandardMaterial( { roughness: 0.3 } ) );
				const instances = new THREE.InstancedMesh( new THREE.SphereGeometry( radius, 24, 12 ), material, 160 );
				const matrix = new THREE.Matrix4();
				const balls = [];

				let seed = 1;
				const random = () => ( seed = seed * 16807 % 2147483647 ) / 2147483647;

				for ( let i = 0; i < 160; i ++ ) {

					const position = new THREE.Vector3( 0, Infinity, 0 );

					for ( let j = 0; j < 40; j ++ ) {

						const x = ( random() * 2 - 1 ) * ( 4 - radius );
						const z = ( random() * 2 - 1 ) * ( 4 - radius );
						let y = radius;

						for ( const ball of balls ) {

							const distanceSq = ( ball.x - x ) ** 2 + ( ball.z - z ) ** 2;
							if ( distanceSq < 4 * radius * radius ) y = Math.max( y, ball.y + Math.sqrt( 4 * radius * radius - distanceSq ) );

						}

						if ( y < position.y ) position.set( x, y, z );

					}

					balls.push( position );

					instances.setMatrixAt( i, matrix.makeTranslation( position ) );
					instances.setColorAt( i, colors[ i % colors.length ] );

				}

				instances.castShadow = true;
				instances.receiveShadow = true;
				root.add( instances );

			function openGLTF() {

				// know the glTF file types

			async function loadGLTFFiles( fileList, keepUV1 = false ) {

				const files = [ ...fileList ];
				const file = files.find( ( file ) => /\.(glb|gltf)$/i.test( file.name ) );

				if ( file === undefined ) {

					warning.textContent = 'Open a .glb file, or a .gltf file together with its buffers and textures.';
					return;

				}

				if ( busy ) return;

				busy = true;
				stopBake();
				status.textContent = `Loading ${ file.name }…`;

				let next = null;

				try {

					next = await createGLTFWorld( await parseGLTFFiles( files, file ), files, keepUV1 );

				} catch ( error ) {

					console.error( error );
					warning.textContent = `${ file.name } could not be loaded: ${ error.message }`;

				} finally {

					busy = false;

				}

				if ( next === null ) {

					bake();
					return;

				}

				// a reloaded file replaces its world

				const name = `glTF: ${ file.name }`;

				if ( worlds[ name ] !== undefined ) disposeWorld( worlds[ name ] );

				worlds[ name ] = next;

				if ( sceneControl.options.includes( name ) === false ) {

					const option = document.createElement( 'option' );
					option.value = option.textContent = name;
					sceneControl.select.appendChild( option );
					sceneControl.options.push( name );

				}

				sceneControl.setValue( name );

			}

			async function parseGLTFFiles( files, file ) {

				// the buffers and textures of a .gltf file are looked up among the files by their names

				const urls = new Map( files.map( ( file ) => [ file.name, URL.createObjectURL( file ) ] ) );
				const manager = new THREE.LoadingManager();
				manager.setURLModifier( ( url ) => urls.get( decodeURIComponent( url.split( /[\\/]/ ).pop() ) ) ?? url );

				try {

					if ( gltfLoader === null ) {

						gltfLoader = { draco: new DRACOLoader().setDecoderPath( DRACO_GLTF_CONFIG ), ktx2: new KTX2Loader().detectSupport( renderer ) };

					}

					const loader = new GLTFLoader( manager ).setDRACOLoader( gltfLoader.draco ).setKTX2Loader( gltfLoader.ktx2 ).setMeshoptDecoder( MeshoptDecoder );

					return await loader.parseAsync( await file.arrayBuffer(), '' );

				} finally {

					for ( const url of urls.values() ) URL.revokeObjectURL( url );

				}

			}

			function reloadGLTF() {

				if ( world.gltf !== undefined && params.keepUV1 !== world.gltf.keepUV1 ) loadGLTFFiles( world.gltf.files, params.keepUV1 );

			}

			async function createGLTFWorld( gltf, files, keepUV1 ) {

				// objects, instances get their own atlas regions, meshes without UVs are unwrapped too

				const fileLights = [];

					if ( object.isLight ) fileLights.push( object );

					const geometry = object.geometry;
					triangles += ( geometry.index ?? geometry.getAttribute( 'position' ) ).count / 3 * ( object.isInstancedMesh ? object.count : 1 );

					if ( object.isSkinnedMesh ) skinned ++;
					if ( object.isInstancedMesh ) instances += object.count;

					if ( geometry.hasAttribute( 'uv1' ) ) withUV1 ++;
					else withoutUV1 ++;

				// device allows, since the charts of a mesh and all its instances have to fit one page. Phones get
				// smaller ones

				if ( huge ) warnings.push( `${ ( triangles / 1e6 ).toFixed( 2 ) }M triangles: the bake takes a while, the light map has pages of up to ${ pageSize }²` );

					if ( light.castShadow ) fitShadow( light, center, radius );

				// bounces are baked

					camera: center.clone().addScaledVector( direction, radius / Math.sin( THREE.MathUtils.degToRad( camera.fov / 2 ) ) ), target: center.clone(), near: radius / 500, far: radius * 50,

					reflections: [ { position: center.toArray(), box: bounds.min.toArray().concat( bounds.max.toArray() ) } ],

			function fitShadow( light, center, radius ) {

				// where their shadow camera is

			}

			function setupProbes() {

				// light probes for the dynamic objects, laid out like the probes of the Light Probe algorithm unless
				// the objects need probes closer to the floor and on both sides of walls, and box projected reflection
				// probes for glossy materials

				const { size, position, counts } = world.dynamicProbes ?? world.probes;

				world.lightProbes = new LightProbeGrid( size.x, size.y, size.z, ...counts );
				world.lightProbes.position.copy( position );
				world.lightProbes.updateBoundingBox();

				const reflections = world.reflections.map( ( { position, box } ) => ( { position: new THREE.Vector3( ...position ), box: new THREE.Box3().setFromArray( box ) } ) );
				world.reflectionProbes = new ReflectionProbes( reflections, { far: world.probes.far * 2 } );

				// the probes only add specular light to glossy materials, their light maps provide the diffuse light

				for ( const material of new Set( [ ...materials, ...world.sourceMaterials.values() ] ) ) {

					if ( material.roughness < 0.5 ) {

						material.envNode = world.reflectionProbes.envNode;
						material.needsUpdate = true;

					}

				}

				world.curve = new THREE.CatmullRomCurve3( world.path.map( ( point ) => new THREE.Vector3( ...point ) ), true );

			}

			function setProbeCapture( capturing ) {

				// the dynamic objects, the reflections and the Vertex GI wireframe are left out of bakes and probe captures

				for ( const object of dynamicObjects ) object.visible = capturing === false && params.dynamicObject;

				if ( wireframe !== null ) wireframe.group.visible = capturing === false;

				if ( world.reflectionProbes !== undefined ) world.reflectionProbes.intensity = capturing === false && params.reflections ? 1 : 0;

			}

			function updateProbes() {

				if ( world.lightProbes === undefined ) setupProbes();

				// Vertex GI is fitted to the light map, the probes see the light-mapped scene in both outputs

				const baked = params.output !== 'Live GI';

				// the probes capture the light-mapped scene when a bake has finished, and once while baking a
				// scene or algorithm for the first time, so that the dynamic objects are lit in the meantime

				if ( baked === false || capture?.bakeId !== bakeId ) capture = null;

				if ( baked && lightBaker.baking === false && captureBakeId !== bakeId ) {

					captureBakeId = bakeId;
					capture = { bakeId, probe: 0, count: 1, reflection: 0, time: 0 };

				} else if ( baked && lightBaker.baking && previewBakeId !== bakeId && world.capturedAlgorithm !== params.algorithm && lightBaker.samples >= 8 ) {

					previewBakeId = bakeId;
					capture = { bakeId, probe: 0, count: 1, reflection: 0, time: 0 };

				}

				if ( capture !== null ) captureProbes();

				setProbeCapture( false );

				// in Live GI the dynamic objects get the live irradiance of the GI source through the context of
				// the live pass, like the static meshes. They stop moving there, the frames are accumulated

				const probeLighting = baked && world.lightProbes.texture !== null;
				const materialKey = `${ params.scene },${ probeLighting }`;

				if ( dynamicMaterialKey !== materialKey ) {

					dynamicMaterialKey = materialKey;

					if ( probeLighting ) world.lightProbeContext ??= builtinGIContext( float( 1 ), lightProbeGridIrradiance( world.lightProbes, positionWorld, normalWorld ) );

					for ( const object of dynamicObjects ) {

						object.material.contextNode = probeLighting ? world.lightProbeContext : null;
						object.material.envNode = world.reflectionProbes.envNode;
						object.material.needsUpdate = true;

					}

					for ( const mesh of world.probeLitMeshes ) {

						mesh.material.contextNode = probeLighting ? world.lightProbeContext : null;
						mesh.material.needsUpdate = true;

					}

				}

				const time = performance.now() / 1000;
				if ( baked ) dynamicTime += Math.min( time - frameTime, 0.1 );
				frameTime = time;

				const [ sphere, knot ] = dynamicObjects;
				const size = world.objectSize;
				const length = world.curve.getLength();
				const u = dynamicTime * size * 2 / length;

				world.curve.getPointAt( u % 1, sphere.position );
				world.curve.getPointAt( ( u + 1 - size * 4 / length ) % 1, knot.position );
				sphere.scale.setScalar( size );
				knot.scale.setScalar( size );
				knot.rotation.set( dynamicTime * 0.7, dynamicTime * 0.5, 0 );

				if ( baked && lightBaker.baking === false ) status.textContent += capture !== null ? ', capturing probes' : captureStatus;

			}

			function captureProbes() {

				// a few probes per frame keep the view responsive, the light probes first, as many per frame as fit
				// in a few milliseconds, then one reflection probe per frame

				const { lightProbes, reflectionProbes } = world;
				const total = lightProbes.resolution.x * lightProbes.resolution.y * lightProbes.resolution.z;
				const background = scene.background;
				const start = performance.now();

				// background colors are not part of the bake

				if ( background !== null && background.isColor ) scene.background = null;

				setProbeCapture( true );

				// meshes lit by the probes would light them

				for ( const mesh of world.probeLitMeshes ) mesh.visible = false;

				if ( capture.probe < total ) {

					const count = Math.min( capture.count, total - capture.probe );

					lightProbes.bake( renderer, scene, { cubemapSize: 16, near: 0.05, far: world.probes.far, start: capture.probe, count } );

					capture.probe += count;
					capture.count = THREE.MathUtils.clamp( Math.round( count * 6 / Math.max( performance.now() - start, 0.1 ) ), 1, 64 );

				} else if ( capture.reflection < reflectionProbes.probes.length ) {

					reflectionProbes.capture( renderer, scene, { start: capture.reflection, count: 1 } );
					capture.reflection ++;

				}

				setProbeCapture( false );

				for ( const mesh of world.probeLitMeshes ) mesh.visible = true;

				scene.background = background;

				capture.time += performance.now() - start;

				if ( capture.probe === total && capture.reflection === reflectionProbes.probes.length ) {

					world.capturedAlgorithm = params.algorithm;
					captureStatus = `, probes captured in ${ capture.time.toFixed( 0 ) } ms`;
					capture = null;

				}

			}

			async function bake() {

				if ( busy ) {

					bakePending = true;
					return;

				}

				busy = true;
				bakePending = false;

				stopBake();
				resetVertexGI();

				// both radiosity solvers bake the emissive panels of the Cornell Box and the Ball Pool, light probes
				// and VXGI their live point lights

				const emissive = params.algorithm === 'Ray Radiosity' || params.algorithm === 'Stochastic Radiosity';

				if ( world.lightPanel !== null ) world.lightPanel.visible = emissive;
				if ( world.light !== null ) world.light.visible = emissive === false;

				lightBaker.setOptions( {
					algorithm: algorithms[ params.algorithm ],
					resolution: params.resolution,
					pageSize: params.pageSize,
					unwrap: world.unwrap ?? true,
					directions: params.directions,
					cacheSize: params.algorithm === 'Stochastic Radiosity' ? world.cacheSize : 256,
					probes: world.probes,
					directLight: params.directLight === 'Baked' ? 'baked' : 'live',
					directional: params.directionalLightMap,
					specularIntensity: params.lightMapSpecular ? 1 : 0,
					denoise: params.denoise,
					stitchSeams: params.stitchSeams
				} );

				// unwrapping a large model takes a moment

				if ( world.atlasResolution === undefined ) {

					status.textContent = 'Unwrapping light map UVs…';
					await new Promise( requestAnimationFrame );
					await new Promise( requestAnimationFrame );

				}

				// the dynamic objects, the reflections and the Vertex GI wireframe are left out of the bake. A baked
				// direct light is added to the light map and left out of the materials, the GI sources still see
				// it for its bounces

				setProbeCapture( true );

				try {

					await lightBaker.prepare( scene, world.root );

				} catch ( error ) {

					console.error( error );
					warning.textContent = `The bake failed: ${ error.message }`;
					return;

				} finally {

					setProbeCapture( false );
					busy = false;

				}

				// light map UVs, the resolution grows until the charts fit. Resolutions above the page size give
				// several pages at the density of the resolution. Meshes on other pages than the first one get
				// copies of their materials, meshes left out of the light map are lit by probes

				params.resolution = world.atlasResolution = lightBaker.atlasResolution;
				world.pageSize = params.pageSize;
				materials = lightBaker.materials;
				world.probeLitMeshes = lightBaker.excludedMeshes;

				// the shells of inverted hull outlines would enclose and shadow the surfaces that they outline

				const outlines = lightBaker.outlineMeshes.length;
				warning.textContent = [ world.warnings, outlines > 0 ? `${ outlines } outline shell${ outlines > 1 ? 's are' : ' is' } left out of the bake` : '' ].filter( Boolean ).join( ', ' );
				dynamicMaterialKey = '';

				lightBaker.apply();

				livePass?.dispose();
				liveOutput?.dispose();

				livePass = pass( scene, camera );
				livePass.contextNode = builtinGIContext( float( 1 ), lightBaker.liveIrradianceNode( positionWorld, normalWorld ) );
				liveOutput = new FrameAccumulationNode( livePass.getTextureNode() );

				setOutput();

				if ( bakePending ) bake();

			}

			function startBake() {

				// the light baker accumulates a few samples per frame until the noise of the light map drops below
				// its tolerance, it denoises and stitches the light map with each noise estimate

				const controller = bakeController = new AbortController();

				lightBaker.bake( scene, { root: world.root, signal: controller.signal } ).catch( ( error ) => {

					if ( error.name !== 'AbortError' ) console.error( error );

				} );

			}

			function stopBake() {

				bakeController?.abort();
				bakeController = null;

			}

			function setOutput() {

				const live = params.output === 'Live GI';

				// discard accumulated samples when switching to or from Live GI; baking only runs with the
				// light map, which Baked GI and Vertex GI share

				if ( live || lightBaker.samples === 0 ) {

					resetVertexGI();
					stopBake();
					lightBaker.reset();
					liveOutput.reset();
					bakeId ++;

					if ( live === false ) startBake();

				}

				// the light map holds the baked direct light, Live GI only evaluates the indirect light

				applyLightMaps();

				showOutput();

			}

			function applyLightMaps() {

				// the materials re-evaluate the light map for their normal maps with the dominant direction of
				// their page, which also adds a highlight of the baked light. Live GI lights them with all lights

				lightBaker.setOptions( { directional: params.directionalLightMap, specularIntensity: params.lightMapSpecular ? 1 : 0 } );
				lightBaker.apply();

				if ( params.output === 'Live GI' ) {

					for ( const material of materials ) material.lightsNode = null;

				}

			}

			function showOutput() {

				// Vertex GI shows the light map until the vertices are fitted, then their subdivided geometries

				const vertex = params.output === 'Vertex GI' && vertexGI?.geometries != null;

				if ( vertexGI?.geometries != null ) {

					const step = Math.min( params.vertexStep, vertexGI.steps.length - 1 );

					vertexGI.meshes.forEach( ( mesh, i ) => mesh.geometry = vertex ? stepGeometry( i, step ) : vertexGI.originals[ i ] );
					showWireframe( vertex && params.wireframe ? step : - 1 );

				}

				for ( const control of vertexControls ) {

					if ( params.output === 'Vertex GI' ) control.show();
					else control.hide();

				}

				// the instances of instanced meshes share their vertices, they keep their light maps

				for ( const material of materials ) material.lightMapIntensity = params.output === 'Live GI' || ( vertex && vertexGI.materials.has( material ) ) ? 0 : 1;

				renderPipeline.outputNode = params.output === 'Live GI' ? liveOutput : vertex ? vertexPass : bakedPass;
				renderPipeline.needsUpdate = true;

			}

			async function fitVertexGI() {

				const vertexMeshes = meshes.filter( ( mesh ) => mesh.isInstancedMesh !== true && mesh.geometry.hasAttribute( 'uv1' ) );
				const fit = vertexGI = { meshes: vertexMeshes, materials: new Set( vertexMeshes.map( ( mesh ) => mesh.material ) ), originals: vertexMeshes.map( ( mesh ) => mesh.geometry ), geometries: null, stats: null, steps: [], levels: null, stepGeometries: [], wireframes: [] };
				const baker = new VertexLightBaker( vertexMeshes );

				// every step keeps its triangles and fit

				const onStep = ( stats ) => fit.steps.push( {
					stats,
					geometries: baker.geometries.map( ( geometry ) => ( {
						index: geometry.index.array,
						groups: geometry.groups.map( ( group ) => ( { ...group } ) ),
						irradiance: geometry.getAttribute( baker.attribute ).array,
						count: geometry.getAttribute( 'position' ).count
					} ) )
				} );

				status.textContent = 'Fitting Vertex GI…';

				await baker.readLightMap( renderer, lightBaker.process() );
				const stats = await refineVertices( baker, () => vertexGI === fit, onStep );

				// discarded by a re-bake or a new budget

				if ( stats === null ) {

					disposeVertexGeometries( fit, baker.geometries );
					return;

				}

				// the share of the added vertices up to the step that created each vertex, 0 for the original ones

				const added = ( step ) => fit.steps[ step ].stats.vertices - fit.steps[ 0 ].stats.vertices;
				const total = Math.max( added( fit.steps.length - 1 ), 1 );

				fit.levels = baker.geometries.map( ( geometry, i ) => {

					const levels = new Float32Array( geometry.getAttribute( 'position' ).count );

					for ( let step = 1; step < fit.steps.length; step ++ ) levels.fill( Math.max( added( step ) / total, 1e-3 ), fit.steps[ step - 1 ].geometries[ i ].count, fit.steps[ step ].geometries[ i ].count );

					return new THREE.BufferAttribute( levels, 1 );

				} );

				fit.geometries = baker.geometries;
				fit.stats = stats;

				const slider = vertexControls[ 1 ];
				slider.slider.max = slider.numberInput.max = fit.steps.length - 1;
				params.vertexStep = fit.steps.length - 1;

				showOutput();

			}

			async function refineVertices( baker, isCurrent, onStep = null ) {

				// the irradiance of the vertices is fitted to the light map with least squares, the meshes are
				// subdivided where a linear function cannot fit the light map beyond its noise, until they fit
				// within 2% or the vertex budget is used up. With steps, the splitting rounds are fitted one by one,
				// later ones in groups that grow every ten steps

				const start = performance.now();
				const options = { noise: Number.isFinite( lightBaker.noise ) ? lightBaker.noise : 0 };
				const history = [];

				while ( true ) {

					const stats = baker.fit();
					history.push( stats );

					if ( onStep !== null ) {

						onStep( stats );
						options.rounds = 1 + Math.floor( history.length / 10 );

					}

					status.textContent = `Fitting vertices: ${ stats.vertices } vertices, ${ ( stats.error * 100 ).toFixed( 1 ) }% error`;

					if ( baker.refine( params.vertexBudget, options ) === 0 ) break;

					await new Promise( requestAnimationFrame );
					if ( isCurrent() === false ) return null;

				}

				return { ...history[ history.length - 1 ], history, time: ( performance.now() - start ) / 1000 };

			}

			function resetVertexGI() {

				if ( vertexGI === null ) return;

				if ( vertexGI.geometries !== null ) {

					vertexGI.meshes.forEach( ( mesh, i ) => mesh.geometry = vertexGI.originals[ i ] );
					disposeVertexGeometries( vertexGI, vertexGI.geometries );

					for ( const geometries of [ ...vertexGI.stepGeometries, ...vertexGI.wireframes ] ) {

						if ( geometries !== undefined ) disposeVertexGeometries( vertexGI, geometries );

					}

					showWireframe( - 1 );

				}

				vertexGI = null;

			}

			function disposeVertexGeometries( fit, geometries ) {

				// geometries without subdivisions share the buffers of the originals

				geometries.forEach( ( geometry, i ) => geometry.getAttribute( 'position' ) !== fit.originals[ i ].getAttribute( 'position' ) && geometry.dispose() );

			}

			function stepGeometry( i, step ) {

				// the subdivisions only append vertices, so every step shares the vertices of the final geometry
				// and has its own triangles and fit

				const final = vertexGI.geometries[ i ];

				if ( step === vertexGI.steps.length - 1 ) return final;

				const geometries = vertexGI.stepGeometries[ step ] ??= [];

				if ( geometries[ i ] === undefined ) {

					const { index, groups, irradiance } = vertexGI.steps[ step ].geometries[ i ];
					const geometry = new THREE.BufferGeometry();

					for ( const name in final.attributes ) geometry.setAttribute( name, final.getAttribute( name ) );
					for ( const group of groups ) geometry.addGroup( group.start, group.count, group.materialIndex );

					const padded = new Float32Array( final.getAttribute( 'position' ).count * 3 );
					padded.set( irradiance );

					geometry.setAttribute( 'bakedIrradiance', new THREE.BufferAttribute( padded, 3 ) );
					geometry.setIndex( new THREE.BufferAttribute( index, 1 ) );

					geometries[ i ] = geometry;

				}

				return geometries[ i ];

			}

			function showWireframe( step ) {

				if ( wireframe === null ) {

					// thin lines, faint for the original edges and from blue to orange for the edges of the later
					// refinement steps, by the share of the added vertices. An edge belongs to the step of its newer
					// vertex, which the line takes from its first vertex with flat interpolation. The colors are divided
					// by the exposure, which the render pipeline applies to the lines too, and the refined edges are
					// opaque, since the HDR blending would hide them on bright surfaces. The lines are drawn slightly
					// towards the camera so that their surfaces do not hide them

					const t = varying( attribute( 'refineLevel', 'float' ) ).setInterpolation( THREE.InterpolationSamplingType.FLAT );
					const refined = t.greaterThan( 0 );

					const material = new THREE.LineBasicNodeMaterial( { transparent: true, depthWrite: false } );
					material.colorNode = refined.select( mix( mix( color( 0x3355ff ), color( 0xee22cc ), t.mul( 2 ).clamp() ), color( 0xff7700 ), t.mul( 2 ).sub( 1 ).clamp() ), color( 0x999999 ) ).div( toneMappingExposure );
					material.opacityNode = refined.select( 1, 0.12 );
					material.vertexNode = cameraProjectionMatrix.mul( vec4( modelViewMatrix.mul( vec4( positionGeometry, 1 ) ).xyz.mul( 0.999 ), 1 ) );

					wireframe = { group: new THREE.Group(), material };
					scene.add( wireframe.group );

				}

				wireframe.group.clear();

				if ( step < 0 ) return;

				vertexGI.meshes.forEach( ( mesh, i ) => {

					const lines = new THREE.LineSegments( wireframeGeometry( i, step ), wireframe.material );
					lines.matrixAutoUpdate = false;
					lines.matrix.copy( mesh.matrixWorld );
					wireframe.group.add( lines );

				} );

			}

			function wireframeGeometry( i, step ) {

				const geometries = vertexGI.wireframes[ step ] ??= [];

				if ( geometries[ i ] === undefined ) {

					// the unique edges of the triangles, the newer vertex first

					const index = vertexGI.steps[ step ].geometries[ i ].index;
					const levels = vertexGI.levels[ i ].array;
					const edges = new Set(), pairs = [];

					for ( let t = 0; t < index.length; t += 3 ) {

						for ( let j = 0; j < 3; j ++ ) {

							const a = index[ t + j ], b = index[ t + ( j + 1 ) % 3 ];
							const key = Math.min( a, b ) * levels.length + Math.max( a, b );

							if ( edges.has( key ) ) continue;

							edges.add( key );

							if ( levels[ a ] >= levels[ b ] ) pairs.push( a, b );
							else pairs.push( b, a );

						}

					}

					const geometry = new THREE.BufferGeometry();
					geometry.setAttribute( 'position', vertexGI.geometries[ i ].getAttribute( 'position' ) );
					geometry.setAttribute( 'refineLevel', vertexGI.levels[ i ] );
					geometry.setIndex( pairs );

					geometries[ i ] = geometry;

				}

				return geometries[ i ];

			}

			async function exportGLTF() {

				if ( busy ) return;

				busy = true;
				renderer.setAnimationLoop( null );
				stopBake();

				// export the original geometries, Vertex GI shows subdivided ones

				if ( vertexGI?.geometries != null ) vertexGI.meshes.forEach( ( mesh, i ) => mesh.geometry = vertexGI.originals[ i ] );

				try {

					// the light baker finishes the bake before exporting

					const onProgress = ( progress ) => {

						if ( progress.stage === 'baking' ) status.textContent = `Finishing ${ params.algorithm }: ${ progress.samples } samples`;
						else if ( progress.stage === 'vertices' ) status.textContent = `Fitting vertex colors: ${ progress.vertices } vertices, ${ ( progress.error * 100 ).toFixed( 1 ) }% error`;
						else status.textContent = 'Writing glTF…';

					};

					const { format, bitDepth } = exportFormats[ params.exportFormat ];
					const toneMapping = params.bakeToneMapping ? renderer.toneMapping : THREE.NoToneMapping;
					const result = await lightBaker.export( { format, bitDepth, toneMapping, maxVertices: params.vertexBudget, onProgress } );

					const name = format === 'unlit-vertex' ? `vertexcolors_${ params.scene }_${ params.algorithm }` : `lightmap_${ params.scene }_${ params.algorithm }_${ params.exportFormat }`;

					const link = document.createElement( 'a' );
					link.href = URL.createObjectURL( new Blob( [ result ], { type: 'application/octet-stream' } ) );
					link.download = name.toLowerCase().replace( /[^a-z0-9]+/g, '_' ).replace( /_$/, '' ) + '.glb';
					link.click();
					URL.revokeObjectURL( link.href );

				} finally {

					busy = false;
					showOutput();
					renderer.setAnimationLoop( animate );

				}

			}

			function setDenoise() {

				lightBaker.denoise = params.denoise;

				// a bake that stopped at the tolerance of the denoiser continues without it

				if ( lightBaker.baking === false && params.output === 'Baked GI' && lightBaker.converged === false ) startBake();

				lightBaker.process();

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				if ( busy || lightBaker.lightMapper === null ) {

					renderPipeline.render();
					return;

				}

				const noise = lightBaker.noise;
				const noiseText = noise === Infinity ? 'estimating noise' : `${ ( noise * 100 ).toFixed( 1 ) }% noise`;
				const bakeTime = lightBaker.time;

				if ( params.output === 'Live GI' ) {

					status.textContent = `Live ${ params.algorithm }: ${ liveOutput.frames } frames`;

				} else if ( lightBaker.baking ) {

					status.textContent = `Baking ${ params.algorithm }: ${ lightBaker.samples } samples, ${ noiseText }, ${ bakeTime.toFixed( 1 ) } s`;

				} else if ( params.output === 'Vertex GI' ) {

					// fitVertexGI() reports its progress

					if ( vertexGI === null ) {

						fitVertexGI();

					} else if ( vertexGI.stats !== null ) {

						const step = Math.min( params.vertexStep, vertexGI.steps.length - 1 ), stats = vertexGI.steps[ step ].stats;
						status.textContent = `Vertex GI baked, step ${ step } of ${ vertexGI.steps.length - 1 }: ${ stats.vertices } vertices, ${ ( stats.error * 100 ).toFixed( 1 ) }% error, fitted in ${ vertexGI.stats.time.toFixed( 1 ) } s, ${ params.algorithm }: ${ lightBaker.samples } samples in ${ bakeTime.toFixed( 1 ) } s`;

					}

				} else {

					const pages = lightBaker.lightMapper.pages.length;

					status.textContent = `${ params.algorithm } baked: ${ lightBaker.samples } samples, ${ noiseText }, in ${ bakeTime.toFixed( 1 ) } s` + ( pages > 1 ? `, ${ pages } pages of ${ lightBaker.lightMapper.size }²` : '' );

				}

				updateProbes();

				renderPipeline.render();

			}

		</script>
