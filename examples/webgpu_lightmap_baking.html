<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - light baking</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - light baking">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_lightmap_baking.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_lightmap_baking.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Light Baking</span>
			</div>

			<small>Bake Stochastic Radiosity, Ray Radiosity (<a href="https://github.com/gkjohnson/three-mesh-bvh" target="_blank" rel="noopener">three-mesh-bvh</a>), Light Probe or VXGI into denoised directional light maps of these scenes or your own glTF.<br/><span id="status"></span><span id="warning" style="display: block; color: #ffc040;"></span></small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/",
					"three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/src/index.js",
					"three-mesh-bvh/webgpu": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/src/webgpu/index.js"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { builtinGIContext, float, ivec2, mix, mrt, normalWorld, output, pass, passTexture, positionWorld, screenCoordinate, texture, uniform, velocity } from 'three/tsl';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { LightBaker } from 'three/addons/lighting/LightBaker.js';
			import { LightProbeGrid } from 'three/addons/lighting/LightProbeGrid.js';
			import { lightProbeGridIrradiance } from 'three/addons/tsl/lighting/LightProbeGridNode.js';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';
			import { ReflectionProbes } from 'three/addons/lighting/ReflectionProbes.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { DRACOLoader, DRACO_GLTF_CONFIG } from 'three/addons/loaders/DRACOLoader.js';
			import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
			import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
			import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';

			let camera, scene, renderer, controls, renderPipeline;
			let world, meshes, materials, status, warning;
			let lightBaker, bakedPass, livePass, liveTRAA = null, liveOutput;
			let busy = false, bakePending = false, bakeController = null, bakeId = 0;
			let dynamicObjects, dynamicTime = 0, dynamicMaterialKey = '', frameTime = 0;
			let capture = null, captureBakeId = - 1, previewBakeId = - 1, captureStatus = '';
			let gltfLoader = null, sceneControl, gltfFolder, uv1Control;
			let framesInFlight = 0;

			// shifts the per-pixel cone noise of the live VXGI view every frame, like the light map samples

			const liveFrame = uniform( 0 );

			const worlds = {};
			const probeKeyedMaterials = new WeakSet();

			// the scenes and their loaders

			const scenes = { 'Cornell Box': createCornellBox, 'Courtyard': loadCourtyard };

			// phones have less GPU memory and slower GPUs

			const phone = window.matchMedia( '(pointer: coarse)' ).matches;

			// stochastic radiosity converges in fewer samples with more directions per sample, desktop GPUs
			// render them at almost no extra cost, but they take memory and more time per sample on phones.
			// A VXGI volume of 256³ takes about 700 MB of GPU memory, phones use 128³

			const params = {
				scene: 'Cornell Box',
				output: 'Baked GI',
				algorithm: 'Stochastic Radiosity',
				resolution: 1024,
				pageSize: 2048,
				directions: phone ? 16 : 64,
				vxgiResolution: phone ? 128 : 256,
				dynamicObject: true,
				reflections: true,
				directLight: 'Live',
				directionalLightMap: true,
				lightMapSpecular: true,
				denoise: true,
				stitchSeams: true,
				keepUV1: false,
				sky: 'venice_sunset_1k.hdr',
				sun: true,
				sunElevation: 50,
				sunAzimuth: 30,
				sunIntensity: 3,
				exposure: 1
			};

			// the algorithms of LightBaker. It stops the bake once the estimated noise of the light map drops
			// below a tolerance, or after a maximum of samples per algorithm, and bakes several cheap samples
			// of the stochastic radiosity per frame

			const algorithms = { 'Stochastic Radiosity': 'stochastic', 'Ray Radiosity': 'ray', 'Light Probe': 'probes', 'VXGI': 'vxgi' };

			// skies for your own glTF files without lights of their own. Small bright suns in a sky converge slowly
			// with the stochastic radiosity, the sun light of these skies is soft

			const skies = [ 'venice_sunset_1k.hdr', 'blouberg_sunrise_2_1k.hdr', 'None' ];

			// Live GI evaluates the irradiance per pixel and frame, this averages the frames while the view
			// is still, so the noisy irradiance of the stochastic algorithms converges like the bake

			class FrameAccumulationNode extends THREE.Node {

				constructor( textureNode, maxFrames = 1024 ) {

					super( 'vec4' );

					this.textureNode = textureNode;
					this.maxFrames = maxFrames;
					this.frames = 0;

					this._target = new THREE.RenderTarget( 1, 1, { type: THREE.HalfFloatType, depthBuffer: false } );
					this._history = new THREE.RenderTarget( 1, 1, { type: THREE.HalfFloatType, depthBuffer: false } );
					this._historyNode = texture( this._history.texture );
					this._outputNode = passTexture( this, this._target.texture );
					this._weight = uniform( 1 );
					this._quad = new THREE.QuadMesh( new THREE.NodeMaterial() );

					this.updateBeforeType = THREE.NodeUpdateType.FRAME;

				}

				reset() {

					this.frames = 0;

				}

				updateBefore( { renderer } ) {

					const size = renderer.getDrawingBufferSize( new THREE.Vector2() );

					if ( size.x !== this._target.width || size.y !== this._target.height ) {

						this._target.setSize( size.x, size.y );
						this._history.setSize( size.x, size.y );
						this.frames = 0;

					}

					// running mean, an exponential average after the last frame

					this._weight.value = 1 / Math.min( this.frames + 1, this.maxFrames );
					this._historyNode.value = this._history.texture;
					this._outputNode.value = this._target.texture;

					const renderTarget = renderer.getRenderTarget();
					renderer.setRenderTarget( this._target );
					this._quad.render( renderer );
					renderer.setRenderTarget( renderTarget );

					[ this._target, this._history ] = [ this._history, this._target ];
					this.frames ++;

				}

				setup() {

					const coord = ivec2( screenCoordinate );

					this._quad.material.fragmentNode = mix( this._historyNode.load( coord ), this.textureNode.load( coord ), this._weight );

					return this._outputNode;

				}

				dispose() {

					this._target.dispose();
					this._history.dispose();
					this._quad.material.dispose();

				}

			}

			init();

			async function init() {

				// Camera

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );

				// Scene

				scene = new THREE.Scene();

				// Renderer. The ray traced radiosity can need more storage buffers per shader stage than the default
				// eight, e.g. for a sky, lights and emissive meshes together

				const adapter = await navigator.gpu?.requestAdapter();
				const requiredLimits = adapter ? { maxStorageBuffersPerShaderStage: adapter.limits.maxStorageBuffersPerShaderStage } : {};

				// at most twice the resolution of the page, three times on phones would take memory and GPU time
				// from the bake

				renderer = new THREE.WebGPURenderer( { antialias: true, requiredLimits } );
				renderer.setPixelRatio( Math.min( window.devicePixelRatio, 2 ) );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();
				if ( renderer.backend.isWebGPUBackend !== true ) throw new Error( 'This example requires WebGPU.' );

				// GPU errors show on the page. A lost device stops it, e.g. after a phone ran out of GPU memory,
				// which can also destroy the device

				renderer.backend.device.lost.then( ( info ) => {

					stopBake();
					renderer.setAnimationLoop( null );
					warning.textContent = `The GPU device was lost, probably out of memory. Reload the page. ${ info.message }`;

				} );

				const onError = renderer.onError;

				renderer.onError = ( info ) => {

					onError.call( renderer, info );
					if ( warning.textContent === '' ) warning.textContent = `GPU error: ${ info.message }`;

				};

				// Controls

				controls = new OrbitControls( camera, renderer.domElement );
				controls.addEventListener( 'change', () => liveOutput?.reset() );

				// "Baked GI" shows the light map while it accumulates,
				// "Live GI" evaluates the raw irradiance per pixel every frame

				renderPipeline = new THREE.RenderPipeline( renderer );
				bakedPass = pass( scene, camera );

				status = document.getElementById( 'status' );
				warning = document.getElementById( 'warning' );

				// the light baker unwraps the light map UVs, sets up the GI source, bakes, denoises and stitches
				// the light maps and assigns them to the materials

				lightBaker = new LightBaker( renderer );

				dynamicObjects = createDynamicObjects();
				scene.add( ...dynamicObjects );

				await setScene();

				// GUI

				// the scene, the output and the algorithm, the other settings in folders

				const gui = renderer.inspector.createParameters( 'Light Baking' );
				sceneControl = gui.add( params, 'scene', Object.keys( scenes ) ).name( 'Scene' ).onChange( setScene );
				gui.add( { openGLTF }, 'openGLTF' ).name( 'Open glTF…' ).info( 'or drop a .glb, or a .gltf with its files, onto the page' );
				gui.add( params, 'output', [ 'Baked GI', 'Live GI' ] ).name( 'Output' ).onChange( setOutput );
				gui.add( params, 'algorithm', Object.keys( algorithms ) ).name( 'GI Algorithm' ).onChange( bake );
				gui.add( { bake }, 'bake' ).name( 'Re-Bake GI' );

				const lightMapFolder = gui.addFolder( 'Light Map' ).close();
				lightMapFolder.add( params, 'resolution', [ 256, 1024, 2048, 4096 ] ).name( 'Resolution' ).listen().onChange( bake );
				lightMapFolder.add( params, 'pageSize', [ 1024, 2048, 4096 ] ).name( 'Max Page Size' ).listen().onChange( bake );
				lightMapFolder.add( params, 'directLight', [ 'Live', 'Baked' ] ).name( 'Direct Light' ).onChange( bake );
				lightMapFolder.add( params, 'directions', [ 16, 64, 144 ] ).name( 'Stochastic Directions' ).onChange( () => params.algorithm === 'Stochastic Radiosity' && bake() );
				lightMapFolder.add( params, 'denoise' ).name( 'Denoise' ).onChange( setDenoise );
				lightMapFolder.add( params, 'stitchSeams' ).name( 'Stitch Seams' ).onChange( () => {

					lightBaker.stitchSeams = params.stitchSeams;
					lightBaker.process();

				} );
				lightMapFolder.add( params, 'directionalLightMap' ).name( 'Directional' ).onChange( () => params.directionalLightMap && lightBaker.lightMapper.directionTexture === null ? bake() : applyLightMaps() );
				lightMapFolder.add( params, 'lightMapSpecular' ).name( 'Specular' ).onChange( applyLightMaps );

				const probesFolder = gui.addFolder( 'Probes' ).close();
				probesFolder.add( params, 'dynamicObject' ).name( 'Dynamic Objects' ).info( 'a sphere and a knot that light probes light' ).onChange( () => liveOutput.reset() );
				probesFolder.add( params, 'reflections' ).name( 'Reflections' ).onChange( () => liveOutput.reset() );

				// the lighting of glTF files: their lights, or a sky and a sun

				gltfFolder = gui.addFolder( 'glTF Lighting' ).close();
				uv1Control = gltfFolder.add( params, 'keepUV1' ).name( 'Keep uv1' ).info( 'bake into the light map UVs of the file instead of unwrapping new ones' ).listen().onChange( reloadGLTF );
				gltfFolder.add( params, 'sky', skies ).name( 'Sky' ).listen().onChange( setGLTFLighting );
				gltfFolder.add( params, 'sun' ).name( 'Sun' ).listen().onChange( setGLTFLighting );
				gltfFolder.add( params, 'sunElevation', 0, 90, 1 ).name( 'Sun Elevation' ).listen().onChange( setGLTFLighting );
				gltfFolder.add( params, 'sunAzimuth', 0, 360, 1 ).name( 'Sun Azimuth' ).listen().onChange( setGLTFLighting );
				gltfFolder.add( params, 'sunIntensity', 0, 10, 0.1 ).name( 'Sun Intensity' ).listen().onChange( setGLTFLighting );
				gltfFolder.add( params, 'exposure', 0.1, 16, 0.1 ).name( 'Exposure' ).listen().onChange( () => world.exposure = renderer.toneMappingExposure = params.exposure );

				showWorldControls();
				showOutput();

				window.addEventListener( 'resize', onWindowResize );

				// drop a .glb, or a .gltf with its buffers and textures, onto the page

				window.addEventListener( 'dragover', ( event ) => event.preventDefault() );
				window.addEventListener( 'drop', ( event ) => {

					event.preventDefault();

					if ( event.dataTransfer.files.length > 0 ) loadGLTFFiles( event.dataTransfer.files );

				} );

				renderer.setAnimationLoop( animate );

			}

			async function setScene() {

				if ( busy ) return;

				busy = true;

				try {

					if ( worlds[ params.scene ] === undefined ) {

						status.textContent = `Loading ${ params.scene }…`;
						worlds[ params.scene ] = await scenes[ params.scene ]();

					}

				} finally {

					busy = false;

				}

				showWorld( worlds[ params.scene ] );

				await bake();

			}

			function showWorld( next ) {

				if ( world !== undefined ) scene.remove( world.root );

				world = next;
				scene.add( world.root );
				scene.background = world.background;
				renderer.toneMappingExposure = world.exposure ?? 1;

				params.resolution = world.atlasResolution ?? world.resolution;
				params.pageSize = world.pageSize ?? params.pageSize;

				camera.near = world.near ?? 0.1;
				camera.far = world.far ?? 100;
				camera.updateProjectionMatrix();
				camera.position.copy( world.camera );
				controls.target.copy( world.target );
				controls.update();

				meshes = [];
				world.root.traverse( ( object ) => object.isMesh && meshes.push( object ) );
				world.sourceMaterials ??= new Set( meshes.flatMap( ( mesh ) => [ mesh.material ].flat() ) );

				warning.textContent = world.warnings ?? '';

				if ( world.gltf !== undefined ) Object.assign( params, world.gltf.lighting, { keepUV1: world.gltf.keepUV1, exposure: world.exposure ?? 1 } );

				showWorldControls();

			}

			function showWorldControls() {

				// the lighting controls of your own glTF files

				if ( gltfFolder === undefined ) return;

				if ( world.gltf !== undefined ) gltfFolder.show();
				else gltfFolder.hide();

				if ( world.hasUV1 ) uv1Control.show();
				else uv1Control.hide();

			}

			function createCornellBox() {

				const root = new THREE.Group();

				const wallMaterial = new THREE.MeshStandardMaterial( { color: 0xcccccc } );
				const redMaterial = new THREE.MeshStandardMaterial( { color: 0xff0000 } );
				const greenMaterial = new THREE.MeshStandardMaterial( { color: 0x00ff00 } );

				// Floor
				const floor = new THREE.Mesh( new THREE.PlaneGeometry( 6, 6 ), wallMaterial );
				floor.rotation.x = - Math.PI / 2;
				floor.receiveShadow = true;
				root.add( floor );

				// Ceiling
				const ceiling = new THREE.Mesh( new THREE.PlaneGeometry( 6, 6 ), wallMaterial );
				ceiling.rotation.x = Math.PI / 2;
				ceiling.position.y = 5;
				ceiling.receiveShadow = true;
				root.add( ceiling );

				// Back wall
				const backWall = new THREE.Mesh( new THREE.PlaneGeometry( 6, 5 ), wallMaterial );
				backWall.position.set( 0, 2.5, - 3 );
				backWall.receiveShadow = true;
				root.add( backWall );

				// Front wall
				const frontWall = new THREE.Mesh( new THREE.PlaneGeometry( 6, 5 ), wallMaterial );
				frontWall.rotation.y = Math.PI;
				frontWall.position.set( 0, 2.5, 3 );
				frontWall.receiveShadow = true;
				root.add( frontWall );

				// Left wall (red)
				const leftWall = new THREE.Mesh( new THREE.PlaneGeometry( 6, 5 ), redMaterial );
				leftWall.rotation.y = Math.PI / 2;
				leftWall.position.set( - 3, 2.5, 0 );
				leftWall.receiveShadow = true;
				root.add( leftWall );

				// Right wall (green)
				const rightWall = new THREE.Mesh( new THREE.PlaneGeometry( 6, 5 ), greenMaterial );
				rightWall.rotation.y = - Math.PI / 2;
				rightWall.position.set( 3, 2.5, 0 );
				rightWall.receiveShadow = true;
				root.add( rightWall );

				// Objects inside the box

				const objectMaterial = new THREE.MeshStandardMaterial( { color: 0xeeeeee } );

				// Tall box
				const tallBox = new THREE.Mesh( new THREE.BoxGeometry( 1.2, 2.5, 1.2 ), objectMaterial );
				tallBox.position.set( - 0.8, 1.25, - 0.8 );
				tallBox.rotation.y = Math.PI / 8;
				tallBox.castShadow = true;
				tallBox.receiveShadow = true;
				root.add( tallBox );

				// Glossy sphere, to show direct specular lighting (Light Probe and VXGI)
				const glossyMaterial = new THREE.MeshStandardMaterial( { color: 0x0044ff, roughness: 0.15 } );
				const glossySphere = new THREE.Mesh( new THREE.SphereGeometry( 0.65, 32, 32 ), glossyMaterial );
				glossySphere.position.set( 1, 0.65, 0.5 );
				glossySphere.castShadow = true;
				glossySphere.receiveShadow = true;
				root.add( glossySphere );

				// Lights: both radiosity solvers bake the direct light of an emissive area light panel with
				// soft shadows, light probes and VXGI bake the indirect light of a live point light
				const lightPanel = new THREE.Mesh( new THREE.PlaneGeometry( 2, 2 ), new THREE.MeshStandardMaterial( { color: 0x000000, emissive: 0xffffff, emissiveIntensity: 20 } ) );
				lightPanel.rotation.x = Math.PI / 2;
				lightPanel.position.y = 4.99;
				root.add( lightPanel );

				const light = new THREE.PointLight( 0xffffff, 40 );
				light.position.set( 0, 4.5, 0 );
				light.castShadow = true;
				light.shadow.mapSize.setScalar( 256 );
				light.shadow.radius = 10;
				light.shadow.normalBias = - 0.02;
				root.add( light );

				return {
					root, light, lightPanel, background: new THREE.Color( 0x111111 ), resolution: 1024, cacheSize: 256,
					camera: new THREE.Vector3( 0, 2.5, 8 ), target: new THREE.Vector3( 0, 2.5, 0 ),
					path: [[ - 2.2, 0.55, - 2.2 ], [ - 2.3, 1.3, 0.3 ], [ - 1.1, 2.4, 1.8 ], [ 1, 1.9, 1.9 ], [ 2.3, 1.1, 0.1 ], [ 2, 0.55, - 2.1 ], [ 0.5, 1, - 2.3 ], [ - 0.9, 0.6, - 2.4 ]], objectSize: 0.3,
					reflections: [ { position: [ 0.4, 1.6, 1.3 ], box: [ - 3, 0, - 3, 3, 5, 3 ] }, { position: [ 0.6, 1.6, - 1.9 ], box: [ - 3, 0, - 3, 3, 5, 3 ] } ],
					probes: { size: new THREE.Vector3( 5.6, 4.7, 5.6 ), position: new THREE.Vector3( 0, 2.45, 0 ), counts: [ 8, 8, 8 ], far: 20 }
				};

			}

			async function loadCourtyard() {

				// a two storey cloister at sunrise, lit by the sky. It has no outer walls, their outside would only
				// take light map space and bake time

				const sky = await new HDRLoader().loadAsync( 'textures/equirectangular/blouberg_sunrise_2_1k.hdr' );
				sky.mapping = THREE.EquirectangularReflectionMapping;

				const root = new THREE.Group();

				const stone = new THREE.MeshStandardMaterial( { color: 0xddd0b8 } );
				const plaster = new THREE.MeshStandardMaterial( { color: 0xd9a066 } );
				const tiles = new THREE.MeshStandardMaterial( { color: 0xb59a7e } );
				const water = new THREE.MeshStandardMaterial( { color: 0x3c7a8a } );
				const leaves = new THREE.MeshStandardMaterial( { color: 0x4a7a32 } );
				const banners = [ 0xb02a20, 0x2a4ab0, 0xd8a020, 0x2a8a50 ].map( ( color ) => new THREE.MeshStandardMaterial( { color } ) );

				function add( parent, geometry, material, x, y, z ) {

					const mesh = new THREE.Mesh( geometry, material );
					mesh.position.set( x, y, z );
					parent.add( mesh );
					return mesh;

				}

				// the courtyard facade of a wing in one piece, so that no seams show: arches down to the floor below,
				// and above a parapet upstairs

				const arches = [ - 4.5, - 1.5, 1.5, 4.5 ];
				const facadeShape = new THREE.Shape().moveTo( - 6.5, 0 );

				for ( const x of arches ) facadeShape.lineTo( x - 1, 0 ).lineTo( x - 1, 2.4 ).absarc( x, 2.4, 1, Math.PI, 0, true ).lineTo( x + 1, 0 );

				facadeShape.lineTo( 6, 0 ).lineTo( 6, 7.5 ).lineTo( - 6.5, 7.5 ).closePath();

				for ( const x of arches ) facadeShape.holes.push( new THREE.Path().moveTo( x + 0.9, 5.2 ).lineTo( x + 0.9, 5.8 ).absarc( x, 5.8, 0.9, 0, Math.PI ).lineTo( x - 0.9, 5.2 ).closePath() );

				const facade = new THREE.ExtrudeGeometry( facadeShape, { depth: 0.5, bevelEnabled: false, curveSegments: 16 } );
				const floorSlab = new THREE.BoxGeometry( 15.5, 0.3, 2.5 );
				const roof = new THREE.BoxGeometry( 15.2, 0.3, 3.8 );
				const banner = new THREE.PlaneGeometry( 0.7, 2.4 );

				// four wings, each one covers the corner on its left so that the walls do not overlap

				for ( let i = 0; i < 4; i ++ ) {

					const wing = new THREE.Group();
					wing.rotation.y = - i * Math.PI / 2;
					root.add( wing );

					add( wing, facade, stone, 0, 0, - 6.5 );
					add( wing, floorSlab, stone, - 1.25, 4.15, - 7.75 );
					add( wing, roof, stone, - 1.9, 7.65, - 7.6 );

					for ( const x of [ - 3, 0, 3 ] ) add( wing, banner, banners[ i ], x, 6.25, - 5.95 );

				}

				add( root, new THREE.PlaneGeometry( 19, 19 ), tiles, 0, 0, 0 ).rotation.x = - Math.PI / 2;

				// fountain

				const octagon = ( radius ) => Array.from( { length: 8 }, ( v, i ) => new THREE.Vector2( radius, 0 ).rotateAround( new THREE.Vector2(), ( i + 0.5 ) * Math.PI / 4 ) );

				const basin = new THREE.Shape( octagon( 1.9 ) );
				basin.holes.push( new THREE.Path( octagon( 1.6 ) ) );

				add( root, new THREE.ExtrudeGeometry( basin, { depth: 0.55, bevelEnabled: false } ), stone, 0, 0, 0 ).rotation.x = - Math.PI / 2;
				add( root, new THREE.ShapeGeometry( new THREE.Shape( octagon( 1.6 ) ) ), water, 0, 0.4, 0 ).rotation.x = - Math.PI / 2;
				add( root, new THREE.CylinderGeometry( 0.2, 0.3, 1.3, 16 ), stone, 0, 0.65, 0 );
				add( root, new THREE.CylinderGeometry( 0.8, 0.3, 0.3, 16 ), stone, 0, 1.45, 0 );
				add( root, new THREE.SphereGeometry( 0.25, 16, 12 ), stone, 0, 1.85, 0 );

				// cypresses in planters

				for ( const [ x, z ] of [[ - 4.6, - 4.6 ], [ 4.6, - 4.6 ], [ 4.6, 4.6 ], [ - 4.6, 4.6 ]] ) {

				// their page, which also adds a highlight of the baked light. Live GI lights them with all lights

				lightBaker.setOptions( { directional: params.directionalLightMap, specularIntensity: params.lightMapSpecular ? 1 : 0 } );
				lightBaker.apply();

				if ( params.output === 'Live GI' ) {

					for ( const material of materials ) material.lightsNode = null;

				}

			}

			function showOutput() {

				const live = params.output === 'Live GI';

				for ( const material of materials ) material.lightMapIntensity = live ? 0 : 1;

				renderPipeline.outputNode = live ? liveOutput : bakedPass;
				renderPipeline.needsUpdate = true;

			}

			function setDenoise() {

				lightBaker.denoise = params.denoise;

				// a bake that stopped at the tolerance of the denoiser continues without it

				if ( lightBaker.baking === false && params.output === 'Baked GI' && lightBaker.converged === false ) startBake();

				lightBaker.process();

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				// no new frames while the GPU is more than three frames behind, slow GPUs, e.g. of phones, are not
				// handed more frames than they render

				if ( framesInFlight > 3 ) return;

				framesInFlight ++;

				render();

				renderer.backend.device.queue.onSubmittedWorkDone().then( () => framesInFlight -- );

			}

			function render() {

				if ( busy || lightBaker.lightMapper === null ) {

					renderPipeline.render();
					return;

				}

				const noise = lightBaker.noise;
				const noiseText = noise === Infinity ? 'estimating noise' : `${ ( noise * 100 ).toFixed( 1 ) }% noise`;
				const bakeTime = lightBaker.time;

				if ( params.output === 'Live GI' ) {

					liveFrame.value = ( liveFrame.value + 1 ) % 64;
					status.textContent = `Live ${ params.algorithm }: ${ liveOutput.frames } frames`;

				} else if ( lightBaker.baking ) {

					status.textContent = `Baking ${ params.algorithm }: ${ lightBaker.samples } samples, ${ noiseText }, ${ bakeTime.toFixed( 1 ) } s`;

				} else {

					const pages = lightBaker.lightMapper.pages.length;

					status.textContent = `${ params.algorithm } baked: ${ lightBaker.samples } samples, ${ noiseText }, in ${ bakeTime.toFixed( 1 ) } s` + ( pages > 1 ? `, ${ pages } pages of ${ lightBaker.lightMapper.size }²` : '' );

				}

				updateProbes();

				renderPipeline.render();

			}

		</script>
	</body>
</html>
