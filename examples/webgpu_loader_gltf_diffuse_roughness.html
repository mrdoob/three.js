<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - glTF + diffuseRoughness</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - glTF + diffuseRoughness">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_loader_gltf_diffuse_roughness.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_loader_gltf_diffuse_roughness.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>

	<body>
		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>glTF + diffuseRoughness</span>
			</div>

			<small>
				<a href="https://github.com/KhronosGroup/glTF/pull/2481" target="_blank" rel="noopener">KHR_materials_diffuse_roughness</a> parameter sweep from <a href="https://github.com/KhronosGroup/glTF-Sample-Assets/pull/288" target="_blank" rel="noopener">glTF-Sample-Assets</a>
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';

			let camera, scene, renderer, controls;

			init();

			async function init() {

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = THREE.NeutralToneMapping;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				scene = new THREE.Scene();
				scene.backgroundBlurriness = 0.5;

				const pmremGenerator = new THREE.PMREMGenerator( renderer );
				const envMap = pmremGenerator.fromScene( new RoomEnvironment(), 0.04 ).texture;

				scene.background = envMap;
				scene.environment = envMap;

				camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 0, 10 );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
			
				const gltf = await new GLTFLoader()
					.setPath( 'models/gltf/' )
					.loadAsync( 'DiffuseRoughnessParameterSweep.glb' );
				const model = gltf.scene;

				// The draft sample asset currently uses clockwise triangle winding.
				const geometries = new Set();

				model.traverse( function ( object ) {

					const geometry = object.geometry;

					if ( geometry === undefined ) return;

					if ( geometries.has( geometry ) ) return;

					const index = geometry.index;

					for ( let i = 0; i < index.count; i += 3 ) {

						const second = index.getX( i + 1 );
						index.setX( i + 1, index.getX( i + 2 ) );
						index.setX( i + 2, second );

					}

					index.needsUpdate = true;
					geometries.add( geometry );

				} );

				scene.add( model );

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				controls.update();
				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
