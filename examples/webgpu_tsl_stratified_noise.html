<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - stratified noise</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - stratified noise">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_tsl_stratified_noise.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_tsl_stratified_noise.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			.label {
				position: absolute;
				bottom: 20px;
				width: 50%;
				text-align: center;
				color: #fff;
				font: 600 14px 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
				text-shadow: 0 0 4px #000, 0 0 4px #000;
				pointer-events: none;
			}
		</style>
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Stratified Noise</span>
			</div>

			<small>
				White noise vs. <a href="https://ben3d.ca/blog/houston-stratified-noise" target="_blank" rel="noopener">Houston Stratified Noise</a> and animated <a href="https://www.iryoku.com/next-generation-post-processing-in-call-of-duty-advanced-warfare/" target="_blank" rel="noopener">interleaved gradient noise</a> (Jorge Jimenez) by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a>.<br/>A 1-bit dithered sphere or a uniform noise field, accumulated over time.<br/>Frames accumulated: <span id="frames">0</span>
			</small>
		</div>

		<div class="label" style="left: 0;">White Noise</div>
		<div class="label" id="noiseLabel" style="right: 0;">Houston Stratified Noise</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { Fn, float, hash, interleavedGradientNoise, mix, screenCoordinate, screenSize, screenUV, texture, uint, uniform, vec2, vec3, vec4 } from 'three/tsl';

			import { animatedInterleavedGradientNoise } from 'three/addons/tsl/utils/IGN.js';
			import { houstonStratifiedNoise } from 'three/addons/tsl/utils/HoustonStratifiedNoise.js';
			import { gaussianBlur } from 'three/addons/tsl/display/GaussianBlurNode.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';

			const modes = { 'Sphere': 0, 'Uniform': 1 };
			const noises = { 'Houston Stratified Noise': 4, 'Animated IGN': 0, 'IGN + Golden Ratio': 1, 'IGN + 4-Frame Offset': 2, 'Static IGN': 3 };
			const params = { mode: 'Sphere', noise: 'Houston Stratified Noise', pixelSize: 2, temporalBlur: true, spatialBlur: true, animate: true };

			let renderer, computeQuad, displayQuad, targets, history, current, display, blurredDisplay;
			let samples = 0;

			const framesElement = document.getElementById( 'frames' );

			const mode = uniform( modes[ params.mode ] );
			const noiseType = uniform( noises[ params.noise ] );
			const index = uniform( 0, 'uint' );
			const blend = uniform( 1 );

			init();

			async function init() {

				renderer = new THREE.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				targets = [ 0, 1 ].map( () => new THREE.RenderTarget( 1, 1, { type: THREE.FloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: false } ) );
				history = texture( targets[ 1 ].texture );
				current = texture( targets[ 0 ].texture );

				// noise

				const left = screenUV.x.lessThan( 0.5 );
				const white = hash( uint( screenCoordinate.x ).add( uint( screenCoordinate.y ).mul( 4096 ) ).add( index.mul( 16777259 ) ) );
				// static IGN animated three ways: scrolled, rotated by the golden ratio, or offset by a 4-frame table as in GTAO

				const ign = interleavedGradientNoise( screenCoordinate );
				const golden = ign.add( index.mul( uint( 2654435769 ) ).shiftRight( 8 ).toFloat().div( 16777216 ) ).fract();
				const offset4 = ign.add( float( index.bitAnd( 1 ) ).mul( 0.5 ) ).add( float( index.shiftRight( 1 ).bitAnd( 1 ) ).mul( 0.25 ) ).fract();
				const animated = animatedInterleavedGradientNoise( screenCoordinate, index );
				const hsn = houstonStratifiedNoise( screenCoordinate, index, 1 );

				const noise = left.select( white, noiseType.equal( 4 ).select( hsn, noiseType.equal( 0 ).select( animated, noiseType.equal( 1 ).select( golden, noiseType.equal( 2 ).select( offset4, ign ) ) ) ) );

				// the same shaded sphere over a gradient in each half

				const image = Fn( () => {

					const p = vec2( screenUV.x.mul( 2 ).fract().sub( 0.5 ).mul( screenSize.x.div( screenSize.y ).mul( 0.5 ) ), screenUV.y.sub( 0.5 ) );
					const r = float( 0.3 );
					const z = r.mul( r ).sub( p.dot( p ) );
					const normal = vec3( p.x, p.y.negate(), z.max( 0 ).sqrt() ).div( r );
					const shading = normal.dot( vec3( - 0.5, 0.6, 0.6 ).normalize() ).max( 0 ).mul( 0.9 ).add( 0.03 );
					return z.greaterThan( 0 ).select( shading, screenUV.x.mul( 2 ).fract().mul( 0.5 ) );

				} )();

				// 1 sample per frame, accumulated with a running average

				const sample = mode.equal( 0 ).select( noise.lessThan( image ).select( 1, 0 ), noise );
				const accumulated = mix( history.sample( screenUV ).r, sample, blend );

				computeQuad = new THREE.QuadMesh( new THREE.NodeMaterial() );
				computeQuad.material.fragmentNode = vec4( accumulated, 0, 0, 1 );

				// sigma = 0 selects a sigma = 1 Gaussian with kernel radius 3

				const divider = screenCoordinate.x.sub( screenSize.x.mul( 0.5 ) ).abs().lessThan( 1 );
				const output = ( channel ) => divider.select( vec4( 1, 0.3, 0.1, 1 ), vec4( vec3( channel ), 1 ) );

				display = output( current.sample( screenUV ).r );
				blurredDisplay = output( gaussianBlur( current, null, 0 ).r );

				displayQuad = new THREE.QuadMesh( new THREE.NodeMaterial() );
				displayQuad.material.fragmentNode = params.spatialBlur ? blurredDisplay : display;

				const gui = renderer.inspector.createParameters( 'Settings' );
				gui.add( params, 'mode', Object.keys( modes ) ).onChange( ( value ) => {

					mode.value = modes[ value ];
					samples = 0;

				} );
				gui.add( params, 'noise', Object.keys( noises ) ).onChange( ( value ) => {

					noiseType.value = noises[ value ];
					document.getElementById( 'noiseLabel' ).textContent = value;
					samples = 0;

				} );
				gui.add( params, 'pixelSize', 1, 8, 1 ).name( 'pixel size' ).onChange( onWindowResize );
				gui.add( params, 'temporalBlur' ).name( 'temporal blur' ).onChange( () => samples = 0 );
				gui.add( params, 'spatialBlur' ).name( 'spatial blur' ).onChange( ( value ) => {

					displayQuad.material.fragmentNode = value ? blurredDisplay : display;
					displayQuad.material.needsUpdate = true;

				} );
				gui.add( params, 'animate' ).onChange( () => samples = 0 );

				onWindowResize();
				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				renderer.setSize( window.innerWidth, window.innerHeight );

				const size = renderer.getDrawingBufferSize( new THREE.Vector2() ).divideScalar( params.pixelSize ).ceil();
				for ( const target of targets ) target.setSize( size.x, size.y );
				samples = 0;

			}

			function animate() {

				if ( computeQuad === undefined ) return;

				if ( samples === 0 ) index.value = 0;
				else if ( params.animate ) index.value ++;

				// temporal blur is a running average of every sample since the last reset

				samples ++;
				blend.value = params.temporalBlur ? 1 / samples : 1;
				framesElement.textContent = params.temporalBlur ? samples : 1;

				renderer.setRenderTarget( targets[ 0 ] );
				computeQuad.render( renderer );
				renderer.setRenderTarget( null );
				displayQuad.render( renderer );

				targets.reverse();
				history.value = targets[ 1 ].texture;
				current.value = targets[ 0 ].texture;

			}

		</script>

	</body>
</html>
