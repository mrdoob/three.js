<html lang="en">
	<head>
		<title>three.js webgpu - 2D FFT</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - 2D FFT">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_fft_2d.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_fft_2d.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a>
				<span>webgpu - 2D FFT</span>
			</div>

			<small>
				GPU 2D complex FFT (<a href="https://github.com/mrdoob/three.js/blob/dev/examples/jsm/gpgpu/FFT2D.js" target="_blank" rel="noopener">FFT2D</a>) via TSL compute shaders, WebGPU only, by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a>.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import {
				texture, storage, Fn, instanceIndex, uint, int, ivec2, uvec2, vec4, mix,
				storageTexture, textureStore, uniform, NodeAccess
			} from 'three/tsl';

			import WebGPU from 'three/addons/capabilities/WebGPU.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { FFT2D } from 'three/addons/gpgpu/FFT2D.js';
			import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';

			// FFT2D requires power-of-two width/height. `hdr: true` presets are latlong (equirectangular)
			// HDR images loaded as Float16 (HDRLoader's default `HalfFloatType`) instead of the usual
			// 8-bit LDR path -- the FFT pipeline works on float textures throughout regardless, so
			// this is just a different loader feeding the same complex-source packing step.
			const PRESETS = [
				{ name: 'Moonless Night (1024x512)', url: 'textures/equirectangular/moonless_golf_1k.hdr', hdr: true },
				{ name: 'Venice Sunset (1024x512)', url: 'textures/equirectangular/venice_sunset_1k.hdr', hdr: true },
				{ name: 'Pedestrian Overpass (1024x512)', url: 'textures/equirectangular/pedestrian_overpass_1k.hdr', hdr: true },
				{ name: 'Spruit Sunrise (1024x512)', url: 'textures/equirectangular/spruit_sunrise_1k.hdr', hdr: true },
				{ name: 'Colors (128x128)', url: 'textures/colors.png' },
				{ name: 'Disturb (512x512)', url: 'textures/disturb.jpg' }
			];

			// Filter mask shapes, drawn with Canvas 2D (see drawFilterCanvas) rather than as TSL/SDF
			// shaders -- plain path/arc calls with ctx.rotate give exact shapes, free anti-aliasing
			// on the edges, and no shader math to hand-port.
			const SHAPES = [ 'circle', 'square', 'rectangle', 'star', 'bokeh' ];

			const CHANNELS = [ 'r', 'g', 'b' ];

			// Builds a `{ r, g, b }` object by calling `fn(channel)` once per channel.
			function buildPerChannel( fn ) {

				const result = {};

				for ( const c of CHANNELS ) result[ c ] = fn( c );

				return result;

			}

			let camera, scene, renderer, controls;
			let quadOriginal, quadFilter, quadSpectrum, quadFilterSpectrum, quadConvolution, quadReconstructed;
			let labelOriginal, labelFilter, labelSpectrum, labelFilterSpectrum, labelConvolution, labelReconstructed;

			// GPU resources that only depend on (width, height), keyed by "WxH" and reused across
			// presets of the same size: the per-channel FFT2D instances, the filter's own FFT2D,
			// their complex textures, the display targets, and this example's own pack/multiply/
			// combine/probe kernels.
			const resourceCache = new Map();

			function getResources( width, height, sourceTexture ) {

				const key = `${ width }x${ height }`;
				let entry = resourceCache.get( key );

				if ( entry === undefined ) {

					entry = buildResources( width, height, sourceTexture );
					resourceCache.set( key, entry );

				}

				return entry;

			}

			// A float StorageTexture with (at least) 2 channels -- FFT2D's complex-number format,
			// `(real, imag)` in `.rg`.
			function createComplexTexture( width, height ) {

				const tex = new THREE.StorageTexture( width, height );
				tex.type = THREE.FloatType;
				tex.magFilter = THREE.NearestFilter;
				tex.minFilter = THREE.NearestFilter;
				tex.generateMipmaps = false;

				return tex;

			}

			// Builds everything one (width, height) needs: FFT2D instances (3 for the image's color
			// channels, 1 for the filter mask), their complex textures, the display targets, the
			// filter's own Canvas 2D mask, and the pack/multiply/combine/probe kernels.
			function buildResources( width, height, sourceTexture ) {

				const ffts = buildPerChannel( () => new FFT2D( width, height ) );
				const filterFFT = new FFT2D( width, height );

				const complexSource = buildPerChannel( () => createComplexTexture( width, height ) );
				const complexSpectrum = buildPerChannel( () => createComplexTexture( width, height ) );
				const complexConvolution = buildPerChannel( () => createComplexTexture( width, height ) );
				const complexReconstructed = buildPerChannel( () => createComplexTexture( width, height ) );

				const complexFilterSource = createComplexTexture( width, height );
				const complexFilterSpectrum = createComplexTexture( width, height );

				const spectrumTexture = new THREE.StorageTexture( width, height );
				const filterSpectrumTexture = new THREE.StorageTexture( width, height );
				const convolutionTexture = new THREE.StorageTexture( width, height );
				const reconstructedTexture = new THREE.StorageTexture( width, height );

				for ( const tex of [ spectrumTexture, filterSpectrumTexture, convolutionTexture, reconstructedTexture ] ) {

					tex.magFilter = THREE.NearestFilter;
					tex.minFilter = THREE.NearestFilter;
					tex.generateMipmaps = false;

				}

				// The filter mask itself: drawn centered (for display and so "radius"/"rotation"
				// read naturally) into a plain 2D canvas, at the same resolution as the image so it
				// can be packed straight into an FFT input. Grayscale, black background / white
				// shape -- exactly what's wanted for the "Filter" display quad too.
				const filterCanvas = document.createElement( 'canvas' );
				filterCanvas.width = width;
				filterCanvas.height = height;

				const filterCanvasTexture = new THREE.CanvasTexture( filterCanvas );
				filterCanvasTexture.colorSpace = THREE.NoColorSpace;
				filterCanvasTexture.flipY = true;
				filterCanvasTexture.magFilter = THREE.NearestFilter;
				filterCanvasTexture.minFilter = THREE.NearestFilter;
				filterCanvasTexture.generateMipmaps = false;
				filterCanvasTexture.wrapS = THREE.ClampToEdgeWrapping;
				filterCanvasTexture.wrapT = THREE.ClampToEdgeWrapping;

				return {
					width, height, ffts, filterFFT,
					complexSource, complexSpectrum, complexConvolution, complexReconstructed,
					complexFilterSource, complexFilterSpectrum,
					spectrumTexture, filterSpectrumTexture, convolutionTexture, reconstructedTexture,
					filterCanvas, filterCanvasTexture,
					pack: buildPackKernel( width, height, sourceTexture, complexSource.r ),
					multiply: buildMultiplyKernel( width, height, complexSpectrum.r, complexFilterSpectrum, complexConvolution.r ),
					combine: buildCombineKernel( width, height, complexSpectrum, spectrumTexture ),
					probe: buildProbeKernel( width, complexSpectrum.r )
				};

			}

			let loadedTexture = null;
			let currentResources = null;

			// Bumped on every recompute (image load or filter-parameter change); an in-flight call
			// whose generation is stale after an await (superseded by a newer change) bails out
			// instead of clobbering newer state.
			let generation = 0;

			const textureLoader = new THREE.TextureLoader();
			const hdrLoader = new HDRLoader();

			const params = {
				image: PRESETS[ 0 ].name,
				filterShape: 'bokeh',
				filterRadius: 25,
				filterRotation: 0
			};

			init();

			async function init() {

				if ( WebGPU.isAvailable() === false ) {

					document.body.appendChild( WebGPU.getErrorMessage() );

					throw new Error( 'No WebGPU support' );

				}

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x111111 );

				camera = new THREE.OrthographicCamera( - 1, 1, 1, - 1, 0, 10 );
				camera.position.z = 5;

				// Rebuilt (not reassigned) per preset in setQuadMaterial -- reassigning `.map` on an
				// existing material doesn't reliably trigger a WebGPURenderer node-graph rebuild.
				quadOriginal = new THREE.Mesh( new THREE.PlaneGeometry( 1, 1 ), new THREE.MeshBasicMaterial() );
				quadFilter = new THREE.Mesh( new THREE.PlaneGeometry( 1, 1 ), new THREE.MeshBasicMaterial() );
				quadSpectrum = new THREE.Mesh( new THREE.PlaneGeometry( 1, 1 ), new THREE.MeshBasicMaterial() );
				quadFilterSpectrum = new THREE.Mesh( new THREE.PlaneGeometry( 1, 1 ), new THREE.MeshBasicMaterial() );
				quadConvolution = new THREE.Mesh( new THREE.PlaneGeometry( 1, 1 ), new THREE.MeshBasicMaterial() );
				quadReconstructed = new THREE.Mesh( new THREE.PlaneGeometry( 1, 1 ), new THREE.MeshBasicMaterial() );

				labelOriginal = createLabelMesh( 'Original Image' );
				labelFilter = createLabelMesh( 'Filter' );
				labelSpectrum = createLabelMesh( 'Spectrum' );
				labelFilterSpectrum = createLabelMesh( 'Filter Spectrum' );
				labelConvolution = createLabelMesh( 'Convolution' );
				labelReconstructed = createLabelMesh( 'Reconstructed Image' );

				scene.add(
					quadOriginal, quadFilter, quadSpectrum, quadFilterSpectrum, quadConvolution, quadReconstructed,
					labelOriginal, labelFilter, labelSpectrum, labelFilterSpectrum, labelConvolution, labelReconstructed
				);

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableRotate = false;
				controls.screenSpacePanning = true;

				const gui = renderer.inspector.createParameters( 'FFT' );

				gui.add( params, 'image', PRESETS.map( ( p ) => p.name ) ).name( 'image' ).onChange( ( name ) => {

					const preset = PRESETS.find( ( p ) => p.name === name );

					loadPreset( preset );

				} );

				const filterFolder = gui.addFolder( 'filter' );
				filterFolder.add( params, 'filterShape', SHAPES ).name( 'shape' ).onChange( () => updateFilter() );
				filterFolder.add( params, 'filterRadius', 1, 512, 1 ).name( 'radius (px)' ).onChange( () => updateFilter() );
				filterFolder.add( params, 'filterRotation', 0, 360, 1 ).name( 'rotation (deg)' ).onChange( () => updateFilter() );

				window.addEventListener( 'resize', onWindowResize );

				await loadPreset( PRESETS[ 0 ] );

				// After the first FFT has painted -- an earlier loop would screenshot an empty canvas.
				renderer.setAnimationLoop( render );

			}

			async function loadPreset( preset ) {

				const myGeneration = ++ generation;

				let newTexture;

				if ( preset.hdr ) {

					// HDRLoader is a DataTextureLoader: it parses the whole file into a ready-to-use
					// DataTexture before resolving, so there's no separate decode step to await.
					newTexture = await hdrLoader.loadAsync( preset.url );

				} else {

					newTexture = await textureLoader.loadAsync( preset.url );

					// `loadAsync` resolves once bytes arrive but not necessarily once decoded (including
					// ICC color profile); without this, the very first load of an image can get uploaded
					// mid-decode and render wrong (e.g. temporarily desaturated).
					await newTexture.image.decode();

				}

				if ( myGeneration !== generation ) { newTexture.dispose(); return; }

				newTexture.colorSpace = THREE.NoColorSpace;
				newTexture.flipY = true;
				newTexture.magFilter = THREE.NearestFilter;
				newTexture.minFilter = THREE.NearestFilter;
				newTexture.generateMipmaps = false;
				newTexture.wrapS = THREE.ClampToEdgeWrapping;
				newTexture.wrapT = THREE.ClampToEdgeWrapping;

				const width = newTexture.image.width;
				const height = newTexture.image.height;

				loadedTexture?.dispose();
				loadedTexture = newTexture;

				const resources = getResources( width, height, loadedTexture );
				currentResources = resources;

				assignQuadMaterials( resources );
				layoutQuads( width, height );

				const ok = await computeSourceSpectrum( renderer, resources, myGeneration );
				if ( ! ok ) return;

				await computeFilterAndConvolution( renderer, resources, myGeneration );
				if ( myGeneration !== generation ) return;

				render();

			}

			// Re-draws the filter mask and re-runs filter FFT + spectral multiply + inverse FFT,
			// without touching the (unchanged) source image spectrum. Wired to the filter GUI controls.
			async function updateFilter() {

				if ( loadedTexture === null || currentResources === null ) return;

				const myGeneration = ++ generation;

				await computeFilterAndConvolution( renderer, currentResources, myGeneration );
				if ( myGeneration !== generation ) return;

				render();

			}

			function assignQuadMaterials( resources ) {

				setQuadMaterial( quadOriginal, loadedTexture );
				setQuadMaterial( quadFilter, resources.filterCanvasTexture );
				setQuadMaterial( quadSpectrum, resources.spectrumTexture );
				setQuadMaterial( quadFilterSpectrum, resources.filterSpectrumTexture );
				setQuadMaterial( quadConvolution, resources.convolutionTexture );
				setQuadMaterial( quadReconstructed, resources.reconstructedTexture );

			}

			// Packs + forward-FFTs each color channel of the source image, reading back its DC bin
			// along the way. For a non-negative-real input the DC bin always has the largest
			// magnitude (triangle inequality on the DFT sum), so the largest of the 3 feeds a shared
			// log-scale below -- normalizing per-channel instead would wash out the R:G:B color
			// balance. Awaited per channel since all 3 share one cached probe kernel/buffer.
			async function computeSourceSpectrum( renderer, resources, myGeneration ) {

				const { ffts, complexSource, complexSpectrum, spectrumTexture } = resources;

				const dcMagnitudes = [];

				for ( let i = 0; i < CHANNELS.length; i ++ ) {

					const c = CHANNELS[ i ];

					packChannel( renderer, resources, loadedTexture, complexSource[ c ], i );
					ffts[ c ].computeForward( renderer, complexSource[ c ], complexSpectrum[ c ] );

					const dc = await readBin( renderer, resources, complexSpectrum[ c ], 0 );
					dcMagnitudes.push( Math.hypot( dc.real, dc.imag ) );

				}

				if ( myGeneration !== generation ) return false;

				const maxMagnitude = Math.max( ...dcMagnitudes );

				combineChannels( renderer, resources, complexSpectrum, spectrumTexture, { mode: 'log', scale: 1 / Math.log( 1 + maxMagnitude ), shift: true } );

				return true;

			}

			// Draws the current filter shape, FFTs it, multiplies it (as a complex spectrum) into
			// each color channel's spectrum -- the convolution theorem: multiplying spectra is
			// equivalent to convolving the images -- and inverse-FFTs the result back to a displayable
			// reconstruction.
			async function computeFilterAndConvolution( renderer, resources, myGeneration ) {

				const {
					filterFFT, complexFilterSource, complexFilterSpectrum, filterCanvas, filterCanvasTexture,
					complexSpectrum, complexConvolution, complexReconstructed, ffts,
					filterSpectrumTexture, convolutionTexture, reconstructedTexture
				} = resources;

				drawFilterCanvas( filterCanvas, params );
				filterCanvasTexture.needsUpdate = true;

				// The mask is drawn centered (nice for display / intuitive radius+rotation), but an
				// FFT expects its kernel's origin at pixel (0,0), wrapped across the edges -- so the
				// pack step reads the canvas through a quadrant shift (an "ifftshift"), moving the
				// centered shape out to the four corners before the FFT ever sees it.
				packChannel( renderer, resources, filterCanvasTexture, complexFilterSource, 0, { shift: true } );

				filterFFT.computeForward( renderer, complexFilterSource, complexFilterSpectrum );

				const filterDC = await readBin( renderer, resources, complexFilterSpectrum, 0 );
				if ( myGeneration !== generation ) return;

				// The DC bin of a non-negative-real filter's spectrum is its pixel sum -- i.e. the
				// filter's total strength. Used both to log-scale the filter spectrum display and
				// to divide the convolution back down to that same sum, so the reconstruction's
				// overall brightness doesn't shift with filter size/shape.
				const filterStrength = Math.hypot( filterDC.real, filterDC.imag );

				combineChannels( renderer, resources, { r: complexFilterSpectrum, g: complexFilterSpectrum, b: complexFilterSpectrum }, filterSpectrumTexture, { mode: 'log', scale: 1 / Math.log( 1 + filterStrength ), shift: true } );

				const scale = filterStrength > 0 ? 1 / filterStrength : 1;

				for ( const c of CHANNELS ) {

					multiplySpectrum( renderer, resources, complexSpectrum[ c ], complexFilterSpectrum, complexConvolution[ c ], scale );

				}

				const convDcMagnitudes = [];

				for ( const c of CHANNELS ) {

					const dc = await readBin( renderer, resources, complexConvolution[ c ], 0 );
					convDcMagnitudes.push( Math.hypot( dc.real, dc.imag ) );

				}

				if ( myGeneration !== generation ) return;

				const convMaxMagnitude = Math.max( ...convDcMagnitudes ) || 1;

				combineChannels( renderer, resources, complexConvolution, convolutionTexture, { mode: 'log', scale: 1 / Math.log( 1 + convMaxMagnitude ), shift: true } );

				for ( const c of CHANNELS ) ffts[ c ].computeInverse( renderer, complexConvolution[ c ], complexReconstructed[ c ] );

				combineChannels( renderer, resources, complexReconstructed, reconstructedTexture, { mode: 'linear', scale: 1 } );

			}

			// --- Filter mask: plain Canvas 2D drawing, not a TSL shader -- ctx.rotate() handles the
			// rotation and native path fills give free anti-aliasing on the shape's edges.

			// Builds one shape's outline as a Path2D, centered on the origin, sized from `radius`
			// (pixels). Rectangle/square/star/bokeh are all defined so a given radius produces a
			// shape of roughly comparable extent to a circle of that radius.
			function buildShapePath( shape, radius ) {

				const path = new Path2D();

				switch ( shape ) {

					case 'square': {

						path.rect( - radius, - radius, radius * 2, radius * 2 );
						break;

					}

					case 'rectangle': {

						// 5:1 aspect ratio; radius is the longest side's half-extent, matching how it
						// sizes every other shape (e.g. the circle's radius is its full extent).
						const halfWidth = radius;
						const halfHeight = radius / 5;
						path.rect( - halfWidth, - halfHeight, halfWidth * 2, halfHeight * 2 );
						break;

					}

					case 'circle': {

						path.arc( 0, 0, radius, 0, Math.PI * 2 );
						break;

					}

					case 'star': {

						addPolygonPoints( path, radius, radius * 0.45, 5, - Math.PI / 2 );
						break;

					}

					case 'bokeh': {

						// A regular 7-sided aperture shape, matching a common real camera iris
						// blade count (most range 5-9 blades).
						addRegularPolygonPoints( path, radius, 7, - Math.PI / 2 );
						break;

					}

				}

				return path;

			}

			// Adds an N-pointed star to `path`, alternating outer/inner vertices starting at
			// `startAngle`.
			function addPolygonPoints( path, outerRadius, innerRadius, points, startAngle ) {

				for ( let i = 0; i < points * 2; i ++ ) {

					const r = ( i % 2 === 0 ) ? outerRadius : innerRadius;
					const angle = startAngle + ( i / ( points * 2 ) ) * Math.PI * 2;
					const x = Math.cos( angle ) * r;
					const y = Math.sin( angle ) * r;

					if ( i === 0 ) path.moveTo( x, y ); else path.lineTo( x, y );

				}

				path.closePath();

			}

			// Adds a plain regular N-gon to `path`, starting at `startAngle`.
			function addRegularPolygonPoints( path, radius, sides, startAngle ) {

				for ( let i = 0; i < sides; i ++ ) {

					const angle = startAngle + ( i / sides ) * Math.PI * 2;
					const x = Math.cos( angle ) * radius;
					const y = Math.sin( angle ) * radius;

					if ( i === 0 ) path.moveTo( x, y ); else path.lineTo( x, y );

				}

				path.closePath();

			}

			// Draws the current filter (black background, white shape, centered, rotated) into `canvas`.
			function drawFilterCanvas( canvas, { filterShape, filterRadius, filterRotation } ) {

				const { width, height } = canvas;
				const ctx = canvas.getContext( '2d' );

				ctx.setTransform( 1, 0, 0, 1, 0, 0 );
				ctx.fillStyle = '#000000';
				ctx.fillRect( 0, 0, width, height );

				ctx.translate( width / 2, height / 2 );
				ctx.rotate( THREE.MathUtils.degToRad( filterRotation ) );

				ctx.fillStyle = '#ffffff';
				ctx.fill( buildShapePath( filterShape, filterRadius ) );

			}

			// --- Example-only helpers: packing a channel into FFT2D's format, multiplying two
			// spectra, combining channels back into a displayable image, and reading back a single
			// bin. One kernel is built per size (in buildResources); each call below just re-points
			// its uniforms/textures.

			function buildPackKernel( width, height, initialSourceTexture, initialDestinationTexture ) {

				const sourceNode = texture( initialSourceTexture );
				const writeTex = storageTexture( initialDestinationTexture ).setAccess( NodeAccess.WRITE_ONLY );
				const channelUniform = uniform( 0, 'uint' );
				const shiftUniform = uniform( 0, 'uint' );

				const halfW = uint( width >> 1 );
				const halfH = uint( height >> 1 );

				const kernel = Fn( () => {

					const x = instanceIndex.mod( uint( width ) );
					const y = instanceIndex.div( uint( width ) );

					// Optional quadrant shift on the *read* side (an "ifftshift"): lets a centered
					// mask be packed as if its origin were at pixel (0,0), wrapped across the edges,
					// without changing how it's drawn/displayed.
					const sx = x.add( halfW.mul( shiftUniform ) ).mod( uint( width ) );
					const sy = y.add( halfH.mul( shiftUniform ) ).mod( uint( height ) );

					const texel = sourceNode.load( ivec2( int( sx ), int( sy ) ) );
					const value = channelUniform.equal( uint( 0 ) ).select( texel.r, channelUniform.equal( uint( 1 ) ).select( texel.g, texel.b ) );

					textureStore( writeTex, uvec2( x, y ), vec4( value, 0, 0, 1 ) );

				} )().compute( width * height );

				return { kernel, sourceNode, writeTex, channelUniform, shiftUniform };

			}

			// Packs one channel (channelIndex: 0/1/2 for r/g/b) of sourceTexture into
			// destinationTexture's `.rg` as a complex number (real = channel value, imag = 0).
			// `shift`: read sourceTexture through a quadrant shift first (see buildPackKernel).
			function packChannel( renderer, resources, sourceTexture, destinationTexture, channelIndex, { shift = false } = {} ) {

				const { kernel, sourceNode, writeTex, channelUniform, shiftUniform } = resources.pack;

				sourceNode.value = sourceTexture;
				writeTex.value = destinationTexture;
				channelUniform.value = channelIndex;
				shiftUniform.value = shift ? 1 : 0;

				renderer.compute( kernel );

			}

			// Elementwise complex multiply of two spectra -- the convolution theorem in action.
			// `a` varies per call (one of the image's 3 channel spectra); `filter` is the shared
			// filter spectrum, multiplied in and scaled by `scale` (see computeFilterAndConvolution).
			function buildMultiplyKernel( width, height, initialA, initialFilter, initialTarget ) {

				const aNode = texture( initialA );
				const filterNode = texture( initialFilter );
				const writeTex = storageTexture( initialTarget ).setAccess( NodeAccess.WRITE_ONLY );
				const scaleUniform = uniform( 1 );

				const kernel = Fn( () => {

					const x = instanceIndex.mod( uint( width ) );
					const y = instanceIndex.div( uint( width ) );
					const coord = ivec2( int( x ), int( y ) );

					const a = aNode.load( coord ).rg;
					const f = filterNode.load( coord ).rg;

					// (a.x + a.y*i) * (f.x + f.y*i)
					const re = a.x.mul( f.x ).sub( a.y.mul( f.y ) ).mul( scaleUniform );
					const im = a.x.mul( f.y ).add( a.y.mul( f.x ) ).mul( scaleUniform );

					textureStore( writeTex, uvec2( x, y ), vec4( re, im, 0, 1 ) );

				} )().compute( width * height );

				return { kernel, aNode, filterNode, writeTex, scaleUniform };

			}

			function multiplySpectrum( renderer, resources, sourceSpectrum, filterSpectrum, target, scale ) {

				const { kernel, aNode, filterNode, writeTex, scaleUniform } = resources.multiply;

				aNode.value = sourceSpectrum;
				filterNode.value = filterSpectrum;
				writeTex.value = target;
				scaleUniform.value = scale;

				renderer.compute( kernel );

			}

			// Shared kernel for the spectrum, filter-spectrum, convolution, and reconstruction
			// views; everything they differ in (mode, quadrant shift, scale, and even whether all 3
			// channel inputs are the same texture for a grayscale display) is a uniform/re-pointed
			// texture node rather than a separate kernel.
			function buildCombineKernel( width, height, initialChannels, initialTarget ) {

				const halfW = width >> 1;
				const halfH = height >> 1;

				const rNode = texture( initialChannels.r );
				const gNode = texture( initialChannels.g );
				const bNode = texture( initialChannels.b );
				const writeTex = storageTexture( initialTarget ).setAccess( NodeAccess.WRITE_ONLY );

				const modeUniform = uniform( 0 );
				const shiftUniform = uniform( 0, 'uint' );
				const scaleUniform = uniform( 1 );

				const extract = ( channelNode, coord ) => {

					const texel = channelNode.load( coord );
					const linearValue = texel.r;
					const logValue = texel.rg.length().add( 1 ).log();

					return mix( linearValue, logValue, modeUniform ).mul( scaleUniform ).clamp( 0, 1 );

				};

				const kernel = Fn( () => {

					const x = instanceIndex.mod( uint( width ) );
					const y = instanceIndex.div( uint( width ) );

					// Quadrant shift (spectrum-like views only): moves the DC bin to the texture
					// center. A no-op when shiftUniform is 0.
					const sx = x.add( uint( halfW ).mul( shiftUniform ) ).mod( uint( width ) );
					const sy = y.add( uint( halfH ).mul( shiftUniform ) ).mod( uint( height ) );
					const coord = ivec2( int( sx ), int( sy ) );

					const value = vec4(
						extract( rNode, coord ),
						extract( gNode, coord ),
						extract( bNode, coord ),
						1
					);

					textureStore( writeTex, uvec2( x, y ), value );

				} )().compute( width * height );

				return { kernel, rNode, gNode, bNode, writeTex, modeUniform, shiftUniform, scaleUniform };

			}

			// Combines 3 per-channel complex textures into one RGBA display texture. `channels.r/g/b`
			// may all point at the same texture for a grayscale display (e.g. the filter's spectrum).
			// `mode: 'log'` displays magnitude on a log scale, quadrant-shifted (spectrum-like views,
			// call after a forward FFT / spectral multiply); `mode: 'linear'` displays the real part
			// directly (reconstruction view, call after computeInverse). `scale` is shared across all
			// 3 channels so relative color balance is preserved.
			function combineChannels( renderer, resources, channels, target, { mode = 'linear', scale = 1, shift = false } = {} ) {

				const { kernel, rNode, gNode, bNode, writeTex, modeUniform, shiftUniform, scaleUniform } = resources.combine;

				rNode.value = channels.r;
				gNode.value = channels.g;
				bNode.value = channels.b;
				writeTex.value = target;
				modeUniform.value = mode === 'log' ? 1 : 0;
				shiftUniform.value = shift ? 1 : 0;
				scaleUniform.value = scale;

				renderer.compute( kernel );

			}

			function buildProbeKernel( width, initialSourceTexture ) {

				const sourceNode = texture( initialSourceTexture );
				const indexUniform = uniform( 0, 'uint' );

				const probeAttribute = new THREE.StorageBufferAttribute( 1, 2 );
				const probeWrite = storage( probeAttribute, 'vec2', 1 );

				const kernel = Fn( () => {

					const x = indexUniform.mod( uint( width ) );
					const y = indexUniform.div( uint( width ) );

					probeWrite.element( 0 ).assign( sourceNode.load( ivec2( int( x ), int( y ) ) ).rg );

				} )().compute( 1 );

				return { kernel, sourceNode, indexUniform, probeWrite };

			}

			// Reads back a single complex bin (real, imag) from sourceTexture at a linear index,
			// without transferring the whole texture.
			async function readBin( renderer, resources, sourceTexture, index = 0 ) {

				const { kernel, sourceNode, indexUniform, probeWrite } = resources.probe;

				sourceNode.value = sourceTexture;
				indexUniform.value = index;

				renderer.compute( kernel );

				const data = new Float32Array( await renderer.getArrayBufferAsync( probeWrite.value ) );

				return { real: data[ 0 ], imag: data[ 1 ] };

			}

			// -------------------------------------------------------------------------------------

			function setQuadMaterial( quad, map ) {

				quad.material.dispose();
				quad.material = new THREE.MeshBasicMaterial( { map } );

			}

			let contentWidth = 3;
			let contentHeight = 1;

			// Lays out the 7 display elements (6 quads + the reconstructed image) in two tiers:
			// on top, a 2x2 grid of (original/filter) x (spectrum/filter spectrum) followed by the
			// convolution, each a column vertically centered against the grid's full height; below
			// that, spanning the full width of the three columns above it, the reconstructed image
			// -- sized larger since, as the pipeline's actual output, it's the most important view.
			function layoutQuads( width, height ) {

				const aspect = width / height;

				const cellHeight = 1.6;
				const cellWidth = cellHeight * aspect;
				const rowGap = cellHeight * 0.12;

				// Scaled off cellWidth (which already carries the aspect ratio), not cellHeight
				// (which is a fixed constant): the camera zooms out to fit the layout's full width,
				// and that width grows with aspect (wide images -> wider columns), so tying label
				// size to cellWidth keeps its on-screen size roughly constant instead of shrinking
				// as wider images are selected.
				const labelHeight = cellWidth * 0.1;
				const labelGap = cellWidth * 0.045;

				// A "slot" is a quad plus the label space reserved directly below it.
				const slotExtra = labelGap + labelHeight;

				// The 2x2 grid's two rows, each cellHeight tall, stacked with rowGap between them.
				const gridQuadHeight = cellHeight * 2 + rowGap;

				const topSlotY = ( cellHeight + slotExtra + rowGap ) / 2;
				const bottomSlotY = - topSlotY;

				// The convolution column is sized to match the grid's full height, and vertically
				// centered against it.
				const bigWidth = gridQuadHeight * aspect;

				const colGap = cellWidth * 0.25;
				const bigColGap = ( cellWidth + bigWidth ) / 2 * 0.25;

				const xCol1 = 0;
				const xCol2 = xCol1 + cellWidth + colGap;
				const xCol3 = xCol2 + cellWidth / 2 + bigColGap + bigWidth / 2;

				const topEdges = [];
				const bottomEdges = [];

				// Places a quad+label pair with the quad's top-left corner of its slot at (x,
				// slotCenterY), and records its top/bottom extent for the bounding-box math below.
				const place = ( quad, label, x, quadY, quadWidth, quadHeight ) => {

					quad.scale.set( quadWidth, quadHeight, 1 );
					quad.position.set( x, quadY, 0 );

					const labelWidth = labelHeight * label.userData.aspect;
					const labelY = quadY - quadHeight / 2 - labelGap - labelHeight / 2;
					label.scale.set( labelWidth, labelHeight, 1 );
					label.position.set( x, labelY, 0 );

					topEdges.push( quadY + quadHeight / 2 );
					bottomEdges.push( labelY - labelHeight / 2 );

				};

				place( quadOriginal, labelOriginal, xCol1, topSlotY + slotExtra / 2, cellWidth, cellHeight );
				place( quadFilter, labelFilter, xCol1, bottomSlotY + slotExtra / 2, cellWidth, cellHeight );
				place( quadSpectrum, labelSpectrum, xCol2, topSlotY + slotExtra / 2, cellWidth, cellHeight );
				place( quadFilterSpectrum, labelFilterSpectrum, xCol2, bottomSlotY + slotExtra / 2, cellWidth, cellHeight );
				place( quadConvolution, labelConvolution, xCol3, slotExtra / 2, bigWidth, gridQuadHeight );

				const leftEdge = xCol1 - cellWidth / 2;
				const rightEdge = xCol3 + bigWidth / 2;
				const centerX = ( leftEdge + rightEdge ) / 2;

				const topAreaTop = Math.max( ...topEdges );
				const topAreaBottom = Math.min( ...bottomEdges );

				// Spans the full width of the 3 columns above it, keeping the source image's aspect
				// ratio -- since it's ~3x wider than a single top-row cell, it comes out substantially
				// larger, exactly as befits the pipeline's actual output.
				const reconstructedWidth = rightEdge - leftEdge;
				const reconstructedHeight = reconstructedWidth / aspect;
				const sectionGap = cellHeight * 0.3;
				const reconstructedY = topAreaBottom - sectionGap - reconstructedHeight / 2;

				place( quadReconstructed, labelReconstructed, centerX, reconstructedY, reconstructedWidth, reconstructedHeight );

				const margin = 1.1;
				const centerY = ( topAreaTop + Math.min( ...bottomEdges ) ) / 2;

				contentWidth = ( rightEdge - leftEdge ) * margin;
				contentHeight = ( topAreaTop - Math.min( ...bottomEdges ) ) * margin;

				controls.target.set( centerX, centerY, 0 );
				camera.position.x = centerX;
				camera.position.y = centerY;
				fitCamera();

			}

			// A canvas-texture quad with the given text, as a real scene object rather than an
			// HTML/CSS overlay, so it moves with the camera like everything else.
			function createLabelMesh( text ) {

				const scale = 4; // supersampled for crisp text at any zoom level
				const fontSize = 64 * scale; // doubled from the original 32px

				const canvas = document.createElement( 'canvas' );
				const ctx = canvas.getContext( '2d' );

				// Canvas height stays fixed (unrelated to fontSize) so doubling fontSize actually
				// doubles the glyphs' share of the label plane's fixed world-space height, i.e. their
				// on-screen size -- rather than net out to the same size if both scaled together.
				// Width is measured from the (now much larger) text so long labels like
				// "Reconstructed Image" aren't clipped; setting canvas.width resets context state,
				// so `font` has to be applied again afterwards.
				canvas.height = 96 * scale;
				ctx.font = `${ fontSize }px monospace`;
				const textWidth = ctx.measureText( text ).width;
				canvas.width = Math.ceil( textWidth + fontSize );

				ctx.font = `${ fontSize }px monospace`;
				ctx.fillStyle = '#cccccc';
				ctx.textAlign = 'center';
				ctx.textBaseline = 'middle';
				ctx.fillText( text, canvas.width / 2, canvas.height / 2 );

				const map = new THREE.CanvasTexture( canvas );
				map.colorSpace = THREE.SRGBColorSpace;

				const material = new THREE.MeshBasicMaterial( { map, transparent: true, depthWrite: false } );
				const mesh = new THREE.Mesh( new THREE.PlaneGeometry( 1, 1 ), material );
				mesh.userData.aspect = canvas.width / canvas.height;

				return mesh;

			}

			// Fits an orthographic frustum of contentWidth x contentHeight into the window aspect,
			// letterboxing whichever dimension has room to spare.
			function fitCamera() {

				const windowAspect = window.innerWidth / window.innerHeight;
				const contentAspect = contentWidth / contentHeight;

				let viewWidth, viewHeight;

				if ( windowAspect > contentAspect ) {

					viewHeight = contentHeight;
					viewWidth = viewHeight * windowAspect;

				} else {

					viewWidth = contentWidth;
					viewHeight = viewWidth / windowAspect;

				}

				camera.left = - viewWidth / 2;
				camera.right = viewWidth / 2;
				camera.top = viewHeight / 2;
				camera.bottom = - viewHeight / 2;
				camera.updateProjectionMatrix();

			}

			function onWindowResize() {

				renderer.setSize( window.innerWidth, window.innerHeight );

				fitCamera();

				render();

			}

			function render() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
