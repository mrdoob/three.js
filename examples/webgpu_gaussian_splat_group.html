<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - gaussian splat group</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - gaussian splatting group">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_gaussian_splat_group.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_gaussian_splat_group.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			#info > small#license {
				top: 45px;
			}
		</style>
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Gaussian Splatting Group</span>
			</div>

			<small id="status">Cross-mesh sorted Gaussian splat rendering via GaussianSplatGroup, by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a>.</small>
			<small id="license"></small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { SPZLoader } from 'three/addons/loaders/SPZLoader.js';
			import { GaussianSplat } from 'three/addons/objects/GaussianSplat.js';
			import { GaussianSplatGroup } from 'three/addons/objects/GaussianSplatGroup.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';

			let camera, scene, renderer, controls, clock, hitMarker;
			let group, lionId, tomatoesId;
			let splatLion, splatTomatoes;
			const tomatoesPosition = new THREE.Vector3( 0.12, 0, 0.05 );
			const tomatoesQuaternion = new THREE.Quaternion();

			// the tomatoes SPZ scene is modeled roughly 10x larger than the lion scene
			const tomatoesScale = new THREE.Vector3( 0.06, 0.06, 0.06 );
			let tomatoesRotationY = 0;
			const tomatoesMatrix = new THREE.Matrix4();
			let mode = 'Grouped (correct blending)';
			let rotateTomatoes = false;
			let showLion = true;

			THREE.ColorManagement.workingColorSpace = THREE.SRGBColorSpace;

			const MODE_NAMES = [ 'Grouped (correct blending)', 'Independent (per-mesh sort)' ];
			const TOMATOES_ROTATION_SPEED = 1.2; // radians/second

			const raycaster = new THREE.Raycaster();
			const pointer = new THREE.Vector2();
			const CLICK_DRAG_THRESHOLD = 4;
			const HIT_MARKER_SIZE_RATIO = 1 / 50;
			let pointerDownX = 0;
			let pointerDownY = 0;

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.01, 100 );
				camera.position.set( 0, 0.35, 3.2 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x07080f );

				renderer = new THREE.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.minDistance = 1.2;
				controls.maxDistance = 8;
				controls.target.set( 0, 0, 0 );
				controls.update();

				clock = new THREE.Clock();

				const gui = renderer.inspector.createParameters( 'Building' );
				gui.add( { mode }, 'mode', MODE_NAMES ).name( 'Rendering' ).onChange( ( value ) => {

					mode = value;
					applyRenderMode();

				} );
				gui.add( { rotateTomatoes }, 'rotateTomatoes' ).name( 'Rotate Tomatoes' ).onChange( ( value ) => {

					rotateTomatoes = value;

				} );
				gui.add( { showLion }, 'showLion' ).name( 'Show Lion' ).onChange( ( value ) => {

					showLion = value;

					group.setVisibleAt( lionId, showLion );
					applyRenderMode();

				} );

				hitMarker = new THREE.Mesh(
					new THREE.SphereGeometry( 1, 16, 12 ),
					new THREE.MeshBasicMaterial( { color: 0xff0000, depthTest: false } )
				);
				hitMarker.visible = false;
				scene.add( hitMarker );

				renderer.domElement.addEventListener( 'pointerdown', onPointerDown );
				renderer.domElement.addEventListener( 'click', onClick );

				const loader = new SPZLoader();

				const [ lionGeometry, tomatoesGeometry ] = await Promise.all( [
					loader.loadAsync( './models/spz/lion.v3.spz' ),
					loader.loadAsync( './models/spz/tomatoes.v4.spz' )
				] );

				// two independently loaded splat sets, deliberately overlapping so the
				// grouped-vs-independent blending difference is visible where they intersect
				const lionMatrix = new THREE.Matrix4().compose(
					new THREE.Vector3( - 0.12, 0, 0 ),
					new THREE.Quaternion().setFromEuler( new THREE.Euler( Math.PI, 0, 0 ) ),
					new THREE.Vector3( 1, 1, 1 )
				);

				tomatoesMatrix.compose( tomatoesPosition, tomatoesQuaternion, tomatoesScale );

				group = new GaussianSplatGroup();
				scene.add( group );

				lionId = group.addSplat( lionGeometry );
				tomatoesId = group.addSplat( tomatoesGeometry );

				group.setMatrixAt( lionId, lionMatrix );
				group.setMatrixAt( tomatoesId, tomatoesMatrix );

				// standalone copies for the "Independent (per-mesh sort)" comparison mode -
				// same geometry and transform as their group counterparts, but each is its own
				// self-contained GaussianSplat, sorted only against itself
				splatLion = new GaussianSplat( lionGeometry );
				splatLion.matrix.copy( lionMatrix );
				splatLion.matrixAutoUpdate = false;
				splatLion.visible = false;
				scene.add( splatLion );

				splatTomatoes = new GaussianSplat( tomatoesGeometry );
				splatTomatoes.matrix.copy( tomatoesMatrix );
				splatTomatoes.matrixAutoUpdate = false;
				splatTomatoes.visible = false;
				scene.add( splatTomatoes );

				applyRenderMode();

				group.computeBoundingSphere();

				fitCameraToGroup( group );
				updateHitMarkerSize( group );

				window.addEventListener( 'resize', onWindowResize );

			}

			// Which of the two comparison objects is drawn only changes on a GUI edit, not
			// every frame, so it's applied here rather than in animate()'s hot loop.
			function applyRenderMode() {

				const grouped = mode === 'Grouped (correct blending)';

				group.visible = grouped;
				splatLion.visible = grouped === false && showLion === true;
				splatTomatoes.visible = grouped === false;

			}

			function fitCameraToGroup( group ) {

				group.updateWorldMatrix( true, false );

				const sphere = group.boundingSphere.clone().applyMatrix4( group.matrixWorld );
				const radius = Math.max( sphere.radius, 0.01 );
				const distance = radius / Math.sin( THREE.MathUtils.degToRad( camera.fov ) * 0.5 );

				controls.minDistance = radius * 1.1;
				controls.maxDistance = radius * 8;
				controls.target.copy( sphere.center );
				camera.position.set( 0, 0.15, 1 ).normalize().multiplyScalar( distance * 1.15 ).add( sphere.center );
				camera.near = Math.max( distance / 1000, 0.001 );
				camera.far = Math.max( distance * 10, 10 );

				camera.updateProjectionMatrix();
				controls.update();

			}

			function updateHitMarkerSize( group ) {

				group.updateWorldMatrix( true, false );

				const sphere = group.boundingSphere.clone().applyMatrix4( group.matrixWorld );
				hitMarker.scale.setScalar( Math.max( sphere.radius * HIT_MARKER_SIZE_RATIO, 0.0001 ) );

			}

			function onPointerDown( event ) {

				pointerDownX = event.clientX;
				pointerDownY = event.clientY;

			}

			function onClick( event ) {

				// ignore drags (camera orbiting), only treat this as a hit-test click
				const dx = event.clientX - pointerDownX;
				const dy = event.clientY - pointerDownY;

				if ( Math.sqrt( dx * dx + dy * dy ) > CLICK_DRAG_THRESHOLD ) return;

				pointer.x = ( event.clientX / window.innerWidth ) * 2 - 1;
				pointer.y = - ( event.clientY / window.innerHeight ) * 2 + 1;

				raycaster.setFromCamera( pointer, camera );

				const hit = raycaster.intersectObject( group )[ 0 ];

				if ( hit ) {

					hitMarker.position.copy( hit.point );
					hitMarker.visible = true;

				} else {

					hitMarker.visible = false;

				}

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				// init() loads the SPZ assets asynchronously, but the animation loop is
				// already running by then (renderer.setAnimationLoop is set up before the
				// await), so skip frames until the splats and group actually exist
				if ( group === undefined ) return;

				const delta = clock.getDelta();

				controls.update();

				if ( rotateTomatoes === true ) {

					// continuously recomposes the tomatoes' transform, exercising
					// GaussianSplatGroup.setMatrixAt()'s cheap per-instance re-merge path every
					// frame instead of only on add/remove/visibility changes - the lion's splat
					// range is untouched and is not re-merged
					tomatoesRotationY += delta * TOMATOES_ROTATION_SPEED;
					tomatoesQuaternion.setFromEuler( new THREE.Euler( 0, tomatoesRotationY, 0 ) );
					tomatoesMatrix.compose( tomatoesPosition, tomatoesQuaternion, tomatoesScale );

					group.setMatrixAt( tomatoesId, tomatoesMatrix );
					splatTomatoes.matrix.copy( tomatoesMatrix );

				}

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
