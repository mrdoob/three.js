<!DOCTYPE html>
<html lang="en">

	<head>
		<title>three.js webgpu - postprocessing - Screen Space Reflections (SSR) + denoise</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - postprocessing - Screen Space Reflections (SSR) + denoise">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssr_denoise.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssr_denoise.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			#compare-hint {
				position: fixed;
				bottom: 20px;
				left: 50%;
				transform: translateX(-50%);
				z-index: 1001;
				color: #e0e0e0;
				font: 400 13px 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
				text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.7);
				pointer-events: none;
				opacity: 0.85;
				white-space: nowrap;
			}
		</style>
	</head>

<body>

	<div id="compare-hint" hidden>Hold Shift and move the mouse to scrub the comparison</div>

	<div id="info">
		<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

		<div class="title-wrapper">
			<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>SSR + Denoising</span>
		</div>

		<small>
			Screen Space Reflections with Spatiotemporal Denoising by <a href="https://x.com/0beqz" target="_blank" rel="noopener">0beqz</a>.<br />
			Dungeon - Low Poly Game Level Challenge by
			Warkarma.<br />
		</small>
	</div>

	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.webgpu.js",
				"three/webgpu": "../build/three.webgpu.js",
				"three/tsl": "../build/three.tsl.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">

		import * as THREE from 'three/webgpu';
		import { pass, mrt, output, normalView, roughness, metalness, diffuseColor, specularColorBlended, specularF90, screenUV, sample, packNormalToRGB, unpackRGBToNormal, vec3, vec4, velocity, uniform, mix, step, abs, float, Fn, If, uv, texture, context, cameraWorldMatrix, getViewPosition, convertToTexture, renderOutput, saturation, EnvironmentBRDF, indirectSpecular, environmentSpecular, pmremTexture } from 'three/tsl';
		import { ssr } from 'three/addons/tsl/display/SSRNode.js';
		import { screenSpaceGBuffer } from 'three/addons/tsl/display/ScreenSpaceGBufferNode.js';
		import { reprojectedRadiance } from 'three/addons/tsl/display/ReprojectedRadianceNode.js';
		import { coverageDenoise } from 'three/addons/tsl/display/CoverageDenoiseNode.js';
		import { resolveSSRHitDistance } from 'three/addons/tsl/utils/SpecularHelpers.js';
		import { fastNoise } from 'three/addons/tsl/utils/FASTNoise.js';
		import { jointBilateralUpsample } from 'three/addons/tsl/display/JointBilateralUpsample.js';
		import { traa } from 'three/addons/tsl/display/TRAANode.js';
		import { smaa } from 'three/addons/tsl/display/SMAANode.js';

		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { Inspector } from 'three/addons/inspector/Inspector.js';
		import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';

		const compareHint = document.getElementById( 'compare-hint' );

		const compareSplit = uniform( 0.5 );
		const compareResolution = uniform( new THREE.Vector2( window.innerWidth, window.innerHeight ) );

		function buildCompareNode( left, right ) {

			const compareColor = mix( left, right, step( compareSplit, screenUV.x ) );
			const lineWidth = float( 1 ).div( compareResolution.x );
			const onLine = float( 1 ).sub( step( lineWidth, abs( screenUV.x.sub( compareSplit ) ) ) );

			return mix( compareColor, vec4( 1 ), onLine );

		}

		// same settings as webgpu_postprocessing_ssr, scaled for this smaller scene
		const params = {
			quality: 0.5,
			raysPerPixel: 1,
			traceSteps: 32,
			classify: true,
			output: 'Beauty',
			reflectionSource: 'Previous frame',
			antialiasing: 'TRAA',
			renderScale: 1,
			effectScale: 0.5,
			denoise: true,
			maxFrames: 16,
			radius: 3,
			maxRoughness: 0.8,
			mirrorBias: 0,
			stepExponent: 2,
			maxLuminance: 10,
			screenEdgeFade: 0.2,
			sampling: 'FAST Separate',
			environment: true,
			maxDistance: 0.4,
			intensity: 1,
			thickness: 0.1,
			binaryRefine: true,
			roughness: 0.3,
			enabled: true
		};

		const grading = { exposure: 1.57, gamma: 0.89, contrast: 1.31, saturation: 1 };

		let camera, scene, renderer, renderPipeline, ssrPass, ssrDenoise, effectGuides, traaPass, views;
		let controls, geometryPass, beautyPass, lightingHistory;

		const historyValid = uniform( false );
		const useHistorySource = uniform( params.reflectionSource === 'Previous frame' );
		const previousView = uniform( new THREE.Matrix4() );
		const previousProjection = uniform( new THREE.Matrix4() );
		const previousProjectionInverse = uniform( new THREE.Matrix4() );
		const currentView = new THREE.Matrix4();
		const currentProjection = new THREE.Matrix4();
		const currentProjectionInverse = new THREE.Matrix4();
		const samplingModes = [ 'Original', 'FAST Product', 'FAST Separate' ];
		const samplingMode = uniform( 2, 'uint' );
		const denoiseEnabled = uniform( 1 );
		const maxRoughness = uniform( params.maxRoughness );
		const ssrStrength = uniform( params.intensity );
		const ssrEnabled = uniform( 1 );
		const environmentEnabled = uniform( 1 );
		const gammaUniform = uniform( grading.gamma );
		const contrastUniform = uniform( grading.contrast );
		const saturationUniform = uniform( grading.saturation );

		init();

		async function init() {

			camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 8 );

			scene = new THREE.Scene();

			const loader = new GLTFLoader();
			loader.load( 'models/gltf/dungeon_warkarma.glb', function ( gltf ) {

				gltf.scene.scale.multiplyScalar( 0.1 );

				gltf.scene.traverse( function ( object ) {

					if ( ! object.material ) return;

					object.castShadow = true;
					object.receiveShadow = true;
					object.material.roughness = params.roughness;
					object.material.normalMap = null;

				} );

				scene.add( gltf.scene );
				resetHistory();

			} );

			renderer = new THREE.WebGPURenderer();
			renderer.inspector = new Inspector();
			renderer.setPixelRatio( params.renderScale );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.toneMapping = THREE.AgXToneMapping;
			renderer.toneMappingExposure = grading.exposure;
			renderer.shadowMap.enabled = true;
			document.body.appendChild( renderer.domElement );

			const hdrTexture = await new HDRLoader().setPath( 'textures/equirectangular/' ).loadAsync( 'quarry_01_1k.hdr' );
			hdrTexture.mapping = THREE.EquirectangularReflectionMapping;
			scene.background = hdrTexture;
			scene.environment = hdrTexture;

			const directionalLight = new THREE.DirectionalLight( '#ffffff', 20 );
			directionalLight.position.set( - 10.9, 2.2, 10.75 );
			directionalLight.castShadow = true;
			directionalLight.shadow.autoUpdate = false;
			directionalLight.shadow.needsUpdate = true;
			directionalLight.shadow.mapSize.width = 4096;
			directionalLight.shadow.mapSize.height = 4096;
			directionalLight.shadow.camera.left = - 1.75;
			directionalLight.shadow.camera.right = 1.75;
			directionalLight.shadow.camera.top = 1.75;
			directionalLight.shadow.camera.bottom = - 1.75;
			directionalLight.shadow.camera.near = 0.1;
			directionalLight.shadow.camera.far = 50;
			directionalLight.shadow.bias = - 0.0005;
			scene.add( directionalLight );

			await renderer.init();

			const noiseAtlases = await Promise.all( [ 'product', 'separate05' ].map( async variant => {

				const atlas = await new THREE.TextureLoader().loadAsync( `textures/noises/fast/gauss1-ema01-${ variant }.png` );
				atlas.flipY = false;
				atlas.colorSpace = THREE.NoColorSpace;
				atlas.generateMipmaps = false;
				atlas.minFilter = atlas.magFilter = THREE.NearestFilter;
				return atlas;

			} ) );
			const productNoise = fastNoise( noiseAtlases[ 0 ], new THREE.Vector2() );
			const separateNoise = fastNoise( noiseAtlases[ 1 ], new THREE.Vector2() );
			const samplingNoise = Fn( () => {

				const value = vec4().toVar();
				If( samplingMode.equal( 2 ), () => {

					value.assign( separateNoise );

				} ).Else( () => {

					value.assign( productNoise );

				} );
				return value;

			} )();

			// the environment fills whatever SSR does not cover
			const capture = environmentSpecular( pmremTexture( hdrTexture ) );
			const fallback = query => {

				const value = capture( query );
				return vec4( value.rgb, environmentEnabled );

			};

			renderPipeline = new THREE.RenderPipeline( renderer );

			// geometry guides
			geometryPass = pass( scene, camera );
			geometryPass.contextNode = context( { indirectSpecularNode: indirectSpecular( [] ) } );
			geometryPass.setMRT( mrt( {
				output: vec4( packNormalToRGB( normalView ), roughness ),
				albedo: vec4( diffuseColor.rgb, metalness ),
				reflectance: vec4( specularColorBlended, specularF90 ),
				velocity: velocity
			} ) );
			geometryPass.getTexture( 'albedo' ).type = THREE.UnsignedByteType;
			geometryPass.getTexture( 'reflectance' ).type = THREE.HalfFloatType;
			const normalRoughness = geometryPass.getTextureNode().toInspector( 'Normal-Roughness' );
			const albedoMetalness = geometryPass.getTextureNode( 'albedo' );
			const reflectance = geometryPass.getTextureNode( 'reflectance' );
			const motion = geometryPass.getTextureNode( 'velocity' );
			const depth = geometryPass.getTextureNode( 'depth' ).toInspector( 'Depth', () => geometryPass.getLinearDepthNode() );
			const sceneNormal = sample( uv => unpackRGBToNormal( normalRoughness.sample( uv ).rgb ).normalize() );

			// lighting without SSR, traced when the reflection source is the current frame
			const scenePass = pass( scene, camera );
			scenePass.contextNode = context( { indirectSpecularNode: indirectSpecular( [ fallback ] ) } );
			scenePass.setMRT( mrt( { output: vec4( output.rgb, 1 ) } ) );
			const scenePassColor = scenePass.getTextureNode().toInspector( 'Source Color' );

			// reduced resolution guides
			effectGuides = screenSpaceGBuffer( depth, normalRoughness, albedoMetalness );
			effectGuides.resolutionScale = params.effectScale;
			const effectDepth = effectGuides.getTextureNode();
			const effectNormalRoughness = effectGuides.getTextureNode( 'normal' );
			const effectMaterial = effectGuides.getTextureNode( 'material' );
			const effectReflectance = sample( coordinate => reflectance.sample( effectDepth.sample( coordinate ).gb ) );
			const effectNormal = sample( coordinate => unpackRGBToNormal( effectNormalRoughness.sample( coordinate ).rgb ).normalize() );
			const effectMotion = sample( coordinate => motion.sample( effectDepth.sample( coordinate ).gb ) );

			// tracing the previous frame's lighting gives multiple bounces
			lightingHistory = new THREE.RenderTarget( 1, 1, { type: THREE.HalfFloatType, depthTexture: new THREE.DepthTexture() } );
			lightingHistory.depthTexture.format = depth.value.format;
			lightingHistory.depthTexture.type = depth.value.type;
			lightingHistory.depthTexture.minFilter = THREE.NearestFilter;
			lightingHistory.depthTexture.magFilter = THREE.NearestFilter;
			const historySource = reprojectedRadiance( texture( lightingHistory.texture ), texture( lightingHistory.depthTexture ), depth, sceneNormal, camera, {
				previousView, previousProjection, previousProjectionInverse, valid: historyValid
			} );
			const currentTraceSource = sample( coordinate => scenePassColor.sample( effectDepth.sample( coordinate ).gb ) );
			const previousTraceSource = sample( coordinate => historySource.sample( effectDepth.sample( coordinate ).gb ) );

			ssrPass = ssr( useHistorySource.value ? previousTraceSource : currentTraceSource, effectDepth, effectNormal, {
				camera,
				stochastic: true,
				outputCoverage: true,
				traceMaskNode: effectNormalRoughness.a.lessThan( maxRoughness ),
				noiseNode: samplingNoise,
				diffuseNode: effectMaterial,
				metalnessNode: effectMaterial.a,
				specularNode: effectReflectance.rgb,
				specularF90Node: effectReflectance.a,
				roughnessNode: effectNormalRoughness.a
			} ).toInspector( 'SSR (BRDF weighted)' );

			const coverage = sample( uv => {

				const roughnessFade = effectNormalRoughness.sample( uv ).a.smoothstep( maxRoughness.sub( 0.1 ), maxRoughness ).oneMinus();
				return ssrPass.getCoverageNode().sample( uv ).r.mul( roughnessFade );

			} ).toInspector( 'SSR Coverage' );

			const incoming = sample( uv => {

				const raw = ssrPass.getTextureNode().sample( uv );
				const n = effectNormal.sample( uv );
				const v = getViewPosition( effectDepth.sample( uv ).gb, effectDepth.sample( uv ).r, uniform( camera.projectionMatrixInverse ) ).negate().normalize();
				const f = effectReflectance.sample( uv );
				const modulation = EnvironmentBRDF( {
					dotNV: n.dot( v ).clamp(),
					specularColor: f.rgb,
					specularF90: f.a,
					roughness: effectNormalRoughness.sample( uv ).a
				} );

				// undo coverage and BRDF weighting
				return raw.rgb.div( ssrPass.getCoverageNode().sample( uv ).r.max( 1e-4 ) ).div( modulation.max( vec3( 1e-4 ) ) );

			} ).toInspector( 'SSR Incoming Radiance' );

			ssrDenoise = coverageDenoise( convertToTexture( vec4( incoming.sample( uv() ), coverage.sample( uv() ) ) ), camera, {
				depth: effectDepth,
				normal: effectNormalRoughness,
				velocity: effectMotion,
				hitDistance: sample( uv => resolveSSRHitDistance( ssrPass.getTextureNode().sample( uv ).a, coverage.sample( uv ) ) )
			} );
			const denoised = ssrDenoise.getTextureNode();
			const filtered = jointBilateralUpsample( denoised, effectDepth, effectNormal, depth, sceneNormal, camera );

			const raw = sample( uv => vec4( incoming.sample( uv ), coverage.sample( uv ) ) );

			// SSR replaces the environment where it has coverage, only for the base specular lobe
			const screenReflection = ( { normal, viewDirection, direction, roughness: level } ) => Fn( () => {

				const baseNormal = sceneNormal.sample( screenUV ).transformDirection( cameraWorldMatrix );
				const baseRoughness = normalRoughness.sample( screenUV ).a;
				const baseDirection = baseRoughness.pow4().mix( viewDirection.negate().reflect( baseNormal ), baseNormal ).normalize();
				const matches = level.sub( baseRoughness ).abs().lessThan( 0.01 )
					.and( normal.dot( baseNormal ).greaterThan( 0.999 ) )
					.and( direction.dot( baseDirection ).greaterThan( 0.999 ) );
				const value = denoiseEnabled.mix( raw.sample( screenUV ), filtered.sample( screenUV ) );
				return vec4( value.rgb, value.a.mul( matches ).mul( ssrEnabled ).mul( ssrStrength ) );

			} )();

			beautyPass = pass( scene, camera );
			beautyPass.contextNode = context( { indirectSpecularNode: indirectSpecular( [ screenReflection, fallback ] ) } );

			const onAfterRender = scene.onAfterRender;
			scene.onAfterRender = function ( renderer, sourceScene, sourceCamera, ...args ) {

				onAfterRender.call( this, renderer, sourceScene, sourceCamera, ...args );
				if ( sourceCamera === camera ) {

					currentView.copy( camera.matrixWorldInverse );
					currentProjection.copy( camera.projectionMatrix );
					currentProjectionInverse.copy( camera.projectionMatrixInverse );

				}

			};

			const resolvedSpecular = Fn( () => {

				const normal = sceneNormal.sample( screenUV ).transformDirection( uniform( camera.matrixWorld ) );
				const level = normalRoughness.sample( screenUV ).a;
				const view = getViewPosition( screenUV, depth.sample( screenUV ).r, uniform( camera.projectionMatrixInverse ) ).negate().normalize().transformDirection( uniform( camera.matrixWorld ) );
				const direction = level.pow4().mix( view.negate().reflect( normal ), normal ).normalize();
				const environment = fallback( { direction, roughness: level } );
				const value = filtered.sample( screenUV );
				const weight = value.a.mul( ssrStrength ).mul( ssrEnabled );
				return vec4( value.rgb.mul( weight ).add( environment.rgb.mul( environment.a ).mul( weight.oneMinus() ) ), 1 );

			} )();

			traaPass = traa( beautyPass, depth, motion, camera );
			traaPass.useSubpixelCorrection = false;
			const smaaPass = smaa( beautyPass );
			const beautyViews = { TRAA: applyGrading( traaPass ), SMAA: applyGrading( smaaPass ) };

			const reflections = value => applyGrading( vec4( value.rgb.mul( value.a ).mul( ssrStrength ), 1 ) );

			views = {
				Beauty: beautyViews[ params.antialiasing ],
				'PMREM only': applyGrading( smaa( scenePassColor ) ),
				SSR: reflections( raw.sample( screenUV ) ),
				'SSR Filtered': reflections( filtered.sample( screenUV ) ),
				'SSR Coverage': vec4( vec3( coverage.sample( screenUV ).mul( ssrStrength ) ), 1 ),
				'SSR Coverage Filtered': vec4( vec3( filtered.sample( screenUV ).a.mul( ssrStrength ) ), 1 ),
				'History age': vec4( vec3( ssrDenoise.getTextureNode( 'metadata' ).sample( screenUV ).r.div( ssrDenoise.maxFrames ) ), 1 ),
				'Virtual history': vec4( vec3( ssrDenoise.getTextureNode( 'metadata' ).sample( screenUV ).b ), 1 ),
				'Indirect Specular': applyGrading( resolvedSpecular ),
				'Compare (Denoise)': buildCompareNode( reflections( raw.sample( screenUV ) ), reflections( filtered.sample( screenUV ) ) )
			};

			renderPipeline.outputColorTransform = false;

			controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;

			camera.position.set( 1.259878548682251, 0.5391287340899181, - 0.27217301481427114 );
			controls.target.set( 1.0258536154689288, 0.2746440590977971, - 1.0815876858987743 );
			controls.update();

			window.addEventListener( 'resize', onWindowResize );
			renderer.domElement.addEventListener( 'pointermove', onComparePointerMove );

			// GUI

			const gui = renderer.inspector.createParameters( 'Settings' );
			gui.add( params, 'output', Object.keys( views ) ).name( 'Output' ).onChange( () => {

				updateOutput();
				resetHistory();

			} );
			gui.add( params, 'enabled' ).name( 'SSR' ).onChange( value => {

				ssrEnabled.value = Number( value );

			} );
			gui.add( params, 'environment' ).name( 'Environment' ).onChange( value => {

				environmentEnabled.value = Number( value );
				scene.environmentIntensity = value ? 1 : 0;
				scene.backgroundIntensity = value ? 1 : 0;

			} );
			gui.add( params, 'intensity', 0, 1 ).name( 'SSR strength' ).onChange( value => {

				ssrStrength.value = value;

			} );
			gui.add( params, 'antialiasing', [ 'SMAA', 'TRAA' ] ).name( 'Antialiasing' ).onChange( value => {

				views.Beauty = beautyViews[ value ];
				updateOutput();
				resetHistory();

			} );

			const resolutionFolder = gui.addFolder( 'Resolution' );
			resolutionFolder.add( params, 'renderScale', { '50%': 0.5, '75%': 0.75, '100%': 1 } ).name( 'Render scale' ).onChange( () => {

				renderer.setPixelRatio( params.renderScale );
				onWindowResize();

			} );
			resolutionFolder.add( params, 'effectScale', { Full: 1, Half: 0.5, Quarter: 0.25 } ).name( 'SSR scale' ).onChange( updateParameters );

			const traceFolder = gui.addFolder( 'Trace' ).close();
			traceFolder.add( params, 'raysPerPixel', [ 1, 2, 4, 8, 16 ] ).name( 'Rays per pixel' ).onChange( updateParameters );
			traceFolder.add( params, 'traceSteps', [ 8, 16, 32, 64, 128, 256, 512 ] ).name( 'Steps per ray' ).onChange( updateParameters );
			traceFolder.add( params, 'maxDistance', 0, 5 ).name( 'Max distance' ).onChange( updateParameters );
			traceFolder.add( params, 'thickness', 0, 0.25 ).name( 'Thickness' ).onChange( updateParameters );
			traceFolder.add( params, 'quality', 0, 1 ).name( 'Quality' ).onChange( updateParameters );
			traceFolder.add( params, 'stepExponent', 1, 4, 1 ).name( 'Step exponent' ).onChange( updateParameters );
			traceFolder.add( params, 'mirrorBias', 0, 1 ).name( 'Mirror bias' ).onChange( updateParameters );
			traceFolder.add( params, 'maxRoughness', 0.1, 1 ).name( 'Max roughness' ).onChange( updateParameters );
			traceFolder.add( params, 'screenEdgeFade', 0, 0.5 ).name( 'Screen edge fade' ).onChange( updateParameters );
			traceFolder.add( params, 'classify' ).name( 'Skip unused rays' ).onChange( updateParameters );
			traceFolder.add( params, 'binaryRefine' ).name( 'Binary refine' ).onChange( updateParameters );
			traceFolder.add( params, 'reflectionSource', [ 'Current frame', 'Previous frame' ] ).name( 'Reflection source' ).onChange( value => {

				useHistorySource.value = value === 'Previous frame';
				ssrPass.setColorNode( useHistorySource.value ? previousTraceSource : currentTraceSource );
				updateOutput();
				resetHistory();

			} );

			const denoiseFolder = gui.addFolder( 'Denoise' ).close();
			denoiseFolder.add( params, 'denoise' ).name( 'Enabled' ).onChange( value => {

				denoiseEnabled.value = Number( value );

			} );
			denoiseFolder.add( params, 'radius', 0, 3 ).name( 'Radius' ).onChange( updateParameters );
			denoiseFolder.add( params, 'sampling', samplingModes ).name( 'Sampling' ).onChange( updateParameters );
			denoiseFolder.add( params, 'maxFrames', 1, 128, 1 ).name( 'Max frames' ).onChange( updateParameters );

			const sceneFolder = gui.addFolder( 'Scene' );
			sceneFolder.add( params, 'roughness', 0, 1 ).name( 'Model roughness' ).onChange( value => {

				scene.traverse( object => {

					if ( object.material ) object.material.roughness = value;

				} );

			} );
			[ 'x', 'y', 'z' ].forEach( axis => {

				sceneFolder.add( directionalLight.position, axis, - 30, 30 ).name( `Light ${ axis.toUpperCase() }` )
					.onChange( () => directionalLight.shadow.needsUpdate = true );

			} );
			sceneFolder.add( directionalLight, 'intensity', 0, 50 ).name( 'Light intensity' );

			updateParameters();
			updateOutput();

			renderer.setAnimationLoop( animate );

		}

		function updateParameters() {

			samplingMode.value = samplingModes.indexOf( params.sampling );
			ssrPass.useNoiseNode.value = samplingMode.value !== 0;
			ssrPass.quality.value = params.quality;
			ssrPass.raysPerPixel.value = params.raysPerPixel;
			ssrPass.maxSteps.value = params.traceSteps;
			ssrPass.useTraceMask.value = params.classify && params.effectScale === 1;
			effectGuides.resolutionScale = params.effectScale;
			ssrPass.resolutionScale = params.effectScale;
			ssrDenoise.inputNode.setResolutionScale( params.effectScale );
			ssrPass.mirrorBias.value = params.mirrorBias;
			ssrPass.stepExponent = params.stepExponent;
			ssrPass.maxLuminance.value = params.maxLuminance;
			ssrPass.screenEdgeFade.value = params.screenEdgeFade;
			maxRoughness.value = params.maxRoughness;
			ssrDenoise.maxFrames.value = params.maxFrames;
			ssrDenoise.radius.value = params.radius;
			ssrPass.maxDistance.value = params.maxDistance;
			ssrStrength.value = params.intensity;
			ssrPass.thickness.value = params.thickness;
			// build-time constant: assigning it recompiles the SSR material (setter no-ops if unchanged)
			ssrPass.binaryRefine = params.binaryRefine;

		}

		function applyGrading( source ) {

			let rgb = source.rgb;

			rgb = renderOutput( vec4( rgb, 1 ), THREE.AgXToneMapping, THREE.SRGBColorSpace ).rgb;
			rgb = rgb.sub( 0.5 ).mul( contrastUniform ).add( 0.5 );
			rgb = saturation( rgb, saturationUniform );
			rgb = rgb.max( 0.0 ).pow( float( 1 ).div( gammaUniform ) );

			return vec4( rgb, 1 );

		}

		function isCompareMode() {

			return params.output.startsWith( 'Compare' );

		}

		function updateOutput() {

			// debug views still render the beauty lighting used by the next frame
			const selected = views[ params.output ];
			const traa = params.antialiasing === 'TRAA';
			renderPipeline.outputNode = ( useHistorySource.value || traa ) && params.output !== 'Beauty' ? Fn( builder => {

				( traa ? traaPass : beautyPass ).build( builder );
				return selected;

			} )() : selected;
			renderPipeline.needsUpdate = true;

			compareHint.hidden = ! isCompareMode();
			controls.enabled = true;

		}

		function resetHistory() {

			historyValid.value = false;
			ssrDenoise?.reset();
			traaPass?.setSize( 1, 1 );

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );
			compareResolution.value.set( window.innerWidth, window.innerHeight );

		}

		function onComparePointerMove( event ) {

			if ( ! isCompareMode() ) return;

			if ( event.shiftKey ) {

				controls.enabled = false;

				const rect = renderer.domElement.getBoundingClientRect();
				compareSplit.value = Math.max( 0, Math.min( 1, ( event.clientX - rect.left ) / rect.width ) );

			} else {

				controls.enabled = true;

			}

		}

		function animate() {

			controls.update();

			const size = renderer.getDrawingBufferSize( new THREE.Vector2() );
			if ( lightingHistory.width !== size.x || lightingHistory.height !== size.y ) {

				lightingHistory.setSize( size.x, size.y );
				resetHistory();

			}

			renderer.initRenderTarget( lightingHistory );
			renderPipeline.render();
			if ( useHistorySource.value ) {

				renderer.copyTextureToTexture( beautyPass.getTexture( 'output' ), lightingHistory.texture );
				renderer.copyTextureToTexture( geometryPass.getTexture( 'depth' ), lightingHistory.depthTexture );
				previousView.value.copy( currentView );
				previousProjection.value.copy( currentProjection );
				previousProjectionInverse.value.copy( currentProjectionInverse );
				historyValid.value = true;

			} else {

				historyValid.value = false;

			}

		}

	</script>
</body>
