<!DOCTYPE html>
<html lang="en">

	<head>
		<title>three.js webgpu - postprocessing - Screen Space Reflections (SSR) + denoise</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - postprocessing - Screen Space Reflections (SSR) + denoise">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssr_denoise.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssr_denoise.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			#compare-hint {
				position: fixed;
				bottom: 20px;
				left: 50%;
				transform: translateX(-50%);
				z-index: 1001;
				color: #e0e0e0;
				font: 400 13px 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
				text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.7);
				pointer-events: none;
				opacity: 0.85;
				white-space: nowrap;
			}
		</style>
	</head>

<body>

	<div id="compare-hint" hidden>Hold Shift and move the mouse to scrub the comparison</div>

	<div id="info">
		<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

		<div class="title-wrapper">
			<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>SSR + Denoising</span>
		</div>

		<small>
			Screen Space Reflections with Spatiotemporal Denoising by <a href="https://x.com/0beqz" target="_blank" rel="noopener">0beqz</a>.<br />
			Dungeon - Low Poly Game Level Challenge by
			Warkarma.<br />
		</small>
	</div>

	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.webgpu.js",
				"three/webgpu": "../build/three.webgpu.js",
				"three/tsl": "../build/three.tsl.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">

		import * as THREE from 'three/webgpu';
		import { pass, mrt, output, normalView, materialMetalness, materialRoughness, screenUV, sample, packNormalToRGB, unpackRGBToNormal, velocity, diffuseColor, vec3, vec4, uniform, mix, step, abs, float, renderOutput, saturation, property, convertToTexture, texture, vec2, ivec2, Fn, positionPrevious, textureSize, getViewPosition, isBackgroundDepth } from 'three/tsl';
		import { ssr } from 'three/addons/tsl/display/SSRNode.js';
		import { temporalDenoise } from 'three/addons/tsl/display/DenoiseNode.js';
		import { sharpen } from 'three/addons/tsl/display/SharpenNode.js';
		import { traa } from 'three/addons/tsl/display/TRAANode.js';

		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { Inspector } from 'three/addons/inspector/Inspector.js';
		import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';

		// Render the env map specular of every PBR material into its own MRT target instead of the beauty,
		// so that it fills in where SSR has no coverage. Clearcoat env radiance is dropped. Scoped to this
		// example rather than modifying the core library.
		const envSpecular = property( 'vec3', 'EnvSpecular', vec3( 0 ) );

		const _indirectSpecular = THREE.PhysicalLightingModel.prototype.indirectSpecular;
		THREE.PhysicalLightingModel.prototype.indirectSpecular = function ( builder ) {

			const { reflectedLight } = builder.context;

			if ( this.clearcoatRadiance ) this.clearcoatRadiance.assign( vec3( 0 ) );

			envSpecular.assign( vec3( 0 ) );
			builder.context.reflectedLight = { ...reflectedLight, indirectSpecular: envSpecular };
			_indirectSpecular.call( this, builder );
			builder.context.reflectedLight = reflectedLight;

		};

		const OUTPUT_COMPARE_DENOISE = 8;
		const OUTPUT_COMPARE_SSR = 9;

		const GRADED_OUTPUTS = new Set( [ 0, 1, 3, 4, 6, OUTPUT_COMPARE_DENOISE, OUTPUT_COMPARE_SSR ] );

		const compareHint = document.getElementById( 'compare-hint' );

		function isCompareMode( output ) {

			return output === OUTPUT_COMPARE_DENOISE || output === OUTPUT_COMPARE_SSR;

		}

		function updateCompareHint( output ) {

			compareHint.hidden = ! isCompareMode( output );

		}

		const compareSplit = uniform( 0.5 );
		const compareResolution = uniform( new THREE.Vector2( window.innerWidth, window.innerHeight ) );

		function buildCompareNode( noisy, denoised ) {

			const compareColor = mix( noisy, denoised, step( compareSplit, screenUV.x ) );
			const lineWidth = float( 1 ).div( compareResolution.x );
			const onLine = float( 1 ).sub( step( lineWidth, abs( screenUV.x.sub( compareSplit ) ) ) );

			return mix( compareColor, vec4( 1 ), onLine );

		}

		const params = {
			output: 0,
			roughness: 0.3,

			ssr: {
				resolutionScale: 1,
				quality: 0.25,
				mirrorBias: 0.5,
				maxRoughness: 1,
				rayReuse: new URLSearchParams( location.search ).get( 'rayReuse' ) !== '0',
				reuseRadius: 3,
				maxDistance: 0.4,
				intensity: 1,
				thickness: 0.1,
				maxLuminance: 35,
				binaryRefine: false,
				stepExponent: 3,
				screenEdgeFade: 0.2,
				screenEdgeFadeBlack: false, // for indoor scenes, set to true
			},

			denoise: {
				enabled: true,
				luminancePhi: 3,
				maxFrames: 8,
				spatialPasses: 2,
				historyDeviation: 0,
				fireflyClamp: 0,
				toneMappedWeights: 0,
				lobeLuminanceRelax: 0,
				historyRadius: 0,
				clampSigma: 0,
				historyCatmullRom: 0,
				antilagSigma: 0,
				antilagReset: 0
			},

			post: {
				grading: { toneMapping: 'AgX', exposure: 1.57, gamma: 0.89, contrast: 1.31, saturation: 1 },
			},
		};

		let camera, scene, model, renderer, postProcessing, ssrNode, denoiseNode, reflection, scenePassEnvSpecular, hitDistanceTexture;
		let controls;
		let scenePassNode, combinedOutputNode, scenePassDepth, scenePassVelocity;
		let gammaUniform, contrastUniform, saturationUniform;
		const denoiseEnabled = uniform( 1 );
		const previousJitter = new THREE.Vector2();
		const currentJitter = new THREE.Vector2();
		const currentProjectionInverse = new THREE.Matrix4();
		const previousProjectionInverse = uniform( new THREE.Matrix4() );
		const historyValid = uniform( false );
		const historySize = uniform( new THREE.Vector2() );
		const jitterDelta = uniform( new THREE.Vector2() ).onRenderUpdate( () => {

			// TRAA excludes projection jitter from velocity; the scene color still contains it.
			const e = camera.projectionMatrix.elements;
			currentJitter.set( - e[ 8 ] * 0.5, e[ 9 ] * 0.5 );
			currentProjectionInverse.copy( camera.projectionMatrixInverse );
			return jitterDelta.value.copy( previousJitter ).sub( currentJitter );

		} );

		init();

		async function init() {

			camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 8 );

			camera.position.set( 0.9210513838983053, 0.16195074025403253, 0.431687274895316 );

			scene = new THREE.Scene();

			const loader = new GLTFLoader();
			loader.load( 'models/gltf/dungeon_warkarma.glb', function ( gltf ) {

				gltf.scene.scale.multiplyScalar( 0.1 );

				gltf.scene.traverse( function ( object ) {

					if ( ! object.material ) return;

					object.castShadow = true;
					object.receiveShadow = true;
					object.material.roughness = 0.3;
					object.material.normalMap = null;

				} );

				model = gltf.scene;
				scene.add( model );

			} );

			// five MRT targets need 40 bytes per sample, above the default limit of 32
			renderer = new THREE.WebGPURenderer( { requiredLimits: { maxColorAttachmentBytesPerSample: 40 } } );
			renderer.inspector = new Inspector();
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.toneMapping = THREE.AgXToneMapping;
			renderer.toneMappingExposure = params.post.grading.exposure;
			renderer.shadowMap.enabled = true;
			document.body.appendChild( renderer.domElement );

			const hdrLoader = new HDRLoader().setPath( 'textures/equirectangular/' );
			const hdrTexture = await hdrLoader.loadAsync( 'quarry_01_1k.hdr' );
			hdrTexture.mapping = THREE.EquirectangularReflectionMapping;
			scene.background = hdrTexture;
			scene.environment = hdrTexture;
			hdrTexture.generateMipmaps = true;
			hdrTexture.needsUpdate = true;

			const directionalLight = new THREE.DirectionalLight( '#ffffff', 20 );
			directionalLight.position.set( - 10.9, 2.2, 10.75 );
			directionalLight.castShadow = true;
			directionalLight.shadow.autoUpdate = false;
			directionalLight.shadow.needsUpdate = true;
			directionalLight.shadow.mapSize.width = 4096;
			directionalLight.shadow.mapSize.height = 4096;
			directionalLight.shadow.camera.left = - 1.75;
			directionalLight.shadow.camera.right = 1.75;
			directionalLight.shadow.camera.top = 1.75;
			directionalLight.shadow.camera.bottom = - 1.75;
			directionalLight.shadow.camera.near = 0.1;
			directionalLight.shadow.camera.far = 50;
			directionalLight.shadow.bias = - 0.0005;
			scene.add( directionalLight );

			await renderer.init();

			scene.environmentIntensity = 1;

			postProcessing = new THREE.RenderPipeline( renderer );

			const scenePass = pass( scene, camera );
			scenePassNode = scenePass;
			scenePass.setMRT( mrt( {
				output: output,
				envSpecular: vec4( envSpecular, 1 ),
				// Store base color (albedo) in RGB + metalness in alpha. The albedo is needed for
				// metal Fresnel f0; do NOT bake in the (1-metalness) diffuse attenuation here, as
				// that zeroes metals and destroys their specular tint (f0 would become 0 → black).
				diffuseColor: vec4( diffuseColor.rgb, materialMetalness ),
				// Pack roughness into normal alpha channel to save MRT bandwidth
				normal: vec4( packNormalToRGB( normalView ).rgb, materialRoughness ),
				// The hit's previous view depth also follows object motion, including motion toward the camera.
				velocity: vec4( velocity, velocity.previousCameraViewMatrix.mul( velocity.previousModelWorldMatrix ).mul( vec4( positionPrevious, 1 ) ).z.toVarying(), 0 )
			} ) );

			const scenePassColor = scenePass.getTextureNode( 'output' ).toInspector( 'Color' );
			const scenePassNormal = scenePass.getTextureNode( 'normal' ).toInspector( 'Normal' );
			scenePassDepth = scenePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => {

				return scenePass.getLinearDepthNode();

			} );
			scenePassVelocity = scenePass.getTextureNode( 'velocity' ).toInspector( 'Velocity' );
			const scenePassDiffuseColor = scenePass.getTextureNode( 'diffuseColor' ).toInspector( 'Diffuse Color' );
			scenePassEnvSpecular = scenePass.getTextureNode( 'envSpecular' ).toInspector( 'Env Specular' );

			const normalTexture = scenePass.getTexture( 'normal' );
			normalTexture.type = THREE.UnsignedByteType;

			const diffuseTexture = scenePass.getTexture( 'diffuseColor' );
			diffuseTexture.type = THREE.UnsignedByteType;

			const sceneNormal = sample( ( uv ) => unpackRGBToNormal( scenePassNormal.sample( uv ).rgb ) );

			// SSR traces the previous frame's lit color ( beauty and reflections, so multi-bounce comes for free ),
			// reprojected with the motion of the hit. Alpha is the share of valid history, which scales the coverage.

			let lit = null;

			const previousLit = sample( uv => Fn( () => {

				const previousColor = texture( lit.value );
				const previousDepth = scenePass.getPreviousTextureNode( 'depth' );

				// Load motion and expected depth from one surface at silhouettes.

				const motionSize = ivec2( textureSize( scenePassVelocity ) );
				const motionTexel = ivec2( uv.mul( vec2( motionSize ) ) ).clamp( ivec2( 0 ), motionSize.sub( 1 ) );
				const motion = scenePassVelocity.load( motionTexel ).toConst();
				const historyUV = uv.sub( motion.xy.mul( vec2( 0.5, - 0.5 ) ) ).add( jitterDelta ).toConst();
				const size = vec2( textureSize( previousDepth ) );
				const pixel = historyUV.mul( size ).sub( 0.5 );
				const base = pixel.floor();
				const fraction = pixel.fract();
				const inBounds = p => p.greaterThanEqual( 0 ).all().and( p.lessThanEqual( 1 ).all() );
				const valid = historyValid.and( inBounds( historyUV ) )
					.and( size.equal( historySize ).all() )
					.and( vec2( textureSize( scenePassDepth ) ).equal( historySize ).all() )
					.and( motion.z.lessThan( camera.near * - 1 ) );

				// Allow a small pixel footprint for depth variation on sloping surfaces, plus half-float rounding.
				const pixelDepth = previousProjectionInverse.element( 1 ).y.abs().mul( motion.z.abs() ).mul( 3 ).div( size.y );
				const tolerance = pixelDepth.max( motion.z.abs().mul( 0.002 ) ).max( 0.001 );
				const radiance = vec3( 0 ).toVar();
				const support = float( 0 ).toVar();

				// Validate each bilinear tap so interpolation cannot pull color across an occlusion edge.
				for ( let y = 0; y <= 1; y ++ ) {

					for ( let x = 0; x <= 1; x ++ ) {

						const tapUV = base.add( vec2( x, y ) ).add( 0.5 ).div( size ).toConst();
						const depth = previousDepth.sample( tapUV ).r;
						const viewZ = getViewPosition( tapUV, depth, previousProjectionInverse ).z;
						const accepted = valid.and( inBounds( tapUV ) ).and( isBackgroundDepth( depth ).not() )
							.and( viewZ.sub( motion.z ).abs().lessThanEqual( tolerance ) );
						const weightX = x === 0 ? fraction.x.oneMinus() : fraction.x;
						const weightY = y === 0 ? fraction.y.oneMinus() : fraction.y;
						const weight = weightX.mul( weightY ).mul( accepted ).toConst();
						radiance.addAssign( previousColor.sample( tapUV ).rgb.mul( weight ) );
						support.addAssign( weight );

					}

				}

				// Missing history has no coverage; never substitute an unrelated surface's color.
				return vec4( radiance.div( support.max( 1e-6 ) ), support );

			} )() );

			ssrNode = ssr( previousLit, scenePassDepth, sceneNormal, {
				camera,
				stochastic: true,
				diffuseNode: scenePassDiffuseColor,
				metalnessNode: scenePassDiffuseColor.a,
				roughnessNode: scenePassNormal.a,
				binaryRefine: params.ssr.binaryRefine,
				rayReuse: params.ssr.rayReuse
			} ).toInspector( 'SSR' );

			// the reflections ( SSR radiance with its coverage in alpha ) are accumulated in time and filtered within
			// the footprint of their reflection lobe, with the roughness of the scene and the hit distance of each pixel

			const ssrTexture = ssrNode.getTextureNode();
			hitDistanceTexture = ssrNode.getHitDistanceNode();

			denoiseNode = temporalDenoise( ssrTexture, {
				depth: scenePassDepth,
				normal: sceneNormal,
				camera,
				velocity: scenePassVelocity,
				roughness: sample( ( uv ) => scenePassNormal.sample( uv ).a ),
				hitDistance: sample( ( uv ) => hitDistanceTexture.sample( uv ).r ),
				coverage: true
			} );
			reflection = mix( ssrTexture, denoiseNode.getTextureNode(), denoiseEnabled ).toInspector( 'Denoise' );

			// where SSR has no coverage, the env map specular of the beauty pass fills in
			const specular = mix( scenePassEnvSpecular.rgb, reflection.rgb, reflection.a );

			gammaUniform = uniform( params.post.grading.gamma );
			contrastUniform = uniform( params.post.grading.contrast );
			saturationUniform = uniform( params.post.grading.saturation );

			lit = convertToTexture( vec4( scenePassColor.rgb.add( specular ), 1 ) );
			lit.toInspector( 'Combined SSR' );
			combinedOutputNode = lit;

			postProcessing.outputNode = applyPostProcessing( combinedOutputNode );
			postProcessing.outputColorTransform = false;

			controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;
			controls.update();

			// Initial camera transform
			camera.position.set( 1.259878548682251, 0.5391287340899181, - 0.27217301481427114 );
			camera.rotation.set( - 0.3158233106804791, 0.26820684188431526, 0.08637696823742165 );
			controls.target.set( 1.0258536154689288, 0.2746440590977971, - 1.0815876858987743 );

			window.addEventListener( 'resize', onWindowResize );
			renderer.domElement.addEventListener( 'pointermove', onComparePointerMove );

			applyParams();
			applyPost();

			const outputTypes = {
				Combined: 0,
				'Denoised SSR': 4,
				'Compare (Denoise)': OUTPUT_COMPARE_DENOISE,
				'Compare (Reflections)': OUTPUT_COMPARE_SSR,
				'SSR (Raw)': 1,
				'SSR Coverage': 5,
				'Env Specular': 6,
				'Ray Length': 7
			};

			const ssrGui = renderer.inspector.createParameters( 'SSR settings' );
			ssrGui.add( params, 'output', outputTypes ).onChange( updateOutputNode );
			ssrGui.add( params.ssr, 'quality', 0, 1 ).name( 'quality' ).onChange( applyParams );
			ssrGui.add( params.ssr, 'mirrorBias', 0, 1 ).name( 'mirror bias' ).onChange( applyParams );
			ssrGui.add( params.ssr, 'maxRoughness', 0, 1 ).name( 'max roughness' ).onChange( applyParams );
			ssrGui.add( params.ssr, 'rayReuse' ).name( 'ray reuse (reloads)' ).onChange( ( value ) => location.search = value ? '' : '?rayReuse=0' );
			ssrGui.add( params.ssr, 'reuseRadius', 0, 16 ).name( 'reuse radius' ).onChange( applyParams );
			ssrGui.add( params.ssr, 'stepExponent', 1, 4, 0.5 ).name( 'step exponent' ).onChange( applyParams );
			ssrGui.add( params.ssr, 'binaryRefine' ).name( 'binary refine' ).onChange( applyParams );
			ssrGui.add( params.ssr, 'maxDistance', 0, 5 ).name( 'max distance' ).onChange( applyParams );
			ssrGui.add( params.ssr, 'intensity', 0, 4 ).name( 'intensity' ).onChange( applyParams );
			ssrGui.add( params.ssr, 'thickness', 0, 0.25 ).name( 'thickness' ).onChange( applyParams );
			ssrGui.add( params, 'roughness', 0, 1 ).onChange( ( value ) => {

				scene.traverse( ( object ) => {

					if ( object.material ) object.material.roughness = value;

				} );

			} );

			const denoiseGui = renderer.inspector.createParameters( 'Denoise settings' );
			denoiseGui.add( params.denoise, 'enabled' ).name( 'enabled' ).onChange( applyParams );
			denoiseGui.add( params.denoise, 'luminancePhi', 0, 10 ).name( 'luminance phi' ).onChange( applyParams );
			denoiseGui.add( params.denoise, 'maxFrames', 1, 64, 1 ).name( 'max frames' ).onChange( applyParams );
			denoiseGui.add( params.denoise, 'spatialPasses', 1, 3, 1 ).name( 'spatial passes' ).onChange( applyParams );
			denoiseGui.add( params.denoise, 'historyDeviation', 0, 1 ).name( 'history deviation' ).onChange( applyParams );
			denoiseGui.add( params.denoise, 'fireflyClamp', 0, 8 ).name( 'firefly clamp' ).onChange( applyParams );
			denoiseGui.add( params.denoise, 'toneMappedWeights', 0, 1 ).name( 'tone mapped weights' ).onChange( applyParams );
			denoiseGui.add( params.denoise, 'lobeLuminanceRelax', 0, 1 ).name( 'lobe luminance relax' ).onChange( applyParams );
			denoiseGui.add( params.denoise, 'historyRadius', 0, 1 ).name( 'history radius' ).onChange( applyParams );
			denoiseGui.add( params.denoise, 'clampSigma', 0, 4 ).name( 'clamp sigma' ).onChange( applyParams );
			denoiseGui.add( params.denoise, 'historyCatmullRom', 0, 1, 1 ).name( 'catmull-rom history' ).onChange( applyParams );
			denoiseGui.add( params.denoise, 'antilagSigma', 0, 8 ).name( 'anti-lag sigma' ).onChange( applyParams );
			denoiseGui.add( params.denoise, 'antilagReset', 0, 1 ).name( 'anti-lag reset' ).onChange( applyParams );

			// Concise UI for Directional Light controls
			const lightGui = renderer.inspector.createParameters( 'Light' ).close();
			[ 'x', 'y', 'z' ].forEach( axis => {

				lightGui.add( directionalLight.position, axis, - 30, 30 ).name( axis.toUpperCase() )
					.onChange( () => directionalLight.shadow.needsUpdate = true );

			} );
			lightGui.add( directionalLight, 'intensity', 0, 50 ).name( 'Intensity' );

			updateOutputNode();
			renderer.setAnimationLoop( animate );

		}

		function applyParams() {

			if ( ! ssrNode ) return;

			ssrNode.resolutionScale = params.ssr.resolutionScale;
			ssrNode.quality.value = params.ssr.quality;
			ssrNode.mirrorBias.value = params.ssr.mirrorBias;
			ssrNode.maxRoughness.value = params.ssr.maxRoughness;
			ssrNode.reuseRadius.value = params.ssr.reuseRadius;
			// stepExponent / screenEdgeFadeBlack / binaryRefine are build-time constants: assigning
			// them recompiles the SSR material (the setters no-op when the value is unchanged).
			ssrNode.stepExponent = params.ssr.stepExponent;
			ssrNode.binaryRefine = params.ssr.binaryRefine;
			ssrNode.maxDistance.value = params.ssr.maxDistance;
			ssrNode.intensity.value = params.ssr.intensity;
			ssrNode.thickness.value = params.ssr.thickness;
			ssrNode.maxLuminance.value = params.ssr.maxLuminance;
			ssrNode.screenEdgeFade.value = params.ssr.screenEdgeFade;
			ssrNode.screenEdgeFadeBlack = params.ssr.screenEdgeFadeBlack;

			if ( denoiseNode ) {

				denoiseEnabled.value = params.denoise.enabled ? 1 : 0;
				denoiseNode.luminancePhi.value = params.denoise.luminancePhi;
				denoiseNode.maxFrames.value = params.denoise.maxFrames;
				denoiseNode.iterations = params.denoise.spatialPasses;

				for ( const key of [ 'historyDeviation', 'fireflyClamp', 'toneMappedWeights', 'lobeLuminanceRelax', 'historyRadius', 'clampSigma', 'historyCatmullRom', 'antilagSigma', 'antilagReset' ] ) denoiseNode[ key ].value = params.denoise[ key ];

			}

		}

		function applyGrading( source ) {

			let rgb = source.rgb;

			rgb = renderOutput( vec4( rgb, 1 ), THREE.AgXToneMapping, THREE.SRGBColorSpace ).rgb;
			rgb = rgb.sub( 0.5 ).mul( contrastUniform ).add( 0.5 );
			rgb = saturation( rgb, saturationUniform );
			rgb = rgb.max( 0.0 ).pow( float( 1 ).div( gammaUniform ) );

			return vec4( rgb, 1 );

		}

		function applyPostProcessing( source ) {

			return sharpen( traa( applyGrading( source ), scenePassDepth, scenePassVelocity, camera ), 0 );

		}

		function applyPost() {

			const g = params.post.grading;
			gammaUniform.value = g.gamma;
			contrastUniform.value = g.contrast;
			saturationUniform.value = g.saturation;

			renderer.toneMapping = THREE.AgXToneMapping;
			renderer.toneMappingExposure = g.exposure;

		}

		function updateOutputNode() {

			if ( ! postProcessing ) return;

			let node;

			switch ( params.output ) {

				case 0: node = applyPostProcessing( combinedOutputNode ); break; // Combined
				case 1: node = applyPostProcessing( vec4( ssrNode.rgb.mul( ssrNode.a ), 1 ) ); break; // SSR (Raw)
				case 4: node = applyPostProcessing( vec4( reflection.rgb.mul( reflection.a ), 1 ) ); break; // Denoised SSR
				case 5: node = vec4( reflection.aaa, 1 ); break; // SSR Coverage
				case 6: node = applyPostProcessing( vec4( scenePassEnvSpecular.rgb, 1 ) ); break; // Env Specular
				case 7: node = vec4( hitDistanceTexture.rrr, 1 ); break; // Ray Length (Raw)
				case OUTPUT_COMPARE_DENOISE: { // Compare (denoised | noisy)

					const noisySSR = applyPostProcessing( vec4( ssrNode.rgb.mul( ssrNode.a ), 1 ) );
					const denoisedSSR = applyPostProcessing( vec4( reflection.rgb.mul( reflection.a ), 1 ) );
					node = buildCompareNode( denoisedSSR, noisySSR );
					break;

				}

				case OUTPUT_COMPARE_SSR: { // Compare (combined SSR vs. scene only)

					node = buildCompareNode( applyPostProcessing( combinedOutputNode ), applyPostProcessing( scenePassNode ) );
					break;

				}

			}

			if ( ! isCompareMode( params.output ) ) controls.enabled = true;

			updateCompareHint( params.output );

			postProcessing.outputColorTransform = ! GRADED_OUTPUTS.has( params.output );
			postProcessing.outputNode = node;
			postProcessing.needsUpdate = true;

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );
			compareResolution.value.set( window.innerWidth, window.innerHeight );
			historyValid.value = false;

		}

		function onComparePointerMove( event ) {

			if ( ! isCompareMode( params.output ) ) return;

			if ( event.shiftKey ) {

				controls.enabled = false;

				const rect = renderer.domElement.getBoundingClientRect();
				compareSplit.value = Math.max( 0, Math.min( 1, ( event.clientX - rect.left ) / rect.width ) );

			} else {

				controls.enabled = true;

			}

		}

		function animate() {

			controls.update();

			postProcessing.render();

			previousJitter.copy( currentJitter );
			previousProjectionInverse.value.copy( currentProjectionInverse );
			const { width, height } = scenePassNode.getTexture( 'output' ).image;
			historySize.value.set( width, height );
			historyValid.value = true;

		}

	</script>
</body>
