<!DOCTYPE html>
<html lang="en">

<head>

	<title>three.js webgl - postprocessing - Screen Space Reflection 2</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<meta property="og:title" content="three.js webgl - postprocessing - Screen Space Reflection 2">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://threejs.org/examples/webgl_postprocessing_ssr2.html">
	<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_postprocessing_ssr2.jpg">
	<link type="text/css" rel="stylesheet" href="main.css">

</head>

<body>
	<div id="info">
		<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - screen space reflections as indirect specular<br />
		SSR2Pass fills <code>scene.indirectSpecularMap</code>; materials apply their own BRDF to it.
	</div>

	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.module.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">
		import * as THREE from 'three';

		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
		import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
		import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
		import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
		import { GBufferPass } from 'three/addons/postprocessing/GBufferPass.js';
		import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
		import { SSR2Pass } from 'three/addons/postprocessing/SSR2Pass.js';
		import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
		import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

		const params = {
			ssr: true,
			autoRotate: true,
			roughness: 0.1,
			metalness: 0.5,
			view: 'Beauty'
		};

		const renderer = new THREE.WebGLRenderer();
		renderer.setPixelRatio( window.devicePixelRatio );
		renderer.setSize( window.innerWidth, window.innerHeight );
		renderer.setAnimationLoop( animate );
		document.body.appendChild( renderer.domElement );

		const camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 15 );
		camera.position.set( 0.13, 0.35, 0.44 );

		const scene = new THREE.Scene();
		scene.background = new THREE.Color( 0x443333 );

		const pmrem = new THREE.PMREMGenerator( renderer );
		scene.environment = pmrem.fromScene( new RoomEnvironment(), 0.04 ).texture;
		scene.environmentIntensity = 0.6;
		pmrem.dispose();

		const materials = [];
		const add = ( geometry, color, x, y, z ) => {

			const material = new THREE.MeshStandardMaterial( { color, roughness: params.roughness, metalness: params.metalness } );
			const mesh = new THREE.Mesh( geometry, material );
			mesh.position.set( x, y, z );
			scene.add( mesh );
			materials.push( material );
			return mesh;

		};

		add( new THREE.PlaneGeometry( 8, 8 ), 0xcbcbcb, 0, - 0.0001, 0 ).rotation.x = - Math.PI / 2;
		add( new THREE.BoxGeometry( 0.05, 0.05, 0.05 ), 'green', - 0.12, 0.025, 0.015 );
		add( new THREE.IcosahedronGeometry( 0.025, 4 ), 'cyan', - 0.05, 0.025, 0.08 );
		add( new THREE.ConeGeometry( 0.025, 0.05, 64 ), 'yellow', - 0.05, 0.025, - 0.055 );

		const dracoLoader = new DRACOLoader();
		dracoLoader.load( 'models/draco/bunny.drc', function ( geometry ) {

			geometry.computeVertexNormals();
			add( geometry, 0xa5a5a5, 0, - 0.0365, 0 );
			dracoLoader.dispose();

		} );

		const controls = new OrbitControls( camera, renderer.domElement );
		controls.target.set( 0, 0.0635, 0 );
		controls.enableDamping = true;
		controls.enabled = ! params.autoRotate;
		controls.update();

		const width = window.innerWidth * window.devicePixelRatio;
		const height = window.innerHeight * window.devicePixelRatio;

		const composer = new EffectComposer( renderer );
		const gBufferPass = new GBufferPass( scene, camera, width, height, { material: true } );
		const ssr2Pass = new SSR2Pass( scene, camera, width, height, gBufferPass );
		ssr2Pass.maxDistance = 0.3;
		ssr2Pass.thickness = 0.02;

		composer.addPass( gBufferPass );
		composer.addPass( new RenderPass( scene, camera ) );
		composer.addPass( ssr2Pass );

		// debug view: replaces the beauty with one of the buffers
		const viewPass = new ShaderPass( {
			uniforms: { tView: { value: null }, mode: { value: 0 } },
			vertexShader: /* glsl */`
				varying vec2 vUv;
				void main() {
					vUv = uv;
					gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
				}`,
			fragmentShader: /* glsl */`
				uniform sampler2D tView;
				uniform int mode;
				varying vec2 vUv;
				void main() {
					vec4 c = texture2D( tView, vUv );
					if ( mode == 1 ) c = vec4( vec3( c.r ), 1.0 ); // roughness
					gl_FragColor = vec4( c.rgb, 1.0 );
				}`
		}, 'unused' );
		viewPass.enabled = false;
		composer.addPass( viewPass );
		composer.addPass( new OutputPass() );

		scene.indirectSpecularMap = ssr2Pass.texture;

		const views = {
			'Beauty': null,
			'SSR radiance': [ ssr2Pass.texture, 0 ],
			'Roughness': [ gBufferPass.materialTexture, 1 ],
			'Normals': [ gBufferPass.normalTexture, 0 ]
		};

		const gui = new GUI( { width: 260 } );
		gui.add( params, 'view', Object.keys( views ) ).onChange( v => {

			viewPass.enabled = views[ v ] !== null;
			if ( viewPass.enabled ) {

				viewPass.uniforms.tView.value = views[ v ][ 0 ];
				viewPass.uniforms.mode.value = views[ v ][ 1 ];

			}

		} );
		gui.add( params, 'ssr' ).name( 'SSR as indirect specular' ).onChange( v => {

			scene.indirectSpecularMap = v ? ssr2Pass.texture : null;

		} );
		gui.add( params, 'autoRotate' ).onChange( v => controls.enabled = ! v );
		gui.add( params, 'roughness', 0, 1 ).onChange( v => materials.forEach( m => m.roughness = v ) );
		gui.add( params, 'metalness', 0, 1 ).onChange( v => materials.forEach( m => m.metalness = v ) );
		gui.add( ssr2Pass, 'maxDistance', 0, 1 );
		gui.add( ssr2Pass, 'thickness', 0, 0.1 );
		gui.add( ssr2Pass, 'maxRoughness', 0, 1 );
		gui.add( ssr2Pass, 'screenEdgeFade', 0, 0.5 );
		gui.add( scene, 'environmentIntensity', 0, 2 );

		window.addEventListener( 'resize', () => {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize( window.innerWidth, window.innerHeight );
			composer.setSize( window.innerWidth, window.innerHeight );

		} );

		function animate() {

			if ( params.autoRotate ) {

				const t = performance.now() / 1000 * 0.3;
				camera.position.set( Math.sin( t ) * 0.45, 0.3, Math.cos( t ) * 0.45 );
				controls.target.set( 0, 0.0635, 0 );
				camera.lookAt( controls.target );

			} else {

				controls.update();

			}

			composer.render();

		}

	</script>
</body>

</html>
