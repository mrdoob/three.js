<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - microgeometry AO</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>
			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Microgeometry AO</span>
			</div>
			<small>
				Alpha, displacement, normal, and bump-aware pre-pass by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a>
			</small>
		</div>

		<script type="importmap">
			{ "imports": {
				"three": "../build/three.module.js",
				"three/webgpu": "../build/three.webgpu.js",
				"three/tsl": "../build/three.tsl.js",
				"three/addons/": "./jsm/"
			} }
		</script>
		<script type="module">

			import * as THREE from 'three';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { createMicroGeometryScene } from 'three/addons/scenes/MicroGeometryScene.js';

			import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
			import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
			import { GBufferPass } from 'three/addons/postprocessing/GBufferPass.js';
			import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
			import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
			import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

			const renderer = new THREE.WebGLRenderer();
			renderer.setPixelRatio( devicePixelRatio );
			renderer.setSize( innerWidth, innerHeight );
			document.body.appendChild( renderer.domElement );

			const { scene, cutouts, update } = await createMicroGeometryScene();
			const camera = new THREE.PerspectiveCamera( 45, innerWidth / innerHeight, 0.1, 30 );
			camera.position.set( 0, 1.5, 11 );
			const controls = new OrbitControls( camera, renderer.domElement );
			controls.target.set( 0, 1.5, 0 );
			controls.update();
			const params = { view: 'AO + beauty', alphaTest: 0.5, opacity: 0.75, animate: true };
			const gui = new GUI();
			gui.add( params, 'alphaTest', 0, 1 ).onChange( value => {

				for ( const material of cutouts ) material.alphaTest = value;

			} );
			gui.add( params, 'opacity', 0, 1 ).onChange( value => cutouts[ 2 ].opacity = value );
			gui.add( params, 'animate' ).name( 'animate displacement' );

			const composer = new EffectComposer( renderer );
			const prepass = new GBufferPass( scene, camera );
			composer.addPass( prepass );
			composer.addPass( new RenderPass( scene, camera ) );
			const gtaoPass = new GTAOPass( scene, camera, innerWidth, innerHeight, {
				depthTexture: prepass.depthTexture,
				normalTexture: prepass.normalTexture
			} );
			// Match GTAONode's sample budget and quadratic distance distribution.
			gtaoPass.updateGtaoMaterial( { radius: 0.5 * Math.sqrt( 1.5 ), samples: 64, distanceExponent: 2, thickness: 1, scale: 2 } );
			composer.addPass( gtaoPass );
			// Composite raw AO; GTAOPass's denoised intermediate is not used.
			const compositePass = new ShaderPass( {
				uniforms: { tDiffuse: { value: null }, tAO: { value: null } },
				vertexShader: /* glsl */`
					varying vec2 vUv;
					void main() {
						vUv = uv;
						gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
					}`,
				fragmentShader: /* glsl */`
					uniform sampler2D tDiffuse;
					uniform sampler2D tAO;
					varying vec2 vUv;
					void main() {
						vec4 beauty = texture2D( tDiffuse, vUv );
						gl_FragColor = vec4( beauty.rgb * texture2D( tAO, vUv ).r, beauty.a );
					}`
			} );
			compositePass.uniforms.tAO.value = gtaoPass.gtaoRenderTarget.texture;
			composer.addPass( compositePass );
			composer.addPass( new OutputPass() );
			const views = {
				'AO + beauty': GTAOPass.OUTPUT.Off,
				Beauty: GTAOPass.OUTPUT.Diffuse,
				AO: GTAOPass.OUTPUT.AO,
				Normals: GTAOPass.OUTPUT.Normal,
				Depth: GTAOPass.OUTPUT.Depth
			};
			function updateOutput() {

				compositePass.enabled = params.view === 'AO + beauty';
				gtaoPass.output = views[ params.view ];
				// OUTPUT.Off preserves the beauty buffer for the raw AO composite.
				gtaoPass.needsSwap = ! compositePass.enabled;

			}

			gui.add( params, 'view', Object.keys( views ) ).onChange( updateOutput );
			updateOutput();
			// Compare the reusable prepass with GTAO's original internal solid override.
			params.legacyPrepass = false;
			gui.add( params, 'legacyPrepass' ).name( 'legacy solid prepass' ).onChange( legacy => {

				prepass.enabled = ! legacy;
				if ( legacy ) {

					gtaoPass.setGBuffer();

				} else {

					gtaoPass.setGBuffer( prepass.depthTexture, prepass.normalTexture );

				}

			} );
			const metrics = document.createElement( 'div' );
			metrics.style.cssText = 'position:absolute;bottom:16px;left:16px;padding:8px;color:white;background:rgba(0,0,0,0.6)';
			document.body.appendChild( metrics );
			renderer.info.autoReset = false;
			renderer.setAnimationLoop( time => {

				if ( params.animate ) update( time / 1000 );

				renderer.info.reset();
				composer.render();
				metrics.textContent = `Draw calls: ${ renderer.info.render.calls } | Programs: ${ renderer.info.programs.length } | Cached materials: ${ prepass._materialCache.size }`;

			} );

			window.addEventListener( 'resize', () => {

				camera.aspect = innerWidth / innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( innerWidth, innerHeight );
				composer.setSize( innerWidth, innerHeight );

			} );

		</script>
	</body>
</html>
