<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - shaders - sky sun shader</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - shaders - sky sun shader">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_shaders_sky.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_shaders_sky.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info"><a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> webgl - sky + sun shader
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Sky } from 'three/addons/objects/Sky.js';

			let camera, scene, renderer;

			let sky, sun;

			let sphere, cubeCamera;

			init();

			function initSky() {

				// Add Sky
				sky = new Sky();
				sky.scale.setScalar( 450000 );
				scene.add( sky );

				sun = new THREE.Vector3();

				/// GUI

				// Earth is the base, the other planets override it

				const presets = {
					Earth: {
						rayleigh: 3,
						mieCoefficient: 0.025,
						mieDirectionalG: 0.7,
						mieDirectionalGSpread: 0,
						mieColor: new THREE.Color( 0.451084, 0.681483, 1.0 ),
						mieAlbedo: new THREE.Color( 1, 1, 1 ),
						absorptionScale: 1,
						absorptionColor: new THREE.Color( 0.3125, 1.0, 0.04375 ),
						sunSize: 1,
						cloudCoverage: 0.4,
						cloudDensity: 0.4,
						cloudElevation: 0.5
					},
					Mars: {
						// thin air, large butterscotch dust grains, wispy ice clouds, blue sunsets
						rayleigh: 0.05,
						mieCoefficient: 0.75,
						mieDirectionalG: 0.55,
						mieDirectionalGSpread: 0.22,
						mieColor: new THREE.Color( 1, 1, 1 ),
						mieAlbedo: new THREE.Color( 0.95, 0.6, 0.48 ),
						absorptionScale: 0,
						sunSize: 0.66,
						cloudCoverage: 0.35,
						cloudDensity: 0.05,
						cloudElevation: 0.8
					},
					Titan: {
						// dense nitrogen, orange smog under a high haze that absorbs blue
						rayleigh: 1,
						mieCoefficient: 0.5,
						mieColor: new THREE.Color( 1, 1, 1 ),
						mieAlbedo: new THREE.Color( 0.9, 0.55, 0.25 ),
						absorptionScale: 50,
						absorptionColor: new THREE.Color( 0.1, 0.4, 1.0 ),
						sunSize: 0.11,
						cloudCoverage: 0.2
					}
				};

				const effectController = {
					planet: 'Earth',
					elevation: 3,
					azimuth: - 150,
					exposure: 0.05,
					showSunDisc: true
				};

				const copy = ( value ) => value.isColor ? value.clone() : value;

				for ( const key in presets.Earth ) effectController[ key ] = copy( presets.Earth[ key ] );

				function applyPreset() {

					const preset = { ...presets.Earth, ...presets[ effectController.planet ] };

					for ( const key in preset ) controllers[ key ].setValue( copy( preset[ key ] ) );

					guiChanged();

				}

				function guiChanged() {

					const uniforms = sky.material.uniforms;
					uniforms[ 'rayleigh' ].value = effectController.rayleigh;
					uniforms[ 'mieCoefficient' ].value = effectController.mieCoefficient;
					uniforms[ 'mieDirectionalG' ].value = effectController.mieDirectionalG;
					uniforms[ 'mieDirectionalGSpread' ].value = effectController.mieDirectionalGSpread;
					uniforms[ 'mieColor' ].value.copy( effectController.mieColor );
					uniforms[ 'mieAlbedo' ].value.copy( effectController.mieAlbedo );
					uniforms[ 'absorptionScale' ].value = effectController.absorptionScale;
					uniforms[ 'absorptionColor' ].value.copy( effectController.absorptionColor );
					uniforms[ 'cloudCoverage' ].value = effectController.cloudCoverage;
					uniforms[ 'cloudDensity' ].value = effectController.cloudDensity;
					uniforms[ 'cloudElevation' ].value = effectController.cloudElevation;
					uniforms[ 'showSunDisc' ].value = effectController.showSunDisc;

					const phi = THREE.MathUtils.degToRad( 90 - effectController.elevation );
					const theta = THREE.MathUtils.degToRad( effectController.azimuth );

					sun.setFromSphericalCoords( 1, phi, theta );

					uniforms[ 'sunPosition' ].value.copy( sun );
					uniforms[ 'sunSize' ].value = effectController.sunSize;

					renderer.toneMappingExposure = effectController.exposure;

				}

				const gui = new GUI();
				const controllers = {};

				gui.add( effectController, 'planet', Object.keys( presets ) ).onChange( applyPreset );
				controllers.rayleigh = gui.add( effectController, 'rayleigh', 0.0, 4, 0.001 ).onChange( guiChanged );
				controllers.mieCoefficient = gui.add( effectController, 'mieCoefficient', 0.0, 1, 0.001 ).onChange( guiChanged );
				controllers.mieDirectionalG = gui.add( effectController, 'mieDirectionalG', 0.0, 1, 0.001 ).onChange( guiChanged );
				controllers.mieDirectionalGSpread = gui.add( effectController, 'mieDirectionalGSpread', 0.0, 0.3, 0.001 ).onChange( guiChanged );
				controllers.mieColor = gui.addColor( effectController, 'mieColor' ).onChange( guiChanged );
				controllers.mieAlbedo = gui.addColor( effectController, 'mieAlbedo' ).onChange( guiChanged );
				controllers.absorptionScale = gui.add( effectController, 'absorptionScale', 0.0, 50, 0.1 ).onChange( guiChanged );
				controllers.absorptionColor = gui.addColor( effectController, 'absorptionColor' ).onChange( guiChanged );
				gui.add( effectController, 'elevation', 0, 90, 0.1 ).onChange( guiChanged );
				gui.add( effectController, 'azimuth', - 180, 180, 0.1 ).onChange( guiChanged );
				controllers.sunSize = gui.add( effectController, 'sunSize', 0.05, 2, 0.01 ).onChange( guiChanged );
				gui.add( effectController, 'exposure', 0, 1, 0.0001 ).onChange( guiChanged );
				gui.add( effectController, 'showSunDisc' ).onChange( guiChanged );

				const folderClouds = gui.addFolder( 'Clouds' );
				controllers.cloudCoverage = folderClouds.add( effectController, 'cloudCoverage', 0, 1, 0.01 ).name( 'coverage' ).onChange( guiChanged );
				controllers.cloudDensity = folderClouds.add( effectController, 'cloudDensity', 0, 1, 0.01 ).name( 'density' ).onChange( guiChanged );
				controllers.cloudElevation = folderClouds.add( effectController, 'cloudElevation', 0, 1, 0.01 ).name( 'elevation' ).onChange( guiChanged );

				guiChanged();

			}

			function init() {

				camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 100, 2000000 );
				camera.position.set( 0, 100, 2000 );

				scene = new THREE.Scene();

				const cubeRenderTarget = new THREE.WebGLCubeRenderTarget( 256, { type: THREE.HalfFloatType } );
				cubeCamera = new THREE.CubeCamera( 1, 1000, cubeRenderTarget );

				sphere = new THREE.Mesh(
					new THREE.SphereGeometry( 400, 64, 32 ),
					new THREE.MeshBasicMaterial( { envMap: cubeRenderTarget.texture } )
				);
				scene.add( sphere );

				renderer = new THREE.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 0.5;
				document.body.appendChild( renderer.domElement );

				const controls = new OrbitControls( camera, renderer.domElement );
				//controls.maxPolarAngle = Math.PI / 2;
				controls.enableZoom = false;
				controls.enablePan = false;

				initSky();

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				sky.material.uniforms[ 'time' ].value = performance.now() * 0.001;

				sphere.visible = false;
				cubeCamera.update( renderer, scene );
				sphere.visible = true;

				renderer.render( scene, camera );

			}

		</script>

	</body>

</html>
