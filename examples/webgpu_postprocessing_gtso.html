<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - specular occlusion</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - specular occlusion">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_gtso.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_gtso.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>GTSO</span>
			</div>

			<small>
				Specular occlusion from GTAO bent normals.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { sample, pass, mrt, screenUV, normalView, positionView, positionWorld, velocity, vec4, packNormalToRGB, unpackRGBToNormal, builtinAOContext, mx_fractal_noise_float } from 'three/tsl';
			import { ao } from 'three/addons/tsl/display/GTAONode.js';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			let camera, scene, renderer, renderPipeline, controls;

			const params = {
				mode: 'GTAO + GTSO'
			};

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 50 );
				camera.position.set( 0.3, 3.2, 4.6 );

				scene = new THREE.Scene();

				renderer = new THREE.WebGPURenderer();
				renderer.toneMapping = THREE.NeutralToneMapping;
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				// controls

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.minDistance = 2;
				controls.maxDistance = 10;
				controls.target.set( 0, 0.4, 0 );

				// environment

				const environment = await new HDRLoader().setPath( 'textures/equirectangular/' ).loadAsync( 'san_giuseppe_bridge_2k.hdr' );
				environment.mapping = THREE.EquirectangularReflectionMapping;

				scene.background = environment;
				scene.environment = environment;

				// aged metal: fine procedural bumps ( surface gradient bump mapping, Mikkelsen 2010 )

				const height = mx_fractal_noise_float( positionWorld.mul( 30 ), 3 ).mul( 0.0006 );
				const dpdx = positionView.dFdx();
				const dpdy = positionView.dFdy();
				const r1 = dpdy.cross( normalView );
				const r2 = normalView.cross( dpdx );
				const det = dpdx.dot( r1 );
				const bumpNormal = det.abs().mul( normalView ).sub( det.sign().mul( height.dFdx().mul( r1 ).add( height.dFdy().mul( r2 ) ) ) ).normalize();

				const steel = new THREE.MeshStandardNodeMaterial( { color: '#c8c8c8', roughness: 0.35, metalness: 1 } );
				steel.normalNode = bumpNormal;

				const bronze = new THREE.MeshStandardNodeMaterial( { color: '#b08d57', roughness: 0.35, metalness: 1 } );
				bronze.normalNode = bumpNormal;

				// contact and cavities are where reflections hit nearby geometry instead of the sky

				const floor = new THREE.Mesh( new THREE.BoxGeometry( 8, 0.2, 8 ), steel );
				floor.position.y = - 0.1;
				scene.add( floor );

				const finGeometry = new THREE.BoxGeometry( 0.08, 1.2, 1.6 );

				for ( let i = 0; i < 9; i ++ ) {

					const fin = new THREE.Mesh( finGeometry, bronze );
					fin.position.set( - 1.6 + i * 0.22, 0.6, - 0.6 );
					scene.add( fin );

				}

				const sphereGeometry = new THREE.SphereGeometry( 0.35, 64, 32 );

				for ( let i = 0; i < 3; i ++ ) {

					const sphere = new THREE.Mesh( sphereGeometry, bronze );
					sphere.position.set( 0.6 + i * 0.75, 0.35, 0.6 );
					scene.add( sphere );

				}

				// pre-pass

				const prePass = pass( scene, camera );
				prePass.transparent = false;

				prePass.setMRT( mrt( {
					output: packNormalToRGB( normalView ),
					velocity: velocity
				} ) );

				prePass.getTexture( 'output' ).type = THREE.UnsignedByteType;

				const prePassNormal = sample( ( uv ) => {

					return unpackRGBToNormal( prePass.getTextureNode().sample( uv ) );

				} );

				const prePassDepth = prePass.getTextureNode( 'depth' );
				const prePassVelocity = prePass.getTextureNode( 'velocity' );

				// gtao: getLightingContext() uses the bent normals for specular occlusion,
				// builtinAOContext() only applies the scalar ambient occlusion

				const aoPass = ao( prePassDepth, prePassNormal, camera ).toInspector( 'GTAO', ( inspectNode ) => inspectNode.r );
				aoPass.radius.value = 1;
				aoPass.useTemporalFiltering = true;

				const contexts = {
					'GTAO + GTSO': aoPass.getLightingContext(),
					'GTAO': builtinAOContext( aoPass.getTextureNode().sample( screenUV ).r ),
					'No AO': null
				};

				// scene pass and traa ( resolves the temporal noise of GTAO )

				const scenePass = pass( scene, camera ).toInspector( 'Color' );

				const traaPass = traa( scenePass, prePassDepth, prePassVelocity, camera );
				traaPass.useSubpixelCorrection = false;

				const debugOutputs = {
					'Normals': vec4( prePassNormal.sample( screenUV ).xyz.mul( 0.5 ).add( 0.5 ), 1 ),
					'Bent normals': vec4( aoPass.getBentNormalNode().mul( 0.5 ).add( 0.5 ), 1 )
				};

				renderPipeline = new THREE.RenderPipeline( renderer );

				function updateOutput() {

					const debugOutput = debugOutputs[ params.mode ];

					if ( debugOutput === undefined ) {

						scenePass.contextNode = contexts[ params.mode ];
						scenePass.needsUpdate = true;

					}

					renderPipeline.outputNode = debugOutput || traaPass;
					renderer.toneMapping = debugOutput ? THREE.NoToneMapping : THREE.NeutralToneMapping;
					renderPipeline.needsUpdate = true;

				}

				updateOutput();

				// events

				window.addEventListener( 'resize', onWindowResize );

				// GUI

				const gui = renderer.inspector.createParameters( 'Settings' );
				gui.add( params, 'mode', [ 'GTAO + GTSO', 'GTAO', 'No AO', 'Normals', 'Bent normals' ] ).onChange( updateOutput );
				gui.add( aoPass.samples, 'value', 4, 32, 1 ).name( 'samples' ).debounce( 250 );
				gui.add( aoPass.radius, 'value', 0.1, 2 ).name( 'radius' );
				gui.add( aoPass.scale, 'value', 0.01, 2 ).name( 'scale' );
				gui.add( aoPass.thickness, 'value', 0.01, 2 ).name( 'thickness' );
				gui.add( bronze, 'roughness', 0, 1 ).onChange( ( value ) => steel.roughness = value );

			}

			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );

			}

			function animate() {

				if ( renderPipeline === undefined ) return;

				controls.update();

				renderPipeline.render();

			}

		</script>
	</body>
</html>
